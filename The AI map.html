backprop: {l:"Backpropagation & gradient descent", s:"core",
 p:"How a network learns: measure the error, work out how much each weight contributed to it, and nudge every weight a little in the direction that reduces it.",
 t:"Backpropagation applies the chain rule to get the gradient of the loss with respect to every parameter. Gradient descent (in practice SGD with momentum, or Adam) moves each parameter a small step, the learning rate, against that gradient.",
 h:"The ideas date to the 1960s and 1970s (Linnainmaa, Werbos); the 1986 Nature paper by Rumelhart, Hinton and Williams made it standard.",
 w:"Every training run, from a spam filter to a frontier LLM, repeats this loop millions of times.",
 n:"Core. Frameworks such as PyTorch compute the gradients automatically (autograd).",
 m:"Backpropagation is not a learning paradigm. It computes gradients; supervised, self-supervised and reinforcement learning all rely on it."},
inside: {l:"Inside a Transformer", s:"core",
 p:"What happens to your text, step by step, from characters to the next predicted token.",
 t:"Text → tokens → token IDs → embedding vectors (plus position) → stacked attention and feed-forward layers → logits → probabilities → next token.",
 w:"This pipeline runs every time a chat assistant streams a word.",
 n:"These stages explain context limits, token pricing, odd spelling mistakes and why prompts behave as they do.",
 m:"A token is not fed into “its own neuron”. Each token ID becomes a vector of hundreds or thousands of numbers, and every layer processes all of those vectors."},
tok: {l:"Tokenization & token IDs", s:"core",
 p:"Text is chopped into pieces called tokens (words, parts of words or characters), and each piece gets an ID number from a fixed vocabulary.",
 t:"Subword algorithms such as BPE, WordPiece or SentencePiece build a vocabulary of roughly 30,000 to 200,000 tokens. “unbelievable” might become “un”, “believ”, “able”. The model only ever sees the integer IDs.",
 h:"Byte-pair encoding was adapted for neural translation in 2015 (Sennrich and colleagues).",
 w:"API prices and context limits are counted in tokens; in English one token is roughly three quarters of a word.",
 n:"Core. Tokenization explains why models struggle to count letters and why some languages need more tokens than others."},
emb: {l:"Embeddings", s:"core",
 p:"Each token ID is turned into a list of numbers (a vector) that places it in a space where similar meanings sit close together.",
 t:"An embedding matrix has one learned row per vocabulary entry; looking up an ID returns its vector, often 768 to 8,000 or more dimensions. Passing through the layers makes the vector contextual, so “bank” by a river and “bank” for money end up different.",
 h:"word2vec (2013) popularized learned word vectors; transformers made them contextual.",
 w:"The classic word2vec example: king − man + woman lands near queen.",
 n:"Core. The same idea, applied to whole texts, powers embedding models and vector search.",
 m:"Token embeddings inside an LLM are not an embedding model’s output. An embedding model returns one vector for a whole text, designed for search and similarity."},
pos: {l:"Positional information", s:"core",
 p:"Attention on its own doesn’t know word order, so the model adds information about where each token sits.",
 t:"The original transformer added fixed sine and cosine patterns; GPT-2 learned position vectors; most current LLMs use rotary position embeddings (RoPE), which rotate query and key vectors by an angle that depends on position.",
 h:"Sinusoidal encodings (2017); RoPE (Su and colleagues, 2021).",
 w:"Without it, “dog bites man” and “man bites dog” would look identical.",
 n:"Core. Stretching position schemes is one way models extend their context window."},
attn: {l:"Self-attention (multi-head)", s:"core",
 p:"Each token looks at all the other tokens and decides which ones matter for understanding it.",
 t:"Every token produces a query, a key and a value. Query-key dot products, scaled and passed through softmax, become attention weights, and the output is a weighted mix of the values. Multi-head attention runs several of these in parallel so different heads can track different relationships.",
 h:"Attention was added to RNN translation models in 2014 (Bahdanau and colleagues); the transformer (2017) built everything around it.",
 w:"In “The trophy didn’t fit in the suitcase because it was too big”, attention helps link “it” to “trophy”.",
 n:"Core. Its cost grows with the square of the sequence length, which is why long context is expensive."},
ffn: {l:"Feed-forward layers", s:"core",
 p:"After attention mixes information between tokens, a small neural network processes each token on its own.",
 t:"A two-layer MLP applied to every position independently, usually expanding to about four times the model width and back. Research suggests these layers store much of a model’s factual knowledge.",
 w:"In Mixture-of-Experts models, this is the block replaced by many expert networks.",
 n:"Core: a large share of an LLM’s parameters lives here."},
ctx: {l:"Context window", s:"core",
 p:"The maximum number of tokens the model can look at in one go: your prompt, documents, conversation and its own answer.",
 t:"Set by training and the position scheme, ranging from a few thousand tokens to a million or more. Anything outside it is invisible to the model, and quality can drop for details buried in the middle of very long contexts.",
 w:"Pasting a long contract works only if it fits; otherwise you need RAG or summarization.",
 n:"Core for AI engineers: context budgeting drives cost, latency and system design.",
 m:"A long context window isn’t memory. The model forgets everything between calls unless your application sends it again."},
logits: {l:"Logits & next token", s:"core",
 p:"At the end, the model gives a score to every token in its vocabulary; the scores become probabilities and one token is picked.",
 t:"The final layer projects the last position’s vector onto the vocabulary, producing logits. Softmax (with temperature) turns them into probabilities; decoding picks the top one or samples with top-k or top-p.",
 w:"Temperature 0 gives near-deterministic answers; higher temperatures give more varied ones.",
 n:"Core. Constrained decoding, such as strict JSON output, works by masking tokens at this step."},
ssm: {l:"State Space Models", f:"SSM", s:"emerg",
 p:"A newer kind of sequence model that reads step by step like an RNN but trains in parallel like a transformer.",
 t:"A learned linear dynamical system carries a fixed-size state through the sequence, so cost grows linearly with length instead of quadratically. Mamba adds “selective” updates that depend on the input.",
 h:"S4 (2021) showed SSMs could handle very long sequences; Mamba followed in 2023.",
 w:"Long audio, genomics and long-document models; hybrid models mix SSM layers with attention layers.",
 n:"Active research and some production hybrids; transformers remain the default."},
mamba: {l:"Mamba", s:"emerg",
 p:"The best-known state space model, built as a faster alternative to attention for long sequences.",
 t:"Selective SSM blocks whose parameters depend on the input, computed with a hardware-aware parallel scan. The pure version uses no attention at all.",
 h:"Gu and Dao, December 2023.",
 w:"Hybrid open models such as AI21’s Jamba combine Mamba and transformer layers.",
 n:"Influential; hybrids are the most common way it is used."},

learn: {l:"How it learns", s:"core",
 p:"The training lens: where a model’s abilities come from.",
 t:"Two separate questions. The learning paradigm is the kind of signal the model learns from: labels, structure in the data, the data itself, or rewards. The training stage is when and why it is trained: pretraining, fine-tuning, alignment.",
 w:"A chat assistant is typically self-supervised in pretraining, supervised in instruction tuning, and preference-optimized at the end.",
 n:"Core: many engineering choices (prompt or fine-tune? LoRA or full training?) live here.",
 m:"Paradigm and stage are different axes. Supervised learning, for example, can be used both in pretraining and in fine-tuning."},
paradigms: {l:"Learning paradigms", s:"core",
 p:"The kind of feedback a model learns from.",
 t:"Supervised: the correct answers are given. Unsupervised: find structure with no answers. Self-supervised: create the answers from the data itself. Reinforcement: learn from rewards for actions.",
 w:"Spam filter (supervised), customer segments (unsupervised), GPT pretraining (self-supervised), game agents (reinforcement).",
 n:"Self-supervised learning is what made foundation models possible: no human labeling at internet scale."},
sup: {l:"Supervised learning", s:"core",
 p:"Learning from examples that come with the right answer, like studying with flashcards.",
 t:"Minimize the gap between predictions and labels (cross-entropy for classes, squared error for numbers). Quality depends heavily on how good and how complete the labels are.",
 h:"The default setting of applied ML for decades; ImageNet (2009) was a landmark labeled dataset.",
 w:"Labeled fraud cases, tagged support tickets, X-rays annotated by radiologists.",
 n:"Core: instruction tuning of LLMs is supervised learning on example conversations."},
unsup: {l:"Unsupervised learning", s:"wide",
 p:"Learning from data with no answers given: find groups, patterns or a compact description.",
 t:"Clustering (k-means), dimensionality reduction (PCA, UMAP), density estimation and anomaly detection.",
 w:"Customer segmentation, spotting unusual network traffic, plotting embeddings in 2D.",
 n:"Widely used, especially to explore data and embeddings."},
selfsup: {l:"Self-supervised learning", s:"core",
 p:"The data supplies its own answers: hide part of it and learn to predict the hidden part.",
 t:"Technically supervised training, but the labels are generated automatically from raw data, so it scales to trillions of tokens without human labeling.",
 h:"word2vec (2013) was an early example; BERT and GPT (2018) made it standard for language.",
 w:"Pretraining of every modern LLM, CLIP and most image encoders.",
 n:"Core: the reason foundation models exist.",
 m:"Self-supervised doesn’t mean the model teaches itself without guidance. People design the objective; only the labels come for free."},
ntp: {l:"Next-token pretraining", s:"core",
 p:"Read text and predict each next token. Every sentence becomes thousands of free exercises.",
 t:"Causal language modeling: maximize the probability of each token given all the previous ones, with causal attention so the model can’t peek ahead.",
 h:"GPT-1 (2018) and its successors.",
 w:"How GPT, Llama and Qwen models are pretrained.",
 n:"Core.",
 m:"Training on next-token prediction and generating autoregressively are linked but different: one is the learning objective, the other is how text is produced afterwards."},
mlm: {l:"Masked-token pretraining", s:"wide",
 p:"Hide some words and learn to fill them in using context on both sides.",
 t:"BERT masks about 15% of tokens and predicts them. This yields strong bidirectional representations but doesn’t directly teach the model to write.",
 h:"BERT, 2018.",
 w:"BERT, RoBERTa and many embedding models.",
 n:"Widely used for encoder models."},
contrastive: {l:"Contrastive learning", s:"core",
 p:"Learn by comparison: pull matching pairs together and push non-matching pairs apart.",
 t:"Given a batch of pairs (an image and its caption, two crops of one photo, a question and its answer), train encoders so true pairs get high similarity and all other combinations low similarity, typically with an InfoNCE loss.",
 h:"SimCLR (2020) for images; OpenAI’s CLIP (2021), trained on 400 million image-text pairs.",
 w:"Searching photos by typing a description; most text embedding models used in RAG.",
 n:"Core for retrieval and multimodal models."},
rlloop: {l:"Agent, environment, reward", s:"found",
 p:"The RL setup: an agent takes an action, the environment changes and hands back a reward, repeat.",
 t:"Formalized as a Markov decision process: states, actions, transitions, rewards and a discount factor. The agent learns a policy (what to do) and often a value function (how good a state is).",
 w:"A robot arm (agent) in a warehouse (environment) earns a reward for each item it picks.",
 n:"Core vocabulary, also used to describe LLM agents and RL fine-tuning."},
rlalgos: {l:"Q-learning / DQN / PPO", s:"wide",
 p:"Three landmark RL algorithms: learn the value of actions (Q-learning), do it with a deep network (DQN), or improve the policy directly (PPO).",
 t:"Q-learning updates a table of action values from experience. DQN replaces the table with a neural network, plus a replay buffer and a target network. PPO is a policy-gradient method that limits each update for stability.",
 h:"Q-learning (Watkins, 1989), DQN (DeepMind, 2013–2015), PPO (OpenAI, 2017).",
 w:"PPO was the RL algorithm in InstructGPT-style RLHF.",
 n:"PPO and its relatives remain workhorses in robotics, games and LLM post-training."},
stages: {l:"Training & adaptation", s:"core",
 p:"The stages a model goes through, from raw pretraining to an assistant tuned for your task.",
 t:"Pretraining builds general ability; fine-tuning adapts it; alignment shapes its behavior; distillation and parameter-efficient methods make adaptation cheaper.",
 w:"Base model → instruction-tuned model → preference-aligned chat model → your LoRA for legal emails.",
 n:"Core: “prompting, RAG or fine-tuning?” is a daily AI engineering question."},
pretrain: {l:"Pretraining", s:"core",
 p:"The long, expensive first stage: learn the general patterns of language (or images) from a huge dataset.",
 t:"Self-supervised training on trillions of tokens across thousands of GPUs for weeks or months. It produces a base model that continues text but doesn’t follow instructions reliably.",
 h:"Scaling studies by Kaplan and colleagues (2020) and Chinchilla (2022) showed how model size and data should grow together.",
 w:"Base checkpoints of open models are published for others to fine-tune.",
 n:"Core, but only a few organizations pretrain frontier models; most engineers start from pretrained ones."},
finetune: {l:"Fine-tuning", s:"core",
 p:"Take a pretrained model and keep training it on a smaller, focused dataset so it gets good at your task.",
 t:"Usually supervised on input-output pairs with a small learning rate. Full fine-tuning updates all the weights; parameter-efficient methods train a small add-on.",
 h:"Transfer learning from ImageNet models (from about 2014), then ULMFiT and BERT (2018) for language.",
 w:"A ticket classifier fine-tuned from BERT; a model fine-tuned to write in a company’s report format.",
 n:"Core, though better prompting and RAG often solve the problem first, more cheaply.",
 m:"Fine-tuning is mostly for behavior, style and format. It is a poor way to add facts that change often; that is RAG’s job."},
instruct: {l:"Instruction tuning", s:"core",
 p:"Fine-tuning on examples of instructions and good answers, so a base model learns to follow requests.",
 t:"Supervised fine-tuning (SFT) on instruction-response pairs, thousands to millions of them, written by people or generated and filtered with other models.",
 h:"FLAN (Google, 2021) and InstructGPT (OpenAI, 2022).",
 w:"The difference between a base model that rambles on and a chat model that answers your question.",
 n:"Core: a standard step for every chat model."},
peft: {l:"LoRA / QLoRA", f:"Parameter-efficient fine-tuning (PEFT) with Low-Rank Adaptation", s:"core",
 p:"Fine-tune a big model cheaply by training a small add-on instead of all its weights.",
 t:"LoRA freezes the original weights and learns two small low-rank matrices per layer whose product is added to the weights. QLoRA does this on top of a 4-bit-quantized base model, so large models fit on a single GPU.",
 h:"LoRA (Microsoft, 2021); QLoRA (2023).",
 w:"Teams keep one base model and swap small LoRA adapters per customer or task; image-model LoRAs teach a specific style.",
 n:"Core: the default way to fine-tune open models."},
dpo: {l:"DPO", f:"Direct Preference Optimization", s:"core",
 p:"Teach a model from “answer A is better than answer B” pairs directly, without training a separate reward model.",
 t:"Rewrites the RLHF objective as a simple classification-style loss on preference pairs, measured against a frozen reference model. It works offline: no sampling loop and no RL algorithm.",
 h:"Rafailov and colleagues, 2023.",
 w:"Widely used to align open models because it is simpler and cheaper than PPO-based RLHF.",
 n:"Core, alongside newer variants and RL with verifiable rewards.",
 m:"DPO is often grouped with RLHF, but it is not online reinforcement learning: it learns from a fixed set of preference pairs."},
distill: {l:"Knowledge distillation", s:"core",
 p:"A big “teacher” model trains a small “student” to imitate it.",
 t:"The student learns from the teacher’s output probabilities (soft labels) or from data the teacher generates, keeping much of the quality at a fraction of the size.",
 h:"Hinton, Vinyals and Dean, 2015. DistilBERT (2019) kept about 97% of BERT’s language understanding while being 40% smaller.",
 w:"Small models trained on the outputs of larger ones, such as distilled reasoning models.",
 n:"Core: a main source of strong small models."},

imgex: {l:"SDXL / FLUX.1 / StyleGAN", s:"wide",
 p:"Three real image generators, each from a different recipe: diffusion, flow matching and adversarial training.",
 t:"SDXL: latent diffusion with a large U-Net (Stability AI, 2023). FLUX.1: a diffusion-transformer backbone trained with flow matching (Black Forest Labs, 2024). StyleGAN: a GAN that generates in a single pass (NVIDIA, 2018–2021).",
 w:"SDXL and FLUX.1 for marketing visuals and concept art; StyleGAN for synthetic faces and research.",
 n:"Flow-matching transformers are the current frontier, SDXL is still common in open tooling, and StyleGAN is mostly historical.",
 m:"GAN, diffusion and transformer aren’t three competing boxes. Diffusion and flow matching describe how a model generates; a transformer or U-Net is the network doing the work."},

data: {l:"What it processes", s:"core",
 p:"The data lens: what kind of input a model takes and what kind of output it produces.",
 t:"Each modality needs its own way of turning raw data into vectors: tokens for text, patches for images, spectrograms or audio tokens for sound. Multimodal models combine several.",
 w:"Reading invoices from photos needs vision input; answering phone calls needs speech in and out.",
 n:"Core: assistants increasingly handle text, images and audio in one model.",
 m:"Multimodal is not an architecture. Transformers, CNN encoders and diffusion decoders can all be combined to cover several modalities."},
mtext: {l:"Text & code", s:"core",
 p:"Characters, words and programs, turned into tokens.",
 t:"Tokenized into subword IDs. Code is text with more structure, often with tokenizers tuned for whitespace and symbols.",
 w:"Chat, translation, code completion, document Q&A.",
 n:"Core: still the main modality of LLM applications."},
mimage: {l:"Images & video", s:"core",
 p:"Grids of pixels and, for video, sequences of them over time.",
 t:"Processed by CNNs or cut into patches for vision transformers. Video adds a time dimension, usually compressed into space-time latents.",
 w:"Document scanning, product photo search, video moderation.",
 n:"Core."},
maudio: {l:"Audio & speech", s:"core",
 p:"Sound waves: speech, music, everyday sounds.",
 t:"Usually converted into spectrograms (frequency over time) or into discrete audio tokens by a neural codec before a model processes them.",
 w:"Transcription with Whisper, voice assistants, call analytics.",
 n:"Core and growing, especially real-time voice agents."},
mstruct: {l:"Structured data", s:"core",
 p:"Tables, time series, logs and graphs: data with fixed fields and relationships.",
 t:"Often handled best by classical ML (gradient boosting) or specialized models. LLMs work with it by reading it as text, or by writing SQL and code that do the calculation.",
 w:"Sales tables, sensor readings, transaction graphs.",
 n:"Huge in business. A common pattern: the LLM writes the query, the database does the maths."},
multi: {l:"Multimodal", s:"core",
 p:"Models that work with more than one kind of data, such as text and images together.",
 t:"Usually one encoder per modality (for example a ViT for images) projected into a shared space or into the LLM’s token space. What a model can take in and what it can produce are separate questions.",
 h:"CLIP (2021) linked images and text; Flamingo (2022) and LLaVA (2023) connected vision encoders to language models.",
 w:"Asking about a screenshot, describing photos for blind users, robots following spoken instructions.",
 n:"Core: frontier assistants are multimodal by default.",
 m:"Understanding images doesn’t mean generating them. Always check input and output modalities separately."},
vlm: {l:"Vision-language models", f:"VLM", s:"core",
 p:"Models that connect images and text: match them, describe them or answer questions about them.",
 t:"Two main styles. Dual encoders trained contrastively (CLIP) produce matching embeddings. Generative VLMs feed image features into a language model (LLaVA) and answer in text.",
 w:"Image search by text, automatic alt text, visual question answering.",
 n:"Core."},
llava: {l:"CLIP / LLaVA", s:"core",
 io:["CLIP: an image or a text. LLaVA: an image plus text.","CLIP: embedding vectors. LLaVA: text."],
 p:"CLIP matches images with text; LLaVA lets a language model talk about images.",
 t:"CLIP pairs an image encoder with a text encoder, trained contrastively. LLaVA connects a CLIP vision encoder through a projection layer to an open LLM, then instruction-tunes it on image conversations.",
 h:"CLIP (OpenAI, 2021); LLaVA (2023).",
 w:"CLIP powers zero-shot image classification and guides image generators; LLaVA-style models answer questions about photos.",
 n:"CLIP-style encoders are everywhere; LLaVA set the recipe many open VLMs follow."},
mllm: {l:"Multimodal LLMs", f:"MLLM", s:"core",
 p:"General-purpose LLMs that can also take in images, audio or video, and sometimes produce them.",
 t:"An LLM backbone with modality encoders, and sometimes decoders. Some are trained natively on mixed data; others attach pretrained encoders. For proprietary models, internal details are often not published.",
 w:"Explaining a chart in a screenshot, live voice conversations, summarizing a video.",
 n:"Core: the usual form of frontier assistants."},
gpt4o: {l:"GPT-4o / Gemini", s:"core",
 io:["Text, images and audio (Gemini also video).","Text and speech; images in some versions."],
 p:"Two well-known multimodal assistants, from OpenAI and Google.",
 t:"Both accept text, images and audio and produce text and speech; image generation depends on the product version. Their internal architectures are not fully published.",
 h:"Gemini (December 2023) was announced as natively multimodal; GPT-4o (“omni”, May 2024) added real-time voice.",
 w:"Voice assistants that can see through your camera; analysing documents full of charts.",
 n:"Representative of today’s assistants, though specific versions change quickly."},
vla: {l:"Vision-language-action models", f:"VLA", s:"emerg",
 p:"Models that see, read an instruction and output robot actions.",
 t:"A VLM backbone whose outputs are decoded into motor commands, for example discretized action tokens or chunks of continuous actions.",
 h:"Google DeepMind’s RT-2 (2023) showed web knowledge transferring to robot control.",
 w:"Told to “pick up the extinct animal”, an RT-2 robot picked the toy dinosaur.",
 n:"Active research and early products in robotics."},
rt2: {l:"RT-2 / π0", s:"emerg",
 io:["Camera images and a text instruction.","Robot actions."],
 p:"Two well-known robot foundation models.",
 t:"RT-2 represents robot actions as text-like tokens inside a VLM. π0 (Physical Intelligence) pairs a VLM with a flow-matching “action expert” that outputs continuous motions.",
 h:"RT-2 (Google DeepMind, 2023); π0 (2024).",
 w:"Research robots folding laundry, clearing tables and picking objects.",
 n:"Emerging."},

scale: {l:"Size & efficiency", f:"Model scale & structure", s:"core",
 p:"The practical lens: how big a model is, how its parameters are organized, and what it takes to run it.",
 t:"Parameter count, dense or sparse (Mixture-of-Experts) structure, numerical precision and hardware memory together decide cost, speed and where a model can run.",
 w:"Choosing between a 3B model on a laptop and a frontier model through an API.",
 n:"Core for AI engineers: these trade-offs drive budgets and architecture decisions."},
size: {l:"Model size", s:"core",
 p:"How many learned parameters a model has, usually quoted in billions (B).",
 t:"More parameters generally mean more capacity, but data quality, training compute and post-training matter as much. Memory needed is roughly parameters × bytes per parameter: a 7B model in 16-bit needs about 14 GB for the weights alone.",
 w:"Open models at 1B, 3B, 8B, 70B and beyond; frontier proprietary models often don’t disclose their size.",
 n:"Core.",
 m:"There is no official cutoff between “small” and “large” language models; the labels are relative and shift over time."},
llm: {l:"Large language models", f:"LLM", s:"core",
 p:"Language models big enough, and trained on enough data, to handle many tasks from instructions alone.",
 t:"Typically tens of billions to trillions of parameters, usually decoder-only, pretrained on trillions of tokens and then post-trained. Abilities such as learning from examples in the prompt become reliable at scale.",
 h:"GPT-3 (2020) made “large language model” the standard term.",
 w:"Chat assistants, coding agents, document analysis.",
 n:"Core."},
params: {l:"Dense vs Mixture of Experts", s:"core",
 p:"Does every part of the model work on every token, or only a few specialist parts?",
 t:"Dense models use all their parameters for each token. Mixture-of-Experts (MoE) models route each token to a few expert sub-networks, so total parameters can be huge while active parameters per token stay small.",
 w:"Mixtral 8x7B has about 47B total parameters but uses about 13B per token.",
 n:"Core: many recent open models are MoE."},
dense: {l:"Dense models", s:"core",
 p:"Every parameter takes part in processing every token.",
 t:"Simple to train and serve; compute per token grows with the total parameter count.",
 w:"Llama 3 8B and 70B are dense models.",
 n:"Still common, especially at small and medium sizes."},
moe: {l:"Mixture of Experts", f:"MoE", s:"core",
 p:"Many specialist sub-networks (experts), and a small router that picks a few of them for each token.",
 t:"Usually the feed-forward block in each transformer layer is replaced by N experts and a learned gate that selects the top one, two or more. All experts must still sit in memory, even though only some compute per token.",
 h:"Sparsely gated MoE (Shazeer and colleagues, 2017), Switch Transformer (2021), Mixtral (2023).",
 w:"Mixtral and DeepSeek-V3 (671B total, 37B active parameters).",
 n:"Core.",
 m:"Active parameters cut compute per token, not memory: an MoE model still needs room for all its experts."},
compress: {l:"Making models smaller", s:"core",
 p:"Techniques that shrink a model so it runs faster on cheaper hardware, ideally with little loss of quality.",
 t:"Quantization lowers numerical precision, pruning removes parameters or structures, and distillation trains a smaller model to imitate a larger one.",
 w:"Running a 7B model on a laptop thanks to 4-bit quantization.",
 n:"Core for on-device and cost-sensitive deployments."},
quant: {l:"Quantization", s:"core",
 p:"Store the model’s numbers with fewer bits, for example 4 instead of 16, to cut memory and speed it up.",
 t:"Maps weights (and sometimes activations) from 16-bit floats to 8-bit or 4-bit formats. Methods such as GPTQ, AWQ and the GGUF formats keep quality close to the original; very low bit widths degrade it.",
 h:"Common in mobile CNNs by the late 2010s; LLM.int8() and GPTQ (2022) brought it to LLMs.",
 w:"Local tools such as llama.cpp and Ollama run 4-bit models on laptops.",
 n:"Core.",
 m:"Quantization changes precision, not the number of parameters. A 4-bit 7B model still has 7 billion parameters."},
prune: {l:"Pruning", s:"wide",
 p:"Remove the parts of a network that contribute little.",
 t:"Unstructured pruning zeroes individual weights; structured pruning removes whole neurons, attention heads or layers, which is what actually speeds things up on standard hardware.",
 h:"Optimal Brain Damage (LeCun and colleagues, 1989); the lottery ticket hypothesis (2018).",
 w:"Some small open models were made by pruning a larger one and then distilling it.",
 n:"Used, but less common than quantization for LLMs."},
hw: {l:"Running models", f:"Inference hardware & deployment", s:"core",
 p:"Where a trained model actually runs, and what limits its speed.",
 t:"LLM generation is often limited by memory bandwidth (moving the weights for every token) as much as by raw compute. Memory capacity decides which models fit at all.",
 w:"Choosing between a GPU server, a laptop and an API.",
 n:"Core for AI engineers."},
chips: {l:"CPU, GPU & NPU", f:"Central, Graphics and Neural Processing Units", s:"core",
 p:"Three kinds of processors: general-purpose (CPU), massively parallel (GPU) and specialized for neural networks (NPU).",
 t:"GPUs run thousands of matrix operations in parallel and dominate training and serving. NPUs and TPUs are accelerators built for neural-network maths, for low power or large scale. CPUs can run small or quantized models, slowly.",
 w:"Data-centre GPUs for serving; NPUs in phones and laptops for on-device features.",
 n:"Core."},
memory: {l:"RAM, VRAM & unified memory", s:"core",
 p:"A model’s weights must sit in memory the processor can reach quickly; how much you have decides which models fit.",
 t:"VRAM is the GPU’s own high-bandwidth memory. RAM is system memory for the CPU. Unified memory (as on Apple silicon) is one physical pool shared by CPU and GPU, so big models fit, though bandwidth and compute are usually below high-end GPUs.",
 w:"A 70B model in 4-bit needs roughly 40 GB: too much for most gaming GPUs, but it fits in a 64 GB unified-memory laptop.",
 n:"Core for local inference.",
 m:"Unified memory is not automatically as fast as dedicated GPU VRAM; it trades bandwidth for capacity."},
localcloud: {l:"Local vs cloud inference", s:"core",
 p:"Run the model on your own hardware, or call it over an API in someone else’s data centre.",
 t:"Local: privacy, offline use and fixed costs, but limited model size and you run the operations. Cloud: the strongest models and elastic scale, paying per token and sending data out.",
 w:"A hospital running an open model on its own servers; a startup calling a frontier API.",
 n:"A core decision; many systems are hybrid."},

systems: {l:"Building AI apps", f:"AI systems & orchestration", s:"core",
 p:"The application lens: what developers build around a model to make a reliable product.",
 t:"A model on its own only maps input tokens to output tokens. Products add retrieval, tools, memory, routing, evaluation and guardrails around it.",

 n:"Em grande parte substituídas pelos transformers em linguagem. A ideia volta nos modelos de espaço de estados, como o Mamba, e no RWKV, que buscam contexto longo barato."},

lstm: {l:"RNN / LSTM / GRU", f:"Long Short-Term Memory / Gated Recurrent Unit",
 p:"As células recorrentes mais usadas. LSTM e GRU acrescentam portas que decidem o que lembrar e o que esquecer.",
 t:"A LSTM tem portas de entrada, esquecimento e saída em volta de um estado de célula; a GRU é uma versão mais simples, com duas portas.",
 h:"LSTM em 1997 (Hochreiter e Schmidhuber), GRU em 2014 (Cho e colegas). LSTMs sequence-to-sequence (2014) lançaram a tradução automática neural.",
 w:"O Google Neural Machine Translation (2016) foi construído com LSTMs.",
 n:"Ainda usadas em séries temporais pequenas e em dispositivos, e são a melhor forma de mostrar aos alunos por que a atenção era necessária."},

trans: {l:"Transformers",
 p:"A arquitetura por trás dos LLMs modernos: cada token olha para todos os outros para decidir o que importa.",
 t:"A auto-atenção (self-attention) mistura informação de todas as posições em paralelo, seguida de camadas feed-forward, com conexões residuais e normalização. O treino paraleliza em GPUs muito melhor que nas RNNs.",
 h:"“Attention Is All You Need” (Vaswani e colegas, Google, 2017), criado para tradução automática.",
 w:"ChatGPT, Claude, Gemini, assistentes de código, ranqueamento de buscas na web.",
 n:"A arquitetura dominante em texto, visão, áudio e geração de imagens. O custo da atenção cresce com o quadrado do tamanho do contexto, o que motiva pesquisas em atenção eficiente.",
 m:"Transformers não servem só para linguagem: o mesmo desenho roda modelos de visão, áudio, geração de imagens e robótica."},

inside: {l:"Dentro de um Transformer", f:"Inside a Transformer",
 p:"O que acontece com o seu texto, passo a passo, dos caracteres até o próximo token previsto.",
 t:"Texto → tokens → IDs de token → vetores de embedding (mais posição) → camadas empilhadas de atenção e feed-forward → logits → probabilidades → próximo token.",
 w:"Esse pipeline roda toda vez que um assistente de chat escreve uma palavra na tela.",
 n:"Essas etapas explicam limites de contexto, preço por token, erros estranhos de ortografia e por que os prompts se comportam como se comportam.",
 m:"Um token não entra em “seu próprio neurônio”. Cada ID de token vira um vetor de centenas ou milhares de números, e cada camada processa todos esses vetores."},

tok: {l:"Tokenização e IDs de token", f:"Tokenization & token IDs",
 p:"O texto é cortado em pedaços chamados tokens (palavras, partes de palavras ou caracteres), e cada pedaço recebe um número de ID de um vocabulário fixo.",
 t:"Algoritmos de subpalavras como BPE, WordPiece ou SentencePiece montam um vocabulário de cerca de 30 mil a 200 mil tokens. “inacreditável” pode virar “in”, “acredit”, “ável”. O modelo só enxerga os IDs inteiros.",
 h:"O byte-pair encoding foi adaptado para tradução neural em 2015 (Sennrich e colegas).",
 w:"Preços de API e limites de contexto são contados em tokens; textos em português costumam gastar mais tokens que o mesmo texto em inglês.",
 n:"Essencial. A tokenização explica por que modelos erram ao contar letras e por que alguns idiomas custam mais tokens que outros."},

emb: {l:"Embeddings", f:"Vetores de representação",
 p:"Cada ID de token vira uma lista de números (um vetor) que o posiciona num espaço em que significados parecidos ficam próximos.",
 t:"Uma matriz de embedding tem uma linha aprendida por item do vocabulário; consultar um ID devolve seu vetor, muitas vezes com 768 a mais de 8.000 dimensões. Ao passar pelas camadas, o vetor fica contextual, e “banco” de praça e “banco” de dinheiro terminam diferentes.",
 h:"O word2vec (2013) popularizou vetores de palavras aprendidos; os transformers os tornaram contextuais.",
 w:"O exemplo clássico do word2vec: rei − homem + mulher cai perto de rainha.",
 n:"Essencial. A mesma ideia, aplicada a textos inteiros, alimenta modelos de embedding e busca vetorial.",
 m:"Os embeddings de token dentro de um LLM não são a saída de um modelo de embedding. Um modelo de embedding devolve um único vetor para um texto inteiro, pensado para busca e similaridade."},

pos: {l:"Informação de posição", f:"Positional information",
 p:"A atenção sozinha não sabe a ordem das palavras, então o modelo acrescenta a informação de onde cada token está.",
 t:"O transformer original somava padrões fixos de seno e cosseno; o GPT-2 aprendia vetores de posição; a maioria dos LLMs atuais usa rotary position embeddings (RoPE), que giram os vetores de query e key num ângulo que depende da posição.",
 h:"Codificações senoidais (2017); RoPE (Su e colegas, 2021).",
 w:"Sem ela, “cachorro morde homem” e “homem morde cachorro” pareceriam idênticos.",
 n:"Essencial. Esticar esses esquemas de posição é uma das formas de ampliar a janela de contexto."},

attn: {l:"Auto-atenção (multi-head)", f:"Self-attention",
 p:"Cada token olha para todos os outros e decide quais importam para entendê-lo.",
 t:"Cada token produz uma query, uma key e um value. Os produtos escalares entre queries e keys, escalados e passados por softmax, viram pesos de atenção, e a saída é uma mistura ponderada dos values. A atenção multi-head roda várias dessas em paralelo, para que cada cabeça acompanhe relações diferentes.",
 h:"A atenção foi acrescentada a modelos de tradução com RNN em 2014 (Bahdanau e colegas); o transformer (2017) construiu tudo em volta dela.",
 w:"Em “O troféu não coube na mala porque ele era grande demais”, a atenção ajuda a ligar “ele” a “troféu”.",
 n:"Essencial. O custo cresce com o quadrado do tamanho da sequência, por isso contexto longo é caro."},

ffn: {l:"Camadas feed-forward", f:"Feed-forward layers",
 p:"Depois que a atenção mistura informação entre tokens, uma pequena rede neural processa cada token isoladamente.",
 t:"Um MLP de duas camadas aplicado a cada posição de forma independente, normalmente expandindo para cerca de quatro vezes a largura do modelo e voltando. Pesquisas sugerem que essas camadas guardam boa parte do conhecimento factual do modelo.",
 w:"Nos modelos Mixture of Experts, é este bloco que é substituído por várias redes especialistas.",
 n:"Essencial: uma grande parte dos parâmetros de um LLM mora aqui."},

ctx: {l:"Janela de contexto", f:"Context window",
 p:"O número máximo de tokens que o modelo consegue olhar de uma vez: seu prompt, documentos, conversa e a própria resposta.",
 t:"Definida pelo treinamento e pelo esquema de posição, vai de alguns milhares a um milhão de tokens ou mais. O que fica fora é invisível para o modelo, e a qualidade pode cair para detalhes enterrados no meio de contextos muito longos.",
 w:"Colar um contrato longo só funciona se ele couber; caso contrário, você precisa de RAG ou de resumos.",
 n:"Essencial para engenheiros de IA: o orçamento de contexto define custo, latência e desenho do sistema.",
 m:"Uma janela de contexto longa não é memória. O modelo esquece tudo entre chamadas, a menos que a aplicação envie de novo."},

logits: {l:"Logits e próximo token", f:"Output logits & token prediction",
 p:"No final, o modelo dá uma nota para cada token do vocabulário; as notas viram probabilidades e um token é escolhido.",
 t:"A última camada projeta o vetor da última posição sobre o vocabulário, produzindo logits. O softmax (com temperatura) os transforma em probabilidades; a decodificação escolhe o mais provável ou sorteia com top-k ou top-p.",
 w:"Temperatura 0 dá respostas quase determinísticas; temperaturas maiores dão respostas mais variadas.",
 n:"Essencial. A decodificação restrita, como saída JSON estrita, funciona bloqueando tokens nesta etapa."},

enc: {l:"Encoder-only", f:"Somente codificador",
 p:"Transformers que leem o texto inteiro de uma vez, nos dois sentidos, para entendê-lo em vez de escrevê-lo.",
 t:"Atenção bidirecional, pré-treinamento por modelagem de linguagem mascarada (completar palavras escondidas). Produz embeddings contextuais para classificação, marcação e busca.",
 h:"O BERT (2018) definiu a categoria.",
 w:"Casar buscas com documentos; muitos modelos de embedding por trás da busca vetorial em RAG.",
 n:"Muito relevante para engenheiros de IA: muitos modelos de embedding e rerankers em pipelines de busca seguem o estilo encoder."},

bert: {l:"BERT / RoBERTa", f:"Bidirectional Encoder Representations from Transformers (representações bidirecionais de codificador a partir de Transformers)",
 p:"O BERT, do Google, aprendeu linguagem completando palavras mascaradas; o RoBERTa, da Meta, treinou o mesmo desenho por mais tempo e melhor.",
 t:"O BERT-base tem cerca de 110 milhões de parâmetros em 12 camadas. O RoBERTa (2019) abandonou a previsão da próxima frase e usou mais dados com mascaramento dinâmico.",
 h:"O BERT foi lançado em outubro de 2018, e o Google passou a usá-lo na Busca em 2019.",
 w:"Análise de sentimento, reconhecimento de entidades nomeadas, detecção de intenção em bots de atendimento.",
 n:"Ainda é escolha frequente para classificação e embeddings rápidos e baratos, por exemplo via sentence-transformers. O ModernBERT (2024) renovou a linhagem.",
 m:"O BERT não escreve texto como o GPT. Ele foi treinado para completar palavras mascaradas usando o contexto dos dois lados, então brilha em entender, não em gerar."},

dec: {l:"Decoder-only", f:"Somente decodificador",
 p:"Transformers que escrevem: preveem o próximo token, acrescentam e repetem.",
 t:"Atenção causal, para que cada token só veja o passado. Pré-treinados com previsão do próximo token e depois ajustados com instruções e alinhados com métodos como o RLHF.",
 h:"GPT-1 (2018), GPT-2 (2019) e GPT-3 (2020, 175 bilhões de parâmetros), que mostrou que a escala traz habilidades few-shot.",
 w:"Assistentes de chat, assistentes de código, agentes.",
 n:"O desenho dominante de LLM, dos modelos de fronteira até os pequenos que rodam no aparelho."},

gpt: {l:"GPT / Llama / Qwen", f:"GPT: Generative Pre-trained Transformer (transformer generativo pré-treinado)",
 p:"Famílias de grandes modelos de linguagem: o GPT da OpenAI (pesos fechados), o Llama da Meta e o Qwen da Alibaba (pesos abertos).",
 t:"Transformers decoder-only com bilhões de parâmetros, atenção causal e pré-treinamento por próximo token. Ingredientes comuns nos modelos abertos: rotary position embeddings, grouped-query attention e, em muitos recentes, camadas Mixture of Experts. Os detalhes internos dos modelos proprietários recentes muitas vezes não são publicados.",
 h:"O ChatGPT foi lançado em novembro de 2022. O Llama (fevereiro de 2023) iniciou a onda de pesos abertos, e o Qwen virou uma das famílias abertas mais usadas.",
 w:"Assistentes de atendimento, geração de código, perguntas e respostas sobre documentos da empresa.",
 n:"O centro do trabalho de engenharia de IA: prompting, RAG, uso de ferramentas, fine-tuning e avaliação partem daqui."},

encdec: {l:"Encoder–Decoder", f:"Codificador–decodificador",
 p:"Uma metade lê a entrada e a outra escreve a saída: ideal para transformar um texto em outro.",
 t:"O encoder constrói uma representação com atenção bidirecional; o decoder gera com atenção causal mais atenção cruzada (cross-attention) sobre a saída do encoder.",
 h:"O transformer original de 2017 era um encoder-decoder feito para tradução.",
 w:"Tradução automática, resumo, transcrição de fala (o Whisper, da OpenAI, é encoder-decoder).",
 n:"Menos comum em modelos de chat de uso geral, mas ainda forte em tradução, reconhecimento de fala e reescrita estruturada."},

t5: {l:"T5 / BART", f:"Text-to-Text Transfer Transformer / Bidirectional and Auto-Regressive Transformers",
 p:"O T5, do Google, trata toda tarefa como “texto entra, texto sai”. O BART, da Meta, aprende consertando texto corrompido.",
 t:"O T5 é pré-treinado preenchendo trechos removidos e recebe as tarefas como prefixos, como “summarize:”. O BART embaralha o texto (mascaramento, troca de ordem) e aprende a reconstruí-lo.",
 h:"Ambos de 2019. O Flan-T5 (2022) acrescentou ajuste por instruções.",
 w:"Pipelines de resumo, tradução, reescrita de consultas de busca.",
 n:"Ainda usados em tarefas especializadas com fine-tuning, e o codificador de texto do T5 lê o prompt dentro de vários geradores de imagem."},

vt: {l:"Vision Transformers", f:"Transformers de visão",
 p:"Transformers aplicados a imagens: a imagem é cortada em pedaços (patches) e cada pedaço é tratado como uma palavra.",
 t:"A imagem vira uma sequência de embeddings de patches mais embeddings de posição, processada por um encoder de transformer comum.",
 h:"Apresentado pelo Google em 2020, em “An Image is Worth 16x16 Words”.",
 w:"Classificação de imagens e a parte de visão de assistentes que leem prints e fotos.",
 n:"Os codificadores de imagem dentro de LLMs multimodais costumam ser do estilo ViT, como CLIP ou SigLIP.",
 m:"Essas categorias se sobrepõem. O ViT é, ele mesmo, um transformer encoder-only, e o DiT é um transformer usado dentro da difusão. Famílias nomeadas pelo uso (visão, difusão) e pela estrutura (encoder, decoder) não são mutuamente exclusivas."},

vit: {l:"ViT", f:"Vision Transformer",
 p:"O Vision Transformer original.",
 t:"Divide a imagem em patches de 16×16 pixels e acrescenta um token especial [CLS] usado na classificação. Precisa de pré-treinamento em grande escala para superar as CNNs.",
 h:"Dosovitskiy e colegas, 2020 (publicado na ICLR 2021).",
 w:"O CLIP da OpenAI (2021) combinou um ViT com um codificador de texto, permitindo buscar fotos por descrição.",
 n:"Variantes do ViT, como DINOv2 e SigLIP, são codificadores de imagem padrão hoje."},

dit: {l:"Diffusion Transformers", f:"DiT: transformers de difusão",
 p:"Transformers usados como motor de geradores de imagem e vídeo, no lugar da antiga U-Net.",
 t:"Patches latentes com ruído entram como tokens; o transformer prevê o que remover (ruído ou velocidade), condicionado à etapa de tempo e ao prompt.",
 h:"O artigo do DiT, de Peebles e Xie, saiu em 2022.",
 w:"O Sora da OpenAI (2024) e o Stable Diffusion 3 usam backbones de transformer na geração.",
 n:"O backbone padrão para geração de imagem e vídeo no estado da arte.",
 m:"O DiT não é uma alternativa à difusão; é a rede que faz a remoção de ruído dentro de um modelo de difusão ou de flow matching."},

ditimg: {l:"Modelos de imagem DiT", f:"DiT image models",
 p:"Geradores de imagem construídos sobre diffusion transformers.",
 t:"Normalmente trabalham no espaço latente comprimido de um VAE, leem o prompt com um codificador de texto (CLIP, T5) e muitas vezes são treinados com um objetivo de flow matching.",
 h:"Stable Diffusion 3 (2024) e FLUX.1, da Black Forest Labs (2024).",
 w:"Peças de marketing, mockups de produto, arte conceitual.",
 n:"Estado da arte em texto para imagem."},

other: {l:"Outras arquiteturas neurais", f:"Other neural architectures",
 p:"Redes pensadas para dados que não são uma grade ou sequência simples, ou para comprimir dados.",
 t:"Redes de grafos passam mensagens pelas arestas; modelos de espaço de estados processam sequências longas; autoencoders comprimem a entrada num código pequeno e a reconstroem.",
 h:"As ideias têm décadas e amadureceram com o deep learning nos anos 2010.",
 w:"Previsão de propriedades de moléculas, detecção de anomalias.",
 n:"Ferramentas especializadas, e autoencoders se escondem dentro da maioria dos geradores de imagem."},

gnn: {l:"Redes neurais de grafos", f:"GNN: Graph Neural Network",
 p:"Redes que aprendem com grafos: cada nó se atualiza usando mensagens dos vizinhos.",
 t:"Camadas de troca de mensagens (GCN, GraphSAGE, GAT) agregam as features dos vizinhos, gerando previsões por nó, por aresta ou para o grafo inteiro.",
 h:"Primeiros trabalhos por volta de 2005–2009 (Scarselli e colegas); a GCN (Kipf e Welling, 2016) as popularizou.",
 w:"Recomendações do PinSage, no Pinterest; previsão do tempo GraphCast, do Google DeepMind; descoberta de medicamentos.",
 n:"Fortes em ciência, recomendação e detecção de fraude, e parceiras naturais dos grafos de conhecimento."},

ssm: {l:"Modelos de espaço de estados", f:"SSM: State Space Models",
 p:"Um tipo mais novo de modelo de sequência que lê passo a passo como uma RNN, mas treina em paralelo como um transformer.",
 t:"Um sistema dinâmico linear aprendido carrega um estado de tamanho fixo pela sequência, então o custo cresce linearmente com o tamanho, e não ao quadrado. O Mamba acrescenta atualizações “seletivas” que dependem da entrada.",
 h:"O S4 (2021) mostrou que SSMs lidam com sequências muito longas; o Mamba veio em 2023.",
 w:"Áudio longo, genômica e documentos longos; modelos híbridos misturam camadas SSM com camadas de atenção.",
 n:"Pesquisa ativa e alguns híbridos em produção; transformers continuam sendo o padrão."},

mamba: {l:"Mamba",
 p:"O modelo de espaço de estados mais conhecido, criado como alternativa mais rápida à atenção em sequências longas.",
 t:"Blocos SSM seletivos cujos parâmetros dependem da entrada, calculados com uma varredura paralela otimizada para o hardware. A versão pura não usa atenção.",
 h:"Gu e Dao, dezembro de 2023.",
 w:"Modelos abertos híbridos, como o Jamba da AI21, combinam camadas Mamba e de transformer.",
 n:"Influente; os híbridos são a forma de uso mais comum."},

ae: {l:"Autoencoders", f:"Autocodificadores",
 p:"Uma rede que espreme os dados num código pequeno e depois os reconstrói. Se a reconstrução fica boa, o código capturou o que importa.",
 t:"Um encoder comprime a entrada num código pequeno (o gargalo) e um decoder a reconstrói, com treino pelo erro de reconstrução. É um padrão de desenho e um objetivo, não uma família separada: encoder e decoder podem ser CNNs, transformers ou MLPs. Um VAE acrescenta um espaço latente probabilístico para que se possa amostrar dados novos.",
 h:"Raízes na pesquisa de redes neurais dos anos 1980; autoencoders profundos foram popularizados por Hinton e Salakhutdinov em 2006.",
 w:"Detecção de anomalias (reconstrução ruim indica algo incomum), compressão.",
 n:"Autoencoders esparsos viraram uma ferramenta central de interpretabilidade para olhar dentro de LLMs, e VAEs comprimem imagens para modelos de difusão.",
 m:"Um autoencoder não concorre com CNNs ou transformers; é uma forma de usá-los."},

learn: {l:"Como aprende", f:"Learning paradigms & training",
 p:"A lente do treinamento: de onde vêm as habilidades de um modelo.",
 t:"Duas perguntas separadas. O paradigma de aprendizado é o tipo de sinal com que o modelo aprende: rótulos, estrutura dos dados, os próprios dados ou recompensas. A etapa de treinamento é quando e para quê ele é treinado: pré-treinamento, fine-tuning, alinhamento.",
 w:"Um assistente de chat costuma ser auto-supervisionado no pré-treinamento, supervisionado no ajuste por instruções e otimizado por preferências no final.",
 n:"Essencial: muitas decisões de engenharia (prompt ou fine-tuning? LoRA ou treino completo?) moram aqui.",
 m:"Paradigma e etapa são eixos diferentes. O aprendizado supervisionado, por exemplo, pode ser usado tanto no pré-treinamento quanto no fine-tuning."},

paradigms: {l:"Paradigmas de aprendizado", f:"Learning paradigms",
 p:"O tipo de retorno com que um modelo aprende.",
 t:"Supervisionado: as respostas certas são dadas. Não supervisionado: achar estrutura sem respostas. Auto-supervisionado: criar as respostas a partir dos próprios dados. Por reforço: aprender com recompensas por ações.",
 w:"Filtro de spam (supervisionado), segmentos de clientes (não supervisionado), pré-treinamento do GPT (auto-supervisionado), agentes de jogos (reforço).",
 n:"O aprendizado auto-supervisionado é o que tornou possíveis os modelos de fundação: sem rotulagem humana, em escala de internet."},

sup: {l:"Aprendizado supervisionado", f:"Supervised learning",
 p:"Aprender com exemplos que já vêm com a resposta certa, como estudar com flashcards.",
 t:"Minimizar a diferença entre previsões e rótulos (entropia cruzada para classes, erro quadrático para números). A qualidade depende muito de quão bons e completos são os rótulos.",
 h:"O cenário padrão do machine learning aplicado por décadas; o ImageNet (2009) foi um conjunto de dados rotulado histórico.",
 w:"Casos de fraude rotulados, tickets de suporte classificados, raios-X anotados por radiologistas.",
 n:"Essencial: o ajuste por instruções de LLMs é aprendizado supervisionado com conversas de exemplo."},

unsup: {l:"Aprendizado não supervisionado", f:"Unsupervised learning",
 p:"Aprender com dados sem respostas: achar grupos, padrões ou uma descrição compacta.",
 t:"Clustering (k-means), redução de dimensionalidade (PCA, UMAP), estimativa de densidade e detecção de anomalias.",
 w:"Segmentação de clientes, detecção de tráfego de rede incomum, plotar embeddings em 2D.",
 n:"Muito usado, principalmente para explorar dados e embeddings."},

selfsup: {l:"Aprendizado auto-supervisionado", f:"Self-supervised learning",
 p:"Os dados fornecem as próprias respostas: esconda uma parte e aprenda a prever a parte escondida.",
 t:"Tecnicamente é treino supervisionado, mas os rótulos são gerados automaticamente a partir de dados brutos, o que escala para trilhões de tokens sem rotulagem humana.",
 h:"O word2vec (2013) foi um exemplo pioneiro; BERT e GPT (2018) tornaram o método padrão em linguagem.",
 w:"O pré-treinamento de todo LLM moderno, do CLIP e da maioria dos codificadores de imagem.",
 n:"Essencial: a razão de existirem modelos de fundação.",
 m:"Auto-supervisionado não quer dizer que o modelo aprende sozinho, sem orientação. Pessoas definem o objetivo; só os rótulos vêm de graça."},

ntp: {l:"Pré-treino por próximo token", f:"Next-token pretraining",
 p:"Ler texto e prever cada próximo token. Cada frase vira milhares de exercícios gratuitos.",
 t:"Modelagem de linguagem causal: maximizar a probabilidade de cada token dados todos os anteriores, com atenção causal para o modelo não espiar o futuro.",
 h:"GPT-1 (2018) e sucessores.",
 w:"É assim que os modelos GPT, Llama e Qwen são pré-treinados.",
 n:"Essencial.",
 m:"Treinar com previsão do próximo token e gerar de forma autorregressiva estão ligados, mas são coisas diferentes: um é o objetivo de aprendizado, o outro é como o texto é produzido depois."},

mlm: {l:"Pré-treino por token mascarado", f:"Masked-token pretraining",
 p:"Esconder algumas palavras e aprender a completá-las usando o contexto dos dois lados.",
 t:"O BERT mascara cerca de 15% dos tokens e os prevê. Isso gera representações bidirecionais fortes, mas não ensina o modelo a escrever diretamente.",
 h:"BERT, 2018.",
 w:"BERT, RoBERTa e muitos modelos de embedding.",
 n:"Muito usado em modelos encoder."},

contrastive: {l:"Aprendizado contrastivo", f:"Contrastive learning",
 p:"Aprender por comparação: aproximar pares que combinam e afastar pares que não combinam.",
 t:"Dado um lote de pares (uma imagem e sua legenda, dois recortes da mesma foto, uma pergunta e sua resposta), treinar codificadores para que pares verdadeiros tenham alta similaridade e todas as outras combinações baixa, normalmente com uma perda InfoNCE.",
 h:"SimCLR (2020) para imagens; o CLIP da OpenAI (2021), treinado com 400 milhões de pares imagem-texto.",
 w:"Buscar fotos digitando uma descrição; a maioria dos modelos de embedding de texto usados em RAG.",
 n:"Essencial para busca e modelos multimodais."},

rl: {l:"Aprendizado por reforço", f:"Reinforcement Learning (RL)",
 p:"Aprender por tentativa e erro: tentar ações, receber recompensas ou penalidades e repetir o que funciona.",
 t:"Um agente aprende uma política que maximiza a recompensa de longo prazo, com métodos como Q-learning, policy gradients e PPO, muitas vezes com redes profundas.",
 h:"Sutton e Barto lançaram as bases nos anos 1980 e 1990; a DQN da DeepMind aprendeu jogos de Atari a partir dos pixels (2013–2015).",
 w:"Controle de robôs, agentes de jogos, estratégias de lances em anúncios.",
 n:"Central no pós-treinamento de LLMs: o RLHF tornou os modelos de chat úteis, e RL com recompensas verificáveis treina modelos de raciocínio."},

rlloop: {l:"Agente, ambiente, recompensa", f:"Agent, environment, reward",
 p:"O esquema do RL: um agente age, o ambiente muda e devolve uma recompensa, e o ciclo se repete.",
 t:"Formalizado como um processo de decisão de Markov: estados, ações, transições, recompensas e um fator de desconto. O agente aprende uma política (o que fazer) e muitas vezes uma função de valor (quão bom é um estado).",
 w:"Um braço robótico (agente) num armazém (ambiente) ganha uma recompensa a cada item que pega.",
 n:"Vocabulário essencial, também usado para descrever agentes com LLM e fine-tuning por RL."},

rlalgos: {l:"Q-learning / DQN / PPO",

 t:"O Q-learning atualiza uma tabela de valores de ação a partir da experiência. A DQN troca a tabela por uma rede neural, com replay buffer e rede alvo. O PPO é um método de policy gradient que limita cada atualização para ganhar estabilidade.",
 h:"Q-learning (Watkins, 1989), DQN (DeepMind, 2013–2015), PPO (OpenAI, 2017).",
 w:"O PPO foi o algoritmo de RL do RLHF no estilo InstructGPT.",
 n:"O PPO e seus parentes seguem como cavalos de batalha em robótica, jogos e pós-treinamento de LLMs."},

stages: {l:"Treinamento e adaptação", f:"Training & adaptation",
 p:"As etapas pelas quais um modelo passa, do pré-treinamento bruto a um assistente ajustado para a sua tarefa.",
 t:"O pré-treinamento constrói a capacidade geral; o fine-tuning a adapta; o alinhamento molda o comportamento; destilação e métodos eficientes em parâmetros barateiam a adaptação.",
 w:"Modelo base → modelo ajustado por instruções → modelo de chat alinhado por preferências → a sua LoRA para e-mails jurídicos.",
 n:"Essencial: “prompting, RAG ou fine-tuning?” é uma pergunta diária na engenharia de IA."},

pretrain: {l:"Pré-treinamento", f:"Pretraining",

 h:"Estudos de escala de Kaplan e colegas (2020) e o Chinchilla (2022) mostraram como tamanho do modelo e volume de dados devem crescer juntos.",
 w:"Checkpoints base de modelos abertos são publicados para que outros façam fine-tuning.",
 n:"Essencial, mas poucas organizações pré-treinam modelos de fronteira; a maioria dos engenheiros parte de modelos pré-treinados."},

finetune: {l:"Fine-tuning", f:"Ajuste fino",

 t:"Normalmente supervisionado com pares de entrada e saída, com taxa de aprendizado pequena. O fine-tuning completo atualiza todos os pesos; métodos eficientes em parâmetros treinam um pequeno complemento.",
 h:"Transferência de aprendizado com modelos do ImageNet (a partir de 2014, aproximadamente), depois ULMFiT e BERT (2018) em linguagem.",
 w:"Um classificador de tickets ajustado a partir do BERT; um modelo ajustado para escrever no formato de relatório de uma empresa.",
 n:"Essencial, embora prompting melhor e RAG muitas vezes resolvam o problema antes, e mais barato.",
 m:"Fine-tuning serve principalmente para comportamento, estilo e formato. É um jeito ruim de adicionar fatos que mudam com frequência; isso é trabalho do RAG."},

instruct: {l:"Ajuste por instruções", f:"Instruction tuning",
 p:"Fine-tuning com exemplos de instruções e boas respostas, para que um modelo base aprenda a atender pedidos.",
 t:"Supervised fine-tuning (SFT, ajuste fino supervisionado) com pares instrução-resposta, de milhares a milhões deles, escritos por pessoas ou gerados e filtrados com outros modelos.",
 h:"FLAN (Google, 2021) e InstructGPT (OpenAI, 2022).",
 w:"A diferença entre um modelo base que divaga e um modelo de chat que responde à sua pergunta.",
 n:"Essencial: etapa padrão de todo modelo de chat."},

peft: {l:"LoRA / QLoRA", f:"Parameter-efficient fine-tuning (PEFT, ajuste eficiente em parâmetros) com Low-Rank Adaptation (adaptação de baixo posto)",

 t:"A LoRA congela os pesos originais e aprende duas matrizes pequenas de baixo posto por camada, cujo produto é somado aos pesos. A QLoRA faz isso sobre um modelo base quantizado em 4 bits, de modo que modelos grandes cabem numa única GPU.",
 h:"LoRA (Microsoft, 2021); QLoRA (2023).",
 w:"Equipes mantêm um modelo base e trocam pequenos adaptadores LoRA por cliente ou tarefa; LoRAs de modelos de imagem ensinam um estilo específico.",
 n:"Essencial: a forma padrão de fazer fine-tuning de modelos abertos."},

 h:"O InstructGPT (OpenAI, 2022) mostrou que um modelo de 1,3 bilhão de parâmetros com RLHF era preferido ao GPT-3 de 175 bilhões.",

 h:"Rafailov e colegas, 2023.",
 w:"Muito usado para alinhar modelos abertos por ser mais simples e barato que o RLHF com PPO.",

buzz: {l:"Buzzwords decoded", s:"core",
 p:"Terms you’ll see on X and in AI news, translated into plain words.",
 t:"Many buzzwords are new names for ideas found elsewhere on this map; each of these nodes links back to the underlying concept.",
 w:"“Vibe coding”, “thinking models”, “context engineering”, “skills”, “SOTA on SWE-bench”.",
 n:"Useful for following the conversation without getting lost.",
 k:"Like a phrasebook for travellers: it won’t teach you the whole language, but it gets you through the conversation."},
vibe: {l:"Vibe coding", s:"core",
 p:"Building software by describing what you want in plain language and letting an AI write the code, often without reading it closely.",
 t:"Coined by Andrej Karpathy in February 2025. Fine for prototypes and personal tools; for production, engineers still review, test and take responsibility for the code, which some call agentic engineering to mark the difference.",
 w:"A designer building a working prototype app in one afternoon with a coding agent.",
 n:"A mainstream practice, and an ongoing debate about quality and security.",
 m:"Vibe coding doesn’t remove the need to understand code: someone still has to judge whether it is correct and safe.",

reasoning: {l:"Reasoning models", f:"Thinking models", s:"core",
 p:"Models that “think” through hidden steps before answering, trading time for accuracy on hard problems.",
 t:"Trained with reinforcement learning on tasks with checkable answers (maths, code) to produce long internal chains of thought. Most providers let you choose the reasoning effort; more thinking costs more tokens and time.",
 h:"OpenAI’s o1 (September 2024) and DeepSeek-R1 (January 2025) popularized them; by 2026 most frontier models think by default or on request.",
 w:"Choosing high effort for a tricky bug and low effort for a quick summary.",

 m:"The visible “thinking” summary is not a perfect window into how the model actually reached its answer.",

ctxeng: {l:"Context engineering", s:"core",
 p:"Deciding exactly what information goes into the model’s context window, and what stays out.",
 t:"Goes beyond writing a good prompt: choosing which documents to retrieve, which tool results to keep, when to summarize history, how to describe tools and how to give an agent memory, all within a limited token budget.",
 w:"An agent that keeps a running notes file instead of stuffing the whole conversation into every call.",
 n:"A core skill for engineers building agents.",
 k:"Like packing a small suitcase: you can’t bring everything, so what you choose decides how the trip goes."},
skills: {l:"Agent skills", s:"core",
 p:"Reusable folders of instructions, scripts and examples that teach an agent how to do one kind of task.",
 t:"A skill is usually a SKILL.md file plus resources. The agent sees a short description of every skill and loads the full instructions only when relevant, which saves context. Introduced by Anthropic and published as an open standard; OpenAI’s Codex uses the same format.",
 w:"A skill that teaches an agent your team’s way of writing release notes, or how to create a PowerPoint file properly.",
 n:"Widely adopted across agent tools in 2026.",
 k:"Like recipe cards in a kitchen drawer: the cook doesn’t memorize every recipe, but pulls out the right card when a dish is ordered."},
bench: {l:"Benchmarks & leaderboards", s:"core",
 p:"Standard tests and public rankings used to compare models, and argued about endlessly on X.",
 t:"Benchmarks are fixed test sets: SWE-bench for coding, GPQA for hard science questions, Terminal-Bench for agent tasks. Leaderboards include LMArena, where people vote between two anonymous answers, and Artificial Analysis, which combines many tests with price and speed.",
 w:"A lab announcing a model with a table of scores; developers checking whether it actually helps on their own tasks.",
 n:"Useful signals, but labs tune for popular benchmarks and agent results depend on the harness.",
 m:"“SOTA” (state of the art) on one benchmark doesn’t mean best for your use case; always test on your own data.",
 k:"Like school exams: a top grade is a good sign, but it doesn’t guarantee someone will be great at the actual job."},
codenames: {l:"Codenames & versions", s:"core",
 p:"Why model names are so confusing: internal codenames, marketing names, version numbers and API IDs.",
 t:"Labs test many checkpoints under codenames, and some names leak before launch. A launched model can have a public name (Gemini 4 Carbon), an API ID (gemini-4-carbon), dated snapshots and tiers such as Pro, Flash, Mini or Luna. The same marketing name can also point to a newer model later.",
 h:"GPT-5.5 was codenamed “Spud”, Mistral Large 4 is nicknamed “Le Chonk”, and Gemini 4 checkpoints were called Argon, Barium and Carbon.",
 w:"Pinning a dated model ID in production so your app doesn’t change behaviour overnight.",
 n:"A core practical habit: always check the exact model ID you are calling.",
 m:"A codename doesn’t guarantee the public name: Google’s public Argon was internally called Barium-B, while Carbon kept its codename at launch.",
 k:"Like a film’s working title during shooting, then its release title, then the director’s cut and the extended edition."}

  // ---------- search ----------
  const q = document.getElementById("q"), qres = document.getElementById("qres");
  let qItems = [], qActive = 0;
  function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function search(text) {
    const s = norm(text.trim());
    if (!s) return [];
    const out = [];
    NODES.forEach(function (n, id) {
      const hay = [T(id).l, T(id).f, EN[id].l, EN[id].f, PT[id].l, PT[id].f].map(norm);
      let score = 9;
      hay.forEach(function (h, i) {
        if (!h) return;
        const pen = i < 2 ? 0 : 0.5;
        if (h.indexOf(s) === 0) score = Math.min(score, 0 + pen);
        else if (h.indexOf(" " + s) > -1 || h.indexOf("/" + s) > -1 || h.indexOf("(" + s) > -1) score = Math.min(score, 1 + pen);
        else if (h.indexOf(s) > -1) score = Math.min(score, 2 + pen);
      });
      if (score === 9 && s.length > 3 && norm(T(id).p).indexOf(s) > -1) score = 4;   // words in the plain explanation
      if (score < 9) out.push({ id: id, score: score, depth: n.depth });
    });
    out.sort(function (a, b) { return a.score - b.score || a.depth - b.depth; });
    return out.slice(0, 8).map(function (o) { return o.id; });
  }
  function drawResults() {
    qres.replaceChildren();
    if (!q.value.trim()) { qres.hidden = true; q.setAttribute("aria-expanded", "false"); return; }
    if (!qItems.length) qres.append(el("p", null, U("noMatch")));
    qItems.forEach(function (id, i) {
      const n = NODES.get(id), b = btn("lens-" + n.lens, null, function () { choose(id); });
      b.id = "qr" + i; b.setAttribute("role", "option"); b.tabIndex = -1;
      b.setAttribute("aria-selected", i === qActive ? "true" : "false");
      b.append(el("span", "dot")); b.append(document.createTextNode(L(id)));
      if (n.lens !== "root") b.append(el("small", null, U("lens")[n.lens]));
      b.addEventListener("mousedown", function (e) { e.preventDefault(); });   // keep focus in the field; the click selects
      qres.append(b);
    });
    qres.hidden = false; q.setAttribute("aria-expanded", "true");
    if (qItems.length) q.setAttribute("aria-activedescendant", "qr" + qActive); else q.removeAttribute("aria-activedescendant");
  }
  function choose(id) { q.value = ""; qItems = []; drawResults(); reveal(id); }
  q.addEventListener("input", function () { qItems = search(q.value); qActive = 0; drawResults(); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" && qItems.length) { e.preventDefault(); qActive = (qActive + 1) % qItems.length; drawResults(); }
    else if (e.key === "ArrowUp" && qItems.length) { e.preventDefault(); qActive = (qActive - 1 + qItems.length) % qItems.length; drawResults(); }
    else if (e.key === "Enter" && qItems.length) { e.preventDefault(); choose(qItems[qActive]); }
    else if (e.key === "Escape") { q.value = ""; qItems = []; drawResults(); }
  });
  q.addEventListener("blur", function () { setTimeout(function () { qres.hidden = true; q.setAttribute("aria-expanded", "false"); }, 150); });
  q.addEventListener("focus", function () { if (q.value.trim()) drawResults(); });

  });
  document.getElementById("scrim").addEventListener("click", function () { setSheet(false); });
  document.getElementById("sheetClose").addEventListener("click", function () { setSheet(false); });
  document.getElementById("sheetBtn").addEventListener("click", function () { setView("course"); });
  sheetMQ.addEventListener("change", applySheetMode);
  document.getElementById("openAll").addEventListener("click", function () {
    hideHint(); leaveEverything();
    (function openAll(n) { if (n.kids.length) { open.add(n.id); n.kids.forEach(openAll); } })(NODES.get(selected));
    for (let a = NODES.get(selected).parent; a; a = a.parent) open.add(a.id);
    render(selected, fit);
  });
  document.getElementById("closeAll").addEventListener("click", function () {
    leaveEverything();
    open.clear(); open.add("ai"); selected = "ai"; tlActive = -1; setHash("ai"); syncZoomBtn();
    renderPanel();
    render("ai", fit);
  });
  document.getElementById("fitBtn").addEventListener("click", fit);
  document.getElementById("centerBtn").addEventListener("click", centerChart);
  document.getElementById("zoomBtn").addEventListener("click", function () {
    if (sheetOpen) setSheet(false);
    if (shown.has(selected)) zoomTo(selected); else { reveal(selected, true); setTimeout(function () { zoomTo(selected); }, 650); }
  });
  window.addEventListener("hashchange", function () {
    const id = decodeURIComponent(location.hash.slice(1));
    if (NODES.has(id) && id !== selected) reveal(id);
  });
  let lastW = 0, rz = null;
  new ResizeObserver(function () {          // keep the map framed when its width changes (window resize, panel shown or hidden)
    const w = canvasEl.clientWidth;
    if (!lastW || w === lastW) { lastW = w; return; }
    lastW = w; clearTimeout(rz);
    rz = setTimeout(function () { if (selected === "ai" || everything) fit(); else panTo(selected); }, 120);
  }).observe(canvasEl);
  if (SITE.donateUrl) { const s = document.getElementById("supportBtn"); s.href = SITE.donateUrl; s.hidden = false; }

  // ---------- start ----------
  applyTheme();
  applySheetMode();
  syncControls();
  pressGroup("#levelSeg", "data-level", level);
  open.add("ai");                                   // show the main branches from the first frame
  const linked = decodeURIComponent(location.hash.slice(1));
  if (NODES.has(linked) && linked !== "ai") {       // a shared link to one concept
    for (let a = NODES.get(linked).parent; a; a = a.parent) open.add(a.id);
    selected = linked; view = "node"; hinted = true; document.getElementById("hint").classList.add("gone");
  }
  setView(view);
  applyLang();
  initialView();
  render(null, view === "node" ? function () { panTo(selected); } : fit);
})();

</script>
</body>
</html>
