*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; height: 100%; min-height: 560px;
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; font-weight: 400; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 60; background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 999px; box-shadow: var(--shadow); }
.skip:focus { left: 12px; }

/* ---------- controls ---------- */
.btn {
  font-size: 0.86rem; line-height: 1.2; color: var(--ink); cursor: pointer; text-decoration: none;
  background: var(--fill); border: 0; border-radius: 999px; padding: 8px 15px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background 0.15s;
}
.btn:hover { background: var(--fill-2); }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { font-size: 1rem; padding: 12px 24px; }
.btn.quiet { background: none; color: var(--muted); padding-left: 2px; padding-right: 2px; }
.btn.quiet:hover { color: var(--accent); }
.btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { font-size: 0.8rem; color: var(--muted); cursor: pointer; border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--thumb); }

/* ---------- header ---------- */
.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 260px) minmax(0, 1fr); align-items: center; gap: 10px 14px; padding: 14px 22px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 26px; height: 26px; flex: none; color: var(--accent); }
h1 { font-weight: 500; font-size: 1.12rem; line-height: 1.1; letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
.prefs { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 4px; margin: -4px; }
.prefs::-webkit-scrollbar { display: none; }
.prefs > * { flex: none; }
.sc-prefs { justify-self: end; max-width: 100%; }
/* rows that slide sideways: arrows appear only when there is more to see */
.sc { position: relative; display: flex; min-width: 0; }
.sc-btn {
  position: absolute; z-index: 3; top: 50%; width: 30px; height: 30px; margin-top: -15px; padding: 0; border: 0; border-radius: 50%;
  display: none; align-items: center; justify-content: center; cursor: pointer;
  background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 3px 10px rgba(0, 0, 0, 0.14);
}
.sc-btn svg { width: 7px; height: 12px; }
.sc-l { left: -6px; } .sc-r { right: -6px; }
.sc.can-l .sc-l, .sc.can-r .sc-r { display: inline-flex; }
.sc.can-r > .scroller { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 46px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 46px), transparent); }
.sc.can-l > .scroller { -webkit-mask-image: linear-gradient(to right, transparent, #000 46px); mask-image: linear-gradient(to right, transparent, #000 46px); }
.sc.can-l.can-r > .scroller { -webkit-mask-image: linear-gradient(to right, transparent, #000 46px, #000 calc(100% - 46px), transparent); mask-image: linear-gradient(to right, transparent, #000 46px, #000 calc(100% - 46px), transparent); }
.mapbar > .sc { flex: 0 1 auto; }
.search { position: relative; width: 100%; min-width: 0; }
.search input { width: 100%; font: inherit; font-size: 0.88rem; color: var(--ink); background: var(--fill); border: 0; border-radius: 999px; padding: 8px 15px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--muted); }
.qres {
  position: absolute; z-index: 50; top: calc(100% + 8px); left: 0; right: 0; min-width: 270px;
  background: var(--panel); border-radius: 14px; padding: 6px; max-height: 360px; overflow: auto; box-shadow: var(--shadow);
}
.qres button { display: flex; width: 100%; align-items: center; gap: 9px; text-align: left; font-size: 0.9rem; background: none; border: 0; border-radius: 9px; padding: 8px 10px; cursor: pointer; }
.qres button small { margin-left: auto; color: var(--muted); font-size: 0.76rem; white-space: nowrap; }
.qres button[aria-selected="true"], .qres button:hover { background: var(--fill); }
.qres p { margin: 8px 10px; color: var(--muted); font-size: 0.88rem; }

/* ---------- layout ---------- */
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; grid-template-rows: minmax(0, 1fr); padding: 0 18px 18px 0; }
.canvas { position: relative; overflow: hidden; min-height: 380px; }
#graph { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#graph:active { cursor: grabbing; }
.sw { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: var(--c, var(--muted)); }
.sw.ring { background: transparent; border: 1.2px solid var(--muted); }
.sw.dash { width: 18px; height: 0; border-radius: 0; background: none; border-top: 1.2px dotted var(--muted); }
.hint { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); margin: 0; color: var(--muted); font-size: 0.82rem; pointer-events: none; text-align: center; white-space: nowrap; transition: opacity 0.4s; }
.hint.gone { opacity: 0; }
.mapbar { position: absolute; z-index: 4; left: 16px; right: 16px; bottom: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none; }
.mapbar > * { pointer-events: auto; }
.tools { display: flex; gap: 6px; align-items: center; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 6px; margin: -6px; }
.tools::-webkit-scrollbar { display: none; }
.tools > * { flex: none; }
.tools .div { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
.mapbar .btn { background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0, 0, 0, 0.05); font-size: 0.82rem; padding: 7px 13px; }
.mapbar .btn:hover { color: var(--accent); }
.mapbar .btn[aria-pressed="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 2px 8px rgba(0, 0, 0, 0.05); }
.mapbar .btn.primary { background: var(--accent); box-shadow: 0 4px 14px var(--accent-soft); }
.mapbar .btn.primary:hover { color: var(--on-accent); }
.mapbar .seg { background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0, 0, 0, 0.05); align-items: center; }
.mapbar .seg button[aria-pressed="true"] { background: var(--fill-2); box-shadow: none; }
.seglabel { font-size: 0.78rem; color: var(--muted); padding: 0 6px 0 10px; white-space: nowrap; }
.btn.reveal svg, .btn.zoomin svg { width: 15px; height: 15px; flex: none; }
.mapbar .btn.zoomin { color: var(--accent); animation: fadein 0.25s ease; }
.mapbar .btn.reveal { color: var(--accent); }
.mapbar .btn.reveal[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 4px var(--accent-soft), 0 4px 18px var(--accent-soft); }
.mapbar .btn.reveal[aria-pressed="true"]:hover { color: var(--on-accent); }
#sheetBtn { display: none; flex: none; }
html.panel-closed #sheetBtn { display: inline-flex; }
html.panel-closed:not(.sheet) .stage { grid-template-columns: minmax(0, 1fr); padding-right: 0; }
html.panel-closed:not(.sheet) .side { display: none; }

/* ---------- side panel ---------- */
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.scrim { display: none; }
.sidehead { display: flex; align-items: center; flex: none; border-bottom: 1px solid var(--line); padding: 0 14px; }
.tabs { display: flex; flex: 1; min-width: 0; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { font-size: 0.9rem; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 15px 10px 13px; white-space: nowrap; position: relative; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--accent); }
.close { display: inline-flex; flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--fill); color: var(--muted); font-size: 1.15rem; line-height: 1; cursor: pointer; align-items: center; justify-content: center; }
.close:hover { background: var(--fill-2); color: var(--ink); }
.close + .close { margin-left: 0; }
.details { flex: 1; min-height: 0; overflow: auto; padding: 18px 26px 34px; -webkit-overflow-scrolling: touch; }
.details:focus { outline: none; }
.ico { display: inline-flex; width: 1em; height: 1em; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

/* page top: back link or lesson position, share */
.pagetop { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; margin-bottom: 12px; }
.backlink { display: inline-flex; align-items: center; gap: 7px; min-width: 0; background: none; border: 0; padding: 6px 0; color: var(--accent); font-size: 0.94rem; cursor: pointer; }
.backlink .ico { width: 8px; height: 14px; }
.backlink span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kicker { margin: 0; font-size: 0.84rem; color: var(--muted); }
.kicker.accent { color: var(--accent); font-weight: 500; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: var(--fill-2); }
.iconbtn .ico { width: 15px; height: 17px; }

/* reading */
.details h2.title { font-size: 1.9rem; font-weight: 600; line-height: 1.12; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.subtitle { margin: 6px 0 0; color: var(--muted); font-size: 1rem; }
.metaline { display: flex; align-items: center; gap: 7px; margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
.lead { margin: 22px 0 0; font-size: 1.2rem; line-height: 1.5; letter-spacing: -0.01em; max-width: 36em; }
.explain { margin: 14px 0 0; font-size: 1.02rem; line-height: 1.65; max-width: 38em; }
.lead.muted { color: var(--muted); font-size: 1.06rem; margin-top: 10px; }
.part { margin-top: 26px; }
.part h3 { margin: 0 0 4px; font-size: 1.02rem; font-weight: 600; letter-spacing: -0.01em; }
.part p { margin: 0; font-size: 1rem; line-height: 1.6; max-width: 38em; }
.card { margin-top: 24px; padding: 16px 18px 17px; border-radius: 18px; background: var(--fill); }
.card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 0.95rem; font-weight: 600; }
.card p { margin: 0; font-size: 1.02rem; line-height: 1.55; }
.analogy h3 .ico { width: 15px; height: 17px; color: var(--learn); }
.io { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 0.97rem; }
.io dt { color: var(--muted); }
.io dd { margin: 0; }

/* go deeper */
.deeper { margin-top: 30px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.deeper summary { list-style: none; display: flex; align-items: center; justify-content: space-between; padding: 15px 2px; cursor: pointer; font-size: 1.02rem; font-weight: 600; }
.deeper summary::-webkit-details-marker { display: none; }
.deeper summary .ico { width: 8px; height: 14px; color: var(--muted); transform: rotate(90deg); transition: transform 0.2s; }
.deeper[open] summary .ico { transform: rotate(-90deg); }
.deeper-body { padding: 0 2px 22px; }
.deeper-body .part:first-child { margin-top: 0; }
.facts { margin: 22px 0 0; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.86rem; color: var(--muted); }
.facts a { color: var(--accent); text-decoration: none; }
.facts a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* grouped lists, like iOS settings */
.group { margin-top: 30px; }
.group-h { margin: 0 0 8px 4px; font-size: 0.82rem; font-weight: 500; color: var(--muted); }
.list { background: var(--fill); border-radius: 14px; overflow: hidden; }
.rowi { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 11px 14px; text-align: left; background: none; border: 0; cursor: pointer; }
.rowi + .rowi::before { content: ""; position: absolute; top: 0; right: 0; left: 46px; border-top: 1px solid var(--line); }
.rowi:hover { background: var(--fill); }
.rowi:active { background: var(--fill-2); }
.rowi:disabled { cursor: default; }
.rowi > .dot { width: 9px; height: 9px; margin: 0 8px 0 6px; }
.rowt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.rowtitle { font-size: 0.98rem; }
.rowsub { font-size: 0.8rem; color: var(--muted); }
.rowside { font-size: 0.82rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rowi > .chev { width: 7px; height: 12px; color: var(--muted); opacity: 0.55; }
.num { width: 24px; height: 24px; border-radius: 50%; background: var(--panel); color: var(--muted); font-size: 0.78rem; display: inline-flex; align-items: center; justify-content: center; flex: none; font-variant-numeric: tabular-nums; }
.ring { width: 24px; height: 24px; color: var(--accent); flex: none; }
.ring svg { width: 100%; height: 100%; display: block; }

/* course */
.hero { margin-top: 22px; padding: 20px 20px 18px; border-radius: 20px; background: var(--accent-soft); }
.hero h3 { margin: 4px 0 6px; font-size: 1.3rem; font-weight: 600; letter-spacing: -0.02em; }
.hero p.hero-g { margin: 0 0 16px; color: var(--muted); font-size: 0.97rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.goals { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 10px; }
.goals li { display: flex; gap: 11px; align-items: flex-start; font-size: 1rem; line-height: 1.5; }
.goals .ico { width: 18px; height: 18px; margin-top: 3px; color: var(--accent); }
.block-actions { margin-top: 28px; }
.btn.wide { width: 100%; justify-content: center; padding: 14px; font-size: 1rem; border-radius: 14px; }
.resetrow { margin: 24px 0 0; text-align: center; }
.coursebar { flex: none; border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.cb-mid { min-width: 0; text-align: center; }
.cb-label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; display: flex; gap: 6px; justify-content: center; align-items: center; }
.cb-label button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 1rem; line-height: 1; }
.cb-label button:hover { color: var(--ink); }
.cb-mid .meter { margin-top: 6px; }
.cb-mid .btn { font-size: 0.8rem; padding: 6px 12px; }
.meter { flex: 1; display: flex; gap: 3px; }
.meter i { flex: 1; height: 3px; background: var(--fill-2); border-radius: 2px; }
.meter i.on { background: var(--accent); }

/* quiz */
.qtext { margin: 30px 0 10px; font-size: 1.02rem; font-weight: 600; line-height: 1.45; max-width: 38em; }
.mark { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--fill-2); flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--on-accent); }
.mark .ico { width: 12px; height: 12px; }
.rowi.right .mark { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
.rowi.wrongpick .mark { background: var(--bad); border-color: var(--bad); color: #FFFFFF; }
.rowi:disabled .rowtitle { color: var(--muted); }
.rowi.right .rowtitle, .rowi.wrongpick .rowtitle { color: var(--ink); }
.fb { margin: 10px 4px 0; font-size: 0.93rem; line-height: 1.5; color: var(--muted); }
.fb b { font-weight: 600; color: var(--ok); }
.fb.no b { color: var(--bad); }
.result { margin-top: 30px; }
.result .card h3 { font-size: 1.2rem; margin-bottom: 14px; }

/* about, timeline */
.about .part p { font-size: 0.98rem; }
.about a { color: var(--accent); text-decoration: none; }
.about .actions { margin-top: 26px; }
.tl { list-style: none; margin: 14px 0 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 53px; top: 12px; bottom: 12px; border-left: 1px solid var(--line); }
.tl button { display: grid; grid-template-columns: 44px 18px 1fr; align-items: start; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; border-radius: 12px; padding: 10px 8px 10px 0; cursor: pointer; }
.tl button:hover, .tl button[aria-current="true"] { background: var(--fill); }
.tl .yr { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--muted); padding-top: 1px; }
.tl .pin { width: 7px; height: 7px; border-radius: 50%; margin: 8px 0 0 6px; background: var(--c); box-shadow: 0 0 0 3px var(--panel); position: relative; }
.tl .txt { font-size: 0.95rem; line-height: 1.5; }
.tl .kind { display: block; font-size: 0.76rem; color: var(--muted); }

/* ---------- graph: quiet branches, one clear path ---------- */
.lens-build { --c: var(--build); } .lens-learn { --c: var(--learn); } .lens-tasks { --c: var(--tasks); } .lens-data { --c: var(--data); }
.lens-genm { --c: var(--genm); } .lens-scale { --c: var(--scale); } .lens-systems { --c: var(--systems); } .lens-trust { --c: var(--trust); }
.lens-eco { --c: var(--eco); } .lens-root { --c: var(--accent); }
.node { cursor: pointer; }
.node:focus { outline: none; }
.node .hit { fill: transparent; }
.node .main { fill: var(--c); fill-opacity: 0.16; transition: fill-opacity 0.15s; }
.node .core { fill: var(--c); pointer-events: none; }
.node:hover .main { fill-opacity: 0.3; }
.node.k-leaf .main { fill-opacity: 0.9; }
.node.k-leaf:hover .main { fill-opacity: 1; }
.node.k-example .main { fill: var(--canvas); fill-opacity: 1; stroke: var(--c); stroke-width: 1.2; }
.node.k-root .main { fill-opacity: 0.1; stroke: var(--c); stroke-width: 0.8; stroke-opacity: 0.45; }
.node .orbit { fill: none; stroke: var(--c); stroke-width: 0.8; stroke-dasharray: 1.5 5; stroke-linecap: round; opacity: 0.7; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.node .halo { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.node.selected .halo { opacity: 1; }
.node .focus { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 2 3; opacity: 0; pointer-events: none; }
.node:focus-visible .focus { opacity: 1; }
.label { font-family: var(--font); font-weight: 400; font-size: 12px; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.k-example .label, .k-leaf .label { fill: var(--muted); }
.k-lens .label { font-weight: 500; font-size: 13px; letter-spacing: -0.005em; }
.k-root .label { font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
.node.selected .label { fill: var(--accent); font-weight: 500; }
.badge circle { fill: transparent; }
.badge text { font-family: var(--font); font-size: 10px; fill: var(--muted); text-anchor: start; dominant-baseline: central; }
.link { fill: none; stroke: var(--edge); stroke-width: 0.9; }
.link.onpath { stroke: var(--accent); stroke-width: 1.4; }
.xlink { fill: none; stroke: var(--muted); stroke-width: 0.9; stroke-dasharray: 1.5 4; stroke-linecap: round; opacity: 0.45; }
.xlink.hot { stroke: var(--accent); stroke-width: 1.1; opacity: 0.85; }
.xlabel { font-family: var(--font); font-size: 10.5px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.xlabel.hot { fill: var(--accent); }
.mk { fill: var(--muted); } .mk.hot { fill: var(--accent); }
#graph.far .k-leaf:not(.selected) .label, #graph.far .k-example:not(.selected) .label, #graph.far .xlabel:not(.hot) { opacity: 0; }
#graph .label, #graph .xlabel { transition: opacity 0.2s; }
html.inapp #graph .label, html.inapp #graph .xlabel { stroke: none; stroke-width: 0; }
#graph.everything .xlabel:not(.hot) { opacity: 0; }
#graph.everything .xlink:not(.hot) { opacity: 0.22; }
#graph .label.out { text-anchor: start; dominant-baseline: central; font-size: 11px; stroke-width: 3px; }
#graph .label.out.flip { text-anchor: end; }
#graph.everything .k-family:not(.selected) .label { font-size: 10.5px; fill: var(--muted); }
#graph.far .label.out { opacity: 1; }
#graph.tiny .label.out { opacity: 0; }
.dim { opacity: 0.15; transition: opacity 0.25s; }
.exiting { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
@keyframes fadein { from { opacity: 0; } }
.entering { animation: fadein 0.4s ease; }

/* ---------- touch and tablet: full-screen map, details in a modal ---------- */
html.sheet .top { padding: 12px 16px 8px; }
html.sheet .stage { display: block; padding: 0; }
html.sheet .canvas { height: 100%; }
html.sheet .hint { display: none; }
html.sheet #sheetBtn { display: inline-flex; }
html.sheet .btn { padding: 10px 17px; font-size: 0.9rem; }
html.sheet .mapbar .seg button { padding: 9px 12px; }
html.sheet .seg button { padding: 7px 12px; }
html.sheet .mapbar { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
html.sheet .side { position: fixed; z-index: 40; display: none; border-radius: 22px; }
/* tablets: a side panel on the right, the map stays visible and usable */
html.sheet.sheet-open .side {
  display: flex; left: auto; right: 12px; top: calc(var(--hdr, 60px) + 2px); bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  width: min(400px, 48vw); height: auto; transform: none; animation: sidein 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
}
html.sheet.sheet-open .tabs { gap: 0; }
html.sheet.sheet-open .tabs button { padding: 16px 6px 14px; font-size: 0.88rem; }
html.sheet.sheet-open .sidehead .close { width: 30px; height: 30px; }
html.sheet.sheet-open .minbtn, html.sheet.sheet-open .maxbtn { margin-right: 4px; }
html.sheet.sheet-open .sidehead { padding: 0 10px 0 12px; }
html.sheet.sheet-open .details { padding: 18px 22px 28px; }
/* maximized: a large centered modal over the blurred map */
html.sheet.sheet-open.sheet-max .side {
  left: 50%; right: auto; top: 50%; bottom: auto; transform: translate(-50%, -50%);
  width: min(680px, calc(100vw - 40px)); height: min(860px, calc(100dvh - 60px)); border-radius: 24px; animation: sheetin 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
}
html.sheet.sheet-open.sheet-max .tabs button { padding: 18px 12px 16px; font-size: 0.95rem; }
html.sheet.sheet-open.sheet-max .details { padding: 24px 32px 32px; }
html.sheet.sheet-open.sheet-max .scrim { display: block; position: fixed; z-index: 39; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); animation: fadein 0.2s ease; }
html.sheet .maxbtn { display: inline-flex; margin-right: 6px; }
.maxbtn, .minbtn { display: none; }
html.sheet .minbtn { display: inline-flex; margin-right: 6px; }
.minbtn .ico { width: 13px; height: 8px; }
.dock {
  position: absolute; z-index: 5; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 10px; max-width: min(420px, calc(100% - 32px)); padding: 10px 16px;
  border: 0; border-radius: 999px; background: var(--panel); color: var(--ink); font-size: 0.92rem; cursor: pointer;
  box-shadow: 0 0 0 1px var(--line), 0 8px 26px rgba(0, 0, 0, 0.14); animation: dockin 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.dock-t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .dock-i { width: 13px; height: 8px; color: var(--muted); }
@keyframes dockin { from { opacity: 0; transform: translate(-50%, 12px); } }
.maxbtn .ico { width: 14px; height: 14px; }
@keyframes sidein { from { opacity: 0; transform: translateX(24px); } }
@keyframes sheetin { from { opacity: 0; transform: translate(-50%, -48%) scale(0.98); } }
@media (max-width: 1100px) {
  .top { grid-template-columns: auto minmax(120px, 1fr) auto; padding-left: 16px; padding-right: 16px; }
  .search { width: 100%; max-width: 340px; justify-self: center; }
  .prefs { gap: 6px; }
  html.sheet .top .seg button { padding: 6px 10px; }
}
@media (max-width: 700px) {
  .top { grid-template-columns: minmax(0, 1fr); }
  .search { width: 100%; max-width: none; }
  .sc-prefs { justify-self: stretch; }
}
@media (max-width: 640px) {
  .mapbar { left: 10px; right: 10px; gap: 6px; }
  html.sheet .mapbar .btn { padding: 10px 14px; }
  html.sheet.sheet-open .side, html.sheet.sheet-open.sheet-max .side { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100%; height: min(88dvh, calc(100dvh - 40px)); border-radius: 22px 22px 0 0; animation: sheetin 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }
  html.sheet.sheet-open .scrim { display: block; position: fixed; z-index: 39; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }
  html.sheet.sheet-open .details, html.sheet.sheet-open.sheet-max .details { padding: 20px 20px 26px; }
  html.sheet.sheet-open .tabs button, html.sheet.sheet-open.sheet-max .tabs button { padding: 16px 9px 14px; font-size: 0.9rem; }
  html.sheet .maxbtn { display: none; }
  @keyframes sheetin { from { opacity: 0; transform: translateY(24px); } }
}
@media (prefers-reduced-motion: reduce) {
  .entering, .node .orbit, html.sheet.sheet-open .side, html.sheet.sheet-open .scrim, .dock { animation: none; }
  .exiting, .hint, .node .halo, .dim, .btn, .node .main { transition: none; }
}
</style>
</head>
<body>
<a class="skip" href="#details" data-i="skip">Skip to the content</a>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.6"/><circle cx="16" cy="16" r="9" fill="currentColor" opacity="0.14"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg>
    <h1 data-i="title">The AI map</h1>
  </div>
  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="qres">
    <div id="qres" class="qres" role="listbox" hidden></div>
  </div>
  <div class="prefs">
    <div class="seg" role="group" id="levelSeg">
      <button type="button" data-level="simple" data-i="lvlSimple" aria-pressed="true">Simple</button>
      <button type="button" data-level="full" data-i="lvlFull" aria-pressed="false">Detailed</button>
    </div>
    <div class="seg" role="group" id="langSeg">
      <button type="button" data-lang="auto" data-i="thAuto" aria-pressed="true">Auto</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="pt" aria-pressed="false">PT-BR</button>
    </div>
    <div class="seg" role="group" id="themeSeg">
      <button type="button" data-theme-set="auto" data-i="thAuto" aria-pressed="true">Auto</button>
      <button type="button" data-theme-set="light" data-i="thLight" aria-pressed="false">Light</button>
      <button type="button" data-theme-set="dark" data-i="thDark" aria-pressed="false">Dark</button>
    </div>
    <a class="btn primary" id="supportBtn" target="_blank" rel="noopener noreferrer" hidden><span aria-hidden="true">&#9825;</span> <span data-i="support">Support this project</span></a>
  </div>
</header>
<main class="stage">
  <section class="canvas" id="canvas">
    <svg id="graph" role="group"></svg>
    <p class="hint" id="hint" data-i="hint"></p>
    <button type="button" class="dock" id="dock" hidden><span class="dot"></span><span class="dock-t"></span><span class="ico dock-i"></span></button>
    <div class="mapbar">
      <div class="tools" role="toolbar" id="tools">
        <button type="button" class="btn reveal" id="allBtn" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/><circle cx="8" cy="1.4" r="1.2" fill="currentColor"/><circle cx="13.7" cy="11.3" r="1.2" fill="currentColor"/><circle cx="2.3" cy="11.3" r="1.2" fill="currentColor"/></svg><span data-i="showAll">Show everything</span></button>
        <span class="div" aria-hidden="true"></span>
        <button type="button" class="btn" id="fitBtn" data-i="fit">Fit</button>
        <button type="button" class="btn" id="centerBtn" data-i="center">Center</button>
        <button type="button" class="btn zoomin" id="zoomBtn" hidden><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 10.4 14 14M6.8 4.6v4.4M4.6 6.8H9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span data-i="zoomIn">Zoom in</span></button>
        <span class="div" aria-hidden="true"></span>
        <div class="seg" role="group" id="modeSeg">
          <button type="button" data-mode="tree" data-i="tree" aria-pressed="true">Tree</button>
          <button type="button" data-mode="radial" data-i="radial" aria-pressed="false">Radial</button>
        </div>
        <div class="seg" role="group" id="linkSeg" aria-labelledby="linksLabel">
          <span class="seglabel" id="linksLabel" data-i="links">Connections</span>
          <button type="button" data-link="sel" data-i="linkSel" aria-pressed="true">Selected</button>
          <button type="button" data-link="all" data-i="linkAll" aria-pressed="false">All</button>
          <button type="button" data-link="off" data-i="linkOff" aria-pressed="false">Off</button>
        </div>
        <span class="div" aria-hidden="true"></span>
        <button type="button" class="btn" id="openAll" data-i="openAll">Expand branch</button>
        <button type="button" class="btn" id="closeAll" data-i="closeAll">Collapse all</button>
        <button type="button" class="btn" id="focusBtn" data-i="focus" aria-pressed="false">Focus</button>
      </div>
      <button type="button" class="btn primary" id="sheetBtn" data-i="tabCourse">Course</button>
    </div>
  </section>
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="sidehead">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" data-view="course" data-i="tabCourse" aria-selected="true">Course</button>
        <button type="button" role="tab" data-view="node" data-i="tabNode" aria-selected="false">Concept</button>
        <button type="button" role="tab" data-view="timeline" data-i="tabTimeline" aria-selected="false">Timeline</button>
        <button type="button" role="tab" data-view="about" data-i="tabAbout" aria-selected="false">About</button>
      </div>
      <button type="button" class="close minbtn" id="sheetMin"></button>
      <button type="button" class="close maxbtn" id="sheetMax"></button>
      <button type="button" class="close" id="sheetClose"><span aria-hidden="true">&times;</span></button>
    </div>
    <div class="details" id="details" tabindex="-1"></div>
    <div class="coursebar" id="coursebar" hidden></div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const EN = {
ai: {l:"Artificial Intelligence", s:"core",
 p:"Making machines do things that seem to need intelligence: understand, predict, create and decide.",
 t:"This map looks at the same field through three lenses: how a system is built, what job it does, and how generative models create new data. The same model often shows up in more than one lens, and dashed lines connect those appearances.",
 h:"The term was coined for the 1956 Dartmouth workshop (McCarthy, Minsky, Rochester, Shannon). The field went through boom-and-bust cycles, with “AI winters” in the 1970s and late 1980s.",
 w:"A phone uses AI dozens of times a day: face unlock, autocorrect, spam filtering, photo search, voice typing.",
 n:"Today’s wave is driven by deep learning, especially transformers, trained on huge datasets with large amounts of GPU compute."},

build: {l:"How it’s built", s:"core",
 p:"The engineering lens: what kind of machinery sits inside the system.",
 t:"Two big families. Symbolic AI, where people write the knowledge down as rules and logic, and machine learning, where the system learns patterns from data. Real systems often mix both.",
 h:"Symbolic AI dominated from 1956 to the late 1980s, statistical machine learning took over in the 1990s, and deep learning took off in 2012.",
 w:"A bank’s fraud system may combine hand-written rules (“block if the card is used in two countries within an hour”) with a learned risk score.",
 n:"As AI engineers you’ll mostly build on learned models, but rules, search and knowledge graphs remain the guardrails and the glue."},

tasks: {l:"What it does", s:"core",
 p:"The product lens: what problem the system solves, whatever is inside it.",
 t:"Three broad jobs: predict a label or number about existing data, generate new data, or choose actions over time. One architecture, such as a transformer, can do all three.",
 h:"The split comes from statistics and ML (discriminative versus generative models) plus decision theory and reinforcement learning.",
 w:"“Is this email spam?” is predictive. “Write a reply” is generative. “Decide which offer to show next” is decision making.",
 n:"Most real products chain these: retrieve and rank (predictive), then generate an answer (generative), then pick the next tool to call (decision)."},

genm: {l:"How it generates", s:"core",
 p:"The generative lens: the different recipes for creating new text, images or sound.",
 t:"All of them learn the probability distribution of the training data and sample from it. They differ in how: one token at a time, by removing noise step by step, by following a learned flow, through a generator-versus-critic game, or by decoding from a latent space.",
 h:"VAEs (2013) and GANs (2014) opened the deep generative era, diffusion took over images around 2020–2022, and flow matching (2022) is the newer refinement.",
 w:"Chat assistants write autoregressively; most image and video generators use diffusion or flow matching.",
 n:"Autoregressive models dominate text and code. Diffusion and flow matching dominate images, video and much of audio. GANs and VAEs live on mostly as components."},

sym: {l:"Symbolic / Classical AI", s:"found",
 p:"AI where people write the intelligence down explicitly: facts, rules and logical steps.",
 t:"Knowledge is represented as symbols (if-then rules, logic formulas, graphs) and manipulated by inference or search. Fully explainable, but brittle when the world doesn’t match the rules.",
 h:"Dominant from the 1950s to the late 1980s, sometimes called “Good Old-Fashioned AI”. The collapse of the expert-system market contributed to the second AI winter.",
 w:"Tax software, eligibility checks and airline crew scheduling still run on rule engines and solvers.",
 n:"No longer the headline, but back in “neuro-symbolic” designs: LLMs calling solvers, rule-based guardrails, knowledge graphs for grounding."},

rules: {l:"Rules & Expert Systems", s:"wide",
 p:"Capture an expert’s know-how as hundreds of if-then rules.",
 t:"A knowledge base of rules plus an inference engine that fires them, forward (from facts to conclusions) or backward (from a goal to the facts that support it), often with certainty scores.",
 h:"Boomed in the 1970s and 1980s. DEC’s XCON configured computer orders and was one of the first big commercial successes.",
 w:"Business rule engines such as Drools decide insurance pricing, loan eligibility and compliance checks.",
 n:"Still everywhere in enterprise software. In LLM apps the same idea returns as policy layers and guardrails around the model."},

mycin: {l:"MYCIN / DENDRAL", s:"hist",
 p:"Two famous Stanford expert systems: DENDRAL identified molecules, MYCIN recommended antibiotics.",
 t:"MYCIN used around 600 rules, backward chaining and certainty factors to diagnose blood infections and suggest treatment. DENDRAL inferred molecular structures from mass-spectrometry data.",
 h:"DENDRAL began in 1965 and MYCIN in the early 1970s. In evaluations MYCIN performed as well as infectious-disease specialists, yet it was never used in routine care.",
 w:"Its descendants are the clinical decision-support alerts inside hospital record systems.",
 n:"A classic teaching case: accuracy is not enough without trust, workflow fit and clear accountability. LLMs in healthcare face exactly the same questions."},

search: {l:"Search & Planning", s:"wide",
 p:"Find a good sequence of steps by exploring the possibilities systematically.",
 t:"Model the problem as states and actions, then explore with algorithms like breadth-first search, A*, minimax with alpha-beta pruning, or Monte Carlo Tree Search, guided by heuristics.",
 h:"Newell and Simon’s General Problem Solver (1957), A* (1968), the STRIPS planner (1971).",
 w:"Navigation apps, logistics routing, game AI and robot motion planning.",
 n:"Very much alive: AlphaGo combined search with neural networks, and reasoning models and agents use search-like ideas such as trying several paths and backtracking."},

deepblue: {l:"Deep Blue / A*", s:"found",
 p:"Deep Blue beat the world chess champion by searching enormous numbers of positions. A* is the classic shortest-path search.",
 t:"Deep Blue ran alpha-beta search on custom chess chips at around 200 million positions per second, with a hand-tuned evaluation function. A* expands the node with the lowest cost-so-far plus estimated cost-to-go, and finds the shortest path when the estimate never overshoots.",
 h:"A* was published in 1968 (Hart, Nilsson, Raphael). Deep Blue defeated Garry Kasparov in 1997.",
 w:"A* variants route characters in video games and robots in warehouses.",
 n:"A* is still an everyday tool. Deep Blue’s brute-force style was overtaken by learned evaluation, as in AlphaZero (2017)."},

logic: {l:"Logic & Knowledge Representation", s:"wide",
 p:"Ways to store facts and relationships so a machine can reason over them.",
 t:"Formal logic, semantic networks, frames and ontologies. A reasoner derives new facts from stated ones, for example “every manager is an employee” plus “Ana is a manager” gives “Ana is an employee”.",
 h:"Prolog (1972), the Cyc project (from 1984), and the Semantic Web standards RDF and OWL in the 2000s.",
 w:"Google’s Knowledge Graph (2012) powers the fact panels next to search results.",
 n:"Current again through knowledge graphs and GraphRAG, where structured facts ground what an LLM says."},

kg: {l:"Knowledge Graphs", s:"wide", add:true,
 p:"Facts stored as nodes and relationships, just like the graph you are clicking through right now.",
 t:"Entities become nodes and typed relations become edges, queried with languages like Cypher or SPARQL. Often combined with embeddings for hybrid retrieval.",
 h:"The term was popularized by Google in 2012. Graph databases such as Neo4j (1.0 in 2010) made them practical for developers.",
 w:"Banks uncover fraud rings by following shared phone numbers and addresses; retailers link products, brands and categories.",
 n:"Popular in RAG: GraphRAG-style pipelines extract a graph from documents so an LLM can answer questions that need several hops."},

ml: {l:"Machine Learning", s:"core",
 p:"Instead of writing the rules, show the system examples and let it learn the rules itself.",
 t:"Fit a model’s parameters to data by minimizing a loss (an error score), then check that it works on data it hasn’t seen. Main settings: supervised, unsupervised and reinforcement learning.",
 h:"Arthur Samuel coined the term in 1959 with a checkers program that improved by playing. Statistical methods took over the field in the 1990s.",
 w:"Streaming recommendations, credit scoring, spam filters.",
 n:"Almost all modern AI is machine learning. In practice the hard parts are data quality, evaluation and deployment, more than the algorithm."},

classical: {l:"Classical ML", s:"wide",
 p:"Machine learning without deep neural networks: smaller models, often working on tables of data.",
 t:"Linear and logistic regression, decision trees, gradient boosting, SVMs, k-means. They usually need hand-designed features, but are cheap to train and easier to explain.",
 h:"Mostly developed between the 1960s and 2000s; the industry default until deep learning arrived around 2012.",
 w:"Credit risk, customer churn prediction, insurance pricing.",
 n:"Still the best choice for many tabular problems, where gradient-boosted trees often beat neural networks."},

trees: {l:"Trees / Random Forest / SVM", s:"wide",
 p:"Models that split data with yes/no questions (trees), or draw the widest possible boundary between classes (SVM).",
 t:"A decision tree splits on features. A random forest averages many randomized trees. Gradient boosting (XGBoost, LightGBM) adds trees one by one, each fixing the previous errors. An SVM maximizes the margin between classes and uses kernels for curved boundaries.",
 h:"CART (1984), SVM (Cortes and Vapnik, 1995), Random Forest (Breiman, 2001), XGBoost (2014–2016).",
 w:"Credit scoring and card-fraud models at banks commonly run on gradient-boosted trees.",
 n:"Gradient boosting is a first choice for tabular data. SVMs are much less common now."},


dl: {l:"Deep Learning", s:"core",
 p:"Machine learning with neural networks of many layers that learn their own features from raw data.",
 t:"Stacked layers of learned transformations, trained with backpropagation and gradient descent on GPUs. The architecture encodes assumptions about the data: grids for images, sequences for text, graphs for relationships.",
 h:"Backpropagation was popularized in 1986 (Rumelhart, Hinton, Williams), and AlexNet’s 2012 win started the modern era. Hinton, LeCun and Bengio received the 2018 Turing Award.",
 w:"Speech recognition, translation, face unlock, image generation, LLMs.",
 n:"The engine of modern AI. Most engineers adapt pretrained models rather than train from scratch."},

cnn: {l:"Convolutional Networks", s:"wide",
 p:"Networks that scan an image with small learned filters: first edges, then shapes, then whole objects.",
 t:"Convolution layers reuse the same filter weights at every position, pooling reduces resolution, and deeper layers see larger areas of the image.",
 h:"Yann LeCun’s LeNet read handwritten digits on bank cheques in the 1990s; AlexNet (2012) made CNNs famous.",
 w:"Medical scan analysis, defect detection on factory lines, phone camera features.",
 n:"Still widely used, especially on small devices, though Vision Transformers lead many benchmarks."},

alexnet: {l:"AlexNet / ResNet", s:"found",
 p:"AlexNet proved deep networks on GPUs could crush image recognition. ResNet made very deep networks trainable.",
 t:"AlexNet: 8 learned layers, ReLU activations, dropout, trained on two GPUs. ResNet: skip (residual) connections let the signal and gradients flow through more than 100 layers.",
 h:"AlexNet won ImageNet 2012 with about 15% top-5 error against about 26% for the runner-up. ResNet won ImageNet 2015 with 152 layers.",
 w:"ResNet backbones sit inside countless image classifiers and detectors.",
 n:"Residual connections are inside every transformer and LLM today, which is ResNet’s biggest legacy."},

unet: {l:"U-Net", s:"wide",
 p:"A network shaped like a U: shrink the image to understand it, then expand it back to produce a pixel-level answer.",
 t:"An encoder-decoder with skip connections between matching resolutions, so fine detail survives. The output has the same size as the input.",
 h:"Introduced in 2015 for biomedical image segmentation (Ronneberger and colleagues).",
 w:"Outlining tumours in medical scans. It was also the denoising network inside Stable Diffusion 1.x, 2.x and SDXL.",
 n:"Still common for segmentation. In image generation, transformer backbones (DiT) have largely replaced it in newer models."},

rnn: {l:"Recurrent Networks", s:"niche",
 p:"Networks that read a sequence one step at a time, carrying a memory forward.",
 t:"A hidden state is updated at each step and trained with backpropagation through time. Plain RNNs forget over long sequences because gradients vanish.",
 h:"Elman networks (1990); gated versions such as LSTM fixed the memory problem.",
 w:"Before transformers: Google Translate, voice assistants’ speech recognition, next-word prediction on phone keyboards.",
 n:"Largely replaced by transformers for language. The idea returns in state-space models such as Mamba and in RWKV, which aim for cheap long context."},

lstm: {l:"RNN / LSTM / GRU", s:"niche",
 p:"The workhorse recurrent cells. LSTM and GRU add gates that decide what to remember and what to forget.",
 t:"An LSTM has input, forget and output gates around a cell state; a GRU is a simpler two-gate version.",
 h:"LSTM in 1997 (Hochreiter and Schmidhuber), GRU in 2014 (Cho and colleagues). Sequence-to-sequence LSTMs (2014) launched neural machine translation.",
 w:"Google’s Neural Machine Translation system (2016) was built on LSTMs.",
 n:"Still used for small time-series and on-device tasks, and the best way to show students why attention was needed."},

trans: {l:"Transformers", s:"core",
 p:"The architecture behind modern LLMs: every token looks at every other token to decide what matters.",
 t:"Self-attention mixes information from all positions in parallel, followed by feed-forward layers, with residual connections and normalization. Training parallelizes on GPUs far better than RNNs.",
 h:"“Attention Is All You Need” (Vaswani and colleagues at Google, 2017), designed for machine translation.",
 w:"ChatGPT, Claude, Gemini, coding assistants, web search ranking.",
 n:"The dominant architecture for text, vision, audio and image generation. Attention cost grows with the square of context length, which drives work on efficient attention."},

enc: {l:"Encoder-only", s:"core",
 p:"Transformers that read the whole text at once, in both directions, to understand it rather than write it.",
 t:"Bidirectional attention, pretrained by masked language modeling (fill in the hidden words). Produces contextual embeddings for classification, tagging and retrieval.",
 h:"BERT (2018) defined the category.",
 w:"Matching search queries to documents; many embedding models behind RAG vector search.",
 n:"Very relevant for AI engineers: many embedding models and rerankers in retrieval pipelines are encoder-style."},

bert: {l:"BERT / RoBERTa", s:"wide",
 p:"Google’s BERT learned language by filling in masked words; Meta’s RoBERTa trained the same design longer and better.",
 t:"BERT-base has about 110 million parameters in 12 layers. RoBERTa (2019) dropped next-sentence prediction and used more data with dynamic masking.",
 h:"BERT was released in October 2018, and Google began using it in Search in 2019.",
 w:"Sentiment analysis, named-entity recognition, intent detection in support bots.",
 n:"Still a go-to for fast, cheap classification and embeddings, for example through sentence-transformers. ModernBERT (2024) refreshed the line."},

dec: {l:"Decoder-only", s:"core",
 p:"Transformers that write: predict the next token, append it, repeat.",
 t:"Causal attention, so each token only sees the past. Pretrained on next-token prediction, then instruction-tuned and aligned with methods such as RLHF.",
 h:"GPT-1 (2018), GPT-2 (2019), and GPT-3 (2020, 175 billion parameters), which showed that scale brings few-shot abilities.",
 w:"Chat assistants, coding assistants, agents.",
 n:"The dominant LLM design, from frontier models down to small on-device ones."},

gpt: {l:"GPT / Llama / Qwen", s:"core",
 p:"Large language model families: OpenAI’s GPT (closed weights), Meta’s Llama and Alibaba’s Qwen (open weights).",
 t:"Decoder-only transformers with billions of parameters. Common ingredients: rotary position embeddings, grouped-query attention and, in many recent models, Mixture-of-Experts layers.",
 h:"ChatGPT launched in November 2022. Llama (February 2023) started the open-weights wave, and Qwen became one of the most used open families.",
 w:"Customer-support assistants, code generation, question answering over company documents.",
 n:"The center of AI engineering work: prompting, RAG, tool use, fine-tuning and evaluation all build on these."},

slm: {l:"Small Language Models", s:"core", add:true,
 p:"Compact LLMs, roughly 0.5 to 10 billion parameters, that run cheaply, even on a laptop or a phone.",
 t:"Same decoder-only design, made strong through better data, distillation from larger models and quantization (for example 4-bit weights). Examples: Phi, Gemma, Llama 3.2 1B and 3B, small Qwen models.",
 h:"Microsoft’s Phi-1 (2023) showed that carefully curated “textbook” data lets small models punch above their weight.",
 w:"On-device assistants, private document processing, high-volume extraction or classification where a large model is overkill.",
 n:"A common production pattern: route easy requests to an SLM and hard ones to a frontier model, cutting cost and latency."},

encdec: {l:"Encoder–Decoder", s:"wide",
 p:"One half reads the input, the other half writes the output: ideal for turning one text into another.",
 t:"The encoder builds a representation with bidirectional attention; the decoder generates with causal attention plus cross-attention to the encoder’s output.",
 h:"The original 2017 transformer was an encoder-decoder built for translation.",
 w:"Machine translation, summarization, speech-to-text (OpenAI’s Whisper is an encoder-decoder).",
 n:"Less common for general chat models, but still strong for translation, speech recognition and structured rewriting."},

t5: {l:"T5 / BART", s:"wide",
 p:"Google’s T5 treats every task as “text in, text out”. Meta’s BART learns by repairing corrupted text.",
 t:"T5 is pretrained by filling in dropped spans and given tasks as prefixes such as “summarize:”. BART scrambles text (masking, shuffling) and learns to reconstruct it.",
 h:"Both from 2019. Flan-T5 (2022) added instruction tuning.",
 w:"Summarization pipelines, translation, rewriting search queries.",
 n:"Still used for fine-tuned specialist tasks, and T5’s text encoder reads the prompt inside several image generators."},

vt: {l:"Vision Transformers", s:"core",
 p:"Transformers applied to images by cutting them into patches and treating each patch like a word.",
 t:"An image becomes a sequence of patch embeddings plus position embeddings, processed by a standard transformer encoder.",
 h:"Introduced by Google in 2020 in “An Image is Worth 16x16 Words”.",
 w:"Image classification, and the vision part of chat assistants that read screenshots and photos.",
 n:"The image encoders inside multimodal LLMs are usually ViT-style, such as CLIP or SigLIP."},

vit: {l:"ViT", s:"core",
 p:"The original Vision Transformer model.",
 t:"Splits the image into 16×16-pixel patches and adds a special [CLS] token used for classification. It needs large-scale pretraining before it beats CNNs.",
 h:"Dosovitskiy and colleagues, 2020 (published at ICLR 2021).",
 w:"OpenAI’s CLIP (2021) paired a ViT with a text encoder, making it possible to search photos by description.",
 n:"ViT variants such as DINOv2 and SigLIP are standard image encoders today."},

dit: {l:"Diffusion Transformers", s:"core",
 p:"Transformers used as the engine of image and video generators, replacing the older U-Net.",
 t:"Noisy latent patches go in as tokens; the transformer predicts what to remove (noise or velocity), conditioned on the time step and the prompt.",
 h:"The DiT paper by Peebles and Xie appeared in 2022.",
 w:"OpenAI’s Sora (2024) and Stable Diffusion 3 use transformer backbones for generation.",
 n:"The default backbone for state-of-the-art image and video generation."},

ditimg: {l:"DiT Image Models", s:"core",
 p:"Image generators built on diffusion transformers.",
 t:"They usually work in the compressed latent space of a VAE, read the prompt with a text encoder (CLIP, T5), and are often trained with a flow-matching objective.",
 h:"Stable Diffusion 3 (2024) and FLUX.1 from Black Forest Labs (2024).",
 w:"Marketing visuals, product mockups, concept art.",
 n:"State of the art for text-to-image."},

other: {l:"Other Neural Architectures", s:"wide",
 p:"Networks designed for data that isn’t a plain grid or sequence, or for compressing data.",
 t:"Graph networks pass messages along edges; autoencoders squeeze the input into a small code and rebuild it.",
 h:"Both ideas trace back decades and matured with deep learning in the 2010s.",
 w:"Molecule property prediction, anomaly detection.",
 n:"Specialist tools, and autoencoders hide inside most image generators."},

gnn: {l:"Graph Neural Networks", s:"wide",
 p:"Networks that learn from graphs: each node updates itself using messages from its neighbors.",
 t:"Message-passing layers (GCN, GraphSAGE, GAT) aggregate neighbor features, giving predictions per node, per edge or per whole graph.",
 h:"Early work around 2005–2009 (Scarselli and colleagues); GCN (Kipf and Welling, 2016) made them popular.",
 w:"Pinterest’s PinSage recommendations, Google DeepMind’s GraphCast weather forecasts, drug discovery.",
 n:"Strong in science, recommendations and fraud detection, and a natural partner for knowledge graphs."},

ae: {l:"Autoencoders", s:"wide",
 p:"A network that squeezes data into a small code and then rebuilds it. If the rebuild is good, the code captured what matters.",
 t:"Encoder, bottleneck, decoder, trained on reconstruction error. Variants: denoising, sparse and variational (VAE).",
 h:"Rooted in 1980s neural-network research; deep autoencoders were popularized by Hinton and Salakhutdinov in 2006.",
 w:"Anomaly detection (a bad rebuild signals something unusual), compression.",
 n:"Sparse autoencoders are now a key interpretability tool for looking inside LLMs, and VAEs compress images for diffusion models."},

pred: {l:"Predictive / Discriminative", s:"core",
 p:"Look at existing data and answer a question about it: which category, how much, where, how relevant.",
 t:"Models learn the probability of a label given the input. Measured with accuracy, precision and recall, AUC, mean absolute error and similar metrics.",
 h:"The backbone of applied machine learning from the 1990s onward.",
 w:"Fraud detection, triaging medical images, search ranking.",
 n:"Still most of the ML running in production, and LLMs are now often used as zero-shot classifiers."},

cls: {l:"Classification", s:"core",
 p:"Put an input into one of several buckets: spam or not, cat or dog, positive or negative.",
 t:"Output a probability per class (softmax or sigmoid), trained with cross-entropy. Can be binary, multi-class or multi-label.",
 h:"Rosenblatt’s perceptron (1958) was an early learned classifier.",
 w:"Spam filtering, content moderation, routing support tickets to the right team.",
 n:"Everywhere. Options range from a small fine-tuned BERT (fast, cheap) to prompting an LLM (flexible, needs no training data)."},

spam: {l:"Spam detection / BERT", s:"wide",
 p:"The textbook classification example, from counting words to transformers.",
 t:"Early filters used Naive Bayes on word frequencies, later gradient boosting on engineered features, and now fine-tuned transformers that understand context and disguised wording.",
 h:"Paul Graham’s essay “A Plan for Spam” (2002) popularized Bayesian filtering.",
 w:"Gmail reports blocking more than 99.9% of spam, phishing and malware.",
 n:"The same pattern powers toxicity filters and prompt-injection detectors in LLM apps."},

reg: {l:"Regression / Forecasting", s:"wide",
 p:"Predict a number instead of a category: a price, a demand, a temperature.",
 t:"Minimize errors such as squared or absolute error. Forecasting adds time structure (trend, seasonality) with models from ARIMA to gradient boosting to transformer-based time-series models.",
 h:"Least-squares regression (Legendre and Gauss, early 1800s) is one of the oldest ideas in machine learning.",
 w:"Delivery-time estimates, energy-demand forecasts, house-price models.",
 n:"Huge in business. Time-series foundation models such as Chronos and TimesFM appeared in 2024."},

forecast: {l:"Demand forecasting", s:"wide", add:true,
 p:"Predicting how much of something people will need, so a business can stock, staff or produce the right amount.",
 t:"A typical stack feeds calendar, promotion and weather features into gradient-boosted trees or deep forecasting models, and evaluates them on held-out time periods.",
 h:"In the M5 competition (2020, Walmart sales data) the top solutions relied on LightGBM.",
 w:"Supermarkets ordering fresh produce; cloud providers planning server capacity.",
 n:"Still mostly classical ML in production; LLMs help explain forecasts more than produce them."},

det: {l:"Detection / Ranking", s:"core",
 p:"Find where things are (detection) or put items in order of relevance (ranking).",
 t:"Detection outputs boxes with labels (YOLO, DETR). Ranking scores items against a query, using learning-to-rank, bi-encoders for retrieval and cross-encoders for reranking.",
 h:"Viola-Jones face detection (2001), YOLO (2015), PageRank (1998) and learning-to-rank in web search.",
 w:"Perception in driver-assistance systems, shelf monitoring in stores, every search engine and social feed.",
 n:"Ranking is at the heart of RAG: retrieve candidates with embeddings, rerank them, then give the best ones to the LLM."},

rerank: {l:"Search ranking & rerankers", s:"core", add:true,
 p:"Deciding which documents best answer a question, so the LLM sees the right context.",
 t:"Two stages. A fast bi-encoder (embeddings plus vector search, often mixed with BM25 keyword search) retrieves the top candidates; a slower cross-encoder rescores each query-document pair together.",
 h:"BM25 dates from the 1990s; dense retrieval and BERT-based rerankers arrived around 2019–2020.",
 w:"Enterprise assistants that answer questions from internal documentation.",
 n:"One of the highest-impact parts of a RAG system: poor retrieval leads to confident wrong answers."},

gen: {l:"Generative", s:"core",
 p:"Create something new that resembles the training data: text, code, images, audio, video.",
 t:"Models learn the distribution of the data (often conditioned on a prompt) and sample from it. The “How it generates” lens explains the recipes.",
 h:"The ideas go back decades, but quality took off with GANs (2014), transformers (2017) and diffusion (2020).",
 w:"Chat assistants, coding assistants, generative image tools in design software.",
 n:"The center of today’s AI boom and of most AI engineering roles."},

textcode: {l:"Text & Code", s:"core",
 p:"Write, summarize, translate, answer questions, and write programs.",
 t:"Usually decoder-only LLMs generating token by token. Quality depends on pretraining data, instruction tuning, alignment and the context you provide through prompts, retrieval and tools.",
 h:"GPT-2 (2019) surprised people with coherent text; OpenAI Codex (2021) powered the first GitHub Copilot.",
 w:"Support chatbots, meeting summaries, coding assistants.",
 n:"The daily work of AI engineers: building reliable applications on top of these models."},

gptex: {l:"GPT / Llama / T5", s:"core",
 p:"Text-generating model families: two decoder-only (GPT, Llama) and one encoder-decoder (T5).",
 t:"GPT and Llama continue freely from a prompt; T5 maps an input text to an output text and is usually fine-tuned for one task.",
 h:"T5 (2019), GPT-3 (2020), Llama (2023).",
 w:"GPT in ChatGPT, Llama fine-tuned in-house where data must stay private, T5 in summarization pipelines.",
 n:"Decoder-only families dominate; T5 remains a solid fine-tuning baseline."},

images: {l:"Images", s:"core",
 p:"Create or edit pictures from a text prompt, a sketch or another image.",
 t:"Mostly diffusion or flow matching in a compressed latent space, guided by text embeddings. Editing works through inpainting and image-to-image generation.",
 h:"GANs led from 2014 to about 2020. DALL·E 2, Midjourney and Stable Diffusion (all 2022) made text-to-image mainstream.",
 w:"Marketing assets, product-shot variations, storyboards, Photoshop’s Generative Fill (2023).",
 n:"Mature and widely deployed. The open questions are copyright, consent and provenance, for example C2PA Content Credentials."},

sdgan: {l:"Stable Diffusion / GAN", s:"wide",
 p:"Two landmark ways to generate images: Stable Diffusion (open, diffusion-based) and GANs (the previous generation).",
 t:"Stable Diffusion runs diffusion in a VAE latent space with a U-Net denoiser (a transformer in version 3) and a CLIP text encoder. GANs generate in one fast pass but are harder to train.",
 h:"GANs in 2014. Stable Diffusion was released in August 2022 by Stability AI with CompVis and Runway.",
 w:"Stable Diffusion runs on consumer GPUs and is often fine-tuned to a brand’s visual style.",
 n:"Stable Diffusion’s open release built a huge ecosystem (LoRAs, ControlNet). GANs survive in fast, specialized jobs such as upscaling."},

av: {l:"Audio & Video", s:"core",
 p:"Generate speech, music, sound effects and video clips.",
 t:"Speech often uses autoregressive models over audio tokens or diffusion and flow models; video generators use diffusion transformers over space-time patches.",
 h:"DeepMind’s WaveNet (2016) made natural-sounding speech synthesis possible; Sora (2024) showed long, coherent video.",
 w:"Audiobook narration, dubbing, voice assistants, short-form video.",
 n:"Improving fast. Voice cloning creates real fraud and consent risks that products must design for."},

avex: {l:"Text-to-speech / video models", s:"core", add:true,
 p:"Models that turn text into a voice, or a prompt into a video clip.",
 t:"Text-to-speech: text becomes acoustic tokens or a spectrogram, and a neural vocoder produces the waveform. Video: latent diffusion transformers with attention across frames.",
 h:"Tacotron 2 (2017); OpenAI’s Sora preview and Google’s Veo (both 2024).",
 w:"Reading tools for accessibility, real-time voice agents in call centres, short ads.",
 n:"Voice agents are a fast-growing area of AI engineering."},

control: {l:"Decision Making / Control", s:"core",
 p:"Choose actions over time to reach a goal, rather than answer a single question.",
 t:"Formalized as states, actions and rewards (a Markov decision process). Solved by planning when the rules are known, or by learning from trial and error when they aren’t.",
 h:"Bellman’s dynamic programming (1950s); TD-Gammon (1992) learned expert-level backgammon.",
 w:"Robotics, games, recommendation strategies, data-centre cooling.",
 n:"AI agents bring this lens to LLMs: the model decides which tool to call next."},

plan: {l:"Planning & Search", s:"wide",
 p:"Work out a sequence of steps before acting.",
 t:"Classical planners (PDDL), graph search and Monte Carlo Tree Search. Increasingly, LLMs propose plans that solvers or tools then check.",
 h:"Shakey the robot (1966–1972) and the STRIPS planner (1971).",
 w:"Delivery routing, manufacturing schedules.",
 n:"Agent frameworks plan and then act; reliable agents still lean on deterministic planners and checks."},

agents: {l:"Route planning / LLM agents", s:"core", add:true,
 p:"From computing the fastest route to an LLM breaking a task into steps and calling tools.",
 t:"Route planners use graph search (Dijkstra, A*, contraction hierarchies). LLM agents loop: reason, choose a tool, read the result, repeat until done.",
 h:"Dijkstra’s algorithm (1956); the ReAct prompting pattern (2022) popularized the reason-and-act loop.",
 w:"Map apps’ routing; coding agents that edit files, run tests and fix failures.",
 n:"One of the main things AI engineers build now. Evaluating and constraining agents is the hard part."},

rl: {l:"Reinforcement Learning", s:"core",
 p:"Learn by trial and error: try actions, receive rewards or penalties, do more of what works.",
 t:"An agent learns a policy that maximizes long-term reward, using methods such as Q-learning, policy gradients and PPO, often with deep networks.",
 h:"Sutton and Barto laid the foundations in the 1980s and 1990s; DeepMind’s DQN learned Atari games from pixels (2013–2015).",
 w:"Robot control, game agents, ad-bidding strategies.",
 n:"Central to LLM training: RLHF made chat models helpful, and RL on checkable rewards trains reasoning models."},

games: {l:"Game-playing agents", s:"found",
 p:"AI that learns to play games, often better than any human.",
 t:"AlphaGo combined deep networks with Monte Carlo Tree Search; AlphaZero learned purely from self-play; OpenAI Five and AlphaStar tackled real-time team games.",
 h:"AlphaGo beat Lee Sedol in 2016; AlphaZero mastered chess, shogi and Go in 2017.",
 w:"Studios use RL agents to playtest game levels; similar methods have been applied to chip layout design.",
 n:"Fewer headlines now, but they proved the recipe of search plus learning that today’s reasoning models build on."},

rlhf: {l:"RLHF for LLMs", s:"core", add:true,
 p:"Using human preferences as the reward, so a raw LLM becomes a helpful and safe assistant.",
 t:"Collect human comparisons of answers, train a reward model, then optimize the LLM with RL (PPO), or skip the reward model with DPO. Newer methods reward verifiable outcomes, such as passing tests or correct math.",
 h:"InstructGPT (OpenAI, 2022) showed that a 1.3-billion-parameter RLHF model was preferred over the 175-billion-parameter GPT-3.",
 w:"Every major chat assistant is post-trained with some form of preference optimization.",
 n:"Explains much of how assistants behave, including why they refuse, hedge or flatter."},

ar: {l:"Autoregressive", s:"core",
 p:"Generate one piece at a time, each new piece based on everything produced so far.",
 t:"The probability of a sequence is the product of next-step probabilities. Trained on next-token prediction; sampled with temperature, top-k or top-p.",
 h:"From Shannon’s n-gram models (1948) to RNN language models to transformer language models (GPT, 2018).",
 w:"Every chatbot reply that streams in word by word.",
 n:"Dominant for text and code, and also used for images and audio once they are turned into tokens."},

ar1: {l:"Next-token prediction", s:"core",
 p:"Guess the next word-piece, append it, repeat.",
 t:"The model outputs a score (logit) for every token in the vocabulary, softmax turns scores into probabilities, and a sampling rule picks one. KV caching keeps generation fast.",
 h:"Shannon’s 1948 paper already modelled English by predicting the next letter.",
 w:"Autocomplete in phone keyboards and code editors.",
 n:"A simple objective that yields surprising skills at scale. Weak spots: errors compound, and output is produced sequentially, so latency grows with length."},

argpt: {l:"GPT / Autoregressive image models", s:"wide",
 p:"The same next-token trick used for text (GPT) and for images, once the images are turned into tokens.",
 t:"Images are encoded into discrete tokens (VQ-VAE, VQGAN) and generated token by token, as in DALL·E (2021) and Parti (2022).",
 h:"OpenAI’s Image GPT (2020) generated images pixel by pixel.",
 w:"Some multimodal assistants generate images natively, with text and images handled by one model.",
 n:"Gaining ground again because a single model can read and write both text and images."},

diff: {l:"Diffusion", s:"core",
 p:"Start from pure noise and remove it little by little until an image appears.",
 t:"Training: add noise to real data at random strengths and teach a network to predict that noise. Generation: start from noise and denoise over many steps, guided by the prompt.",
 h:"Sohl-Dickstein and colleagues introduced the idea in 2015; DDPM (Ho and colleagues, 2020) made it work well.",
 w:"Stable Diffusion, DALL·E 2 and 3, Google’s Imagen.",
 n:"The standard approach for images, video and audio, increasingly merged with flow matching."},

df1: {l:"Iterative denoising", s:"core",
 p:"Many small clean-up steps instead of one big leap.",
 t:"Each step estimates the noise for the current noise level. Samplers such as DDIM cut the steps from about 1,000 to 20–50, and distillation can bring it down to 1–4.",
 h:"DDIM (2020), latent diffusion (2021), consistency models (2023).",
 w:"The reason image generators show a blurry preview that gradually sharpens.",
 n:"The number of steps is the main cost lever; distilled “turbo” models get close to real time."},

ddpm: {l:"DDPM / Stable Diffusion", s:"wide",
 p:"DDPM is the paper that made diffusion practical; Stable Diffusion made it run on a home GPU.",
 t:"Stable Diffusion is latent diffusion: a VAE shrinks the image 8× per side, a U-Net denoises in that small latent space, and CLIP encodes the prompt.",
 h:"DDPM (2020), the latent diffusion paper by Rombach and colleagues (2021), Stable Diffusion (August 2022).",
 w:"A large open ecosystem of fine-tunes, LoRAs and ControlNet for poses, edges and depth.",
 n:"Versions 1.x and SDXL are still widely used; Stable Diffusion 3 moved to a transformer trained with flow matching."},

fm: {l:"Flow Matching", s:"core",
 p:"Learn a smooth path from noise to data, then simply follow it.",

upd("ai", { t:"This map looks at one field through seven lenses: how a system is built, how it learns, what it does, what data it handles, how it generates, how big it is, and how applications are built around it. The same idea often appears in several lenses; select a node to see its connections." });
upd("genm", { f:"Generative modeling paradigms",
  t:"All of them learn the distribution of the training data and sample from it. The labels aren’t all the same kind of thing: autoregressive, diffusion and flow matching describe how samples are produced, while GANs and VAEs are model families with their own training frameworks. Diffusion and flow matching overlap heavily in modern continuous-time models." });
upd("pred", { l:"Predictive / Analytical",
  t:"The model outputs a label, number, location or score for existing data. Measured with accuracy, precision and recall, AUC, mean absolute error and similar metrics.",

upd("gen", { m:"Generative AI isn’t the same as transformers. GANs, VAEs and U-Net diffusion models generate without any transformer, and transformers like BERT don’t generate." });
upd("ae", { t:"An encoder squeezes the input into a small code (the bottleneck) and a decoder rebuilds it, trained on reconstruction error. It is a design pattern and objective rather than a separate family: the encoder and decoder can be CNNs, transformers or MLPs. A VAE adds a probabilistic latent space so you can sample new data.",
  m:"An autoencoder is not a rival to CNNs or transformers; it is a way of using them." });
upd("slm", { f:"SLM",

  m:"SLM is not an architecture. A small encoder or encoder-decoder model is also a small language model, and there is no official parameter cutoff." });
upd("gpt", { f:"GPT: Generative Pre-trained Transformer",

upd("bert", { f:"Bidirectional Encoder Representations from Transformers",

upd("trans", { m:"Transformers aren’t only for language: the same design runs vision, audio, image-generation and robotics models." });
upd("vt", { m:"These categories overlap. ViT is itself an encoder-only transformer, and DiT is a transformer used inside diffusion. Families named after their use (vision, diffusion) and families named after their structure (encoder, decoder) aren’t mutually exclusive." });
