"e": "Na descida, a rede encolhe a imagem passo a passo, o que ajuda a entender o que a foto mostra, mas apaga os detalhes finos. Na subida, ela reconstrói um resultado em tamanho real, enquanto pontes que atravessam o U levam os detalhes nítidos da primeira metade direto para a segunda. Por isso ela consegue contornar a borda exata de algo, como um tumor num exame, em vez de só dizer que ele está ali.",
"w": "Softwares de imagem médica usam U-Nets para contornar órgãos e tumores em tomografias e ressonâncias. Uma U-Net também era o coração das primeiras versões do Stable Diffusion, que transformam ruído aleatório numa imagem passo a passo.",
"p": "Uma rede em forma de U: encolhe a imagem para entender o que há nela e depois a expande de volta para dar uma resposta para cada pixel."
}
},
"lstm": {
"en": {
"e": "The memory is a running summary that a plain recurrent neural network (RNN) rewrites after every word, and in long sentences the early words tend to fade from it. An LSTM adds small learned switches, called gates, that decide at each step what to keep, what to erase and what to pass on. That way it can still remember a sentence’s subject many words later. A GRU does the same job with fewer gates.",
"w": "Before transformers took over, LSTMs powered much of everyday AI. Google Translate switched to an LSTM-based system in 2016, and LSTMs were widely used for speech recognition and for predicting the next word on phone keyboards.",
"p": "An RNN reads a sequence one item at a time, carrying a memory forward. LSTM and GRU add gates that decide what to remember and what to forget."
},
"pt": {
"e": "A memória é um resumo corrente que uma rede neural recorrente (RNN) simples reescreve a cada palavra, e em frases longas as primeiras palavras tendem a sumir dele. A LSTM acrescenta pequenos interruptores aprendidos, chamados portas, que decidem a cada passo o que guardar, o que apagar e o que repassar. Assim ela ainda lembra quem é o sujeito da frase muitas palavras depois. A GRU faz o mesmo trabalho com menos portas.",
"w": "Antes de os transformers dominarem, as LSTMs estavam por trás de muita IA do dia a dia. O Google Tradutor passou a usar um sistema baseado em LSTMs em 2016, e elas foram muito usadas em reconhecimento de fala e na sugestão da próxima palavra no teclado do celular.",
"p": "Uma RNN lê uma sequência um item por vez, levando uma memória adiante. LSTM e GRU acrescentam portas que decidem o que lembrar e o que esquecer."
}
},
"inside": {
"en": {
"e": "First the text is cut into tokens, small pieces that are often whole words or parts of words, and each token becomes a long list of numbers called an embedding. These lists then pass through a tall stack of identical layers. In each layer, attention lets every token gather clues from the others, and a small network refines each token on its own. At the end the model scores every possible next token, picks one, adds it to the text and starts again.",
"w": "Every time a chatbot shows its answer appearing word by word, this whole pipeline has just run once for each new token. Translation tools, writing assistants and coding helpers built on transformers work the same way."
},
"pt": {
"e": "Primeiro o texto é cortado em tokens, pedacinhos que muitas vezes são palavras inteiras ou partes de palavras, e cada token vira uma longa lista de números chamada embedding. Essas listas passam então por uma pilha alta de camadas iguais. Em cada camada, a atenção deixa cada token buscar pistas nos outros, e uma pequena rede refina cada token sozinho. No fim, o modelo dá uma nota a cada próximo token possível, escolhe um, junta ao texto e começa de novo.",
"w": "Toda vez que um chatbot mostra a resposta aparecendo palavra por palavra, esse pipeline inteiro acabou de rodar uma vez para cada token novo. Tradutores, assistentes de escrita e ajudantes de programação baseados em transformers funcionam do mesmo jeito."
}
},
"pos": {
"en": {
"e": "Attention compares every token with every other token, but on its own it treats the text like a bag of words with no order. To fix this, the model blends a position signal into each token’s numbers, so “dog” in the first slot looks slightly different from “dog” in the third. Many current models do this by rotating each token’s numbers by an angle that depends on where it sits, which also tells the model how far apart two words are.",
"w": "Word order changes meaning all the time: “dog bites man” and “man bites dog” use the same words but tell different stories. Position information is what lets a chatbot or a translator tell them apart."
},
"pt": {
"e": "A atenção compara cada token com todos os outros, mas sozinha trata o texto como um saco de palavras sem ordem. Para resolver isso, o modelo mistura um sinal de posição nos números de cada token, e assim “cachorro” na primeira posição fica um pouco diferente de “cachorro” na terceira. Muitos modelos atuais fazem isso girando os números de cada token num ângulo que depende de onde ele está, o que também mostra ao modelo a distância entre duas palavras.",
"w": "A ordem das palavras muda o sentido o tempo todo: “cachorro morde homem” e “homem morde cachorro” usam as mesmas palavras, mas contam histórias diferentes. É a informação de posição que deixa um chatbot ou um tradutor perceber a diferença."
}
},
"ffn": {
"en": {
"e": "Attention is where tokens share information; the feed-forward layer is where each token’s information is worked on further. It stretches the token’s list of numbers into a much longer one, transforms it, then squeezes it back to the original size. These layers hold most of the model’s parameters, the adjustable numbers set during training, and research suggests they store much of what the model knows, such as which city is the capital of which country.",
"w": "Every chatbot you use runs one of these layers in every block of its network, for every word it writes. In models built as a Mixture of Experts, this is the part split into many expert networks, with each token sent to only a few of them."
},
"pt": {
"e": "A atenção é onde os tokens trocam informação; a camada feed-forward é onde a informação de cada token é trabalhada mais a fundo. Ela estica a lista de números do token numa lista bem mais longa, transforma essa lista e depois a encolhe de volta ao tamanho original. Essas camadas concentram a maior parte dos parâmetros do modelo, os números ajustáveis definidos no treinamento, e pesquisas sugerem que guardam boa parte do que o modelo sabe, como qual cidade é a capital de qual país.",
"w": "Todo chatbot que você usa roda uma dessas camadas em cada bloco da rede, para cada palavra que escreve. Nos modelos Mixture of Experts, é esta a parte dividida em várias redes especialistas, e cada token é enviado só para algumas delas."
}
},
"enc": {
"en": {
"e": "Because it sees the words on both sides, an encoder can tell that “bank” means a riverbank in “we fished from the bank” and a business in “the bank closed my account.” Its output is not new text but a set of numbers, called embeddings, that capture what each word or the whole passage means. Other systems use those numbers to sort messages, find names in documents or measure how close two texts are in meaning.",
"w": "When a help center’s search box finds the right article even though you used different words from the article, an encoder model is often doing the matching. Many company chatbots that answer from internal documents use one to find the most relevant passages first."
},
"pt": {
"e": "Como enxerga as palavras dos dois lados, um encoder consegue perceber que “banco” é um assento em “sentei no banco da praça” e uma empresa em “o banco bloqueou minha conta”. O resultado não é um texto novo, e sim um conjunto de números, chamados embeddings, que capturam o sentido de cada palavra ou do trecho inteiro. Outros sistemas usam esses números para classificar mensagens, achar nomes em documentos ou medir o quanto dois textos são parecidos no sentido.",
"w": "Quando a busca da central de ajuda encontra o artigo certo mesmo você usando palavras diferentes das do artigo, muitas vezes é um encoder que faz essa comparação. Muitos chatbots de empresas que respondem com base em documentos internos usam um encoder para achar primeiro os trechos mais relevantes."
}
},
"bert": {
"en": {
"e": "During training, BERT read huge amounts of text with some words hidden and had to guess each missing word from the words on both sides. Doing this over and over taught it a great deal about how language works. Companies then fine-tune it, meaning they give it a short extra round of training on labeled examples, for one specific job such as spotting angry customer emails. RoBERTa showed that the same design got noticeably better with more data and longer training.",
"w": "Google began using BERT in its search engine in 2019 to better understand what people mean when they type a query. Companies also use BERT-style models to sort support tickets by topic, tell whether a review is positive or negative, and pull names and dates out of documents."
},
"pt": {
"e": "No treinamento, o BERT leu enormes quantidades de texto com algumas palavras escondidas e precisava adivinhar cada palavra que faltava a partir das palavras dos dois lados. Repetir isso sem parar ensinou a ele muito sobre como a língua funciona. Depois, as empresas fazem fine-tuning, uma rodada curta de treinamento extra com exemplos rotulados, para uma tarefa específica, como identificar e-mails de clientes irritados. O RoBERTa mostrou que o mesmo desenho melhorava bastante com mais dados e mais tempo de treino.",
"w": "Em 2019, o Google começou a usar o BERT na busca para entender melhor o que as pessoas querem dizer quando digitam uma pesquisa. Empresas também usam modelos no estilo do BERT para separar chamados de suporte por assunto, dizer se uma avaliação é positiva ou negativa e tirar nomes e datas de documentos."
}
},
"dec": {
"en": {
"e": "A decoder can only look backward: while it works on one position, the words after it are hidden. That matches how it is trained, by reading huge amounts of text and guessing each next token, which teaches it grammar, facts and styles of writing. A model trained only this way just continues whatever text it is given, so it is then trained further on examples of instructions with good answers, and on human feedback, to become a helpful assistant.",
"w": "The chat assistants people use to draft emails or answer questions, and the coding tools that suggest the next lines of a program, generate text this way, one token at a time. Well-known open models such as Meta’s Llama are decoder-only transformers.",
"p": "Transformers that write: they predict the next token, add it to the text, and repeat until the answer is done."
},
"pt": {
"e": "Um decoder só olha para trás: enquanto trabalha numa posição, as palavras seguintes ficam escondidas. Isso combina com o jeito como ele é treinado, lendo enormes quantidades de texto e adivinhando cada próximo token, o que ensina gramática, fatos e estilos de escrita. Um modelo treinado só assim apenas continua o texto que recebe, então depois ele é treinado com exemplos de instruções e boas respostas, e com avaliações de pessoas, para virar um assistente útil.",
"w": "Os assistentes de chat que as pessoas usam para escrever e-mails ou tirar dúvidas, e as ferramentas que sugerem as próximas linhas de um programa, geram texto desse jeito, um token de cada vez. Modelos abertos conhecidos, como o Llama, da Meta, são transformers decoder-only.",
"p": "Transformers que escrevem: preveem o próximo token, acrescentam ao texto e repetem até a resposta ficar pronta."
}
},
"gpt": {
"en": {
"e": "All three work the same basic way: a decoder-only transformer with billions of parameters, the adjustable numbers set during training, learns to predict the next token. Those numbers are also called the weights. With an open-weights model, a company can download them and run the model on its own computers, keeping its data in-house and adapting the model to its needs. A closed model can only be used through the maker’s app or online service.",
"w": "Support chatbots on company websites, tools that draft code, and assistants that answer questions about a company’s own documents may run on one of these families. Businesses that must keep their data private often choose an open model like Llama or Qwen and run it on their own servers.",
"p": "Three well-known families of large language models: OpenAI’s GPT, whose main models are kept private, and Meta’s Llama and Alibaba’s Qwen, which anyone can download."
},
"pt": {
"e": "As três funcionam do mesmo jeito básico: um transformer decoder-only com bilhões de parâmetros, os números ajustáveis definidos no treinamento, aprende a prever o próximo token. Esses números também são chamados de pesos. Com um modelo de pesos abertos, uma empresa pode baixá-los e rodar o modelo nos próprios computadores, mantendo os dados dentro de casa e adaptando o modelo ao que precisa. Um modelo fechado só pode ser usado pelo app ou pelo serviço online de quem o criou.",
"w": "Chatbots de atendimento em sites de empresas, ferramentas que escrevem código e assistentes que respondem perguntas sobre os documentos da própria empresa podem rodar sobre uma dessas famílias. Empresas que precisam manter os dados em sigilo muitas vezes escolhem um modelo aberto, como Llama ou Qwen, e o rodam nos próprios servidores.",
"p": "Três famílias de grandes modelos de linguagem: o GPT, da OpenAI, em geral fechado, e o Llama, da Meta, e o Qwen, da Alibaba, que podem ser baixados."
}
},
"encdec": {
"en": {
"e": "The encoder reads the whole input first, looking at every word in both directions, and turns it into a rich set of numbers that capture its meaning. The decoder then writes the output one token at a time. At each step it looks back at what it has written so far and also consults the encoder’s notes through a link called cross-attention. This split suits jobs where input and output are different texts, like a French sentence and its English translation.",
"w": "Translation services, tools that summarize long reports, and speech-to-text apps that turn a voice memo into written words often use this design. OpenAI’s Whisper, a widely used speech recognition model, is an encoder-decoder."
},
"pt": {
"e": "O encoder lê a entrada inteira primeiro, olhando cada palavra nos dois sentidos, e a transforma num conjunto rico de números que captura o sentido. O decoder então escreve a saída um token por vez. A cada passo, ele olha o que já escreveu e também consulta as anotações do encoder por meio de uma ligação chamada atenção cruzada (cross-attention). Essa divisão é ideal quando entrada e saída são textos diferentes, como uma frase em francês e sua tradução em português.",
"w": "Serviços de tradução, ferramentas que resumem relatórios longos e apps que transformam um áudio em texto escrito costumam usar esse desenho. O Whisper, da OpenAI, um modelo de reconhecimento de fala muito usado, é encoder-decoder."
}
},
"t5": {
"en": {
"e": "T5 puts every job in the same format: you add a short instruction to the start of the text, such as “summarize:” or “translate English to German:”, and the model writes the answer as text. That way one model can learn many tasks at once. BART was trained by taking text, scrambling it (hiding words, deleting pieces, shuffling the order), and learning to restore the original. That repair skill transfers well to summarizing and rewriting.",
"w": "Companies use models from these families to summarize customer conversations or news articles and to turn messy search queries into cleaner ones. T5’s text encoder also helps several image generators understand the prompt you type."
},
"pt": {
"e": "O T5 coloca toda tarefa no mesmo formato: você põe uma instrução curta no começo do texto, como “summarize:” ou “translate English to German:”, e o modelo escreve a resposta como texto. Assim, um só modelo aprende várias tarefas ao mesmo tempo. O BART foi treinado pegando textos, bagunçando tudo (escondendo palavras, apagando trechos, trocando a ordem) e aprendendo a restaurar o original. Essa habilidade de conserto funciona bem para resumir e reescrever.",
"w": "Empresas usam modelos dessas famílias para resumir conversas com clientes ou notícias e para transformar buscas bagunçadas em consultas mais limpas. O codificador de texto do T5 também ajuda vários geradores de imagem a entender o prompt que você digita."
}
},
"vt": {
"en": {
"e": "A transformer was built to read sequences of words, so the trick is to turn a picture into a sequence. The image is cut into a grid of small squares, called patches, and each patch is converted into a list of numbers, just as a word would be. Attention then lets every patch compare itself with every other patch, so the model can connect a dog’s ear in one corner with its tail in another.",
"w": "When you send a photo or a screenshot to a chat assistant and it describes what’s in it, a vision transformer is often doing the seeing. Photo apps that let you find pictures by typing a description often rely on them too."
},
"pt": {
"e": "O transformer foi criado para ler sequências de palavras, então o truque é transformar a imagem numa sequência. A imagem é cortada numa grade de quadradinhos, chamados patches, e cada patch vira uma lista de números, como aconteceria com uma palavra. A atenção então deixa cada patch se comparar com todos os outros, e o modelo consegue ligar a orelha de um cachorro num canto ao rabo dele no outro.",
"w": "Quando você manda uma foto ou um print para um assistente de chat e ele descreve o que aparece, muitas vezes é um vision transformer que está enxergando. Apps de fotos que deixam você achar imagens digitando uma descrição também costumam usá-los."
}
},
"vit": {
"en": {
"e": "ViT cuts each image into small squares of 16 by 16 pixels and reads them like words in a sentence. Unlike older convolutional networks, it has no built-in assumptions about images, such as the idea that neighboring pixels belong together. The cost is that it needs far more training pictures, hundreds of millions in the original study, before it beats them. Once trained, it scales well, and it became a standard building block for vision.",
"w": "OpenAI’s CLIP paired a ViT with a text model so that pictures and words could be compared directly. That idea lets photo libraries find a picture from a typed description, like “sunset over the beach,” and helped early image generators understand prompts.",
"p": "ViT, short for Vision Transformer, is the model from Google researchers that first showed a plain transformer could classify images as well as the best older networks."
},
"pt": {
"e": "O ViT corta cada imagem em quadradinhos de 16 por 16 pixels e os lê como palavras numa frase. Diferente das redes convolucionais antigas, ele não traz suposições prontas sobre imagens, como a ideia de que pixels vizinhos andam juntos. O preço é precisar de muito mais fotos de treino, centenas de milhões no estudo original, para superá-las. Depois de treinado, ele escala bem, e virou peça padrão em visão computacional.",
"w": "O CLIP, da OpenAI, juntou um ViT a um modelo de texto para que imagens e palavras pudessem ser comparadas diretamente. Essa ideia permite que galerias de fotos achem uma imagem a partir de uma descrição digitada, como “pôr do sol na praia”, e ajudou os primeiros geradores de imagem a entender prompts.",
"p": "O ViT, sigla de Vision Transformer, é o modelo de pesquisadores do Google que mostrou que um transformer podia classificar imagens tão bem quanto as melhores redes antigas."
}
},
"dit": {
"en": {
"e": "A diffusion model makes a picture by starting from random noise and removing a little of it at a time, guided by your prompt, until an image appears. At every step a network has to judge what to remove. Older models used a U-Net for this job; a diffusion transformer cuts the noisy image into patches and uses attention, so every part of the picture can take every other part into account. Transformers also tend to improve steadily as they get bigger.",
"w": "Several image and video generators, including OpenAI’s Sora video model and Black Forest Labs’ Flux image models, are built on diffusion transformers. They are behind many of the AI pictures and short clips now seen in ads, social media posts and presentations."
},
"pt": {
"e": "Um modelo de difusão cria uma imagem partindo de ruído aleatório e removendo um pouco dele de cada vez, guiado pelo seu prompt, até a imagem aparecer. A cada passo, uma rede precisa julgar o que remover. Os modelos antigos usavam uma U-Net para isso; um diffusion transformer corta a imagem com ruído em patches e usa atenção, então cada parte da imagem pode levar em conta todas as outras. Além disso, transformers costumam melhorar de forma consistente quando ficam maiores.",
"w": "Vários geradores de imagem e vídeo, como o Sora, da OpenAI, e os modelos de imagem Flux, da Black Forest Labs, são construídos sobre diffusion transformers. Eles estão por trás de muitas das imagens e vídeos curtos feitos por IA que aparecem em anúncios, redes sociais e apresentações."
}
},
"ditimg": {
"en": {
"e": "Working directly on millions of pixels would be slow, so these models first compress images into a much smaller code, called a latent, using a separate network called a VAE, and do all the denoising there. A text encoder turns your prompt into numbers the transformer can follow. When denoising ends, the VAE expands the result back into a full-size picture. Many are trained with flow matching, a newer recipe that learns a smooth path from noise to image.",
"w": "Marketing teams use them to make ad visuals and product mockups, and designers use them for quick concept art and mood boards. Many of the text-to-image tools they reach for work this way.",
"p": "Image generators whose core is a diffusion transformer: you type a description, and the model turns random noise into a matching picture."
},
"pt": {
"e": "Trabalhar direto em milhões de pixels seria lento, então esses modelos primeiro comprimem as imagens num código bem menor, chamado espaço latente, usando uma rede separada chamada VAE, e fazem toda a remoção de ruído ali. Um codificador de texto transforma o seu prompt em números que o transformer consegue seguir. Quando a remoção de ruído termina, o VAE expande o resultado de volta para uma imagem em tamanho real. Muitos são treinados com flow matching, uma receita mais nova que aprende um caminho suave do ruído até a imagem.",
"w": "Times de marketing usam esses modelos para criar peças de anúncio e mockups de produto, e designers usam para arte conceitual rápida e moodboards. Muitas das ferramentas de gerar imagem a partir de texto que eles usam funcionam assim.",
"p": "Geradores de imagem que têm um diffusion transformer no centro: você digita uma descrição e o modelo transforma ruído aleatório numa imagem que combina com ela."
}
},
"other": {
"en": {
"e": "Images are neat grids of pixels and text is a line of words, and the best-known networks were designed for those shapes. Much real data looks different: a social network, a molecule or a road map is a web of things connected to each other, which graph neural networks are built to handle. State space models read very long sequences cheaply, and autoencoders learn to compress data and rebuild it, which helps spot anything unusual.",
"w": "Drug researchers use these networks to predict how a new molecule might behave, and banks and factories use autoencoders to flag transactions or sensor readings that look unlike anything seen before.",
"p": "Neural networks built for special jobs: learning from webs of connections, reading very long sequences cheaply, or squeezing data into a compact summary."
},
"pt": {
"e": "Imagens são grades organizadas de pixels e textos são uma fila de palavras, e as redes mais conhecidas foram desenhadas para esses formatos. Muitos dados reais são diferentes: uma rede social, uma molécula ou um mapa de estradas é uma teia de coisas ligadas entre si, e as redes neurais de grafos foram feitas para isso. Os modelos de espaço de estados leem sequências muito longas gastando pouco, e os autoencoders aprendem a comprimir os dados e reconstruí-los, o que ajuda a detectar qualquer coisa fora do normal.",
"w": "Pesquisadores de medicamentos usam essas redes para prever como uma molécula nova pode se comportar, e bancos e fábricas usam autoencoders para sinalizar transações ou leituras de sensores diferentes de tudo o que já foi visto.",
"p": "Redes neurais feitas para tarefas especiais: aprender com teias de conexões, ler sequências muito longas gastando pouco ou espremer os dados num resumo compacto."
}
},
"gnn": {
"en": {
"e": "A graph can be any set of things joined by links: people and friendships, atoms and chemical bonds, stations and train lines. In each layer, every point collects information from its direct neighbors and updates its own description. After several layers, each point reflects its wider surroundings, a bit like hearing news from friends of friends. The network can then make predictions about one point, one link or the whole graph, such as whether a molecule is likely to be toxic.",
"w": "Pinterest has used a graph neural network to recommend pins based on how people save them to boards, and Google DeepMind’s GraphCast uses one to forecast the weather around the globe. Drug researchers use them to predict how a molecule will behave before making it in the lab.",
"p": "Networks that learn from graphs, meaning webs of connected things: each point updates itself using messages from the points it is linked to."
},
"pt": {
"e": "Um grafo pode ser qualquer conjunto de coisas unidas por ligações: pessoas e amizades, átomos e ligações químicas, estações e linhas de trem. Em cada camada, cada ponto recolhe informação dos vizinhos diretos e atualiza a própria descrição. Depois de várias camadas, cada ponto reflete um entorno maior, mais ou menos como ficar sabendo das novidades pelos amigos dos amigos. A rede pode então fazer previsões sobre um ponto, uma ligação ou o grafo inteiro, como a chance de uma molécula ser tóxica.",
"w": "O Pinterest já usou uma rede neural de grafos para recomendar pins com base em como as pessoas os salvam em pastas, e o GraphCast, do Google DeepMind, usa uma para prever o tempo no mundo todo. Pesquisadores de medicamentos usam essas redes para prever como uma molécula vai se comportar antes de produzi-la no laboratório.",
"p": "Redes que aprendem com grafos, ou seja, teias de coisas conectadas: cada ponto se atualiza usando mensagens dos pontos ligados a ele."
}
},
"ssm": {
"en": {
"e": "A transformer looks back at every earlier word each time it adds a new one, so the total work grows quickly as the text gets longer. A state space model instead keeps a compact memory, a fixed-size summary updated as each new piece arrives, so reading twice as much costs only about twice the work. The math behind it also lets training run on many pieces at once. Mamba, a well-known example, chooses what to store based on what it is reading.",
"w": "You mostly meet them inside other systems: some language models mix state space layers with attention layers to handle very long documents more cheaply. Researchers also use them on long recordings such as audio, and on DNA sequences."
},
"pt": {
"e": "Um transformer olha de novo para todas as palavras anteriores cada vez que acrescenta uma nova, então o trabalho total cresce rápido conforme o texto aumenta. Um modelo de espaço de estados guarda uma memória compacta, um resumo de tamanho fixo atualizado a cada novo pedaço que chega, e assim ler o dobro custa só cerca do dobro de trabalho. A matemática por trás também permite treinar com muitos pedaços ao mesmo tempo. O Mamba, um exemplo conhecido, escolhe o que guardar de acordo com o que está lendo.",
"w": "Na maioria das vezes eles aparecem dentro de outros sistemas: alguns modelos de linguagem misturam camadas de espaço de estados com camadas de atenção para lidar com documentos muito longos gastando menos. Pesquisadores também os usam em gravações longas, como áudio, e em sequências de DNA."
}
},
"mamba": {
"en": {
"e": "A transformer’s attention compares every word with every earlier word, so the work grows quickly as a text gets longer. Mamba instead reads in order and keeps a compact memory, a fixed-size summary it updates at each step. Its key trick is being selective: what it keeps or forgets depends on the word it is reading, so it can hold on to a name and drop filler. That keeps its cost roughly in line with the length of the text.",
"w": "You mostly meet it inside hybrid open models, such as AI21’s Jamba, that mix Mamba layers with transformer layers so they can handle long documents more cheaply. Researchers also test it on other long sequences, such as audio and DNA.",
"p": "The best-known state space model, built to handle very long texts faster than the attention used in transformers."
},
"pt": {
"e": "A atenção de um transformer compara cada palavra com todas as anteriores, então o trabalho cresce depressa conforme o texto aumenta. O Mamba lê em ordem e guarda uma memória compacta, um resumo de tamanho fixo que ele atualiza a cada passo. O pulo do gato é ser seletivo: o que ele guarda ou esquece depende da palavra que está lendo, então consegue segurar um nome e descartar a enrolação. Assim, o custo cresce mais ou menos na mesma proporção que o texto.",
"w": "Você o encontra principalmente dentro de modelos abertos híbridos, como o Jamba, da AI21, que misturam camadas Mamba e de transformer para processar documentos longos gastando menos. Pesquisadores também o testam em outras sequências longas, como áudio e DNA.",
"p": "O modelo de espaço de estados mais conhecido, criado para lidar com textos muito longos mais rápido que a atenção usada nos transformers."
}
},
"ae": {
"en": {
"e": "The trick is the narrow middle. Because the code holds far fewer numbers than the original, the network cannot simply copy its input: it has to learn which patterns matter, like the general shape of a face rather than every pixel. Training is simple: compare the rebuilt version with the original and adjust the network to shrink the difference. No labels are needed, since the data serves as its own answer key.",
"w": "Banks and factories use autoencoders to flag unusual transactions or machine readings: the network rebuilds normal cases well, so a poor rebuild signals something odd. A related design, the VAE, also works behind the scenes in many image generators, shrinking pictures so they are cheaper to work with."
},
"pt": {
"e": "O segredo está no meio estreito. Como o código tem muito menos números que o original, a rede não consegue simplesmente copiar a entrada: precisa aprender quais padrões importam, como o formato geral de um rosto em vez de cada pixel. O treino é simples: comparar a versão reconstruída com a original e ajustar a rede para diminuir a diferença. Não precisa de rótulos, porque os próprios dados servem de gabarito.",
"w": "Bancos e indústrias usam autoencoders para sinalizar transações ou leituras de máquinas fora do comum: a rede reconstrói bem os casos normais, então uma reconstrução ruim indica algo estranho. Uma variação, o VAE, também trabalha nos bastidores de muitos geradores de imagem, comprimindo as fotos para que fiquem mais baratas de processar."
}
},
"learn": {
"en": {
"e": "There are two separate questions here. The first is what the model learns from: answers labeled by people, patterns hidden in raw data, or rewards for good actions. These are called learning paradigms. The second is when it learns: a long, general training run first, then shorter rounds that adapt it to a task or shape its behavior. These are the training stages, and one paradigm can show up in several stages.",
"w": "The chat assistant you use at work went through several rounds: first it read huge amounts of text, practicing to predict the next word, then it studied examples of good answers, and finally it learned from people’s ratings of which answers they preferred.",
"p": "This part of the map looks at training: how a model picks up its abilities, from what kind of examples and in what order."
},
"pt": {
"e": "Aqui há duas perguntas diferentes. A primeira é com o que o modelo aprende: respostas rotuladas por pessoas, padrões escondidos nos dados brutos ou recompensas por boas ações. Isso se chama paradigma de aprendizado. A segunda é quando ele aprende: primeiro um treino longo e geral, depois rodadas mais curtas que o adaptam a uma tarefa ou moldam seu comportamento. Essas são as etapas de treinamento, e um mesmo paradigma pode aparecer em várias delas.",
"w": "O assistente de chat que você usa no trabalho passou por várias rodadas: primeiro leu uma quantidade enorme de texto treinando para prever a próxima palavra, depois estudou exemplos de boas respostas e, por fim, aprendeu com as notas que pessoas deram sobre quais respostas preferiam.",
"p": "Esta parte do mapa olha para o treinamento: como um modelo adquire suas habilidades, com que tipo de exemplo e em que ordem."
}
},
"ntp": {
"en": {
"e": "Take “The cat sat on the …”. The model guesses what comes next, checks the real text, and nudges its internal numbers so the right word becomes a little more likely. No one has to label anything, because the answer is always the next bit of the text. Repeated over trillions of tokens, this simple game pushes the model to pick up grammar, facts and some reasoning, since all of them help it guess better.",
"w": "This is the first and biggest training step behind the chatbots you know, including the GPT models behind ChatGPT and open models like Llama and Qwen. The next-word suggestions on your phone keyboard follow the same idea at a much smaller scale.",
"p": "The model reads huge amounts of text and keeps guessing the next token (a word or part of a word). Every sentence becomes free practice."
},
"pt": {
"e": "Pense em “O gato subiu no …”. O modelo chuta o que vem depois, confere no texto real e ajusta um pouco seus números internos para que a palavra certa fique mais provável. Ninguém precisa rotular nada, porque a resposta é sempre o trecho seguinte do próprio texto. Repetido ao longo de trilhões de tokens, esse jogo simples leva o modelo a captar gramática, fatos e algum raciocínio, já que tudo isso ajuda a acertar o palpite.",
"w": "É a primeira e maior etapa de treino por trás dos chatbots que você conhece, incluindo os modelos GPT do ChatGPT e modelos abertos como Llama e Qwen. As sugestões de próxima palavra do teclado do celular seguem a mesma ideia, em escala bem menor.",
"p": "O modelo lê uma quantidade enorme de texto e vai tentando adivinhar o próximo token (uma palavra ou pedaço de palavra). Cada frase vira treino de graça."
}
},
"mlm": {
"en": {
"e": "During training, some words in a sentence are covered up, as in “The [blank] barked at the mailman”, and the model must guess them. Because it can look at the words before and after the gap, it learns what each word means in its surroundings. This makes it very good at understanding text but not at writing it, since it never practiced producing text one word after another.",
"w": "Models trained this way, such as Google’s BERT, help search engines understand what a query means and power many tools that sort, tag or find documents by meaning. Many embedding models, which turn text into numbers for search, are built on them."
},
"pt": {
"e": "No treino, algumas palavras da frase são cobertas, como em “O [lacuna] latiu para o carteiro”, e o modelo precisa adivinhá-las. Como ele enxerga as palavras antes e depois da lacuna, aprende o que cada palavra significa no seu contexto. Isso o deixa ótimo para entender texto, mas não para escrever, porque ele nunca treinou produzir texto palavra por palavra.",
"w": "Modelos treinados assim, como o BERT do Google, ajudam buscadores a entender o que uma pesquisa quer dizer e estão por trás de muitas ferramentas que classificam, etiquetam ou encontram documentos pelo sentido. Muitos modelos de embedding, que transformam texto em números para a busca, são construídos sobre eles."
}
},
"contrastive": {
"en": {
"e": "The model gets a batch of pairs that belong together, such as photos and their captions. Its job is to turn each item into a list of numbers so that true partners end up close together and mismatched ones end up far apart. Nobody has to describe what is in each photo: the pairing itself is the lesson. Afterwards, “close” means “similar in meaning”, which is exactly what search needs.",
"w": "When you type “dog on a beach” into a photo app and it finds the right pictures without any tags, a model trained this way is often doing the matching. The same technique trains many of the embedding models that help AI assistants find the right passages in company documents."
},
"pt": {
"e": "O modelo recebe um lote de pares que combinam, como fotos e suas legendas. A tarefa é transformar cada item numa lista de números de modo que os pares verdadeiros fiquem perto e os trocados fiquem longe. Ninguém precisa descrever o que há em cada foto: o próprio par é a lição. Depois disso, “perto” passa a significar “parecido no sentido”, que é exatamente o que uma busca precisa.",
"w": "Quando você digita “cachorro na praia” num app de fotos e ele acha as imagens certas sem nenhuma etiqueta, muitas vezes é um modelo treinado assim que faz a correspondência. A mesma técnica treina muitos dos modelos de embedding que ajudam assistentes de IA a achar os trechos certos nos documentos da empresa."
}
},
"rlloop": {
"en": {
"e": "The agent is whatever makes the decisions, like a robot or a game-playing program. The environment is everything it acts on. The reward is a number that says how well things went. Nobody shows the agent the right move: it tries things, sees what earns more reward over time, and slowly forms a strategy, called a policy. Rewards can arrive late, as in chess, where only the final result counts.",
"w": "Game-playing systems that learned to beat champions at Go and to play video games were trained in this loop. The same vocabulary describes AI agents at work: an assistant (the agent) uses tools on your computer (the environment) and is judged on whether the task got done (the reward).",
"p": "The basic loop of reinforcement learning: an agent acts, the world around it changes and hands back a reward, and the cycle repeats."
},
"pt": {
"e": "O agente é quem toma as decisões, como um robô ou um programa que joga. O ambiente é tudo aquilo sobre o qual ele age. A recompensa é um número que diz se as coisas foram bem. Ninguém mostra ao agente a jogada certa: ele tenta, vê o que rende mais recompensa ao longo do tempo e aos poucos forma uma estratégia, chamada política. A recompensa pode chegar tarde, como no xadrez, em que só o resultado final conta.",
"w": "Sistemas que aprenderam a vencer campeões de Go e a jogar videogames foram treinados nesse ciclo. O mesmo vocabulário descreve agentes de IA no trabalho: um assistente (o agente) usa ferramentas no seu computador (o ambiente) e é avaliado por ter concluído ou não a tarefa (a recompensa).",
"p": "O ciclo básico do aprendizado por reforço: um agente age, o mundo à sua volta muda e devolve uma recompensa, e tudo se repete."
}
},
"rlalgos": {
"en": {
"e": "Q-learning keeps a table that estimates how much future reward each move will bring in each situation, and updates it after every try. That works for small games but breaks down when situations are countless, like the pixels of a video game screen. DQN solves this by letting a neural network estimate the scores instead. PPO skips the scores and adjusts the agent’s strategy directly, in small, careful steps so learning does not go off the rails.",
"w": "DQN made headlines by learning to play many classic Atari games from the screen pixels alone. PPO is widely used to train robots and game-playing agents, and it was the reinforcement learning method in the human-feedback training behind early versions of ChatGPT.",
"p": "Three classic recipes for reinforcement learning: one scores every possible move, one uses a neural network to do the scoring, and one improves the agent’s strategy directly."
},
"pt": {
"e": "O Q-learning mantém uma tabela que estima quanta recompensa futura cada jogada vai render em cada situação e a atualiza a cada tentativa. Isso funciona em jogos pequenos, mas não dá conta quando as situações são incontáveis, como os pixels da tela de um videogame. A DQN resolve isso pondo uma rede neural para estimar as notas. O PPO dispensa as notas e ajusta direto a estratégia do agente, em passos pequenos e cuidadosos para o aprendizado não desandar.",
"w": "A DQN ficou famosa ao aprender a jogar vários jogos clássicos de Atari só olhando os pixels da tela. O PPO é muito usado para treinar robôs e agentes de jogos, e foi o método de aprendizado por reforço no treino com feedback humano das primeiras versões do ChatGPT.",
"p": "Três receitas clássicas de aprendizado por reforço: uma dá nota a cada jogada, outra usa uma rede neural para isso e a terceira ajusta direto a estratégia."
}
},
"stages": {
"en": {
"e": "It starts with pretraining: a long, expensive run through enormous amounts of data that gives the model broad knowledge but no manners. Fine-tuning then trains it further on a smaller, focused set of examples, such as good answers to instructions. Alignment teaches it which behavior people prefer, like being helpful and declining harmful requests. Cheaper shortcuts, such as small add-ons or passing a big model’s skills to a smaller one, let companies adapt a model without starting over.",
"w": "When a company builds an assistant for its legal team, it rarely trains a model from scratch. It starts from a model that is already pretrained and tuned to chat, then adapts it with its own examples or simply puts the right documents in the prompt."
},
"pt": {
"e": "Tudo começa com o pré-treinamento: uma rodada longa e cara lendo quantidades enormes de dados, que dá ao modelo conhecimento amplo, mas nenhum modo de se comportar. O fine-tuning continua o treino com um conjunto menor e focado de exemplos, como boas respostas a instruções. O alinhamento ensina que comportamento as pessoas preferem, como ser útil e recusar pedidos perigosos. Atalhos mais baratos, como pequenos complementos ou passar o que um modelo grande sabe para um menor, permitem adaptar sem começar do zero.",
"w": "Quando uma empresa monta um assistente para o seu jurídico, quase nunca treina um modelo do zero. Ela parte de um modelo já pré-treinado e ajustado para conversar e depois o adapta com exemplos próprios, ou simplesmente coloca os documentos certos no prompt."
}
},
"instruct": {
"en": {
"e": "A freshly pretrained model, called a base model, only knows how to continue text. Ask it “How do I boil an egg?” and it might add more questions, as if it were writing a quiz. Instruction tuning shows it many examples of a request followed by a helpful reply. From these, the model learns the pattern “request, then answer” and applies it to requests it has never seen.",
"w": "It is the reason a chatbot answers your question instead of rambling on. Every chat assistant you use at work went through this step, and companies repeat it with their own examples to teach a model a house style or format.",
"p": "Extra training on examples of requests paired with good answers, so a model that only continues text learns to actually do what you ask."
},
"pt": {
"e": "Um modelo recém-pré-treinado, chamado de modelo base, só sabe continuar textos. Pergunte “Como cozinhar um ovo?” e ele pode emendar mais perguntas, como se estivesse escrevendo uma prova. O ajuste por instruções mostra a ele muitos exemplos de um pedido seguido de uma resposta útil. Com isso, o modelo aprende o padrão “pedido, depois resposta” e o aplica a pedidos que nunca viu.",
"w": "É o motivo de um chatbot responder à sua pergunta em vez de divagar. Todo assistente de chat que você usa no trabalho passou por essa etapa, e empresas a repetem com exemplos próprios para ensinar um modelo a seguir o estilo ou o formato da casa.",
"p": "Um treino extra com exemplos de pedidos e boas respostas, para que um modelo que só continua textos aprenda a fazer o que você pede."
}
},
"peft": {
"en": {
"e": "A model’s knowledge lives in its weights, the billions of numbers set during training. Changing all of them takes a lot of powerful, expensive hardware. LoRA freezes those numbers and trains a small extra set, a tiny fraction of the model’s size, that nudges its behavior. QLoRA goes further by storing the frozen model in a compressed, lower-precision form, so even large models can be adapted on a single graphics card.",
"w": "A company can keep one base model and plug in a different small LoRA file for each client or task, like legal emails or support replies. In image generators, people share LoRA files online that teach a model a particular art style or character.",
"p": "A cheap way to fine-tune a big model: train a small add-on and leave the model’s billions of internal numbers untouched."
},
"pt": {
"e": "O conhecimento de um modelo mora nos seus pesos, os bilhões de números ajustados no treino. Mexer em todos exige muito hardware potente e caro. A LoRA congela esses números e treina um pequeno conjunto extra, uma fração mínima do tamanho do modelo, que dá um empurrãozinho no comportamento dele. A QLoRA vai além e guarda o modelo congelado numa forma comprimida, com menos precisão, para que até modelos grandes possam ser adaptados numa única placa de vídeo.",
"w": "Uma empresa pode manter um único modelo base e encaixar um arquivo LoRA pequeno diferente para cada cliente ou tarefa, como e-mails jurídicos ou respostas de suporte. Em geradores de imagem, as pessoas compartilham na internet arquivos LoRA que ensinam um estilo de arte ou um personagem específico.",
"p": "Um jeito barato de fazer fine-tuning num modelo grande: treinar um pequeno complemento e deixar intactos os bilhões de números internos do modelo."
}
},
"rlhf": {
"en": {
"e": "First, people compare pairs of answers to the same question and pick the better one. Those choices train a second model, the reward model, which learns to score answers the way people would. Then the chatbot practices: it writes answers, the reward model scores them, and the chatbot is nudged toward higher scores. Newer versions also reward results that can be checked automatically, such as code that passes its tests.",
"w": "When a chatbot asks you to choose between two responses, or offers thumbs-up and thumbs-down buttons, it is collecting the kind of feedback this training can use. Every major chat assistant is trained with some form of it, which shapes its polite tone and its refusals.",
"p": "Training a language model with people’s judgments about which answers are better, so it becomes a more helpful and safer assistant."
},
"pt": {
"e": "Primeiro, pessoas comparam pares de respostas para a mesma pergunta e escolhem a melhor. Essas escolhas treinam um segundo modelo, o modelo de recompensa, que aprende a dar notas como as pessoas dariam. Depois o chatbot pratica: escreve respostas, o modelo de recompensa dá a nota e o chatbot é empurrado na direção das notas mais altas. Versões mais novas também recompensam resultados que dá para checar automaticamente, como código que passa nos testes.",
"w": "Quando um chatbot pede para você escolher entre duas respostas, ou oferece os botões de joinha para cima e para baixo, está coletando o tipo de feedback que esse treino pode usar. Todo grande assistente de chat passa por alguma forma disso, o que molda o tom educado e as recusas dele.",
"p": "Treinar um modelo de linguagem com o julgamento de pessoas sobre quais respostas são melhores, para que ele vire um assistente mais útil e mais seguro."
}
},
"dpo": {
"en": {
"e": "Classic training with human feedback (RLHF) has two steps: train a separate reward model to score answers, then use reinforcement learning to push the chatbot toward high scores. DPO showed that the same goal can be reached in one step. The model looks at each pair, a preferred answer and a rejected one, and is adjusted to make the preferred answer more likely and the rejected one less likely, while staying close to its original self.",
"w": "It is a common choice for teams that align open models with their own preference data, because it needs less computing power and fewer moving parts than the older RLHF recipe. Many open chat models published online were tuned this way."
},
"pt": {
"e": "O treino clássico com feedback humano (RLHF) tem duas etapas: treinar um modelo de recompensa separado para dar notas e depois usar aprendizado por reforço para empurrar o chatbot rumo às notas altas. O DPO mostrou que dá para chegar ao mesmo objetivo numa etapa só. O modelo olha cada par, uma resposta preferida e uma rejeitada, e é ajustado para tornar a preferida mais provável e a rejeitada menos, sem se afastar muito do que era.",
"w": "É uma escolha comum para equipes que alinham modelos abertos com seus próprios dados de preferência, porque exige menos poder de computação e menos peças que a receita antiga de RLHF. Muitos modelos de chat abertos publicados na internet foram ajustados assim."
}
},
"distill": {
"en": {
"e": "The student does not learn only from right answers. It also learns how confident the teacher was about every option, for example “80% cat, 15% fox, 5% dog”, which carries far more information than the single word “cat”. Another approach has the teacher write lots of example answers for the student to study. The result is a model that is much smaller, faster and cheaper to run, while keeping much of the teacher’s skill.",
"w": "The small, fast versions of AI models that run on phones, laptops or cheap servers are often distilled from bigger ones. Some small reasoning models were trained on step-by-step answers written by a larger model, and so picked up its way of working through problems."
},
"pt": {
"e": "O aluno não aprende só com as respostas certas. Ele também aprende o quanto o professor estava confiante em cada opção, por exemplo “80% gato, 15% raposa, 5% cachorro”, o que carrega muito mais informação do que apenas a palavra “gato”. Outro caminho é o professor escrever muitos exemplos de respostas para o aluno estudar. O resultado é um modelo bem menor, mais rápido e mais barato de rodar, que mantém boa parte da habilidade do professor.",
"w": "As versões pequenas e rápidas de modelos de IA, que rodam em celulares, notebooks ou servidores baratos, muitas vezes são destiladas de modelos maiores. Alguns modelos de raciocínio pequenos foram treinados com respostas passo a passo escritas por um modelo maior e assim pegaram o jeito dele de resolver problemas."
}
},
"tasks": {
"en": {
"e": "Almost every AI product does one of three jobs. Predictive systems look at existing data and answer a question about it, such as “is this fraud?”. Generative systems create something new, like text, images or sound. Decision-making systems choose what to do next, step by step, toward a goal. The same type of model can do all three, and real products often chain them together.",
"w": "When an online store flags a suspicious payment, that is predictive. When it writes a product description, that is generative. When it decides which offer to show you next based on what you just did, that is decision making.",
"p": "This part of the map sorts AI by the job it does for you, no matter how it is built inside."
},
"pt": {
"e": "Quase todo produto de IA faz um destes três trabalhos. Sistemas preditivos olham dados que já existem e respondem uma pergunta sobre eles, como “isto é fraude?”. Sistemas generativos criam algo novo, como texto, imagens ou som. Sistemas de tomada de decisão escolhem o que fazer em seguida, passo a passo, rumo a um objetivo. O mesmo tipo de modelo pode fazer os três, e produtos reais muitas vezes os encadeiam.",
"w": "Quando uma loja online sinaliza um pagamento suspeito, isso é preditivo. Quando escreve a descrição de um produto, é generativo. Quando decide qual oferta mostrar a seguir com base no que você acabou de fazer, é tomada de decisão.",
"p": "Esta parte do mapa organiza a IA pelo trabalho que ela faz para você, não importa como seja construída por dentro."
}
},
"pred": {
"en": {
"e": "The system has learned from past examples where the answer was known: transactions later confirmed as fraud, scans already read by doctors, searches where people clicked a result. It finds patterns linking the data to those answers, then applies them to new cases it has never seen. The output is a judgment about something that already exists, such as a label, a number or a score, not a brand-new creation.",
"w": "Your bank uses it when it alerts you about a card payment that looks unusual, and streaming services use it to estimate which shows you will like. It also helps hospitals flag the scans a radiologist should look at first."
},
"pt": {
"e": "O sistema aprendeu com exemplos passados em que a resposta era conhecida: transações depois confirmadas como fraude, exames já laudados por médicos, buscas em que as pessoas clicaram num resultado. Ele encontra padrões que ligam os dados a essas respostas e os aplica a casos novos que nunca viu. O resultado é um julgamento sobre algo que já existe, como um rótulo, um número ou uma nota, e não uma criação nova.",
"w": "Seu banco usa isso quando manda um alerta sobre uma compra no cartão que parece estranha, e serviços de streaming usam para estimar de quais séries você vai gostar. Também ajuda hospitais a destacar os exames que o radiologista deve olhar primeiro."
}
},
"cls": {
"en": {
"e": "A classifier learns from many examples that people have already sorted, such as emails marked as spam or not spam. For each new input it gives a score for every possible bucket, like “92% spam, 8% normal”, and picks the highest. Some tasks have two buckets, some have hundreds, and some let one item land in several at once, like a news story tagged both “sports” and “business”.",
"w": "Your inbox uses it to move junk mail out of sight, social networks use it to flag posts that break their rules, and help desks use it to send each support ticket to the right team automatically."
},
"pt": {
"e": "Um classificador aprende com muitos exemplos que pessoas já separaram, como e-mails marcados como spam ou não. Para cada entrada nova, ele dá uma nota para cada caixa possível, como “92% spam, 8% normal”, e escolhe a maior. Algumas tarefas têm duas caixas, outras têm centenas, e em algumas um item pode cair em várias ao mesmo tempo, como uma notícia marcada como “esporte” e “negócios”.",
"w": "Sua caixa de entrada usa isso para tirar o lixo eletrônico da sua frente, redes sociais usam para sinalizar posts que quebram as regras, e centrais de atendimento usam para mandar cada chamado para a equipe certa automaticamente."
}
},
"spam": {
"en": {
"e": "Early filters simply counted words. If an email had many words that often appeared in spam, like “winner” or “free”, it was flagged. Spammers fought back with odd spellings like “fr33”. Later systems combined hundreds of clues, such as the sender’s history and the links inside. Today, transformer models like BERT read the whole message and judge its meaning, so a scam still gets caught when it is politely worded.",
"w": "Every major email service filters spam this way, and Gmail reports blocking more than 99.9% of spam, phishing and malware. The same kind of classifier also screens comments for abuse and checks messages sent to chatbots for attempts to trick them.",
"p": "Spam filtering is the classic example of classification, and its history shows AI’s progress: from counting suspicious words to models that understand context."
},
"pt": {
"e": "Os primeiros filtros só contavam palavras. Se um e-mail tinha muitas palavras comuns em spam, como “ganhador” ou “grátis”, era marcado. Os spammers reagiram com grafias estranhas, como “gr4tis”. Depois vieram sistemas que combinavam centenas de pistas, como o histórico do remetente e os links da mensagem. Hoje, modelos transformer como o BERT leem a mensagem inteira e julgam o sentido, então um golpe escrito com toda a educação ainda é pego.",
"w": "Todo grande serviço de e-mail filtra spam assim, e o Gmail informa bloquear mais de 99,9% de spam, phishing e malware. O mesmo tipo de classificador também barra comentários ofensivos e verifica mensagens enviadas a chatbots em busca de tentativas de enganá-los.",
"p": "O filtro de spam é o exemplo clássico de classificação, e sua história mostra a evolução da IA: de contar palavras suspeitas a modelos que entendem o contexto."
}
},
"reg": {
"en": {
"e": "The model studies past examples where the number is known, like houses with their size, location and final sale price, and learns how much each factor pushes the number up or down. Forecasting is regression over time: it looks for trends, such as steady growth, and repeating patterns, like more ice cream sold every summer, then projects them forward. The answer is an estimate, so good systems also say how unsure they are.",
"w": "The arrival time your delivery or ride app shows is a regression estimate, and so is the price range a property website suggests for a home. Power companies forecast tomorrow’s electricity demand the same way."
},
"pt": {
"e": "O modelo estuda exemplos passados em que o número é conhecido, como imóveis com tamanho, localização e preço final de venda, e aprende quanto cada fator empurra o número para cima ou para baixo. Previsão é regressão ao longo do tempo: procura tendências, como um crescimento constante, e padrões que se repetem, como vender mais sorvete todo verão, e os projeta para a frente. A resposta é uma estimativa, então bons sistemas também dizem o quanto estão incertos.",
"w": "O horário de chegada que o app de entrega ou de corrida mostra é uma estimativa de regressão, assim como a faixa de preço que um site de imóveis sugere para uma casa. Empresas de energia preveem a demanda de eletricidade do dia seguinte do mesmo jeito."
}
},
"forecast": {
"en": {
"e": "The model learns from past sales together with what was happening at the time: the day of the week, holidays, promotions, the weather. From that it learns, for example, that umbrellas sell more when rain is forecast and that sales jump before a long weekend. It then combines tomorrow’s known conditions into an estimate. Getting it right matters both ways: too little stock means empty shelves, too much means waste.",
"w": "Supermarkets use it to decide how much fresh bread, fruit and milk to order for each store, and restaurants and call centers use it to plan how many staff to schedule. Cloud companies use it to plan how many servers they will need."
},
"pt": {
"e": "O modelo aprende com as vendas passadas junto com o que acontecia na época: dia da semana, feriados, promoções, o clima. Daí ele aprende, por exemplo, que guarda-chuva vende mais quando a previsão é de chuva e que as vendas sobem antes de um feriadão. Depois combina as condições já conhecidas de amanhã numa estimativa. Acertar importa para os dois lados: estoque de menos significa prateleira vazia, e de mais significa desperdício.",
"w": "Supermercados usam isso para decidir quanto pão, fruta e leite pedir para cada loja, e restaurantes e centrais de atendimento usam para planejar quantas pessoas escalar. Empresas de nuvem usam para planejar quantos servidores vão precisar."
}
},
"det": {
"en": {
"e": "A detection model scans an image and draws a box around each thing it recognizes, with a label and a confidence score, such as “pedestrian, 97%”. A ranking model gets a question and a pile of candidates, gives each one a relevance score, and sorts them. Both are prediction tasks, because they judge things that already exist, but the output is a location or an order instead of a single label.",
"w": "Your phone camera uses detection to find faces and focus on them, and cars with driver assistance use it to spot pedestrians and other vehicles. Ranking decides the order of results in every search engine and of posts in your social feed."
},
"pt": {
"e": "Um modelo de detecção varre uma imagem e desenha uma caixa em volta de cada coisa que reconhece, com um rótulo e uma nota de confiança, como “pedestre, 97%”. Um modelo de ranqueamento recebe uma pergunta e uma pilha de candidatos, dá uma nota de relevância para cada um e os ordena. Os dois são tarefas preditivas, porque julgam coisas que já existem, mas o resultado é um lugar ou uma ordem, e não um único rótulo.",
"w": "A câmera do celular usa detecção para achar rostos e focar neles, e carros com assistência ao motorista usam para identificar pedestres e outros veículos. O ranqueamento decide a ordem dos resultados em todo buscador e dos posts no seu feed."
}
},
"rerank": {
"en": {
"e": "Reading thousands of documents carefully would be too slow, so the search happens in two rounds. First, a fast search turns the question and the documents into lists of numbers called embeddings and grabs, say, the 50 closest matches, often combined with plain keyword search. Then a slower, more careful model, the reranker, reads the question together with each candidate and reorders them. Only the best few are handed to the assistant.",
"w": "When you ask your company’s internal assistant about the travel policy and it quotes the right page, a ranking step chose that page. If it picks the wrong document, the assistant can give a wrong answer that sounds completely sure of itself.",
"p": "Picking the documents that best answer a question, so an AI assistant reads the right material before it replies."
},
"pt": {
"e": "Ler milhares de documentos com cuidado seria lento demais, então a busca acontece em duas rodadas. Primeiro, uma busca rápida transforma a pergunta e os documentos em listas de números chamadas embeddings e pega, digamos, os 50 mais parecidos, muitas vezes junto com uma busca comum por palavras-chave. Depois, um modelo mais lento e cuidadoso, o reranker, lê a pergunta junto com cada candidato e reordena a lista. Só os melhores vão para o assistente.",
"w": "Quando você pergunta ao assistente interno da empresa sobre a política de viagens e ele cita a página certa, foi uma etapa de ranqueamento que escolheu essa página. Se ela pega o documento errado, o assistente pode dar uma resposta errada com toda a segurança.",
"p": "Escolher os documentos que melhor respondem a uma pergunta, para que um assistente de IA leia o material certo antes de responder."
}
},
"textcode": {
"en": {
"e": "These models produce text one token at a time, where a token is a word or a piece of one. At each step they pick a likely next token based on everything written so far, including your request. Code is just another kind of text to them, which is why the same model can draft an email and fix a bug. Quality depends heavily on the context you give: clear instructions, examples and the right documents.",
"w": "You see it in the chatbot on a company’s help page, in tools that summarize your meetings and emails, and in coding assistants that suggest the next lines as a programmer types.",
"p": "AI that works with words and code: it writes, summarizes, translates, answers questions and writes computer programs."
},
"pt": {
"e": "Esses modelos produzem texto um token por vez, sendo o token uma palavra ou um pedaço dela. A cada passo, escolhem um próximo token provável com base em tudo o que já foi escrito, incluindo o seu pedido. Para eles, código é só mais um tipo de texto, por isso o mesmo modelo consegue rascunhar um e-mail e corrigir um bug. A qualidade depende muito do contexto que você dá: instruções claras, exemplos e os documentos certos.",
"w": "Você vê isso no chatbot da página de ajuda de uma empresa, nas ferramentas que resumem suas reuniões e e-mails e nos assistentes de código que sugerem as próximas linhas enquanto a pessoa programa.",
"p": "IA que trabalha com palavras e código: escreve, resume, traduz, responde perguntas e cria programas de computador."
}
},
"gptex": {
"en": {
"e": "GPT (from OpenAI) and Llama (from Meta) are “decoder-only” models: they take your prompt and keep adding likely next words, which makes them flexible, general-purpose writers. T5 (from Google) is an “encoder-decoder” model: one part reads and digests the whole input, and a second part writes the result. That suits fixed jobs, such as turning a long report into a short summary, and it is usually trained for one task at a time.",
"w": "GPT models power ChatGPT. Llama can be downloaded and run on a company’s own servers, so it is often adapted in-house when data must not leave the company. T5 shows up inside automated pipelines, for example to summarize or rewrite text in bulk.",
"p": "Three well-known families of text models. GPT and Llama write by continuing text; T5 first reads an input in full, then writes an output from it."
},
"pt": {
"e": "GPT (da OpenAI) e Llama (da Meta) são modelos “decoder-only”: pegam o seu prompt e vão acrescentando as próximas palavras prováveis, o que os torna escritores versáteis. O T5 (do Google) é um modelo “encoder-decoder”: uma parte lê e digere a entrada inteira, e outra parte escreve o resultado. Isso combina com tarefas fixas, como transformar um relatório longo num resumo curto, e ele costuma ser treinado para uma tarefa por vez.",
"w": "Os modelos GPT movem o ChatGPT. O Llama pode ser baixado e rodado nos servidores da própria empresa, por isso costuma ser adaptado internamente quando os dados não podem sair de casa. O T5 aparece dentro de processos automáticos, por exemplo para resumir ou reescrever textos em grande volume.",
"p": "Três famílias conhecidas de modelos de texto. GPT e Llama escrevem continuando o texto; o T5 lê a entrada inteira e depois escreve uma saída a partir dela."
}
},
"images": {
"en": {
"e": "Most image generators start from random noise, like TV static, and remove it step by step, steering each step toward your description until a picture appears. To save effort, they work on a compressed version of the image and expand it at the end. Editing uses the same process: you mark an area, and the model fills it in so it blends with the rest of the picture.",
"w": "Marketing teams use it to make ad visuals and product photos in new settings, and designers use it for quick storyboards and concept art. Photoshop’s Generative Fill, which lets you select an area and describe what should appear there, is a familiar example."
},
"pt": {
"e": "A maioria dos geradores de imagem começa de um ruído aleatório, como o chuvisco de uma TV, e vai limpando passo a passo, guiando cada passo na direção da sua descrição até surgir uma imagem. Para economizar esforço, eles trabalham numa versão comprimida da imagem e a expandem no final. A edição usa o mesmo processo: você marca uma área e o modelo a preenche de um jeito que combine com o resto da foto.",
"w": "Equipes de marketing usam isso para criar peças de anúncio e fotos de produto em novos cenários, e designers usam para storyboards rápidos e arte conceitual. O Preenchimento Generativo do Photoshop, em que você seleciona uma área e descreve o que deve aparecer ali, é um exemplo conhecido."
}
},
"imgex": {
"en": {
"e": "SDXL uses diffusion: it starts from noise and cleans it up over many small steps, guided by your prompt. FLUX.1 uses flow matching, which learns a smoother, more direct route from noise to picture. StyleGAN is a GAN: a generator and a critic train against each other until the critic can no longer reliably spot the fakes. After that, it makes an image in a single pass.",
"w": "SDXL and FLUX.1 are popular in design tools and open-source image apps for marketing visuals and concept art. StyleGAN became known for realistic photos of people who do not exist, and images like these have been used for fake social media profiles.",
"p": "Three well-known image generators, each built on a different recipe for turning randomness into a picture: diffusion, flow matching and adversarial training."
},
"pt": {
"e": "O SDXL usa difusão: parte de um ruído e vai limpando em muitos passos pequenos, guiado pelo seu prompt. O FLUX.1 usa flow matching, que aprende um caminho mais suave e direto do ruído até a imagem. O StyleGAN é uma GAN: um gerador e um crítico treinam um contra o outro até o crítico não conseguir mais distinguir com segurança o falso do real. Depois disso, ela cria a imagem de uma só vez.",
"w": "SDXL e FLUX.1 são populares em ferramentas de design e apps de imagem de código aberto, para peças de marketing e arte conceitual. O StyleGAN ficou conhecido pelas fotos realistas de pessoas que não existem, e imagens assim já foram usadas em perfis falsos nas redes sociais.",
"p": "Três geradores de imagem conhecidos, cada um baseado numa receita diferente para transformar aleatoriedade em imagem: difusão, flow matching e treino adversarial."
}
},
"av": {
"en": {
"e": "These tools build on the same ideas as text and image models. Sound is cut into tiny chunks, called audio tokens, and a model predicts the next chunk much as a chatbot predicts the next word. Video generators treat a clip as a stack of images over time and clean all of them up from noise together, so that motion stays consistent from one frame to the next.",
"w": "You hear it in audiobooks and videos narrated by synthetic voices, in automatic dubbing of videos into other languages, and in voice assistants that answer out loud. Short AI-generated video clips now appear in ads and on social media."
},
"pt": {
"e": "Essas ferramentas usam as mesmas ideias dos modelos de texto e de imagem. O som é cortado em pedacinhos, chamados tokens de áudio, e um modelo prevê o próximo pedaço mais ou menos como um chatbot prevê a próxima palavra. Geradores de vídeo tratam um clipe como uma pilha de imagens ao longo do tempo e limpam o ruído de todas juntas, para que o movimento fique coerente de um quadro para o outro.",
"w": "Você ouve isso em audiolivros e vídeos narrados por vozes sintéticas, na dublagem automática de vídeos para outros idiomas e em assistentes de voz que respondem em voz alta. Clipes curtos de vídeo gerados por IA já aparecem em anúncios e nas redes sociais."
}
},
"avex": {
"en": {
"e": "A text-to-speech system first works out how the words should sound, including rhythm, stress and pauses, and turns that into a compact description of the sound. A second component, called a vocoder, then builds the actual audio wave you hear. Video models start from noise and clean up every frame of the clip together, with each frame taking the others into account so a person or object keeps the same look as it moves.",
"w": "Screen readers and “read aloud” features use text-to-speech to help people with low vision or reading difficulties, and some call centers now use AI voice agents that talk with customers in real time. Some short ads and social media clips are made with video models."
},
"pt": {
"e": "Um sistema de texto para fala primeiro descobre como as palavras devem soar, com ritmo, ênfase e pausas, e transforma isso numa descrição compacta do som. Uma segunda peça, chamada vocoder, então monta a onda sonora que você ouve. Modelos de vídeo partem do ruído e limpam todos os quadros do clipe juntos, com cada quadro levando os outros em conta, para que uma pessoa ou objeto mantenha a mesma aparência enquanto se move.",
"w": "Leitores de tela e funções de “ler em voz alta” usam text-to-speech para ajudar pessoas com baixa visão ou dificuldade de leitura, e algumas centrais de atendimento já usam agentes de voz com IA que conversam com clientes em tempo real. Alguns anúncios curtos e vídeos de redes sociais são feitos com modelos de vídeo."
}
},
"control": {
"en": {
"e": "The AI here is often called an agent: a program that looks at its situation, picks an action, and then sees what changed. A good choice now may only pay off much later, so the agent has to think ahead instead of grabbing the quickest win. It works out which actions lead toward its goal by planning, when it knows the rules, or by trial and error, when it doesn’t.",
"w": "Robot vacuums deciding where to clean next, computer opponents in video games, and systems that adjust the cooling in large data centers all make a chain of decisions toward a goal."
},
"pt": {
"e": "Aqui a IA costuma ser chamada de agente: um programa que observa a situação, escolhe uma ação e vê o que mudou. Uma boa escolha agora pode render frutos só bem depois, então o agente precisa pensar adiante em vez de pegar o ganho mais rápido. Ele descobre quais ações levam ao objetivo planejando, quando conhece as regras, ou por tentativa e erro, quando não conhece.",
"w": "Robôs aspiradores decidindo onde limpar em seguida, adversários controlados pelo computador em videogames e sistemas que ajustam a refrigeração de grandes data centers tomam uma sequência de decisões rumo a um objetivo."
}
},
"plan": {
"en": {
"e": "Planning works when the program has a model of the world, meaning it knows what each action does. It can then try out possible sequences in its head, compare where they lead, and keep the best one. Search is the method for exploring those options without checking every single one, since the number of possible paths grows very fast. A delivery company with 50 stops can’t test every order, so its software hunts for a very good one instead.",
"w": "Delivery companies use planning software to decide which driver visits which address and in what order. Factories use it to schedule which machine makes which product, and when.",
"p": "Working out the whole sequence of steps toward a goal before taking the first one."
},
"pt": {
"e": "O planejamento funciona quando o programa tem um modelo do mundo, ou seja, sabe o que cada ação provoca. Assim ele pode testar sequências possíveis “de cabeça”, comparar aonde cada uma leva e ficar com a melhor. A busca é o método para explorar essas opções sem conferir uma por uma, já que o número de caminhos cresce muito rápido. Uma transportadora com 50 entregas não consegue testar todas as ordens possíveis, então o software procura uma ordem muito boa.",
"w": "Transportadoras usam software de planejamento para decidir qual motorista vai a cada endereço e em que ordem. Fábricas usam o mesmo tipo de sistema para definir qual máquina produz o quê, e quando.",
"p": "Montar toda a sequência de passos até um objetivo antes de dar o primeiro."
}
},
"agents": {
"en": {
"e": "A map app treats roads as a network of points joined by links, each with a travel time, and searches for the quickest path through it. An AI agent, meaning an assistant that can take actions with tools, works more loosely: a language model writes a list of steps in plain words, carries them out one by one, checks the results, and rewrites the plan when a step fails.",
"w": "When your map app reroutes you around a traffic jam, it is planning again with new information. Coding assistants that edit files, run the tests and fix what broke follow a plan in the same spirit.",
"p": "Two everyday kinds of planning: a map app finding the fastest route, and an AI assistant breaking a big goal into smaller steps."
},
"pt": {
"e": "O app de mapas trata as ruas como uma rede de pontos ligados entre si, cada ligação com um tempo de percurso, e procura o caminho mais rápido. Um agente de IA, ou seja, um assistente que consegue agir usando ferramentas, funciona de um jeito mais solto: um modelo de linguagem escreve uma lista de passos em palavras, executa um por um, confere os resultados e refaz o plano quando algo dá errado.",
"w": "Quando o app de mapas desvia você de um congestionamento, ele está planejando de novo com informação nova. Assistentes de programação que editam arquivos, rodam os testes e corrigem o que quebrou seguem um plano parecido.",
"p": "Dois tipos de planejamento do dia a dia: o app de mapas achando a rota mais rápida e um assistente de IA dividindo um objetivo em passos menores."
}
},
"games": {
"en": {
"e": "Most of these agents learn through reinforcement learning (RL): they try moves, get a reward when they win, and slowly shift toward the moves that led to wins. Games make a perfect training ground because the rules are clear, the score is exact, and a computer can play millions of matches quickly. By playing against copies of itself, an agent always has an opponent at its own level, so it keeps improving.",
"w": "Game studios use such agents to test new levels, finding bugs and spots that are too hard before players do. AlphaGo’s 2016 win over Go champion Lee Sedol made this kind of AI famous."
},
"pt": {
"e": "A maioria desses agentes aprende por aprendizado por reforço (RL, na sigla em inglês): eles testam jogadas, ganham uma recompensa quando vencem e, aos poucos, passam a preferir as jogadas que levaram à vitória. Jogos são um ótimo campo de treino porque as regras são claras, o placar é exato e o computador consegue jogar milhões de partidas rapidamente. Jogando contra cópias de si mesmo, o agente sempre tem um adversário do seu nível e continua melhorando.",
"w": "Estúdios de games usam esses agentes para testar fases novas e achar bugs e trechos difíceis demais antes dos jogadores. A vitória do AlphaGo sobre o campeão de Go Lee Sedol, em 2016, tornou esse tipo de IA famoso."
}
},
"data": {
"en": {
"e": "This branch sorts AI by the kind of data it handles, called its modality: text and code, images and video, sound, or organized tables of numbers. Each kind has to be turned into numbers before a model can use it, and each needs its own way of doing that. Some models handle just one. Multimodal models combine several, so you can show one a photo and ask a question about it out loud.",
"w": "A phone app that reads a receipt from a photo needs to take in images. A customer service line answered by AI needs to understand speech and to speak back.",
"m": "“Multimodal” describes what a model can take in and give back, not how it is built. Very different designs can be combined inside one system to handle text, images and sound together."
},
"pt": {
"e": "Este ramo organiza a IA pelo tipo de dado com que ela trabalha, chamado de modalidade: texto e código, imagens e vídeo, som ou tabelas organizadas de números. Cada tipo precisa ser transformado em números antes que um modelo consiga usá-lo, e cada um tem seu próprio jeito de fazer isso. Alguns modelos lidam com uma só modalidade. Os multimodais combinam várias, então dá para mostrar uma foto e fazer uma pergunta sobre ela em voz alta.",
"w": "Um app que lê uma nota fiscal a partir de uma foto precisa receber imagens. Um atendimento telefônico feito por IA precisa entender fala e responder falando.",
"m": "“Multimodal” descreve o que um modelo recebe e devolve, não como ele é construído. Projetos internos bem diferentes podem ser combinados num mesmo sistema para lidar com texto, imagem e som juntos."
}
},
"mtext": {
"en": {
"e": "A model can’t read letters directly, so text is first cut into tokens: whole common words, or pieces of rarer ones, each with an ID number. “Unbelievable” might become “un”, “believ” and “able”. The model works only with these numbers and learns which ones tend to follow which. Code is handled the same way, since it is also text, just with stricter rules and lots of symbols and spaces that matter.",
"w": "Chatbots, translation apps, the autocomplete in email and code editors, and tools that answer questions about a long PDF all work with text broken into tokens.",
"p": "Written language and computer code, which a model reads and writes as small chunks of text called tokens."
},
"pt": {
