"e": "With a coding agent, you describe the result you want, run what it builds, and keep asking for changes until it works, often without reading the code it wrote. That makes it quick to try ideas, even for people who can’t program. The risk is that nobody checks the code: bugs, security holes and messy designs stay hidden until they cause trouble, so serious projects still need someone who reviews and tests it.",
"w": "A teacher can build a small quiz app for a class in an afternoon by describing it to a coding assistant. A company shipping software to customers still has engineers review and test that kind of code before release."
},
"pt": {
"e": "Com um agente de programação, você descreve o resultado que quer, roda o que ele constrói e vai pedindo mudanças até funcionar, muitas vezes sem ler o código que ele escreveu. Isso deixa rápido testar ideias, até para quem não sabe programar. O risco é que ninguém confere o código: bugs, falhas de segurança e soluções bagunçadas ficam escondidos até causarem problema, então projetos sérios ainda precisam de alguém que revise e teste.",
"w": "Uma professora consegue montar um pequeno app de quiz para a turma numa tarde, só descrevendo o que quer para um assistente de programação. Uma empresa que entrega software a clientes ainda tem engenheiros revisando e testando esse tipo de código antes de lançar."
}
},
"ctxeng": {
"en": {
"e": "A model only knows what is in front of it at that moment: its context window. That space is limited, and filling it with the wrong things makes answers worse. Context engineering means choosing what goes in: the right documents, the useful parts of earlier conversation, short tool descriptions and notes the system keeps for itself. It is prompt writing grown into the design of a whole system.",
"w": "A support assistant that pulls in only the customer’s order and the relevant help article, instead of the whole order history and manual, gives sharper answers. Long-running agents keep a short notes file to remember progress without rereading everything."
},
"pt": {
"e": "O modelo só sabe o que está na frente dele naquele momento: a janela de contexto. Esse espaço é limitado, e enchê-lo com as coisas erradas piora as respostas. Engenharia de contexto é escolher o que entra: os documentos certos, as partes úteis da conversa anterior, descrições curtas das ferramentas e anotações que o próprio sistema guarda. É a escrita de prompts virando o projeto de um sistema inteiro.",
"w": "Um assistente de suporte que traz só o pedido do cliente e o artigo de ajuda certo, em vez de todo o histórico e do manual inteiro, dá respostas mais precisas. Agentes que trabalham por muito tempo mantêm um arquivo curto de anotações para lembrar o andamento sem reler tudo."
}
},
"skills": {
"en": {
"e": "Instead of explaining the same procedure in every conversation, you write it down once as a skill: instructions, examples and sometimes small scripts, saved in a folder. The agent sees a one-line description of each skill it has and opens the full instructions only when a task needs them, which keeps its context window free for the work itself.",
"w": "A team can give its coding agent a skill that describes exactly how they write release notes, so every release gets notes in the same style without anyone repeating the instructions."
},
"pt": {
"e": "Em vez de explicar o mesmo procedimento em toda conversa, você o escreve uma vez como skill: instruções, exemplos e às vezes pequenos scripts, guardados numa pasta. O agente vê uma descrição de uma linha de cada skill que tem e só abre as instruções completas quando a tarefa precisa, o que deixa a janela de contexto livre para o trabalho em si.",

    const mi = modView, c = C(mi), m = COURSE[mi], f = document.createDocumentFragment();
    const top = el("div", "pagetop"); top.append(backlink(U("allModules"), function () { setView("course"); })); f.append(top);
    f.append(el("p", "kicker", fill(U("moduleN"), { n: mi + 1 })));
    f.append(el("h2", "title", c.t));
    f.append(el("p", "lead", c.i));
    const goals = el("section", "part"); goals.append(el("h3", null, U("goalsH")));
    const ul = el("ul", "goals"); c.o.forEach(function (t) { const li = el("li"); li.append(ico("goal")); li.append(el("span", null, t)); ul.append(li); });
    goals.append(ul); f.append(goals);
    const g = group(U("lessonsH"));
    m.steps.forEach(function (id, si) {
      const seen = !!prog.seen[id];
      g.list.append(row({ lead: seen ? ring(1, true) : el("span", "num", String(si + 1)), title: L(id), onClick: function () { goStep(mi, si); } }));
    });
    const ans = prog.quiz[mi] || [], right = c.quiz.filter(function (q, i) { return ans[i] === q.c; }).length;
    g.list.append(row({ lead: quizDone(mi) ? ring(1, true) : el("span", "num", "?"), title: U("quizRow"), sub: U("quizRowSub"), side: quizDone(mi) ? right + "/" + c.quiz.length : "", onClick: function () { openQuiz(mi); } }));
    f.append(g.wrap);
    const seen = seenCount(mi), act = el("div", "block-actions");
    act.append(btn("btn primary wide", seen && !quizDone(mi) ? U("resume") : U("startModule"), function () { startModule(mi); }));
    f.append(act);
    put(f);
    toTop();
  }

  function showQuiz() {
    const mi = cur.m, c = C(mi), f = document.createDocumentFragment();
    const ans = prog.quiz[mi] || (prog.quiz[mi] = []);
    const top = el("div", "pagetop"); top.append(backlink(c.t, function () { openModule(mi); })); f.append(top);
    f.append(el("p", "kicker", fill(U("moduleN"), { n: mi + 1 }) + " · " + U("quizRow")));
    f.append(el("h2", "title", U("quizTitle")));
    const k = el("aside", "card"), kh = el("h3", null, U("keyIdeas")), kl = el("ul", "goals");
    c.r.forEach(function (t) { const li = el("li"); li.append(ico("goal")); li.append(el("span", null, t)); kl.append(li); });
    k.append(kh, kl); f.append(k);
    c.quiz.forEach(function (q, qi) {
      f.append(el("p", "qtext", (qi + 1) + ". " + q.q));
      const list = el("div", "list"), picked = ans[qi];
      q.a.forEach(function (text, ai) {
        const mark = el("span", "mark");
        let cls = "";
        if (picked != null) {
          if (ai === q.c) { cls = "right"; mark.append(ico("check")); }
          else if (ai === picked) { cls = "wrongpick"; mark.append(ico("cross")); }
        }
        const b = row({ lead: mark, title: text, cls: cls, noChev: true, onClick: function () { ans[qi] = ai; saveProg(); renderPanelKeep(); } });
        if (picked != null) b.disabled = true;
        list.append(b);
      });
      f.append(list);
      if (picked != null) {
        const ok = picked === q.c, fb = el("p", "fb" + (ok ? "" : " no"));
        fb.setAttribute("role", "status");
        fb.append(el("b", null, ok ? U("correct") : U("wrong"))); fb.append(document.createTextNode(" " + q.why));
        f.append(fb);
      }
    });
    if (quizDone(mi)) {
      const right = c.quiz.filter(function (q, i) { return ans[i] === q.c; }).length;
      const res = el("div", "result"), card = el("div", "card");
      card.append(el("h3", null, fill(U("quizScore"), { n: right, t: c.quiz.length })));
      const act = el("div", "actions");
      if (mi + 1 < COURSE.length) act.append(btn("btn primary", U("nextModule"), function () { openModule(mi + 1); }));
      else act.append(btn("btn primary", U("tabCourse"), function () { setView("course"); }));
      act.append(btn("btn", U("quizRetry"), function () { prog.quiz[mi] = []; saveProg(); renderPanelKeep(); }));
      act.append(btn("btn", U("review"), function () { goStep(mi, 0); }));
      card.append(act); res.append(card); f.append(res);
    }
    put(f, "quiz");
  }
  function renderPanelKeep() { const y = panel.scrollTop, wy = window.scrollY; renderPanel(); panel.scrollTop = y; window.scrollTo(0, wy); }

  function drawBar() {
    const show = !!cur && ((view === "node" && inLesson) || view === "quiz");
    bar.hidden = !show;
    if (!show) return;
    const mi = cur.m, steps = COURSE[mi].steps, last = steps.length - 1, onQuiz = view === "quiz", off = !onQuiz && selected !== stepId();
    bar.replaceChildren();
    const back = btn("btn", "‹ " + U("prev"), function () {
      if (onQuiz) goStep(mi, last); else if (cur.s > 0) goStep(mi, cur.s - 1); else openModule(mi);
    });
    const mid = el("div", "cb-mid");
    if (off) mid.append(btn("btn", U("backToLesson"), function () { goStep(mi, cur.s); }));
    else {
      const lab = el("div", "cb-label");
      lab.append(el("span", null, onQuiz ? U("quizRow") : (cur.s + 1) + " / " + steps.length));
      const x = btn(null, "×", function () { inLesson = false; openModule(mi); });
      x.setAttribute("aria-label", U("leave")); x.title = U("leave");
      lab.append(x);
      mid.append(lab);
      mid.append(meter(onQuiz ? steps.length : cur.s + 1, steps.length));
    }
    const fwd = btn("btn primary", null, function () {
      if (cur.s < last) goStep(mi, cur.s + 1); else openQuiz(mi);
    });
    fwd.textContent = (cur.s < last ? U("next") : U("toQuiz")) + " ›";
    if (onQuiz) fwd.style.visibility = "hidden";
    bar.append(back, mid, fwd);
  }

  // ---------- timeline ----------
  function showTimeline() {
    const f = document.createDocumentFragment();
    f.append(el("h2", "title", U("tlTitle")));
    const ol = el("ol", "tl");
    TIMELINE.forEach(function (it, i) {
      const li = el("li"), b = btn("lens-" + NODES.get(it.id).lens, null, function () {
        tlActive = i;
        ol.querySelectorAll("button").forEach(function (x, j) { if (j === i) x.setAttribute("aria-current", "true"); else x.removeAttribute("aria-current"); });
        reveal(it.id, true);
        setSheet(false);                              // on touch screens, step aside so the map shows the result
      });
      if (i === tlActive) b.setAttribute("aria-current", "true");
      b.setAttribute("aria-label", it.y + ": " + it[lang] + " " + U("tlShow"));
      b.append(el("span", "yr", it.y));
      b.append(el("span", "pin"));
      const tx = el("span", "txt"); tx.append(el("span", "kind", U("kinds")[it.k])); tx.append(document.createTextNode(it[lang]));
      b.append(tx);
      li.append(b); ol.append(li);
    });
    f.append(ol);
    put(f);
  }

  // ---------- about ----------
  function showAbout() {
    const f = document.createDocumentFragment();
    f.append(el("h2", "title", U("aboutTitle")));
    function add(h, text) { const s = part(h, text); f.append(s); return s.querySelector("p"); }
    add(U("aboutWho"), U("aboutWhoText"));
    add(U("aboutHow"), U("aboutHowText"));
    add(U("aboutSrc"), U("aboutSrcText") + " " + checkedLabel() + ".");
    if (SITE.contactUrl) {
      const p = add(U("aboutFix"), U("aboutFixText") + " ");
      const a = el("a", null, U("aboutFixLink")); a.href = SITE.contactUrl; a.target = "_blank"; a.rel = "noopener noreferrer"; p.append(a);
    }
    if (SITE.license[lang] || SITE.license.en) add(U("aboutReuse"), SITE.license[lang] || SITE.license.en);
    add(U("aboutPrivacy"), U("aboutPrivacyText"));
    if (SITE.author) {
      const p = add(U("aboutBy"), "");
      if (SITE.authorUrl) { const a = el("a", null, SITE.author); a.href = SITE.authorUrl; a.target = "_blank"; a.rel = "noopener noreferrer"; p.append(a); }
      else p.textContent = SITE.author;
    }
    if (SITE.donateUrl) {
      const act = el("div", "actions"), a = el("a", "btn primary", "♥ " + U("support"));
      a.href = SITE.donateUrl; a.target = "_blank"; a.rel = "noopener noreferrer"; act.append(a); f.append(act);
    }
    put(f, "about");
    toTop();
  }

  // ---------- search ----------
  const q = document.getElementById("q"), qres = document.getElementById("qres");
  let qItems = [], qActive = 0;
  function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function search(text) {
    const s = norm(text.trim());
    if (!s) return [];
    const out = [];
    NODES.forEach(function (n, id) {
      const hay = [T(id).l, T(id).f, EN[id].l, EN[id].f, PT[id].l, PT[id].f].map(norm);
      let score = 9;
      hay.forEach(function (h, i) {
        if (!h) return;
        const pen = i < 2 ? 0 : 0.5;
        if (h.indexOf(s) === 0) score = Math.min(score, 0 + pen);
        else if (h.indexOf(" " + s) > -1 || h.indexOf("/" + s) > -1 || h.indexOf("(" + s) > -1) score = Math.min(score, 1 + pen);
        else if (h.indexOf(s) > -1) score = Math.min(score, 2 + pen);
      });
      if (score === 9 && s.length > 3 && norm(T(id).p).indexOf(s) > -1) score = 4;   // words in the plain explanation
      if (score < 9) out.push({ id: id, score: score, depth: n.depth });
    });
    out.sort(function (a, b) { return a.score - b.score || a.depth - b.depth; });
    return out.slice(0, 8).map(function (o) { return o.id; });
  }
  function drawResults() {
    qres.replaceChildren();
    if (!q.value.trim()) { qres.hidden = true; q.setAttribute("aria-expanded", "false"); return; }
    if (!qItems.length) qres.append(el("p", null, U("noMatch")));
    qItems.forEach(function (id, i) {
      const n = NODES.get(id), b = btn("lens-" + n.lens, null, function () { choose(id); });
      b.id = "qr" + i; b.setAttribute("role", "option"); b.tabIndex = -1;
      b.setAttribute("aria-selected", i === qActive ? "true" : "false");
      b.append(el("span", "dot")); b.append(document.createTextNode(L(id)));
      if (n.lens !== "root") b.append(el("small", null, U("lens")[n.lens]));
      b.addEventListener("mousedown", function (e) { e.preventDefault(); });   // keep focus in the field; the click selects
      qres.append(b);
    });
    qres.hidden = false; q.setAttribute("aria-expanded", "true");
    if (qItems.length) q.setAttribute("aria-activedescendant", "qr" + qActive); else q.removeAttribute("aria-activedescendant");
  }
  function choose(id) { q.value = ""; qItems = []; drawResults(); reveal(id); }
  q.addEventListener("input", function () { qItems = search(q.value); qActive = 0; drawResults(); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" && qItems.length) { e.preventDefault(); qActive = (qActive + 1) % qItems.length; drawResults(); }
    else if (e.key === "ArrowUp" && qItems.length) { e.preventDefault(); qActive = (qActive - 1 + qItems.length) % qItems.length; drawResults(); }
    else if (e.key === "Enter" && qItems.length) { e.preventDefault(); choose(qItems[qActive]); }
    else if (e.key === "Escape") { q.value = ""; qItems = []; drawResults(); }
  });
  q.addEventListener("blur", function () { setTimeout(function () { qres.hidden = true; q.setAttribute("aria-expanded", "false"); }, 150); });
  q.addEventListener("focus", function () { if (q.value.trim()) drawResults(); });

  // ---------- language, level, theme ----------
  function pressGroup(sel, attr, val) { document.querySelectorAll(sel + " button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute(attr) === val ? "true" : "false"); }); }
  function applyLang() {
    document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
    document.title = U("title");
    document.querySelectorAll("[data-i]").forEach(function (e) { e.textContent = U(e.getAttribute("data-i")); });
    q.placeholder = q.clientWidth && q.clientWidth < 220 ? U("searchShort") : U("search"); q.setAttribute("aria-label", U("search"));
    document.getElementById("langSeg").setAttribute("aria-label", U("lang"));
    document.getElementById("levelSeg").setAttribute("aria-label", U("level"));
    document.getElementById("themeSeg").setAttribute("aria-label", U("theme"));
    document.getElementById("tabs").setAttribute("aria-label", U("panelTabs"));
    document.getElementById("tools").setAttribute("aria-label", U("mapTools"));
    document.getElementById("modeSeg").setAttribute("aria-label", U("layout"));
    document.getElementById("allBtn").title = U("showAllTip");
    document.getElementById("sheetClose").setAttribute("aria-label", U("close"));
    setMax(sheetMax);
    const mb = document.getElementById("sheetMin");
    mb.replaceChildren(ico("down")); mb.setAttribute("aria-label", U("minimize")); mb.title = U("minimize");
    svg.attr("aria-label", U("title"));
    syncZoomBtn();
    pressGroup("#langSeg", "data-lang", langPref);
    renderPanel();
    if (q.value.trim()) { qItems = search(q.value); drawResults(); }
  }
  function setLevel(v) {
    level = v; save("aimap-level", v);
    pressGroup("#levelSeg", "data-level", v);
    if (view === "node") { const y = panel.scrollTop; showDetails(selected); panel.scrollTop = y; }
  }
  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    document.querySelector('meta[name="color-scheme"]').setAttribute("content", theme === "auto" ? "light dark" : theme);
    pressGroup("#themeSeg", "data-theme-set", theme);
  }

  // ---------- controls ----------
  function setLang(pref) {
    langPref = pref; save("aimap-lang", pref);
    lang = pref === "auto" ? deviceLang() : pref;
    applyLang(); render(null);
  }
  window.addEventListener("languagechange", function () { if (langPref === "auto" && deviceLang() !== lang) setLang("auto"); });
  document.querySelectorAll("#langSeg button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });
  document.querySelectorAll("#levelSeg button").forEach(function (b) {
    b.addEventListener("click", function () { setLevel(b.getAttribute("data-level")); });
  });
  document.querySelectorAll("#themeSeg button").forEach(function (b) {
    b.addEventListener("click", function () { theme = b.getAttribute("data-theme-set"); save("aimap-theme", theme); applyTheme(); });
  });
  document.querySelectorAll("#tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      const v = b.getAttribute("data-view");
      if (v === "node" && cur && stepId() === selected) inLesson = true;
      setView(v);
    });
  });
  function syncControls() {
    pressGroup("#modeSeg", "data-mode", mode);
    pressGroup("#linkSeg", "data-link", linkMode);
    document.getElementById("focusBtn").setAttribute("aria-pressed", focus ? "true" : "false");
    document.getElementById("allBtn").setAttribute("aria-pressed", everything ? "true" : "false");
    svg.classed("everything", !!everything);
  }
  function leaveEverything() {      // restore the view from before "Show everything"; true if it was on
    if (!everything) return false;
    mode = everything.mode; linkMode = everything.linkMode; focus = everything.focus;
    open.clear(); everything.open.forEach(function (id) { open.add(id); });
    for (let a = NODES.get(selected).parent; a; a = a.parent) open.add(a.id);   // keep the selected concept on screen
    everything = null;
    syncControls();
    return true;
  }
  function setEverything(on) {
    if (on) {
      everything = { mode: mode, linkMode: linkMode, focus: focus, open: new Set(open) };
      mode = "radial"; linkMode = "all"; focus = false;
      NODES.forEach(function (n) { if (n.kids.length) open.add(n.id); });
      syncControls();
    } else leaveEverything();
    hideHint();
    render(null, fit);
  }
  document.getElementById("allBtn").addEventListener("click", function () { setEverything(!everything); });
  document.querySelectorAll("#modeSeg button").forEach(function (b) {
    b.addEventListener("click", function () {
      const m = b.getAttribute("data-mode"), was = leaveEverything();
      if (m === mode && !was) return;
      mode = m; save("aimap-mode", m); syncControls(); render(null, fit);
    });
  });
  document.querySelectorAll("#linkSeg button").forEach(function (b) {
    b.addEventListener("click", function () {
      const was = leaveEverything();
      linkMode = b.getAttribute("data-link"); save("aimap-links", linkMode); syncControls(); render(null, was ? fit : null);
    });
  });
  document.getElementById("focusBtn").addEventListener("click", function () {
    const was = leaveEverything();
    focus = !focus; syncControls(); render(null, was ? fit : null);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (sheetOpen) setSheet(false); else if (everything) setEverything(false);
  });
  document.getElementById("scrim").addEventListener("click", function () { setSheet(false); });
  document.getElementById("sheetClose").addEventListener("click", function () { setSheet(false); });
  document.getElementById("sheetMax").addEventListener("click", function () { setMax(!sheetMax); });
  document.getElementById("sheetMin").addEventListener("click", function () { setMin(true); });
  document.getElementById("dock").addEventListener("click", function () { setSheet(true); });
  window.addEventListener("resize", measureHeader);
  document.getElementById("sheetBtn").addEventListener("click", function () { setView("course"); });
  sheetMQ.addEventListener("change", applySheetMode);
  document.getElementById("openAll").addEventListener("click", function () {
    hideHint(); leaveEverything();
    (function openAll(n) { if (n.kids.length) { open.add(n.id); n.kids.forEach(openAll); } })(NODES.get(selected));
    for (let a = NODES.get(selected).parent; a; a = a.parent) open.add(a.id);
    render(selected, fit);
  });
  document.getElementById("closeAll").addEventListener("click", function () {
    leaveEverything();
    open.clear(); open.add("ai"); selected = "ai"; tlActive = -1; setHash("ai"); syncZoomBtn();
    renderPanel();
    render("ai", fit);
  });
  document.getElementById("fitBtn").addEventListener("click", fit);
  document.getElementById("centerBtn").addEventListener("click", centerChart);
  document.getElementById("zoomBtn").addEventListener("click", function () {
    if (sheetOpen) setSheet(false);
    if (shown.has(selected)) zoomTo(selected); else { reveal(selected, true); setTimeout(function () { zoomTo(selected); }, 650); }
  });
  window.addEventListener("hashchange", function () {
    const id = decodeURIComponent(location.hash.slice(1));
    if (NODES.has(id) && id !== selected) reveal(id);
  });
  // ---------- rows that slide sideways get arrows when they overflow ----------
  const scrollers = [];
  function scrollHints(el, cls) {
    const wrap = el.parentNode.insertBefore(document.createElement("div"), el);
    wrap.className = "sc" + (cls ? " " + cls : "");
    el.classList.add("scroller");
    function arrow(side) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "sc-btn sc-" + side; b.tabIndex = -1; b.setAttribute("aria-hidden", "true");
      b.innerHTML = '<svg viewBox="0 0 8 14"><path d="' + (side === "l" ? "M6.5 1.5 1.5 7l5 5.5" : "M1.5 1.5 6.5 7l-5 5.5") + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      b.addEventListener("click", function () { el.scrollBy({ left: (side === "l" ? -1 : 1) * Math.max(120, el.clientWidth * 0.7), behavior: reduce ? "auto" : "smooth" }); });
      return b;
    }
    wrap.append(arrow("l"), el, arrow("r"));
    function update() {
      const max = el.scrollWidth - el.clientWidth;
      wrap.classList.toggle("can-l", el.scrollLeft > 4);
      wrap.classList.toggle("can-r", max - el.scrollLeft > 4);
    }
    el.addEventListener("scroll", update, { passive: true });
    const ro = new ResizeObserver(update);
    ro.observe(el); Array.prototype.forEach.call(el.children, function (c) { ro.observe(c); });
    scrollers.push(update);
    update();
  }
  scrollHints(document.getElementById("tools"));
  scrollHints(document.querySelector(".prefs"), "sc-prefs");

  let lastW = 0, rz = null;
  new ResizeObserver(function () {          // keep the map framed when its width changes (window resize, panel shown or hidden)
    const w = canvasEl.clientWidth;
    if (!lastW || w === lastW) { lastW = w; return; }
    lastW = w; clearTimeout(rz);
    rz = setTimeout(function () { if (selected === "ai" || everything) fit(); else panTo(selected); q.placeholder = q.clientWidth < 220 ? U("searchShort") : U("search"); }, 120);
  }).observe(canvasEl);
  if (SITE.donateUrl) { const s = document.getElementById("supportBtn"); s.href = SITE.donateUrl; s.hidden = false; }

  // ---------- start ----------
  applyTheme();
  applySheetMode();
  syncControls();
  pressGroup("#levelSeg", "data-level", level);
  open.add("ai");                                   // show the main branches from the first frame
  const linked = decodeURIComponent(location.hash.slice(1));
  if (NODES.has(linked) && linked !== "ai") {       // a shared link to one concept
    for (let a = NODES.get(linked).parent; a; a = a.parent) open.add(a.id);
    selected = linked; view = "node"; hinted = true; document.getElementById("hint").classList.add("gone");
  }
  setView(view, view !== "node");
  applyLang();
  initialView();
  render(null, view === "node" ? function () { panTo(selected); } : fit);
})();

</script>
