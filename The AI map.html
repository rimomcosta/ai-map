 p:"Machine learning com redes neurais de muitas camadas, que aprendem sozinhas as próprias features a partir de dados brutos.",
 t:"Camadas empilhadas de transformações aprendidas, treinadas com retropropagação e descida do gradiente em GPUs. A arquitetura embute suposições sobre os dados: grades para imagens, sequências para texto, grafos para relações.",
 h:"A retropropagação foi popularizada em 1986 (Rumelhart, Hinton, Williams), e a vitória da AlexNet em 2012 começou a era moderna. Hinton, LeCun e Bengio receberam o Prêmio Turing de 2018.",
 w:"Reconhecimento de fala, tradução, desbloqueio facial, geração de imagens, LLMs.",
 n:"O motor da IA moderna. A maioria dos engenheiros adapta modelos pré-treinados em vez de treinar do zero."},

nnbasics: {l:"Fundamentos de redes neurais", f:"Neural network basics",
 p:"As peças básicas que existiam muito antes dos transformers: neurônios artificiais empilhados em camadas, treinados ajustando seus pesos aos poucos.",
 t:"Um neurônio calcula uma soma ponderada das entradas mais um viés e aplica uma função de ativação. Camadas de neurônios formam uma rede; os pesos e vieses são seus parâmetros, aprendidos por retropropagação e descida do gradiente.",
 h:"Do neurônio de McCulloch e Pitts (1943) e do perceptron de Rosenblatt (1958) às redes de várias camadas treinadas com retropropagação (1986).",
 w:"Todo modelo neural deste mapa, da LeNet ao GPT, é feito dessas peças.",
 n:"Fundamental: entender pesos, camadas e gradientes facilita todo o resto do mapa.",
 m:"Neurônios artificiais não são pequenas células cerebrais. O que importa é quantos parâmetros aprendidos existem e como estão conectados."},

perceptron: {l:"Perceptron", f:"Neurônio artificial",
 p:"A máquina de aprendizado mais simples: um único neurônio artificial que traça uma linha reta entre duas classes.",
 t:"A saída é 1 se a soma ponderada das entradas passa de um limiar, senão 0. A regra do perceptron ajusta os pesos a cada erro. Só consegue separar classes com uma linha reta (ou um plano).",
 h:"Frank Rosenblatt, 1958, que também o construiu em hardware, o Mark I Perceptron. O livro de Minsky e Papert, de 1969, mostrou que ele não aprende o XOR, o que esfriou o interesse por anos.",
 w:"Ainda é o primeiro modelo que estudantes implementam à mão.",
 n:"Histórico como modelo, mas todo neurônio de uma rede moderna descende dele."},

mlp: {l:"MLP / redes feed-forward", f:"Multilayer Perceptron (perceptron de múltiplas camadas)",
 p:"Várias camadas de neurônios em sequência, cada uma alimentando a próxima. Com uma camada oculta, a rede já aprende fronteiras curvas e complexas.",
 t:"Camadas totalmente conectadas com ativações não lineares (ReLU, GELU). A informação flui num só sentido, da entrada à saída, sem ciclos. Com unidades ocultas suficientes, um MLP aproxima qualquer função contínua.",
 h:"Ficou treinável com a retropropagação nos anos 1980; o teorema da aproximação universal foi provado em 1989.",
 w:"Previsões tabulares, cabeças de pontuação em recomendadores e o bloco feed-forward dentro de cada camada de transformer.",
 n:"Essencial: cerca de dois terços dos parâmetros de uma camada clássica de transformer ficam no bloco MLP."},

backprop: {l:"Retropropagação e descida do gradiente", f:"Backpropagation & gradient descent",
 p:"Como uma rede aprende: medir o erro, calcular quanto cada peso contribuiu para ele e ajustar cada peso um pouco na direção que o reduz.",
 t:"A retropropagação aplica a regra da cadeia para obter o gradiente da perda em relação a cada parâmetro. A descida do gradiente (na prática SGD com momentum ou Adam) move cada parâmetro um passo pequeno, a taxa de aprendizado, contra esse gradiente.",
 h:"As ideias vêm dos anos 1960 e 1970 (Linnainmaa, Werbos); o artigo de 1986 na Nature, de Rumelhart, Hinton e Williams, tornou o método padrão.",
 w:"Todo treinamento, de um filtro de spam a um LLM de fronteira, repete esse ciclo milhões de vezes.",
 n:"Essencial. Frameworks como o PyTorch calculam os gradientes automaticamente (autograd).",
 m:"Retropropagação não é um paradigma de aprendizado. Ela calcula gradientes; aprendizado supervisionado, auto-supervisionado e por reforço dependem dela."},

cnn: {l:"Redes convolucionais", f:"CNN: Convolutional Neural Network",
 p:"Redes que varrem a imagem com pequenos filtros aprendidos: primeiro bordas, depois formas, depois objetos inteiros.",
 t:"Camadas de convolução reutilizam os mesmos pesos de filtro em todas as posições, o pooling reduz a resolução, e camadas mais profundas enxergam áreas maiores da imagem.",
 h:"A LeNet de Yann LeCun lia dígitos manuscritos em cheques nos anos 1990; a AlexNet (2012) tornou as CNNs famosas.",
 w:"Análise de exames médicos, detecção de defeitos em linhas de produção, recursos de câmera do celular.",
 n:"Ainda muito usadas, sobretudo em dispositivos pequenos, embora os Vision Transformers liderem vários benchmarks."},

alexnet: {l:"AlexNet / ResNet",
 p:"A AlexNet provou que redes profundas em GPUs podiam dominar o reconhecimento de imagens. A ResNet tornou treináveis redes muito profundas.",
 t:"AlexNet: 8 camadas aprendidas, ativação ReLU, dropout, treinada em duas GPUs. ResNet: conexões residuais (skip connections) deixam o sinal e os gradientes atravessarem mais de 100 camadas.",
 h:"A AlexNet venceu o ImageNet 2012 com cerca de 15% de erro top-5, contra cerca de 26% do segundo colocado. A ResNet venceu o ImageNet 2015 com 152 camadas.",
 w:"Backbones ResNet estão dentro de incontáveis classificadores e detectores de imagem.",
 n:"Conexões residuais estão em todo transformer e LLM atual, o maior legado da ResNet."},

unet: {l:"U-Net",
 p:"Uma rede em forma de U: encolhe a imagem para entendê-la e depois a expande de volta para dar uma resposta pixel a pixel.",
 t:"Um codificador-decodificador com conexões entre resoluções equivalentes, para que os detalhes finos sobrevivam. A saída tem o mesmo tamanho da entrada.",
 h:"Apresentada em 2015 para segmentação de imagens biomédicas (Ronneberger e colegas).",
 w:"Contornar tumores em exames. Também era a rede de remoção de ruído dentro do Stable Diffusion 1.x, 2.x e SDXL.",
 n:"Ainda comum em segmentação. Na geração de imagens, backbones de transformer (DiT) a substituíram em boa parte dos modelos novos."},

rnn: {l:"Redes recorrentes", f:"RNN: Recurrent Neural Network",
 p:"Redes que leem uma sequência um passo de cada vez, carregando uma memória adiante.",
 t:"Um estado oculto é atualizado a cada passo e treinado com retropropagação no tempo. RNNs simples esquecem em sequências longas porque os gradientes desaparecem.",
 h:"Redes de Elman (1990); versões com portas, como a LSTM, resolveram o problema da memória.",
 w:"Antes dos transformers: Google Tradutor, reconhecimento de fala de assistentes de voz, previsão da próxima palavra nos teclados de celular.",
 n:"Em grande parte substituídas pelos transformers em linguagem. A ideia volta nos modelos de espaço de estados, como o Mamba, e no RWKV, que buscam contexto longo barato."},

lstm: {l:"RNN / LSTM / GRU", f:"Long Short-Term Memory / Gated Recurrent Unit",
 p:"As células recorrentes mais usadas. LSTM e GRU acrescentam portas que decidem o que lembrar e o que esquecer.",
 t:"A LSTM tem portas de entrada, esquecimento e saída em volta de um estado de célula; a GRU é uma versão mais simples, com duas portas.",
 h:"LSTM em 1997 (Hochreiter e Schmidhuber), GRU em 2014 (Cho e colegas). LSTMs sequence-to-sequence (2014) lançaram a tradução automática neural.",
 w:"O Google Neural Machine Translation (2016) foi construído com LSTMs.",
 n:"Ainda usadas em séries temporais pequenas e em dispositivos, e são a melhor forma de mostrar aos alunos por que a atenção era necessária."},

trans: {l:"Transformers",
 p:"A arquitetura por trás dos LLMs modernos: cada token olha para todos os outros para decidir o que importa.",
 t:"A auto-atenção (self-attention) mistura informação de todas as posições em paralelo, seguida de camadas feed-forward, com conexões residuais e normalização. O treino paraleliza em GPUs muito melhor que nas RNNs.",
 h:"“Attention Is All You Need” (Vaswani e colegas, Google, 2017), criado para tradução automática.",
 w:"ChatGPT, Claude, Gemini, assistentes de código, ranqueamento de buscas na web.",
 n:"A arquitetura dominante em texto, visão, áudio e geração de imagens. O custo da atenção cresce com o quadrado do tamanho do contexto, o que motiva pesquisas em atenção eficiente.",
 m:"Transformers não servem só para linguagem: o mesmo desenho roda modelos de visão, áudio, geração de imagens e robótica."},

inside: {l:"Dentro de um Transformer", f:"Inside a Transformer",
 p:"O que acontece com o seu texto, passo a passo, dos caracteres até o próximo token previsto.",
 t:"Texto → tokens → IDs de token → vetores de embedding (mais posição) → camadas empilhadas de atenção e feed-forward → logits → probabilidades → próximo token.",
 w:"Esse pipeline roda toda vez que um assistente de chat escreve uma palavra na tela.",
 n:"Essas etapas explicam limites de contexto, preço por token, erros estranhos de ortografia e por que os prompts se comportam como se comportam.",
 m:"Um token não entra em “seu próprio neurônio”. Cada ID de token vira um vetor de centenas ou milhares de números, e cada camada processa todos esses vetores."},

tok: {l:"Tokenização e IDs de token", f:"Tokenization & token IDs",
 p:"O texto é cortado em pedaços chamados tokens (palavras, partes de palavras ou caracteres), e cada pedaço recebe um número de ID de um vocabulário fixo.",
 t:"Algoritmos de subpalavras como BPE, WordPiece ou SentencePiece montam um vocabulário de cerca de 30 mil a 200 mil tokens. “inacreditável” pode virar “in”, “acredit”, “ável”. O modelo só enxerga os IDs inteiros.",
 h:"O byte-pair encoding foi adaptado para tradução neural em 2015 (Sennrich e colegas).",
 w:"Preços de API e limites de contexto são contados em tokens; textos em português costumam gastar mais tokens que o mesmo texto em inglês.",
 n:"Essencial. A tokenização explica por que modelos erram ao contar letras e por que alguns idiomas custam mais tokens que outros."},

emb: {l:"Embeddings", f:"Vetores de representação",
 p:"Cada ID de token vira uma lista de números (um vetor) que o posiciona num espaço em que significados parecidos ficam próximos.",
 t:"Uma matriz de embedding tem uma linha aprendida por item do vocabulário; consultar um ID devolve seu vetor, muitas vezes com 768 a mais de 8.000 dimensões. Ao passar pelas camadas, o vetor fica contextual, e “banco” de praça e “banco” de dinheiro terminam diferentes.",
 h:"O word2vec (2013) popularizou vetores de palavras aprendidos; os transformers os tornaram contextuais.",
 w:"O exemplo clássico do word2vec: rei − homem + mulher cai perto de rainha.",
 n:"Essencial. A mesma ideia, aplicada a textos inteiros, alimenta modelos de embedding e busca vetorial.",
 m:"Os embeddings de token dentro de um LLM não são a saída de um modelo de embedding. Um modelo de embedding devolve um único vetor para um texto inteiro, pensado para busca e similaridade."},

pos: {l:"Informação de posição", f:"Positional information",
 p:"A atenção sozinha não sabe a ordem das palavras, então o modelo acrescenta a informação de onde cada token está.",
 t:"O transformer original somava padrões fixos de seno e cosseno; o GPT-2 aprendia vetores de posição; a maioria dos LLMs atuais usa rotary position embeddings (RoPE), que giram os vetores de query e key num ângulo que depende da posição.",
 h:"Codificações senoidais (2017); RoPE (Su e colegas, 2021).",
 w:"Sem ela, “cachorro morde homem” e “homem morde cachorro” pareceriam idênticos.",
 n:"Essencial. Esticar esses esquemas de posição é uma das formas de ampliar a janela de contexto."},

attn: {l:"Auto-atenção (multi-head)", f:"Self-attention",
 p:"Cada token olha para todos os outros e decide quais importam para entendê-lo.",
 t:"Cada token produz uma query, uma key e um value. Os produtos escalares entre queries e keys, escalados e passados por softmax, viram pesos de atenção, e a saída é uma mistura ponderada dos values. A atenção multi-head roda várias dessas em paralelo, para que cada cabeça acompanhe relações diferentes.",
 h:"A atenção foi acrescentada a modelos de tradução com RNN em 2014 (Bahdanau e colegas); o transformer (2017) construiu tudo em volta dela.",
 w:"Em “O troféu não coube na mala porque ele era grande demais”, a atenção ajuda a ligar “ele” a “troféu”.",
 n:"Essencial. O custo cresce com o quadrado do tamanho da sequência, por isso contexto longo é caro."},

ffn: {l:"Camadas feed-forward", f:"Feed-forward layers",
 p:"Depois que a atenção mistura informação entre tokens, uma pequena rede neural processa cada token isoladamente.",
 t:"Um MLP de duas camadas aplicado a cada posição de forma independente, normalmente expandindo para cerca de quatro vezes a largura do modelo e voltando. Pesquisas sugerem que essas camadas guardam boa parte do conhecimento factual do modelo.",
 w:"Nos modelos Mixture of Experts, é este bloco que é substituído por várias redes especialistas.",
 n:"Essencial: uma grande parte dos parâmetros de um LLM mora aqui."},

ctx: {l:"Janela de contexto", f:"Context window",
 p:"O número máximo de tokens que o modelo consegue olhar de uma vez: seu prompt, documentos, conversa e a própria resposta.",
 t:"Definida pelo treinamento e pelo esquema de posição, vai de alguns milhares a um milhão de tokens ou mais. O que fica fora é invisível para o modelo, e a qualidade pode cair para detalhes enterrados no meio de contextos muito longos.",
 w:"Colar um contrato longo só funciona se ele couber; caso contrário, você precisa de RAG ou de resumos.",
 n:"Essencial para engenheiros de IA: o orçamento de contexto define custo, latência e desenho do sistema.",
 m:"Uma janela de contexto longa não é memória. O modelo esquece tudo entre chamadas, a menos que a aplicação envie de novo."},

logits: {l:"Logits e próximo token", f:"Output logits & token prediction",
 p:"No final, o modelo dá uma nota para cada token do vocabulário; as notas viram probabilidades e um token é escolhido.",
 t:"A última camada projeta o vetor da última posição sobre o vocabulário, produzindo logits. O softmax (com temperatura) os transforma em probabilidades; a decodificação escolhe o mais provável ou sorteia com top-k ou top-p.",
 w:"Temperatura 0 dá respostas quase determinísticas; temperaturas maiores dão respostas mais variadas.",
 n:"Essencial. A decodificação restrita, como saída JSON estrita, funciona bloqueando tokens nesta etapa."},

enc: {l:"Encoder-only", f:"Somente codificador",
 p:"Transformers que leem o texto inteiro de uma vez, nos dois sentidos, para entendê-lo em vez de escrevê-lo.",
 t:"Atenção bidirecional, pré-treinamento por modelagem de linguagem mascarada (completar palavras escondidas). Produz embeddings contextuais para classificação, marcação e busca.",
 h:"O BERT (2018) definiu a categoria.",
 w:"Casar buscas com documentos; muitos modelos de embedding por trás da busca vetorial em RAG.",
 n:"Muito relevante para engenheiros de IA: muitos modelos de embedding e rerankers em pipelines de busca seguem o estilo encoder."},

bert: {l:"BERT / RoBERTa", f:"Bidirectional Encoder Representations from Transformers (representações bidirecionais de codificador a partir de Transformers)",
 p:"O BERT, do Google, aprendeu linguagem completando palavras mascaradas; o RoBERTa, da Meta, treinou o mesmo desenho por mais tempo e melhor.",
 t:"O BERT-base tem cerca de 110 milhões de parâmetros em 12 camadas. O RoBERTa (2019) abandonou a previsão da próxima frase e usou mais dados com mascaramento dinâmico.",
 h:"O BERT foi lançado em outubro de 2018, e o Google passou a usá-lo na Busca em 2019.",
 w:"Análise de sentimento, reconhecimento de entidades nomeadas, detecção de intenção em bots de atendimento.",
 n:"Ainda é escolha frequente para classificação e embeddings rápidos e baratos, por exemplo via sentence-transformers. O ModernBERT (2024) renovou a linhagem.",
 m:"O BERT não escreve texto como o GPT. Ele foi treinado para completar palavras mascaradas usando o contexto dos dois lados, então brilha em entender, não em gerar."},

dec: {l:"Decoder-only", f:"Somente decodificador",
 p:"Transformers que escrevem: preveem o próximo token, acrescentam e repetem.",
 t:"Atenção causal, para que cada token só veja o passado. Pré-treinados com previsão do próximo token e depois ajustados com instruções e alinhados com métodos como o RLHF.",
 h:"GPT-1 (2018), GPT-2 (2019) e GPT-3 (2020, 175 bilhões de parâmetros), que mostrou que a escala traz habilidades few-shot.",
 w:"Assistentes de chat, assistentes de código, agentes.",
 n:"O desenho dominante de LLM, dos modelos de fronteira até os pequenos que rodam no aparelho."},

gpt: {l:"GPT / Llama / Qwen", f:"GPT: Generative Pre-trained Transformer (transformer generativo pré-treinado)",
 p:"Famílias de grandes modelos de linguagem: o GPT da OpenAI (pesos fechados), o Llama da Meta e o Qwen da Alibaba (pesos abertos).",
 t:"Transformers decoder-only com bilhões de parâmetros, atenção causal e pré-treinamento por próximo token. Ingredientes comuns nos modelos abertos: rotary position embeddings, grouped-query attention e, em muitos recentes, camadas Mixture of Experts. Os detalhes internos dos modelos proprietários recentes muitas vezes não são publicados.",
 h:"O ChatGPT foi lançado em novembro de 2022. O Llama (fevereiro de 2023) iniciou a onda de pesos abertos, e o Qwen virou uma das famílias abertas mais usadas.",
 w:"Assistentes de atendimento, geração de código, perguntas e respostas sobre documentos da empresa.",
 n:"O centro do trabalho de engenharia de IA: prompting, RAG, uso de ferramentas, fine-tuning e avaliação partem daqui."},

encdec: {l:"Encoder–Decoder", f:"Codificador–decodificador",
 p:"Uma metade lê a entrada e a outra escreve a saída: ideal para transformar um texto em outro.",
 t:"O encoder constrói uma representação com atenção bidirecional; o decoder gera com atenção causal mais atenção cruzada (cross-attention) sobre a saída do encoder.",
 h:"O transformer original de 2017 era um encoder-decoder feito para tradução.",
 w:"Tradução automática, resumo, transcrição de fala (o Whisper, da OpenAI, é encoder-decoder).",
 n:"Menos comum em modelos de chat de uso geral, mas ainda forte em tradução, reconhecimento de fala e reescrita estruturada."},

t5: {l:"T5 / BART", f:"Text-to-Text Transfer Transformer / Bidirectional and Auto-Regressive Transformers",
 p:"O T5, do Google, trata toda tarefa como “texto entra, texto sai”. O BART, da Meta, aprende consertando texto corrompido.",
 t:"O T5 é pré-treinado preenchendo trechos removidos e recebe as tarefas como prefixos, como “summarize:”. O BART embaralha o texto (mascaramento, troca de ordem) e aprende a reconstruí-lo.",
 h:"Ambos de 2019. O Flan-T5 (2022) acrescentou ajuste por instruções.",
 w:"Pipelines de resumo, tradução, reescrita de consultas de busca.",
 n:"Ainda usados em tarefas especializadas com fine-tuning, e o codificador de texto do T5 lê o prompt dentro de vários geradores de imagem."},

vt: {l:"Vision Transformers", f:"Transformers de visão",
 p:"Transformers aplicados a imagens: a imagem é cortada em pedaços (patches) e cada pedaço é tratado como uma palavra.",
 t:"A imagem vira uma sequência de embeddings de patches mais embeddings de posição, processada por um encoder de transformer comum.",
 h:"Apresentado pelo Google em 2020, em “An Image is Worth 16x16 Words”.",
 w:"Classificação de imagens e a parte de visão de assistentes que leem prints e fotos.",
 n:"Os codificadores de imagem dentro de LLMs multimodais costumam ser do estilo ViT, como CLIP ou SigLIP.",
 m:"Essas categorias se sobrepõem. O ViT é, ele mesmo, um transformer encoder-only, e o DiT é um transformer usado dentro da difusão. Famílias nomeadas pelo uso (visão, difusão) e pela estrutura (encoder, decoder) não são mutuamente exclusivas."},

vit: {l:"ViT", f:"Vision Transformer",
 p:"O Vision Transformer original.",
 t:"Divide a imagem em patches de 16×16 pixels e acrescenta um token especial [CLS] usado na classificação. Precisa de pré-treinamento em grande escala para superar as CNNs.",
 h:"Dosovitskiy e colegas, 2020 (publicado na ICLR 2021).",
 w:"O CLIP da OpenAI (2021) combinou um ViT com um codificador de texto, permitindo buscar fotos por descrição.",
 n:"Variantes do ViT, como DINOv2 e SigLIP, são codificadores de imagem padrão hoje."},

dit: {l:"Diffusion Transformers", f:"DiT: transformers de difusão",
 p:"Transformers usados como motor de geradores de imagem e vídeo, no lugar da antiga U-Net.",
 t:"Patches latentes com ruído entram como tokens; o transformer prevê o que remover (ruído ou velocidade), condicionado à etapa de tempo e ao prompt.",
 h:"O artigo do DiT, de Peebles e Xie, saiu em 2022.",
 w:"O Sora da OpenAI (2024) e o Stable Diffusion 3 usam backbones de transformer na geração.",
 n:"O backbone padrão para geração de imagem e vídeo no estado da arte.",
 m:"O DiT não é uma alternativa à difusão; é a rede que faz a remoção de ruído dentro de um modelo de difusão ou de flow matching."},

ditimg: {l:"Modelos de imagem DiT", f:"DiT image models",
 p:"Geradores de imagem construídos sobre diffusion transformers.",
 t:"Normalmente trabalham no espaço latente comprimido de um VAE, leem o prompt com um codificador de texto (CLIP, T5) e muitas vezes são treinados com um objetivo de flow matching.",
 h:"Stable Diffusion 3 (2024) e FLUX.1, da Black Forest Labs (2024).",
 w:"Peças de marketing, mockups de produto, arte conceitual.",
 n:"Estado da arte em texto para imagem."},

other: {l:"Outras arquiteturas neurais", f:"Other neural architectures",
 p:"Redes pensadas para dados que não são uma grade ou sequência simples, ou para comprimir dados.",
 t:"Redes de grafos passam mensagens pelas arestas; modelos de espaço de estados processam sequências longas; autoencoders comprimem a entrada num código pequeno e a reconstroem.",
 h:"As ideias têm décadas e amadureceram com o deep learning nos anos 2010.",
 w:"Previsão de propriedades de moléculas, detecção de anomalias.",
 n:"Ferramentas especializadas, e autoencoders se escondem dentro da maioria dos geradores de imagem."},

gnn: {l:"Redes neurais de grafos", f:"GNN: Graph Neural Network",
 p:"Redes que aprendem com grafos: cada nó se atualiza usando mensagens dos vizinhos.",
 t:"Camadas de troca de mensagens (GCN, GraphSAGE, GAT) agregam as features dos vizinhos, gerando previsões por nó, por aresta ou para o grafo inteiro.",
 h:"Primeiros trabalhos por volta de 2005–2009 (Scarselli e colegas); a GCN (Kipf e Welling, 2016) as popularizou.",
 w:"Recomendações do PinSage, no Pinterest; previsão do tempo GraphCast, do Google DeepMind; descoberta de medicamentos.",
 n:"Fortes em ciência, recomendação e detecção de fraude, e parceiras naturais dos grafos de conhecimento."},

ssm: {l:"Modelos de espaço de estados", f:"SSM: State Space Models",
 p:"Um tipo mais novo de modelo de sequência que lê passo a passo como uma RNN, mas treina em paralelo como um transformer.",
 t:"Um sistema dinâmico linear aprendido carrega um estado de tamanho fixo pela sequência, então o custo cresce linearmente com o tamanho, e não ao quadrado. O Mamba acrescenta atualizações “seletivas” que dependem da entrada.",
 h:"O S4 (2021) mostrou que SSMs lidam com sequências muito longas; o Mamba veio em 2023.",
 w:"Áudio longo, genômica e documentos longos; modelos híbridos misturam camadas SSM com camadas de atenção.",
 n:"Pesquisa ativa e alguns híbridos em produção; transformers continuam sendo o padrão."},

mamba: {l:"Mamba",
 p:"O modelo de espaço de estados mais conhecido, criado como alternativa mais rápida à atenção em sequências longas.",
 t:"Blocos SSM seletivos cujos parâmetros dependem da entrada, calculados com uma varredura paralela otimizada para o hardware. A versão pura não usa atenção.",
 h:"Gu e Dao, dezembro de 2023.",
 w:"Modelos abertos híbridos, como o Jamba da AI21, combinam camadas Mamba e de transformer.",
 n:"Influente; os híbridos são a forma de uso mais comum."},

ae: {l:"Autoencoders", f:"Autocodificadores",
 p:"Uma rede que espreme os dados num código pequeno e depois os reconstrói. Se a reconstrução fica boa, o código capturou o que importa.",
 t:"Um encoder comprime a entrada num código pequeno (o gargalo) e um decoder a reconstrói, com treino pelo erro de reconstrução. É um padrão de desenho e um objetivo, não uma família separada: encoder e decoder podem ser CNNs, transformers ou MLPs. Um VAE acrescenta um espaço latente probabilístico para que se possa amostrar dados novos.",
 h:"Raízes na pesquisa de redes neurais dos anos 1980; autoencoders profundos foram popularizados por Hinton e Salakhutdinov em 2006.",
 w:"Detecção de anomalias (reconstrução ruim indica algo incomum), compressão.",
 n:"Autoencoders esparsos viraram uma ferramenta central de interpretabilidade para olhar dentro de LLMs, e VAEs comprimem imagens para modelos de difusão.",
 m:"Um autoencoder não concorre com CNNs ou transformers; é uma forma de usá-los."},

learn: {l:"Como aprende", f:"Learning paradigms & training",
 p:"A lente do treinamento: de onde vêm as habilidades de um modelo.",
 t:"Duas perguntas separadas. O paradigma de aprendizado é o tipo de sinal com que o modelo aprende: rótulos, estrutura dos dados, os próprios dados ou recompensas. A etapa de treinamento é quando e para quê ele é treinado: pré-treinamento, fine-tuning, alinhamento.",
 w:"Um assistente de chat costuma ser auto-supervisionado no pré-treinamento, supervisionado no ajuste por instruções e otimizado por preferências no final.",
 n:"Essencial: muitas decisões de engenharia (prompt ou fine-tuning? LoRA ou treino completo?) moram aqui.",
 m:"Paradigma e etapa são eixos diferentes. O aprendizado supervisionado, por exemplo, pode ser usado tanto no pré-treinamento quanto no fine-tuning."},

paradigms: {l:"Paradigmas de aprendizado", f:"Learning paradigms",
 p:"O tipo de retorno com que um modelo aprende.",
 t:"Supervisionado: as respostas certas são dadas. Não supervisionado: achar estrutura sem respostas. Auto-supervisionado: criar as respostas a partir dos próprios dados. Por reforço: aprender com recompensas por ações.",
 w:"Filtro de spam (supervisionado), segmentos de clientes (não supervisionado), pré-treinamento do GPT (auto-supervisionado), agentes de jogos (reforço).",
 n:"O aprendizado auto-supervisionado é o que tornou possíveis os modelos de fundação: sem rotulagem humana, em escala de internet."},

sup: {l:"Aprendizado supervisionado", f:"Supervised learning",
 p:"Aprender com exemplos que já vêm com a resposta certa, como estudar com flashcards.",
 t:"Minimizar a diferença entre previsões e rótulos (entropia cruzada para classes, erro quadrático para números). A qualidade depende muito de quão bons e completos são os rótulos.",
 h:"O cenário padrão do machine learning aplicado por décadas; o ImageNet (2009) foi um conjunto de dados rotulado histórico.",
 w:"Casos de fraude rotulados, tickets de suporte classificados, raios-X anotados por radiologistas.",
 n:"Essencial: o ajuste por instruções de LLMs é aprendizado supervisionado com conversas de exemplo."},

unsup: {l:"Aprendizado não supervisionado", f:"Unsupervised learning",
 p:"Aprender com dados sem respostas: achar grupos, padrões ou uma descrição compacta.",
 t:"Clustering (k-means), redução de dimensionalidade (PCA, UMAP), estimativa de densidade e detecção de anomalias.",
 w:"Segmentação de clientes, detecção de tráfego de rede incomum, plotar embeddings em 2D.",
 n:"Muito usado, principalmente para explorar dados e embeddings."},

selfsup: {l:"Aprendizado auto-supervisionado", f:"Self-supervised learning",
 p:"Os dados fornecem as próprias respostas: esconda uma parte e aprenda a prever a parte escondida.",
 t:"Tecnicamente é treino supervisionado, mas os rótulos são gerados automaticamente a partir de dados brutos, o que escala para trilhões de tokens sem rotulagem humana.",
 h:"O word2vec (2013) foi um exemplo pioneiro; BERT e GPT (2018) tornaram o método padrão em linguagem.",
 w:"O pré-treinamento de todo LLM moderno, do CLIP e da maioria dos codificadores de imagem.",
 n:"Essencial: a razão de existirem modelos de fundação.",
 m:"Auto-supervisionado não quer dizer que o modelo aprende sozinho, sem orientação. Pessoas definem o objetivo; só os rótulos vêm de graça."},

ntp: {l:"Pré-treino por próximo token", f:"Next-token pretraining",
 p:"Ler texto e prever cada próximo token. Cada frase vira milhares de exercícios gratuitos.",
 t:"Modelagem de linguagem causal: maximizar a probabilidade de cada token dados todos os anteriores, com atenção causal para o modelo não espiar o futuro.",
 h:"GPT-1 (2018) e sucessores.",
 w:"É assim que os modelos GPT, Llama e Qwen são pré-treinados.",
 n:"Essencial.",
 m:"Treinar com previsão do próximo token e gerar de forma autorregressiva estão ligados, mas são coisas diferentes: um é o objetivo de aprendizado, o outro é como o texto é produzido depois."},

mlm: {l:"Pré-treino por token mascarado", f:"Masked-token pretraining",
 p:"Esconder algumas palavras e aprender a completá-las usando o contexto dos dois lados.",
 t:"O BERT mascara cerca de 15% dos tokens e os prevê. Isso gera representações bidirecionais fortes, mas não ensina o modelo a escrever diretamente.",
 h:"BERT, 2018.",
 w:"BERT, RoBERTa e muitos modelos de embedding.",
 n:"Muito usado em modelos encoder."},

contrastive: {l:"Aprendizado contrastivo", f:"Contrastive learning",
 p:"Aprender por comparação: aproximar pares que combinam e afastar pares que não combinam.",
 t:"Dado um lote de pares (uma imagem e sua legenda, dois recortes da mesma foto, uma pergunta e sua resposta), treinar codificadores para que pares verdadeiros tenham alta similaridade e todas as outras combinações baixa, normalmente com uma perda InfoNCE.",
 h:"SimCLR (2020) para imagens; o CLIP da OpenAI (2021), treinado com 400 milhões de pares imagem-texto.",
 w:"Buscar fotos digitando uma descrição; a maioria dos modelos de embedding de texto usados em RAG.",
 n:"Essencial para busca e modelos multimodais."},

rl: {l:"Aprendizado por reforço", f:"Reinforcement Learning (RL)",
 p:"Aprender por tentativa e erro: tentar ações, receber recompensas ou penalidades e repetir o que funciona.",
 t:"Um agente aprende uma política que maximiza a recompensa de longo prazo, com métodos como Q-learning, policy gradients e PPO, muitas vezes com redes profundas.",
 h:"Sutton e Barto lançaram as bases nos anos 1980 e 1990; a DQN da DeepMind aprendeu jogos de Atari a partir dos pixels (2013–2015).",
 w:"Controle de robôs, agentes de jogos, estratégias de lances em anúncios.",
 n:"Central no pós-treinamento de LLMs: o RLHF tornou os modelos de chat úteis, e RL com recompensas verificáveis treina modelos de raciocínio."},

rlloop: {l:"Agente, ambiente, recompensa", f:"Agent, environment, reward",
 p:"O esquema do RL: um agente age, o ambiente muda e devolve uma recompensa, e o ciclo se repete.",
 t:"Formalizado como um processo de decisão de Markov: estados, ações, transições, recompensas e um fator de desconto. O agente aprende uma política (o que fazer) e muitas vezes uma função de valor (quão bom é um estado).",
 w:"Um braço robótico (agente) num armazém (ambiente) ganha uma recompensa a cada item que pega.",
 n:"Vocabulário essencial, também usado para descrever agentes com LLM e fine-tuning por RL."},

rlalgos: {l:"Q-learning / DQN / PPO",
 p:"Três algoritmos marcantes de RL: aprender o valor das ações (Q-learning), fazer isso com uma rede profunda (DQN) ou melhorar a política diretamente (PPO).",
 t:"O Q-learning atualiza uma tabela de valores de ação a partir da experiência. A DQN troca a tabela por uma rede neural, com replay buffer e rede alvo. O PPO é um método de policy gradient que limita cada atualização para ganhar estabilidade.",
 h:"Q-learning (Watkins, 1989), DQN (DeepMind, 2013–2015), PPO (OpenAI, 2017).",
 w:"O PPO foi o algoritmo de RL do RLHF no estilo InstructGPT.",
 n:"O PPO e seus parentes seguem como cavalos de batalha em robótica, jogos e pós-treinamento de LLMs."},

stages: {l:"Treinamento e adaptação", f:"Training & adaptation",
 p:"As etapas pelas quais um modelo passa, do pré-treinamento bruto a um assistente ajustado para a sua tarefa.",
 t:"O pré-treinamento constrói a capacidade geral; o fine-tuning a adapta; o alinhamento molda o comportamento; destilação e métodos eficientes em parâmetros barateiam a adaptação.",
 w:"Modelo base → modelo ajustado por instruções → modelo de chat alinhado por preferências → a sua LoRA para e-mails jurídicos.",
 n:"Essencial: “prompting, RAG ou fine-tuning?” é uma pergunta diária na engenharia de IA."},

pretrain: {l:"Pré-treinamento", f:"Pretraining",
 p:"A primeira etapa, longa e cara: aprender os padrões gerais da linguagem (ou das imagens) com um conjunto de dados enorme.",
 t:"Treino auto-supervisionado com trilhões de tokens em milhares de GPUs por semanas ou meses. Produz um modelo base que continua textos, mas não segue instruções de forma confiável.",
 h:"Estudos de escala de Kaplan e colegas (2020) e o Chinchilla (2022) mostraram como tamanho do modelo e volume de dados devem crescer juntos.",
 w:"Checkpoints base de modelos abertos são publicados para que outros façam fine-tuning.",
 n:"Essencial, mas poucas organizações pré-treinam modelos de fronteira; a maioria dos engenheiros parte de modelos pré-treinados."},

finetune: {l:"Fine-tuning", f:"Ajuste fino",
 p:"Pegar um modelo pré-treinado e continuar treinando com um conjunto menor e focado, para que ele fique bom na sua tarefa.",
 t:"Normalmente supervisionado com pares de entrada e saída, com taxa de aprendizado pequena. O fine-tuning completo atualiza todos os pesos; métodos eficientes em parâmetros treinam um pequeno complemento.",
 h:"Transferência de aprendizado com modelos do ImageNet (a partir de 2014, aproximadamente), depois ULMFiT e BERT (2018) em linguagem.",
 w:"Um classificador de tickets ajustado a partir do BERT; um modelo ajustado para escrever no formato de relatório de uma empresa.",
 n:"Essencial, embora prompting melhor e RAG muitas vezes resolvam o problema antes, e mais barato.",
 m:"Fine-tuning serve principalmente para comportamento, estilo e formato. É um jeito ruim de adicionar fatos que mudam com frequência; isso é trabalho do RAG."},

instruct: {l:"Ajuste por instruções", f:"Instruction tuning",
 p:"Fine-tuning com exemplos de instruções e boas respostas, para que um modelo base aprenda a atender pedidos.",
 t:"Supervised fine-tuning (SFT, ajuste fino supervisionado) com pares instrução-resposta, de milhares a milhões deles, escritos por pessoas ou gerados e filtrados com outros modelos.",
 h:"FLAN (Google, 2021) e InstructGPT (OpenAI, 2022).",
 w:"A diferença entre um modelo base que divaga e um modelo de chat que responde à sua pergunta.",
 n:"Essencial: etapa padrão de todo modelo de chat."},

peft: {l:"LoRA / QLoRA", f:"Parameter-efficient fine-tuning (PEFT, ajuste eficiente em parâmetros) com Low-Rank Adaptation (adaptação de baixo posto)",
 p:"Fazer fine-tuning de um modelo grande gastando pouco, treinando um pequeno complemento em vez de todos os pesos.",
 t:"A LoRA congela os pesos originais e aprende duas matrizes pequenas de baixo posto por camada, cujo produto é somado aos pesos. A QLoRA faz isso sobre um modelo base quantizado em 4 bits, de modo que modelos grandes cabem numa única GPU.",
 h:"LoRA (Microsoft, 2021); QLoRA (2023).",
 w:"Equipes mantêm um modelo base e trocam pequenos adaptadores LoRA por cliente ou tarefa; LoRAs de modelos de imagem ensinam um estilo específico.",
 n:"Essencial: a forma padrão de fazer fine-tuning de modelos abertos."},

rlhf: {l:"RLHF para LLMs", f:"Reinforcement Learning from Human Feedback (aprendizado por reforço com feedback humano)",
 p:"Usar as preferências humanas como recompensa, para que um LLM bruto vire um assistente útil e seguro.",
 t:"Coletar comparações humanas entre respostas, treinar um modelo de recompensa e depois otimizar o LLM com um algoritmo de RL como o PPO. Métodos mais novos recompensam resultados verificáveis, como passar em testes ou acertar contas.",
 h:"O InstructGPT (OpenAI, 2022) mostrou que um modelo de 1,3 bilhão de parâmetros com RLHF era preferido ao GPT-3 de 175 bilhões.",
 w:"Todo grande assistente de chat passa por alguma forma de otimização por preferências no pós-treinamento.",
 n:"Explica boa parte do comportamento dos assistentes, inclusive por que recusam, ficam em cima do muro ou bajulam."},

dpo: {l:"DPO", f:"Direct Preference Optimization (otimização direta de preferências)",
 p:"Ensinar um modelo diretamente com pares do tipo “a resposta A é melhor que a B”, sem treinar um modelo de recompensa separado.",
 t:"Reescreve o objetivo do RLHF como uma perda simples, parecida com classificação, sobre pares de preferência, medida contra um modelo de referência congelado. Funciona offline: sem ciclo de amostragem e sem algoritmo de RL.",
 h:"Rafailov e colegas, 2023.",
 w:"Muito usado para alinhar modelos abertos por ser mais simples e barato que o RLHF com PPO.",
 n:"Essencial, ao lado de variantes mais novas e de RL com recompensas verificáveis.",
 m:"O DPO costuma ser agrupado com o RLHF, mas não é aprendizado por reforço online: ele aprende com um conjunto fixo de pares de preferência."},

distill: {l:"Destilação de conhecimento", f:"Knowledge distillation",
 p:"Um modelo “professor” grande treina um “aluno” pequeno para imitá-lo.",
 t:"O aluno aprende com as probabilidades de saída do professor (rótulos suaves) ou com dados que o professor gera, mantendo boa parte da qualidade com uma fração do tamanho.",
 h:"Hinton, Vinyals e Dean, 2015. O DistilBERT (2019) manteve cerca de 97% da compreensão de linguagem do BERT sendo 40% menor.",
 w:"Modelos pequenos treinados com saídas de modelos maiores, como modelos de raciocínio destilados.",
 n:"Essencial: uma das principais fontes de modelos pequenos fortes."},

pred: {l:"Preditivo / analítico", f:"Predictive / analytical tasks",
 p:"Olhar para dados existentes e responder uma pergunta sobre eles: qual categoria, quanto, onde, quão relevante.",

 h:"A espinha dorsal do machine learning aplicado desde os anos 1990.",
 w:"Detecção de fraude, triagem de imagens médicas, ranqueamento de buscas.",
 n:"Ainda é a maior parte do ML em produção, e LLMs passaram a ser usados como classificadores zero-shot.",
 m:"Preditivo e discriminativo não são sinônimos. Discriminativo descreve um tipo de modelo (que aprende rótulos a partir das entradas); preditivo descreve o trabalho. Um modelo generativo também pode ser usado para prever."},

cls: {l:"Classificação", f:"Classification",

spam: {l:"Detecção de spam / BERT", f:"Spam detection",

reg: {l:"Regressão / previsão", f:"Regression / forecasting",

rerank: {l:"Ranqueamento de busca e rerankers", f:"Search ranking & rerankers",

gen: {l:"Generativo", f:"Generative",

textcode: {l:"Texto e código", f:"Text & code",

gptex: {l:"GPT / Llama / T5",

images: {l:"Imagens", f:"Images",

control: {l:"Decisão / controle", f:"Decision making / control",

 t:"Released on Hugging Face under licences such as MIT, Apache 2.0 or custom terms. You can self-host for privacy, fine-tune, distil or quantize them, or use them through any inference provider. In 2026 the strongest open models come mostly from Chinese labs (DeepSeek, Moonshot, Alibaba, Zhipu), with Mistral in Europe, and Google and OpenAI releasing smaller ones.",
 h:"BERT (2018) and GPT-2 (2019) had open weights; Llama and Mixtral (2023) started the open LLM wave; DeepSeek-R1 (January 2025) shook the markets.",
 w:"A hospital fine-tuning an open model on its own servers so patient data never leaves the building.",
 n:"Typically a few months behind the closed frontier, and much cheaper per token.",
 m:"Downloadable doesn’t mean easy to run: Kimi K3 is open, but its 2.8 trillion parameters need a large GPU cluster. Most people use big open models through a hosted API anyway.",
 k:"Like a recipe printed in a cookbook: you can cook it at home, change the spices and serve it in your own restaurant, but you still need a big enough kitchen."},
openvs: {l:"Open weights vs open source", s:"core",
 p:"“Open source AI” on X usually means open weights. Truly open source would also share the training data and code.",
 t:"Open weights: the final parameters can be downloaded, usually with inference code. Fully open: weights, training code and training data are all released so others can reproduce the model, as with AI2’s OLMo. Licences matter too: MIT and Apache 2.0 are permissive, while others restrict commercial use or very large companies.",
 w:"DeepSeek V4’s weights are MIT-licensed, but its training data is not public.",
 n:"Core vocabulary for anyone choosing models for a company.",
 m:"An open-weight model isn’t open source in the strict software sense, because you can’t rebuild it from its sources.",
 k:"Open weights is getting a finished cake with permission to slice and decorate it. Open source is getting the cake, the recipe and the list of where every ingredient came from."},
odeepseek: {l:"DeepSeek V4", s:"core",
 p:"The Chinese lab whose cheap, strong open models made headlines in 2025. DeepSeek is also the name of its chat app.",
 t:"DeepSeek V4 Pro is a Mixture-of-Experts model with about 1.6 trillion total and 49 billion active parameters, a one-million-token context and MIT-licensed weights. A smaller Flash line updates more often (V4.1 Flash in September 2026).",
 h:"DeepSeek-V3 (December 2024) and R1 (January 2025) showed frontier-level reasoning at a fraction of the usual cost. V4 was previewed in April 2026 and became generally available in August.",
 w:"Companies run V4 on their own GPUs, or call it through DeepSeek’s API or gateways such as OpenRouter at a fraction of closed-model prices.",
 n:"Among the strongest open models, within months of the closed frontier.",
 m:"The DeepSeek app is a product that uses the model, and the API is billed per token like any other. You don’t need the app to use the model, and the app sends your data to DeepSeek’s servers, which its privacy policy places in China.",
 k:"Like a famous chef who publishes every recipe for free and also runs a restaurant: you can eat at their place, or take the recipe to any other kitchen."},

geminiapp: {l:"Gemini app", s:"core",
 p:"Google’s chat app, which shares its name with Google’s model family.",

deepseekapp: {l:"DeepSeek app", s:"core",

harness: {l:"Agent harnesses", s:"core",
 p:"Software that straps tools onto a model so it can do real work: read files, run commands, browse, test and fix.",
 t:"A harness runs the agent loop: it sends the model your request plus context, executes the tool calls it asks for (with permissions and sandboxing), feeds the results back, manages the context as it fills up, and shows progress. The same model can perform very differently in different harnesses.",
 w:"Claude Code, Codex, Google Antigravity, Cursor, OpenCode.",
 n:"Core: in 2026 the harness matters as much as the model for a coding agent’s quality.",
 m:"A harness is not a model. Agent benchmark scores depend on the harness used, so compare like with like.",
 k:"A model is a brilliant brain in a jar. A harness gives it hands, eyes and a toolbox, plus rules about what it’s allowed to touch."},
claudecode: {l:"Claude Code", s:"core",
 p:"Anthropic’s coding agent: you describe a task and Claude works in your project, editing files and running commands.",
 t:"Runs in the terminal, IDEs, the desktop and mobile apps and the web, using Claude models. It reads the codebase, plans, edits, runs tests, uses MCP servers and skills, and asks permission before risky actions. Developers can build on the same agent loop with the Claude Agent SDK.",

 w:"“Add pagination to this API and update the tests”; fixing a failing CI build; migrating a codebase.",

 k:"Like hiring a contractor who works inside your house: you say what you want, they use your tools, and they check with you before knocking down a wall."},
codex: {l:"Codex (CLI & app)", s:"core",
 p:"OpenAI’s coding agent, available in the terminal, IDEs, the cloud and a desktop app.",
 t:"The Codex CLI is open source. The Codex app (macOS in February 2026, Windows in March) is a command centre for running several agents in parallel, each in its own thread, with sandboxing and skills. It uses OpenAI models such as GPT-6 and is included in ChatGPT plans.",
 h:"The name first belonged to OpenAI’s 2021 code model behind GitHub Copilot and was reused for the agent in 2025.",

 n:"A leading coding agent.",
 m:"Codex today is a harness, not the 2021 Codex model: same name, different thing.",

antigravity: {l:"Google Antigravity", s:"core",
 p:"Google’s agent-first coding environment, built around Gemini models.",
 t:"An IDE-style app where agents plan and carry out tasks across the editor, terminal and browser, reporting back with artifacts such as plans and screenshots. In November 2026 it previewed /swarm, which turns one prompt into a team of coordinated agents.",
 h:"Launched in November 2025 alongside Gemini 3.",
 w:"Asking an agent to build a feature and test it in a real browser while you review its plan.",
 n:"Google’s main coding-agent product; Gemini 4 Carbon is available in it for AI Ultra subscribers.",
 k:"Like a building site where you’re the architect: the agents are the crew, and they bring you photos and progress reports."},
t3code: {l:"T3 Code", s:"core",
 p:"A “harness of harnesses”: one app that drives the coding agents you already have, side by side.",
 t:"Open source (MIT) from Theo Browne’s team. It has no model of its own and resells no access: it starts Claude Code, Codex, Cursor, OpenCode, Grok Build or Antigravity using your own logins, and shows all their sessions in one desktop, web or phone interface, with a git branch per task and a button to open a pull request.",
 h:"Launched in March 2026; it passed 20,000 GitHub stars by late August.",
 w:"Giving the same task to Claude Code and Codex, comparing the results and merging the better one.",
 n:"A popular example of the orchestration layer above harnesses.",
 m:"T3 Code doesn’t make models smarter or cheaper; you still need each underlying agent and its subscription.",

access: {l:"Gateways & hosting", s:"core",
 p:"Ways to reach models without signing up with each company separately, or to run them yourself.",
 t:"Gateways offer one API for hundreds of models. Inference providers host open models on their GPUs. Cloud platforms sell closed and open models inside your existing cloud account. Local tools run open models on your own computer.",
 w:"A startup trying five models through one gateway before committing to one.",
 n:"Core for AI engineers: this layer decides price, latency, privacy and lock-in.",
 k:"Like getting electricity: straight from one power company, through a supplier that buys from many, or from solar panels on your own roof."},
openrouter: {l:"OpenRouter", s:"core",

 w:"A developer switching a prototype from Claude to DeepSeek by changing one model string.",
 n:"Widely used for prototyping and comparing models; its public usage rankings are often shared on X.",
 m:"A gateway adds convenience, not intelligence: the answer still comes from the underlying model and host, and their data policies apply too.",
 k:"Like a flight comparison site: one search shows many airlines, but the plane is still flown by the airline you pick."},
hosts: {l:"Inference providers & clouds", s:"core",
 p:"Companies that run models on their GPUs and rent you the answers.",
 t:"Specialist hosts (Together AI, Fireworks, Groq, DeepInfra and others) serve open models quickly and cheaply. The big clouds (Amazon Bedrock, Google Cloud Vertex AI, Microsoft Foundry) sell partners’ closed models and open ones, with enterprise contracts, regions and security controls.",
 w:"A company already on AWS uses Claude through Bedrock so its data stays under existing agreements.",
 n:"Core infrastructure of the AI industry.",
 m:"The same open model can differ in speed, price and even quality between hosts, because of quantization and serving settings.",
 k:"Like bakeries all using the same published recipe: some are faster, some cheaper, and some go light on the butter."},
local: {l:"Ollama / LM Studio", s:"core",
 p:"Free apps that download and run open models on your own computer.",

 w:"Running Gemma 4 or a small Qwen offline on a laptop to process private notes.",

 k:"Like downloading a film to watch on a plane: no internet needed, but it has to fit on your device."},
buzz: {l:"Buzzwords decoded", s:"core",
 p:"Terms you’ll see on X and in AI news, translated into plain words.",
 t:"Many buzzwords are new names for ideas found elsewhere on this map; each of these nodes links back to the underlying concept.",
 w:"“Vibe coding”, “thinking models”, “context engineering”, “skills”, “SOTA on SWE-bench”.",
 n:"Useful for following the conversation without getting lost.",
 k:"Like a phrasebook for travellers: it won’t teach you the whole language, but it gets you through the conversation."},
vibe: {l:"Vibe coding", s:"core",
 p:"Building software by describing what you want in plain language and letting an AI write the code, often without reading it closely.",
 t:"Coined by Andrej Karpathy in February 2025. Fine for prototypes and personal tools; for production, engineers still review, test and take responsibility for the code, which some call agentic engineering to mark the difference.",
 w:"A designer building a working prototype app in one afternoon with a coding agent.",
 n:"A mainstream practice, and an ongoing debate about quality and security.",
 m:"Vibe coding doesn’t remove the need to understand code: someone still has to judge whether it is correct and safe.",
 k:"Like telling a builder “make it cosy” and moving in without checking the wiring: lovely for a treehouse, risky for a hospital."},
reasoning: {l:"Reasoning models", f:"Thinking models", s:"core",
 p:"Models that “think” through hidden steps before answering, trading time for accuracy on hard problems.",
 t:"Trained with reinforcement learning on tasks with checkable answers (math, code) to produce long internal chains of thought. Most providers let you choose the reasoning effort; more thinking costs more tokens and time.",
 h:"OpenAI’s o1 (September 2024) and DeepSeek-R1 (January 2025) popularized them; by 2026 most frontier models think by default or on request.",
 w:"Choosing high effort for a tricky bug and low effort for a quick summary.",
 n:"Core: thinking is now a setting on most frontier models.",
 m:"The visible “thinking” summary is not a perfect window into how the model actually reached its answer.",
 k:"Like a student who works the problem out on scrap paper before writing the final answer: slower, but fewer silly mistakes."},
ctxeng: {l:"Context engineering", s:"core",
 p:"Deciding exactly what information goes into the model’s context window, and what stays out.",
 t:"Goes beyond writing a good prompt: choosing which documents to retrieve, which tool results to keep, when to summarize history, how to describe tools and how to give an agent memory, all within a limited token budget.",
 w:"An agent that keeps a running notes file instead of stuffing the whole conversation into every call.",
 n:"A core skill for engineers building agents.",
 k:"Like packing a small suitcase: you can’t bring everything, so what you choose decides how the trip goes."},
skills: {l:"Agent skills", s:"core",
 p:"Reusable folders of instructions, scripts and examples that teach an agent how to do one kind of task.",
 t:"A skill is usually a SKILL.md file plus resources. The agent sees a short description of every skill and loads the full instructions only when relevant, which saves context. Introduced by Anthropic and published as an open standard; OpenAI’s Codex uses the same format.",
 w:"A skill that teaches an agent your team’s way of writing release notes, or how to create a PowerPoint file properly.",
 n:"Widely adopted across agent tools in 2026.",
 k:"Like recipe cards in a kitchen drawer: the cook doesn’t memorize every recipe, but pulls out the right card when a dish is ordered."},
bench: {l:"Benchmarks & leaderboards", s:"core",
 p:"Standard tests and public rankings used to compare models, and argued about endlessly on X.",
 t:"Benchmarks are fixed test sets: SWE-bench for coding, GPQA for hard science questions, Terminal-Bench for agent tasks. Leaderboards include LMArena, where people vote between two anonymous answers, and Artificial Analysis, which combines many tests with price and speed.",
 w:"A lab announcing a model with a table of scores; developers checking whether it actually helps on their own tasks.",
 n:"Useful signals, but labs tune for popular benchmarks and agent results depend on the harness.",
 m:"“SOTA” (state of the art) on one benchmark doesn’t mean best for your use case; always test on your own data.",
 k:"Like school exams: a top grade is a good sign, but it doesn’t guarantee someone will be great at the actual job."},
codenames: {l:"Codenames & versions", s:"core",
 p:"Why model names are so confusing: internal codenames, marketing names, version numbers and API IDs.",
 t:"Labs test many checkpoints under codenames, and some names leak before launch. A launched model can have a public name (Gemini 4 Carbon), an API ID (gemini-4-carbon), dated snapshots and tiers such as Pro, Flash, Mini or Luna. The same marketing name can also point to a newer model later.",
 h:"GPT-5.5 was codenamed “Spud”, Mistral Large 4 is nicknamed “Le Chonk”, and Gemini 4 checkpoints were called Argon, Barium and Carbon.",
 w:"Pinning a dated model ID in production so your app doesn’t change behavior overnight.",
 n:"A core practical habit: always check the exact model ID you are calling.",
 m:"A codename doesn’t guarantee the public name: Google’s public Argon was internally called Barium-B, while Carbon kept its codename at launch.",
 k:"Like a film’s working title during shooting, then its release title, then the director’s cut and the extended edition."}

oclaude: {l:"Claude (Anthropic)",
 p:"A família de modelos da Anthropic, conhecida por programação, tarefas agênticas longas e escrita cuidadosa.",
 t:"Modelos públicos atuais: Claude Opus 5.5 para trabalho complexo, Sonnet 5.5 como opção equilibrada e Haiku 5.5 para velocidade e custo baixo, além do Claude Fable 5.2, no nível superior Mythos, com medidas extras de segurança. O Claude Mythos 5.2, o mesmo modelo de base sem essas medidas, está disponível apenas para organizações aprovadas. Detalhes de arquitetura não são publicados.",
 h:"Claude 1 (2023), a família Claude 3 (2024), Claude 4 (2025) e a geração 5.x em 2026.",
 w:"Os mesmos modelos rodam nos apps Claude, no Claude Code e no Cowork, em muitas ferramentas de terceiros como o Cursor e nas grandes plataformas de nuvem.",
 n:"Uma família de fronteira, especialmente forte em programação agêntica.",
 m:"“Claude” é ao mesmo tempo a família de modelos e o nome do app; o Claude Code é um harness separado que usa os mesmos modelos.",
 k:"Como cozinheiros formados na mesma escola: o Haiku é o cozinheiro rápido da linha, o Sonnet o chef confiável, o Opus o grande chef que você contrata para um banquete de casamento."},
ogemini: {l:"Gemini 4 (Google)",
 p:"A família de modelos do Google. “Gemini” também é o nome do app de chat do Google, e é aí que começa a confusão.",
 t:"O Gemini 4 Argon foi anunciado em 30 de setembro de 2026 como o modelo público de fronteira do Google. Depois veio o Gemini 4 Carbon: mostrado a um grupo de defensores de cibersegurança em 28 de outubro e liberado para desenvolvedores pagantes e assinantes do AI Ultra em 10 de novembro de 2026, como o modelo mais forte do Google para trabalhos longos e de várias etapas. Os modelos Flash e Flash-Lite, mais leves, cobrem tarefas rápidas e baratas. A família é nativamente multimodal.",
 h:"O Bard (2023) virou Gemini em fevereiro de 2024, seguido pelos Gemini 1.5, 2, 2.5, 3 (novembro de 2025) e 4 (2026).",
 w:"No seletor de modelos do app Gemini, o Argon aparece como “Código e análise” e o Carbon como “Trabalho mais complexo”; desenvolvedores chamam gemini-4-carbon na API.",
 n:"Uma das principais famílias de modelos em novembro de 2026.",
 m:"Argon, Barium e Carbon começaram como codinomes internos de checkpoints do Gemini 4. Argon e Carbon viraram nomes públicos, mas um codinome nem sempre sobrevive: o modelo lançado como Argon se chamava Barium-B internamente.",
 k:"Gemini é como a palavra “Nike”: é a marca na fachada da loja e também o nome impresso no tênis. Argon e Carbon são dois modelos de tênis diferentes da mesma coleção de 2026."},
ogrok: {l:"Grok (xAI)",
 p:"A família de modelos da xAI, empresa de IA de Elon Musk que agora faz parte da SpaceX, integrada ao X e ao app Grok.",
 t:"Os modelos Grok 4.x saíram mais ou menos uma vez por mês em 2026 (Grok 4.6 em agosto, com atualizações depois), com janelas de contexto muito longas e foco em programação agêntica pelas ferramentas da própria xAI. A maior parte dos detalhes de arquitetura não é publicada; o antigo Grok-1 teve pesos abertos.",
 h:"Grok-1 (2023, pesos abertos em 2024), Grok 3 (fevereiro de 2025), Grok 4 (julho de 2025). A SpaceX comprou a xAI em fevereiro de 2026.",
 w:"Responder perguntas dentro do X, programar com o Grok Build e acesso pela API e por gateways como o OpenRouter.",
 n:"Um concorrente de fronteira com lançamentos muito frequentes.",
 k:"Como um time de futebol que passou a pertencer a um clube maior: o Grok joga pela xAI, a xAI está dentro da SpaceX, e o X é o estádio onde a maioria dos torcedores assiste."},
open: {l:"Modelos de pesos abertos", f:"Open-weight models",
 p:"Modelos cujos pesos treinados você pode baixar, rodar nas suas máquinas e ajustar com fine-tuning.",
 t:"Publicados no Hugging Face sob licenças como MIT, Apache 2.0 ou termos próprios. Dá para hospedar por conta própria por privacidade, fazer fine-tuning, destilar ou quantizar, ou usá-los por qualquer provedor de inferência. Em 2026, os modelos abertos mais fortes vêm principalmente de laboratórios chineses (DeepSeek, Moonshot, Alibaba, Zhipu), com a Mistral na Europa e Google e OpenAI lançando modelos menores.",
 h:"BERT (2018) e GPT-2 (2019) tiveram pesos abertos; Llama e Mixtral (2023) iniciaram a onda de LLMs abertos; o DeepSeek-R1 (janeiro de 2025) abalou os mercados.",
 w:"Um hospital fazendo fine-tuning de um modelo aberto nos próprios servidores, para que os dados dos pacientes nunca saiam do prédio.",
 n:"Normalmente alguns meses atrás da fronteira fechada, e bem mais baratos por token.",
 m:"Poder baixar não significa conseguir rodar: o Kimi K3 é aberto, mas seus 2,8 trilhões de parâmetros exigem um grande cluster de GPUs. A maioria das pessoas usa modelos abertos grandes por uma API hospedada mesmo assim.",
 k:"Como uma receita publicada num livro de culinária: você cozinha em casa, muda os temperos e serve no seu próprio restaurante, mas ainda precisa de uma cozinha grande o bastante."},
openvs: {l:"Pesos abertos vs código aberto", f:"Open weights vs open source",
 p:"“IA open source” no X quase sempre significa pesos abertos. Código aberto de verdade também compartilharia os dados e o código de treino.",
 t:"Pesos abertos: os parâmetros finais podem ser baixados, normalmente com o código de inferência. Totalmente aberto: pesos, código de treino e dados de treino são publicados para que outros reproduzam o modelo, como no OLMo, do AI2. As licenças também importam: MIT e Apache 2.0 são permissivas, enquanto outras restringem uso comercial ou empresas muito grandes.",
 w:"Os pesos do DeepSeek V4 têm licença MIT, mas os dados de treino não são públicos.",
 n:"Vocabulário essencial para quem escolhe modelos para uma empresa.",
 m:"Um modelo de pesos abertos não é open source no sentido estrito do software, porque não dá para reconstruí-lo a partir das fontes.",
 k:"Pesos abertos é ganhar um bolo pronto com permissão para fatiar e decorar. Código aberto é ganhar o bolo, a receita e a lista de onde veio cada ingrediente."},
odeepseek: {l:"DeepSeek V4",
 p:"O laboratório chinês cujos modelos abertos, baratos e fortes viraram manchete em 2025. DeepSeek também é o nome do app de chat dele.",
 t:"O DeepSeek V4 Pro é um modelo Mixture of Experts com cerca de 1,6 trilhão de parâmetros no total e 49 bilhões ativos, contexto de um milhão de tokens e pesos com licença MIT. Uma linha Flash, menor, é atualizada com mais frequência (V4.1 Flash em setembro de 2026).",
 h:"O DeepSeek-V3 (dezembro de 2024) e o R1 (janeiro de 2025) mostraram raciocínio de nível de fronteira por uma fração do custo habitual. O V4 foi apresentado em abril de 2026 e ficou disponível para todos em agosto.",
 w:"Empresas rodam o V4 nas próprias GPUs, ou o chamam pela API da DeepSeek ou por gateways como o OpenRouter, por uma fração do preço dos modelos fechados.",
 n:"Entre os modelos abertos mais fortes, a poucos meses da fronteira fechada.",
 m:"O app DeepSeek é um produto que usa o modelo, e a API é cobrada por token como qualquer outra. Você não precisa do app para usar o modelo, e o app envia seus dados aos servidores da DeepSeek, que a política de privacidade localiza na China.",
 k:"Como um chef famoso que publica todas as receitas de graça e também tem um restaurante: você pode comer lá, ou levar a receita para qualquer outra cozinha."},
oqwen: {l:"Qwen 3.8 (Alibaba)",
 p:"A família de modelos da Alibaba, em vários tamanhos, do minúsculo ao gigante, a maioria com pesos abertos.",
 t:"O Qwen3.8-Max (agosto de 2026) é um MoE de 2,4 trilhões de parâmetros com cerca de 95 bilhões ativos, o primeiro Qwen da linha Max lançado com pesos abertos. Os Qwen pequenos estão entre as bases mais populares para fine-tuning.",
 h:"Lançado pela primeira vez em 2023; o Qwen virou uma das famílias abertas mais baixadas do Hugging Face.",
 w:"Startups fazem fine-tuning de Qwen pequenos para tarefas de clientes; a versão gigante é usada principalmente pela Alibaba Cloud e por outros provedores.",
 n:"Uma família aberta essencial, usada em todo lugar como base de fine-tuning.",
 k:"Como uma marca de roupa que vende todos os tamanhos, do PP ao XGG: você escolhe o que serve no seu hardware."},
okimi: {l:"Kimi K3 (Moonshot AI)",
 p:"O carro-chefe da Moonshot AI e o maior modelo de pesos abertos até agora.",
 t:"Um modelo Mixture of Experts de 2,8 trilhões de parâmetros, anunciado em 16 de julho de 2026, com os pesos completos liberados em 27 de julho. Focado em raciocínio e tarefas longas de programação; servi-lo exige dezenas de aceleradores.",
 h:"O Kimi K2 (julho de 2025) iniciou os lançamentos abertos da Moonshot, e o K2.5 veio em janeiro de 2026.",
 w:"Usado pelo Kimi.com, pelo Kimi Code, pela API da Moonshot e por provedores terceiros.",
 n:"No lançamento, ficou perto da fronteira fechada em vários benchmarks.",
 k:"Como uma biblioteca gigante doada ao público: qualquer pessoa pode usar, mas é preciso um prédio enorme para guardá-la."},
oglm: {l:"GLM-5.2 (Zhipu / Z.ai)",
 p:"O modelo aberto da Zhipu AI, vendido fora da China com a marca Z.ai e popular para programação.",
 t:"Um MoE de 744 bilhões de parâmetros com cerca de 40 bilhões ativos e contexto de um milhão de tokens, lançado com pesos abertos em junho de 2026.",
 w:"Planos de programação e agentes que querem bons resultados por um preço menor que o dos modelos fechados.",
 n:"Um dos principais modelos abertos de 2026, menor e mais barato de servir que o Kimi K3 ou o DeepSeek V4 Pro.",
 k:"Como um carro compacto quase tão rápido quanto um esportivo e bem mais barato de abastecer."},
omistral: {l:"Mistral Large 4 / Mixtral",
 p:"O laboratório de IA mais conhecido da Europa, de Paris. O Mixtral foi seu famoso modelo aberto inicial; o Mistral Large 4 é o carro-chefe de 2026.",
 t:"O Mixtral 8x7B (dezembro de 2023) popularizou os modelos abertos Mixture of Experts. O Mistral Large 4, apelidado de “Le Chonk”, é um MoE multimodal de um trilhão de parâmetros: prévia pública em 6 de outubro de 2026 e pesos abertos em 29 de outubro. A Mistral também vende modelos menores e especializados, e nem todos são abertos.",
 h:"Fundada em 2023 por ex-pesquisadores do Google DeepMind e da Meta.",
 w:"Empresas europeias que precisam manter os dados na UE hospedam modelos Mistral por conta própria ou usam a nuvem da própria Mistral.",
 n:"A principal opção europeia de pesos abertos.",
 k:"Como uma montadora europeia que enfrenta gigantes americanas e chinesas entregando as plantas do projeto junto com os carros."},
ousopen: {l:"gpt-oss / Gemma 4",
 p:"Modelos de pesos abertos de laboratórios americanos que, no resto, mantêm seus melhores modelos fechados.",
 t:"O gpt-oss da OpenAI (agosto de 2025) saiu nos tamanhos 20B e 120B, com licença Apache 2.0. O Gemma 4 do Google (abril de 2026) é uma família de modelos pequenos e médios, também com Apache 2.0. Ambos foram feitos para rodar numa única GPU ou até num notebook.",
 w:"Rodar um assistente privado e offline num notebook com o Ollama.",
 n:"Escolhas populares para IA local e no próprio aparelho.",
 m:"Gemma não é Gemini: mesma empresa, mas o Gemma é a família pequena e aberta e o Gemini é a grande e fechada.",
 k:"Como uma grande rede de restaurantes que guarda segredo dos pratos principais, mas publica um livro de receitas caseiras mais simples."},
apps: {l:"Apps de chat", f:"Produtos para o consumidor",
 p:"Os apps que as pessoas realmente abrem: uma janela de chat mais conta, histórico, memória, arquivos, voz e assinatura.",
 t:"Cada app chama um ou mais modelos nos bastidores e acrescenta um system prompt, ferramentas (busca na web, execução de código, geração de imagens), camadas de segurança e uma interface. O provedor pode trocar o modelo por baixo sem mudar o nome do app.",
 w:"ChatGPT, o app Gemini, Claude, Le Chat e o app DeepSeek.",
 n:"Essencial para entender como a maioria das pessoas experimenta a IA.",
 m:"Dois apps que usam o mesmo modelo podem se comportar de forma diferente, porque têm system prompts, ferramentas e configurações diferentes.",
 k:"Como serviços de streaming: a Netflix é o app, os filmes vêm dos estúdios. O mesmo filme pode estar em vários serviços, e um serviço exibe filmes de muitos estúdios."},
chatgpt: {l:"ChatGPT",
 p:"O app de chat da OpenAI, o produto que popularizou a IA. Ele não é um modelo.",
 t:"O ChatGPT envia suas mensagens para modelos da OpenAI conforme o seu plano e as configurações: desde outubro de 2026, GPT-6 Sol nos planos pagos e GPT-6 Luna nos planos Free e Go. Por cima, acrescenta memória, busca na web, geração de imagens, análise de arquivos, voz, agentes e plugins.",
 h:"Lançado em 30 de novembro de 2022 com o GPT-3.5; em 2026 a OpenAI informou mais de um bilhão de usuários por semana.",
 w:"Escrever e-mails, estudar, analisar planilhas, planejar viagens.",
 n:"O app de IA mais usado do mundo.",
 m:"“O ChatGPT disse…” identifica o app, não o modelo: duas pessoas em planos diferentes podem estar falando com modelos diferentes.",
 k:"O ChatGPT é a vitrine da loja; o GPT-6 é a fábrica atrás dela. Quando a fábrica troca as máquinas, a loja mantém o mesmo nome na porta."},
geminiapp: {l:"App Gemini", f:"Gemini app",
 p:"O app de chat do Google, que tem o mesmo nome da família de modelos do Google.",
 t:"Disponível na web, no Android e no iOS, e integrado aos produtos do Google. O modelo que você recebe depende do plano: em novembro de 2026, Gemini 4 Argon a partir do Google AI Pro e Gemini 4 Carbon no AI Ultra.",
 h:"Lançado como Bard em 2023 e renomeado Gemini em fevereiro de 2024.",
 w:"Perguntar sobre uma foto, resumir um Google Doc, planejar com seu Gmail e sua Agenda.",
 n:"Um dos maiores apps de IA.",
 m:"Quando alguém disser “Gemini”, pergunte qual: o app, a família de modelos ou um modelo específico, como o Gemini 4 Carbon.",
 k:"Como uma padaria chamada “Padaria Gemini” que vende um bolo também chamado “Gemini”: o mesmo nome na placa e no bolo, mas um é a loja e o outro é o que ela vende."},
claudeapp: {l:"Apps Claude", f:"Claude apps",
 p:"Os apps da Anthropic na web, no desktop e no celular, onde você trabalha com os modelos Claude.",
 t:"Os apps acrescentam projetos, criação de arquivos, memória, conectores com outros serviços, artifacts e voz. O app desktop também traz recursos agênticos: o Cowork para trabalho de conhecimento e uma aba Code para o Claude Code.",
 w:"Revisar um contrato, criar uma pequena página interativa, delegar uma pesquisa.",
 n:"Um app importante para escrita, análise e programação.",
 k:"Como uma oficina em que o Claude é o artesão: o app fornece a bancada, as gavetas e as ferramentas elétricas."},
lechat: {l:"Le Chat (Mistral)",
 p:"O app de chat da Mistral e a alternativa europeia mais conhecida ao ChatGPT. O nome significa “o gato” em francês, um trocadilho com “chat”.",
 t:"Roda os próprios modelos da Mistral, com busca na web, tratamento de documentos, um modo Work para tarefas longas e planos corporativos focados em manter os dados na Europa.",
 w:"Empresas e órgãos públicos europeus que preferem um provedor da UE.",
 n:"O principal app de IA para consumidores da Europa.",
 k:"Como um banco europeu que oferece os mesmos serviços dos gigantes globais, mas mantém seu dinheiro dentro da UE."},
deepseekapp: {l:"App DeepSeek", f:"DeepSeek app",
 p:"O app de chat gratuito da DeepSeek, que é separado dos modelos abertos DeepSeek que você pode rodar por conta própria.",
 t:"Um app web e para celular que roda os modelos mais recentes da DeepSeek nos servidores da DeepSeek. Desenvolvedores usam a API, separada e cobrada por token, ou baixam os pesos abertos e hospedam onde quiserem.",
 h:"Em janeiro de 2025, depois do lançamento do R1, chegou a ser o app gratuito mais baixado da App Store dos EUA.",
 w:"Estudantes usando o app gratuito, enquanto uma empresa hospeda o mesmo modelo nos próprios servidores.",
 n:"Muito usado, embora alguns governos e empresas o restrinjam por preocupações com proteção de dados.",
 m:"“A DeepSeek é de graça” vale para o app e para baixar os pesos, mas não para rodar o modelo em escala: alguém sempre paga pelas GPUs.",
 k:"Como uma degustação grátis na feira: a amostra não custa nada, mas servir o prato para mil convidados exige pagar ingredientes e cozinha."},
harness: {l:"Harnesses de agentes", f:"Agent harnesses",
 p:"Software que prende ferramentas a um modelo para ele fazer trabalho de verdade: ler arquivos, rodar comandos, navegar, testar e corrigir.",
 t:"O harness executa o ciclo do agente: envia ao modelo o seu pedido com o contexto, executa as chamadas de ferramenta que ele pede (com permissões e sandbox), devolve os resultados, gerencia o contexto conforme ele enche e mostra o progresso. O mesmo modelo pode render muito diferente em harnesses diferentes.",
 w:"Claude Code, Codex, Google Antigravity, Cursor, OpenCode.",
 n:"Essencial: em 2026, o harness importa tanto quanto o modelo na qualidade de um agente de programação.",
 m:"Um harness não é um modelo. Notas de benchmarks de agentes dependem do harness usado, então compare coisas equivalentes.",
 k:"Um modelo é um cérebro brilhante num pote. O harness dá a ele mãos, olhos e uma caixa de ferramentas, além de regras sobre o que pode tocar."},
claudecode: {l:"Claude Code",
 p:"O agente de programação da Anthropic: você descreve uma tarefa e o Claude trabalha no seu projeto, editando arquivos e rodando comandos.",
 t:"Roda no terminal, em IDEs, nos apps desktop e celular e na web, usando modelos Claude. Lê o código, planeja, edita, roda testes, usa servidores MCP e skills, e pede permissão antes de ações arriscadas. Desenvolvedores podem construir sobre o mesmo ciclo de agente com o Claude Agent SDK.",
 h:"Apresentado como prévia de pesquisa em fevereiro de 2025, junto com o Claude 3.7 Sonnet.",
 w:"“Adicione paginação a esta API e atualize os testes”; corrigir um build de CI quebrado; migrar uma base de código.",
 n:"Um dos agentes de programação mais usados.",
 k:"Como contratar um empreiteiro que trabalha dentro da sua casa: você diz o que quer, ele usa suas ferramentas e confere com você antes de derrubar uma parede."},
codex: {l:"Codex (CLI e app)", f:"Codex (CLI & app)",
 p:"O agente de programação da OpenAI, disponível no terminal, em IDEs, na nuvem e num app desktop.",
 t:"O Codex CLI é open source. O app Codex (macOS em fevereiro de 2026, Windows em março) é uma central de comando para rodar vários agentes em paralelo, cada um na sua thread, com sandbox e skills. Usa modelos da OpenAI como o GPT-6 e está incluído nos planos do ChatGPT.",
 h:"O nome pertencia ao modelo de código da OpenAI de 2021, por trás do GitHub Copilot, e foi reaproveitado para o agente em 2025.",
 w:"Três agentes ao mesmo tempo: um corrigindo um bug, outro escrevendo documentação, outro revisando um pull request.",
 n:"Um dos principais agentes de programação.",
 m:"O Codex de hoje é um harness, não o modelo Codex de 2021: mesmo nome, coisas diferentes.",
 k:"Como uma torre de controle de tráfego aéreo para robôs programadores: cada robô voa a sua tarefa, e você acompanha todos numa só tela."},
antigravity: {l:"Google Antigravity",
 p:"O ambiente de programação do Google pensado primeiro para agentes, construído em volta dos modelos Gemini.",
 t:"Um app no estilo IDE em que agentes planejam e executam tarefas no editor, no terminal e no navegador, prestando contas com artifacts como planos e capturas de tela. Em novembro de 2026 apresentou o /swarm, que transforma um único prompt numa equipe de agentes coordenados.",
 h:"Lançado em novembro de 2025, junto com o Gemini 3.",
 w:"Pedir a um agente que crie uma funcionalidade e a teste num navegador de verdade enquanto você revisa o plano.",
 n:"O principal produto de agente de programação do Google; o Gemini 4 Carbon está disponível nele para assinantes do AI Ultra.",
 k:"Como uma obra em que você é o arquiteto: os agentes são a equipe e trazem fotos e relatórios de progresso."},
t3code: {l:"T3 Code",
 p:"Um “harness de harnesses”: um único app que comanda, lado a lado, os agentes de programação que você já tem.",
 t:"Open source (MIT), da equipe de Theo Browne. Não tem modelo próprio e não revende acesso: ele inicia Claude Code, Codex, Cursor, OpenCode, Grok Build ou Antigravity com os seus próprios logins e mostra todas as sessões numa interface desktop, web ou de celular, com um branch git por tarefa e um botão para abrir pull request.",
 h:"Lançado em março de 2026; passou de 20 mil estrelas no GitHub no fim de agosto.",
 w:"Dar a mesma tarefa ao Claude Code e ao Codex, comparar os resultados e fazer merge do melhor.",
 n:"Um exemplo popular da camada de orquestração acima dos harnesses.",
 m:"O T3 Code não deixa os modelos mais inteligentes nem mais baratos; você ainda precisa de cada agente e da respectiva assinatura.",
 k:"Como um controle remoto universal: ele não produz os programas e não é uma TV, mas controla todos os seus aparelhos de um só lugar."},
access: {l:"Gateways e hospedagem", f:"Gateways & hosting",
 p:"Formas de acessar modelos sem se cadastrar em cada empresa separadamente, ou de rodá-los você mesmo.",
 t:"Gateways oferecem uma única API para centenas de modelos. Provedores de inferência hospedam modelos abertos nas suas GPUs. Plataformas de nuvem vendem modelos fechados e abertos dentro da conta de nuvem que você já tem. Ferramentas locais rodam modelos abertos no seu próprio computador.",
 w:"Uma startup testando cinco modelos por um único gateway antes de escolher um.",
 n:"Essencial para engenheiros de IA: esta camada decide preço, latência, privacidade e dependência de fornecedor.",
 k:"Como conseguir energia elétrica: direto de uma distribuidora, por uma comercializadora que compra de várias, ou de painéis solares no seu próprio telhado."},
openrouter: {l:"OpenRouter",
 p:"Uma chave de API, centenas de modelos: um marketplace que encaminha seu pedido para o modelo e o provedor que você escolher.",
 t:"Uma API compatível com a da OpenAI na frente de modelos da OpenAI, Anthropic, Google, xAI, DeepSeek, Moonshot, Alibaba e de muitos provedores de modelos abertos. Pode recorrer a outro provedor quando um cai, e publica preços e rankings de uso por modelo.",
 w:"Um desenvolvedor trocando um protótipo do Claude para o DeepSeek mudando uma única string de modelo.",
 n:"Muito usado para prototipar e comparar modelos; seus rankings públicos de uso circulam bastante no X.",
 m:"Um gateway acrescenta conveniência, não inteligência: a resposta continua vindo do modelo e do provedor por trás, e as políticas de dados deles também valem.",
 k:"Como um site de comparação de passagens: uma busca mostra várias companhias, mas quem pilota o avião continua sendo a companhia que você escolheu."},
hosts: {l:"Provedores de inferência e nuvens", f:"Inference providers & clouds",
 p:"Empresas que rodam modelos nas suas GPUs e alugam as respostas para você.",
 t:"Provedores especializados (Together AI, Fireworks, Groq, DeepInfra e outros) servem modelos abertos rápido e barato. As grandes nuvens (Amazon Bedrock, Google Cloud Vertex AI, Microsoft Foundry) vendem modelos fechados de parceiros e modelos abertos, com contratos corporativos, regiões e controles de segurança.",
 w:"Uma empresa que já está na AWS usa o Claude pelo Bedrock para que os dados fiquem sob os contratos existentes.",
 n:"Infraestrutura essencial da indústria de IA.",
 m:"O mesmo modelo aberto pode variar em velocidade, preço e até qualidade entre provedores, por causa de quantização e configurações de serviço.",
 k:"Como padarias que usam a mesma receita publicada: umas são mais rápidas, outras mais baratas, e algumas economizam na manteiga."},
local: {l:"Ollama / LM Studio",
 p:"Apps gratuitos que baixam e rodam modelos abertos no seu próprio computador.",
 t:"Eles juntam motores no estilo llama.cpp com modelos quantizados (muitas vezes arquivos GGUF), uma biblioteca de modelos, uma janela de chat e uma API local compatível com a da OpenAI. Sua RAM, VRAM ou memória unificada limita o tamanho do modelo que você consegue rodar.",
