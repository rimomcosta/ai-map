"e": "Um modelo não lê letras diretamente, então o texto é antes cortado em tokens: palavras comuns inteiras ou pedaços de palavras mais raras, cada um com um número de identificação. “Inacreditável” pode virar algo como “in”, “acredit” e “ável”. O modelo trabalha só com esses números e aprende quais costumam vir depois de quais. Código é tratado do mesmo jeito, porque também é texto, só que com regras mais rígidas e muitos símbolos e espaços que fazem diferença.",
"w": "Chatbots, apps de tradução, o autocompletar do e-mail e dos editores de código e as ferramentas que respondem perguntas sobre um PDF longo trabalham com texto quebrado em tokens.",
"p": "Linguagem escrita e código de programação, que o modelo lê e escreve em pedacinhos de texto chamados tokens."
}
},
"mimage": {
"en": {
"e": "Each pixel is just a few numbers saying how much red, green and blue it has, so a photo arrives as a huge table of numbers. A vision model learns to find patterns in them: first edges and colors, then shapes, then whole objects like a face or a dog. Video adds time, so the model also has to follow how things move from one frame to the next.",
"w": "Your phone uses vision models to find pictures when you search your photos for “beach” or “dog”, and many apps use them to read a document you photograph. Video platforms use them to flag clips that break their rules.",
"p": "Pictures, which a computer stores as grids of colored dots called pixels, and video, which is a fast sequence of those pictures."
},
"pt": {
"e": "Cada pixel é só um punhado de números dizendo quanto ele tem de vermelho, verde e azul, então uma foto chega como uma tabela enorme de números. Um modelo de visão aprende a achar padrões nela: primeiro bordas e cores, depois formas, depois objetos inteiros, como um rosto ou um cachorro. O vídeo acrescenta o tempo, então o modelo também precisa acompanhar como as coisas se movem de um quadro para o outro.",
"w": "O celular usa modelos de visão para achar fotos quando você busca “praia” ou “cachorro”, e muitos apps usam esses modelos para ler um documento fotografado. Plataformas de vídeo usam o mesmo recurso para sinalizar vídeos que violam as regras.",
"p": "Imagens, que o computador guarda como grades de pontinhos coloridos chamados pixels, e vídeo, que é uma sequência rápida dessas imagens."
}
},
"maudio": {
"en": {
"e": "A microphone records sound as a wave: thousands of measurements per second of how the air pressure changes. That raw wave is hard to learn from, so it is usually turned into a picture-like chart called a spectrogram, which shows which pitches are loud at each moment. The model then learns patterns in that chart, such as the shape of a spoken word, much as a vision model learns shapes in a photo.",
"w": "Automatic captions on videos, voice assistants that answer spoken questions, and meeting tools that write up a transcript all rely on speech models. Many call centers also use them to transcribe and summarize customer calls.",
"p": "Sound of every kind, such as speech, music and everyday noises, which AI can learn to recognize, transcribe and produce."
},
"pt": {
"e": "O microfone registra o som como uma onda: milhares de medições por segundo de como a pressão do ar varia. Aprender direto dessa onda é difícil, então ela costuma ser transformada num gráfico parecido com uma imagem, o espectrograma, que mostra quais tons estão fortes em cada instante. O modelo aprende padrões nesse gráfico, como o formato de uma palavra falada, de um jeito parecido com o de um modelo de visão aprendendo formas numa foto.",
"w": "Legendas automáticas em vídeos, assistentes de voz que respondem perguntas faladas e ferramentas de reunião que geram a transcrição dependem de modelos de fala. Muitas centrais de atendimento também usam esses modelos para transcrever e resumir ligações.",
"p": "Som de todo tipo, como fala, música e barulhos do dia a dia, que a IA consegue aprender a reconhecer, transcrever e produzir."
}
},
"mstruct": {
"en": {
"e": "Because every row has the same columns, such as date, price and quantity, the meaning of each number is already clear. That makes this data a good fit for classic machine learning methods, which often beat bigger, newer models here. Chatbots can help too, but usually by writing a spreadsheet formula or a database query that does the math, since they are not reliable at calculating across thousands of rows just by reading them.",
"w": "A bank spotting an unusual card payment, a store forecasting how much stock to order, and a factory watching sensor readings for signs a machine will fail are all working with structured data.",
"p": "Data that comes already organized, like spreadsheet tables, readings taken over time, and networks of connections between people or accounts."
},
"pt": {
"e": "Como toda linha tem as mesmas colunas, como data, preço e quantidade, o significado de cada número já está claro. Isso combina bem com métodos clássicos de machine learning, que muitas vezes se saem melhor aqui do que modelos maiores e mais novos. Chatbots também ajudam, mas em geral escrevendo uma fórmula de planilha ou uma consulta ao banco de dados que faz a conta, porque não são confiáveis para calcular só lendo milhares de linhas.",
"w": "Um banco detectando uma compra estranha no cartão, uma loja prevendo quanto estoque pedir e uma fábrica acompanhando sensores para antecipar a quebra de uma máquina estão todos trabalhando com dados estruturados.",
"p": "Dados que já chegam organizados, como tabelas de planilha, medições feitas ao longo do tempo e redes de conexões entre pessoas ou contas."
}
},
"vlm": {
"en": {
"e": "The key step is putting pictures and words in the same space: each image and each sentence becomes a list of numbers, and a matching pair ends up with similar numbers. Some models stop there and are used for matching, for example finding photos that fit a search phrase. Others pass what they see to a language model, which can then describe the picture or answer questions about it in full sentences.",
"w": "Searching a photo collection by typing a description, asking a chatbot to explain a chart you uploaded, and automatic image descriptions for blind users all rely on vision-language models."
},
"pt": {
"e": "O passo principal é colocar imagens e palavras no mesmo espaço: cada imagem e cada frase viram uma lista de números, e um par que combina fica com números parecidos. Alguns modelos param aí e servem para combinar, por exemplo achar fotos que correspondem a uma frase de busca. Outros passam o que enxergam para um modelo de linguagem, que então descreve a imagem ou responde perguntas sobre ela em frases completas.",
"w": "Buscar fotos digitando uma descrição, pedir a um chatbot que explique um gráfico que você enviou e as descrições automáticas de imagens para pessoas cegas usam modelos visão-linguagem."
}
},
"llava": {
"en": {
"e": "CLIP was trained on a huge collection of internet images paired with their captions. It learned to give an image and its caption similar number codes, called embeddings, so it can tell which caption fits which picture, even for categories nobody explicitly taught it. LLaVA reuses CLIP’s image side as its eyes, connects it to an open language model, and then trains the pair on conversations about images so it can chat about what it sees.",
"w": "Many image generators use CLIP’s text side to understand your prompt, and CLIP is widely used to search and sort images by description. Open-source tools that let you upload a photo and ask about it often follow the LLaVA recipe."
},
"pt": {
"e": "O CLIP foi treinado com uma enorme coleção de imagens da internet acompanhadas de suas legendas. Ele aprendeu a dar a uma imagem e à sua legenda códigos numéricos parecidos, chamados embeddings, e assim consegue dizer qual legenda combina com qual foto, mesmo em categorias que ninguém ensinou a ele explicitamente. O LLaVA usa a parte de imagem do CLIP como olhos, liga essa parte a um modelo de linguagem aberto e depois treina o conjunto com conversas sobre imagens, para que ele consiga falar sobre o que vê.",
"w": "Muitos geradores de imagem usam a parte de texto do CLIP para entender o seu prompt, e o CLIP é muito usado para buscar e organizar imagens por descrição. Ferramentas abertas em que você envia uma foto e pergunta sobre ela costumam seguir a receita do LLaVA."
}
},
"gpt4o": {
"en": {
"e": "Instead of being text models with separate add-ons bolted on, these assistants are trained to handle several kinds of input together, so the same system can look at a photo, listen to your voice and reply in speech. That lets them pick up things a text-only chain would lose, such as the tone of a question. The companies have not published full details of how they are built, so outside descriptions are partly educated guesses.",
"w": "Pointing your phone camera at a broken appliance and asking out loud what is wrong, or uploading a report full of charts and asking for a summary, are typical uses of these assistants."
},
"pt": {
"e": "Em vez de serem modelos de texto com acessórios separados, esses assistentes são treinados para lidar com vários tipos de entrada juntos, então o mesmo sistema consegue olhar uma foto, ouvir sua voz e responder falando. Isso permite perceber coisas que se perderiam numa cadeia só de texto, como o tom de uma pergunta. As empresas não publicaram todos os detalhes de como eles são construídos, então as descrições de fora são em parte suposições bem informadas.",
"w": "Apontar a câmera do celular para um eletrodoméstico quebrado e perguntar em voz alta qual é o problema, ou enviar um relatório cheio de gráficos e pedir um resumo, são usos típicos desses assistentes."
}
},
"vla": {
"en": {
"e": "A VLA starts from a vision-language model, which already understands pictures and words, and adds one more kind of output: movements. The robot’s camera image and the instruction go in, and out come small motor commands, such as “move the gripper a little left”, then “close it”. Because the model learned from internet images and text, it can follow instructions about objects or ideas it never practiced with on the robot.",
"w": "So far mostly in research labs and company prototypes. In one well-known demo, a robot running RT-2 was told to “pick up the extinct animal” and picked up a toy dinosaur, using what it had learned from the web."
},
"pt": {
"e": "Um VLA parte de um modelo visão-linguagem, que já entende imagens e palavras, e acrescenta mais um tipo de saída: movimentos. Entram a imagem da câmera do robô e a instrução; saem pequenos comandos para os motores, como “mova a garra um pouco para a esquerda” e depois “feche”. Como o modelo aprendeu com imagens e textos da internet, ele consegue seguir instruções sobre objetos ou ideias que nunca treinou com o robô.",
"w": "Por enquanto, principalmente em laboratórios de pesquisa e protótipos de empresas. Numa demonstração famosa, um robô com RT-2 recebeu a ordem “pegue o animal extinto” e pegou um dinossauro de brinquedo, usando o que tinha aprendido na internet."
}
},
"rt2": {
"en": {
"e": "RT-2, from Google DeepMind, writes robot movements as if they were words: each action becomes a short string of number tokens that the model outputs just like text. π0, from the startup Physical Intelligence, instead adds a separate part that produces smooth, continuous motions, which helps with fiddly tasks like folding a shirt. Both combine knowledge from internet images and text with recordings of robots doing many different tasks.",
"w": "So far mainly in research videos and company prototypes, showing robots folding laundry, clearing tables, and picking up and sorting objects.",
"p": "Two well-known general-purpose robot models: large models trained on varied data that turn what a robot sees and is told into movements."
},
"pt": {
"e": "O RT-2, do Google DeepMind, escreve movimentos de robô como se fossem palavras: cada ação vira uma sequência curta de tokens numéricos que o modelo produz do mesmo jeito que produz texto. Já o π0, da startup Physical Intelligence, tem uma parte separada que gera movimentos suaves e contínuos, o que ajuda em tarefas delicadas como dobrar uma camiseta. Os dois juntam o conhecimento de imagens e textos da internet com gravações de robôs fazendo muitas tarefas diferentes.",
"w": "Por enquanto, principalmente em vídeos de pesquisa e protótipos de empresas, com robôs dobrando roupas, tirando a mesa e pegando e separando objetos.",
"p": "Dois modelos de uso geral para robôs bem conhecidos: modelos grandes, treinados com dados variados, que transformam o que o robô vê e a instrução recebida em movimentos."
}
},
"genm": {
"en": {
"e": "Every generator learns from huge numbers of examples what real text, pictures or sounds tend to look like, then produces new ones that fit those patterns. The recipes differ in how they build the result: one piece at a time (autoregressive), by cleaning up noise step by step (diffusion), by following a learned path from noise to a picture (flow matching), or in a single quick pass through a trained network (GANs and VAEs). This branch walks through each one.",
"w": "When a chatbot writes its answer word by word, it is generating autoregressively. When an image app turns your description into a picture, it most often uses diffusion or flow matching."
},
"pt": {
"e": "Todo gerador aprende, a partir de uma quantidade enorme de exemplos, como costumam ser textos, imagens ou sons reais, e depois produz novos que seguem esses padrões. As receitas mudam na forma de montar o resultado: um pedaço de cada vez (autorregressivo), limpando ruído passo a passo (difusão), seguindo um caminho aprendido do ruído até a imagem (flow matching) ou numa única passada rápida por uma rede treinada (GANs e VAEs). Este ramo apresenta cada uma delas.",
"w": "Quando um chatbot escreve a resposta palavra por palavra, ele está gerando de forma autorregressiva. Quando um app transforma sua descrição em imagem, na maioria das vezes usa difusão ou flow matching."
}
},
"ar1": {
"en": {
"e": "At each step the model looks at everything written so far and gives each possible token, meaning a word or piece of a word, a probability of coming next. After “The capital of France is”, for example, “Paris” gets a very high one. It picks one token, usually among the most likely, adds it to the text and starts again with the longer text. That is why a chatbot’s answer appears bit by bit, and why the same question can get slightly different answers.",
"w": "Your phone keyboard suggesting the next word and a code editor finishing a line for you both work this way, and so does every chatbot reply that appears on screen bit by bit.",
"p": "The model writes one small piece of text at a time: it predicts what comes next, adds it, and repeats.",
"m": "Writing token by token describes how a model produces text. Training by predicting the next token is a separate step that happens earlier; see “Next-token pretraining” in “How it learns”."
},
"pt": {
"e": "A cada passo, o modelo olha tudo o que já foi escrito e dá uma probabilidade para cada token possível, ou seja, cada palavra ou pedaço de palavra que pode vir em seguida. Depois de “A capital da França é”, por exemplo, “Paris” recebe uma probabilidade bem alta. Ele escolhe um token, normalmente entre os mais prováveis, acrescenta ao texto e recomeça com o texto maior. Por isso a resposta de um chatbot aparece aos poucos, e a mesma pergunta pode receber respostas um pouco diferentes.",
"w": "As sugestões de próxima palavra no teclado do celular e o editor de código que completa uma linha para você funcionam assim, e o mesmo vale para toda resposta de chatbot que aparece na tela aos poucos.",
"p": "O modelo escreve um pedacinho de texto de cada vez: prevê o que vem a seguir, acrescenta e repete.",
"m": "Escrever token a token descreve como o modelo produz texto. Treinar prevendo o próximo token é uma etapa separada, que acontece antes; veja “Pré-treino por próximo token” em “Como aprende”."
}
},
"argpt": {
"en": {
"e": "To use this trick on pictures, an image is first split into small areas, and each area is swapped for the closest match from a fixed list of patterns, called a codebook. The whole picture becomes a sequence of codes, like words in a sentence. The model predicts those codes one after another, row by row, and a decoder turns the finished sequence back into pixels. OpenAI’s first DALL·E, one of the early text-to-image systems, worked this way.",
"w": "Some chat assistants can now create images inside the conversation using a single model for both text and pictures, rather than handing the request to a separate image generator."
},
"pt": {
"e": "Para usar esse truque em imagens, a figura é primeiro dividida em pequenas áreas, e cada área é trocada pelo padrão mais parecido de uma lista fixa de padrões, chamada codebook. Assim a imagem inteira vira uma sequência de códigos, como palavras numa frase. O modelo prevê esses códigos um depois do outro, linha por linha, e um decodificador transforma a sequência pronta de volta em pixels. O primeiro DALL·E da OpenAI, um dos pioneiros de texto para imagem, funcionava assim.",
"w": "Alguns assistentes de chat já criam imagens dentro da conversa usando um único modelo para texto e imagem, em vez de repassar o pedido para um gerador de imagens separado."
}
},
"df1": {
"en": {
"e": "Noise here means random speckles, like static on an old TV. During training, the model sees real images with different amounts of noise added and learns to guess what noise is there. To create something new, it starts from pure static, removes a little of the noise it guessed, looks again, and repeats, so rough shapes appear first and fine details last. Each small step is easy to get right, which is why the result can be so detailed.",
"w": "When an image generator shows a blurry preview that slowly sharpens into the finished picture, you are watching these clean-up steps happen.",
"p": "A diffusion model creates an image by cleaning up random noise in many small steps, instead of drawing it in one go."
},
"pt": {
"e": "Ruído aqui quer dizer pontinhos aleatórios, como o chuvisco de uma TV antiga. No treino, o modelo vê imagens reais com quantidades diferentes de ruído e aprende a adivinhar que ruído foi adicionado. Para criar algo novo, ele parte de puro chuvisco, tira um pouco do ruído que estimou, olha de novo e repete: as formas gerais surgem primeiro e os detalhes finos por último. Cada passo pequeno é fácil de acertar, e por isso o resultado pode ser tão detalhado.",
"w": "Quando um gerador de imagens mostra uma prévia borrada que vai ficando nítida até virar a imagem final, você está vendo esses passos de limpeza acontecendo.",
"p": "Um modelo de difusão cria uma imagem limpando ruído aleatório em muitos passos pequenos, em vez de desenhá-la de uma vez."
}
},
"ddpm": {
"en": {
"e": "DDPM stands for Denoising Diffusion Probabilistic Models. The idea of learning to undo added noise already existed, but this paper by researchers at UC Berkeley found a simple training goal that worked well: show the network a noisy image and ask it to predict exactly which noise was added. That made training stable and easy to scale up, and the image quality began to rival GANs, the leading method of the time.",
"w": "You won’t use DDPM directly, but its training recipe sits underneath most of the image, video and audio diffusion tools that came after it, including Stable Diffusion."
},
"pt": {
"e": "DDPM é a sigla de Denoising Diffusion Probabilistic Models (modelos probabilísticos de difusão com remoção de ruído). A ideia de aprender a desfazer ruído já existia, mas esse artigo, de pesquisadores da UC Berkeley, achou um objetivo de treino simples que funcionava bem: mostrar à rede uma imagem com ruído e pedir que ela adivinhe exatamente qual ruído foi adicionado. Isso deixou o treino estável e fácil de escalar, e a qualidade das imagens passou a rivalizar com a das GANs, o método dominante na época.",
"w": "Você não usa o DDPM diretamente, mas a receita de treino dele está por baixo da maioria das ferramentas de difusão de imagem, vídeo e áudio que vieram depois, incluindo o Stable Diffusion."
}
},
"fm": {
"en": {
"e": "Diffusion clears noise along a winding route, so it needs many steps. Flow matching trains the model to learn a more direct route instead: for any half-finished image, it predicts which way and how fast to move toward a realistic picture. Training is simpler, and when the learned routes are close to straight lines, the generator reaches a good image in fewer steps, saving time and computing power. Many recent image and video generators use it.",
"w": "When you create an image with one of the newer Stable Diffusion releases or a FLUX model, flow matching is doing the work. Some video generators use it too."
},
"pt": {
"e": "A difusão limpa o ruído por um caminho cheio de curvas, por isso precisa de muitas etapas. O flow matching treina o modelo para aprender um caminho mais direto: para qualquer imagem pela metade, ele prevê para que lado e com que velocidade avançar rumo a uma imagem realista. O treino é mais simples e, quando os caminhos aprendidos ficam perto de linhas retas, o gerador chega a uma boa imagem em menos etapas, economizando tempo e poder de computação. Muitos geradores recentes de imagem e vídeo usam essa técnica.",
"w": "Quando você cria uma imagem com uma das versões mais novas do Stable Diffusion ou com um modelo FLUX, é o flow matching que está trabalhando. Alguns geradores de vídeo também usam a técnica."
}
},
"fm1": {
"en": {
"e": "A velocity is simply a direction plus a speed. The model learns a whole field of them: wherever an image currently is on its way from noise to picture, there is an arrow saying where to go next. To generate, the computer starts at random noise, reads the arrow, takes a small step, reads the next arrow, and repeats until it arrives at a finished image. Fewer, bigger steps work when the arrows trace a fairly straight path.",
"w": "This is the machinery inside newer image generators built on flow matching. Because the path is smooth and predictable, they can often make a good image in fewer steps than classic diffusion."
},
"pt": {
"e": "Velocidade aqui é simplesmente uma direção junto com uma rapidez. O modelo aprende um campo inteiro delas: onde quer que uma imagem esteja no caminho entre o ruído e a figura final, há uma seta dizendo para onde ir em seguida. Para gerar, o computador parte de ruído aleatório, lê a seta, dá um passinho, lê a próxima seta e repete até chegar a uma imagem pronta. Passos maiores e em menor número funcionam quando as setas formam um caminho bem reto.",
"w": "É o mecanismo dentro dos geradores de imagem mais novos baseados em flow matching. Como o caminho é suave e previsível, eles muitas vezes chegam a uma boa imagem em menos etapas que a difusão clássica."
}
},
"flux": {
"en": {
"e": "Most of them don’t work on the full-size image directly. A separate part, a VAE, first squeezes the picture into a much smaller compressed version, the generator does its flow-matching steps there, and the VAE expands the result back into pixels. The generator itself is usually a transformer, the same kind of network behind chatbots, and it reads your prompt through large text encoders, which helps it follow long descriptions and spell words correctly in the image.",
"w": "Designers use them to draft posters, mockups and product shots. They are much better than older generators at putting legible words into an image, like a shop sign or a label."
},
"pt": {
"e": "A maioria não trabalha direto na imagem em tamanho real. Uma parte separada, um VAE, primeiro espreme a figura numa versão comprimida bem menor; o gerador faz seus passos de flow matching ali; e o VAE expande o resultado de volta em pixels. O gerador em si costuma ser um transformer, o mesmo tipo de rede por trás dos chatbots, e lê o seu prompt com grandes codificadores de texto, o que ajuda a seguir descrições longas e a escrever palavras corretamente na imagem.",
"w": "Designers usam esses modelos para rascunhar cartazes, mockups e fotos de produto. Eles são bem melhores que os geradores mais antigos em colocar palavras legíveis numa imagem, como o letreiro de uma loja ou um rótulo."
}
},
"gan": {
"en": {
"e": "GAN stands for generative adversarial network. The generator starts from random numbers and turns them into an image; the discriminator sees a mix of real photos and the generator’s fakes and guesses which is which. Each learns from the other’s mistakes. Once trained, the generator makes an image in a single fast pass, but training is touchy: the two can fall out of balance, or the generator can get stuck making only a few kinds of images.",
"w": "Apps that sharpen or enlarge old, low-resolution photos often use GANs, and GANs produced the first wave of strikingly realistic fake faces."
},
"pt": {
"e": "GAN é a sigla de generative adversarial network (rede adversarial generativa). O gerador parte de números aleatórios e os transforma numa imagem; o discriminador recebe uma mistura de fotos reais e falsificações do gerador e tenta dizer qual é qual. Cada um aprende com os erros do outro. Depois de treinado, o gerador cria uma imagem numa única passada rápida, mas o treino é delicado: os dois podem se desequilibrar, ou o gerador pode empacar e produzir só poucos tipos de imagem.",
"w": "Apps que deixam nítidas ou ampliam fotos antigas de baixa resolução muitas vezes usam GANs, e foram as GANs que trouxeram a primeira onda de rostos falsos impressionantemente realistas."
}
},
"gan1": {
"en": {
"e": "In each round, the discriminator first practices on a batch of real images and fakes, getting better at telling them apart. Then the generator gets feedback on exactly how it was caught and adjusts to make its next fakes more convincing. If all goes well, they push each other up step by step until the fakes are so good that the discriminator can do no better than guessing.",
"w": "Photo upscaling and enhancement tools trained this way learn to add believable fine detail, such as skin texture or brick patterns, when they enlarge a small image.",
"p": "The training game at the heart of a GAN: one network makes fakes, the other judges them, and they take turns improving."
},
"pt": {
"e": "Em cada rodada, o discriminador primeiro treina com um lote de imagens reais e falsas e fica melhor em diferenciá-las. Depois, o gerador recebe o retorno de como exatamente foi pego e se ajusta para que as próximas falsificações convençam mais. Se tudo corre bem, um empurra o outro para cima, passo a passo, até que as falsificações fiquem tão boas que o discriminador não consegue fazer melhor do que chutar.",
"w": "Ferramentas que ampliam e melhoram fotos, treinadas desse jeito, aprendem a inventar detalhes finos convincentes, como a textura da pele ou o desenho dos tijolos, quando aumentam uma imagem pequena.",
"p": "O jogo de treino no centro de uma GAN: uma rede cria falsificações, a outra as julga, e elas se revezam para melhorar."
}
},
"stylegan": {
"en": {
"e": "Ordinary GANs feed their random numbers in at the start and hope for the best. StyleGAN first converts the random numbers into a set of style settings and feeds them into every layer of the network. Early layers decide big things like pose and face shape, later layers decide fine things like freckles and hair strands. Swapping the settings at one level while keeping the others lets you mix, for example, one person’s face shape with another’s coloring.",
"w": "The website This Person Does Not Exist showed StyleGAN to the public by displaying a new, completely invented face every time you reloaded the page."
},
"pt": {
"e": "As GANs comuns colocam os números aleatórios logo na entrada e torcem pelo melhor. O StyleGAN primeiro converte esses números num conjunto de ajustes de estilo e os injeta em cada camada da rede. As primeiras camadas decidem coisas grandes, como pose e formato do rosto; as últimas, coisas finas, como sardas e fios de cabelo. Trocar os ajustes de um nível mantendo os outros permite misturar, por exemplo, o formato do rosto de uma pessoa com as cores de outra.",
"w": "O site This Person Does Not Exist apresentou o StyleGAN ao público mostrando um rosto novo, totalmente inventado, a cada vez que você recarregava a página."
}
},
"vae": {
"en": {
"e": "An autoencoder has two halves: an encoder that squeezes an input, say a photo, into a short list of numbers, and a decoder that rebuilds the photo from that list. A plain autoencoder can leave gaps in its map, so random points decode to garbage. A VAE (variational autoencoder) is trained to keep the map smooth and filled in, so any point you pick decodes to something sensible, and that is what makes it a generator.",
"w": "Inside image generators like Stable Diffusion and FLUX, a VAE shrinks each picture into a compact form for the main model to work on, then turns the result back into a full-size image.",
"p": "A model that squeezes data into a compact, well-organized map, then picks fresh points on that map to create new examples."
},
"pt": {
"e": "Um autoencoder tem duas metades: um encoder, que espreme uma entrada, digamos uma foto, numa lista curta de números, e um decoder, que reconstrói a foto a partir dessa lista. Um autoencoder comum pode deixar buracos no mapa, e pontos aleatórios viram imagens sem sentido. Um VAE (autoencoder variacional) é treinado para manter o mapa suave e preenchido, então qualquer ponto escolhido vira algo coerente, e é isso que o torna um gerador.",
"w": "Dentro de geradores de imagem como o Stable Diffusion e o FLUX, um VAE encolhe cada imagem numa forma compacta para o modelo principal trabalhar e depois transforma o resultado de volta numa imagem em tamanho real.",
"p": "Um modelo que comprime os dados num mapa compacto e bem organizado e depois escolhe pontos novos nesse mapa para criar exemplos inéditos."
}
},
"vae1": {
"en": {
"e": "The map is called a latent space: “latent” means hidden, because it holds features the model discovered by itself, not ones a person labeled. When each input covers a fuzzy area rather than a dot, neighboring areas overlap, so the gaps between examples get filled in. That is why a point halfway between a smiling face and a serious one decodes to a believable half-smile instead of noise.",
"w": "Smooth morphs from one face into another, or blends between two designs, can be made by moving step by step across this map from one point to another.",
"p": "Instead of storing each input as one exact point on its internal map, a VAE stores it as a small fuzzy area."
},
"pt": {
"e": "Esse mapa se chama espaço latente: “latente” quer dizer escondido, porque ele guarda características que o próprio modelo descobriu, não rótulos dados por uma pessoa. Quando cada entrada ocupa uma área difusa em vez de um ponto, áreas vizinhas se sobrepõem e os vãos entre os exemplos ficam preenchidos. Por isso um ponto no meio do caminho entre um rosto sorrindo e um rosto sério vira um meio sorriso convincente, e não ruído.",
"w": "Transformações suaves de um rosto em outro, ou misturas entre dois designs, podem ser feitas andando passo a passo por esse mapa, de um ponto até outro.",
"p": "Em vez de guardar cada entrada como um ponto exato no seu mapa interno, o VAE a guarda como uma pequena área difusa."
}
},
"vaeimg": {
"en": {
"e": "The blur comes from how a VAE is graded during training: it is scored on how close each rebuilt pixel is to the original. When it is unsure whether a strand of hair goes here or slightly to the left, the safest bet is an average of both, which looks soft. Later versions fixed this by storing images as a fixed set of codes (VQ-VAE) or by adding a GAN-style judge that penalizes blur.",
"w": "Pure VAE images are rare in today’s apps, but the idea lives on: VAE-style models compress images for diffusion generators and turn images into tokens for models that generate them piece by piece.",
"p": "Pick a random point on a VAE’s internal map, let the decoder turn it into pixels, and you get a new image, usually a little blurry."
},
"pt": {
"e": "O borrão vem do jeito como o VAE é avaliado no treino: ele ganha nota pela proximidade entre cada pixel reconstruído e o original. Quando está em dúvida se um fio de cabelo fica aqui ou um pouco à esquerda, a aposta mais segura é uma média das duas posições, e isso fica com cara de desfocado. Versões posteriores resolveram isso guardando as imagens como um conjunto fixo de códigos (VQ-VAE) ou acrescentando um juiz no estilo das GANs que penaliza o borrão.",
"w": "Imagens feitas só com VAE são raras nos apps de hoje, mas a ideia continua viva: modelos no estilo VAE comprimem imagens para os geradores de difusão e transformam imagens em tokens para modelos que as geram pedaço por pedaço.",
"p": "Escolha um ponto aleatório no mapa interno de um VAE, deixe o decoder transformá-lo em pixels e você tem uma imagem nova, normalmente um pouco borrada."
}
},
"scale": {
"en": {
"e": "This branch looks at models as things you have to pay for and find room for. A model’s size is measured in parameters, the learned numbers inside it. More parameters often mean more ability, but also more memory, more electricity and slower answers. The pages here cover how size is measured, how models are organized inside, the tricks that shrink them, and the hardware they run on.",
"w": "When a company decides whether to run a small model on its own computers or pay for a large model through an online service, it is weighing exactly these trade-offs. The same choice explains why some phone features work offline while others need an internet connection."
},
"pt": {
"e": "Este ramo olha para os modelos como algo que custa dinheiro e precisa de espaço. O tamanho de um modelo é medido em parâmetros, os números aprendidos que ficam dentro dele. Mais parâmetros costumam trazer mais capacidade, mas também mais memória, mais energia e respostas mais lentas. Aqui você vê como se mede o tamanho, como os modelos se organizam por dentro, as técnicas para encolhê-los e o hardware em que rodam.",
"w": "Quando uma empresa decide entre rodar um modelo pequeno nos próprios computadores ou pagar por um modelo grande num serviço online, está pesando exatamente essas escolhas. É também por isso que alguns recursos do celular funcionam sem internet e outros não."
}
},
"size": {
"en": {
"e": "During training, a model adjusts its parameters little by little until its answers improve, so they hold everything it has learned. More parameters give it more room to store patterns, which is why bigger models often handle harder tasks. Size has a cost: every parameter must sit in memory while the model runs. It is not the whole story either, because a smaller model trained on better data can beat a bigger one.",
"w": "You see sizes in model names, such as “8B” or “70B”, on sites that share open models. The companies behind the biggest commercial chatbots often don’t say how large their models are.",
"p": "How many learned numbers, called parameters, a model contains. Sizes are usually given in billions: a “7B” model has about 7 billion parameters."
},
"pt": {
"e": "No treinamento, o modelo ajusta seus parâmetros pouco a pouco até as respostas melhorarem, então é neles que fica tudo o que ele aprendeu. Mais parâmetros dão mais espaço para guardar padrões, e por isso modelos maiores costumam dar conta de tarefas mais difíceis. Mas tamanho tem custo: cada parâmetro precisa ficar na memória enquanto o modelo roda. E não é tudo, porque um modelo menor treinado com dados melhores pode superar um maior.",
"w": "Você vê o tamanho no próprio nome do modelo, como “8B” ou “70B”, nos sites que compartilham modelos abertos. As empresas por trás dos maiores chatbots comerciais muitas vezes não revelam o tamanho dos seus modelos.",
"p": "Quantos números aprendidos, chamados parâmetros, um modelo tem. O tamanho costuma vir em bilhões: um modelo “7B” tem cerca de 7 bilhões de parâmetros."
}
},
"slm": {
"en": {
"e": "A small model can’t hold as much knowledge as a giant one, so it makes more mistakes on broad or tricky questions. It makes up for this by being fast, cheap and private: it can run without sending your data anywhere. Builders make small models stronger by training them on carefully chosen data and by having them learn from the answers of a larger model. They work best on focused jobs, such as sorting emails or pulling names and dates out of documents.",
"w": "Phones and laptops now include AI features, like summarizing a message or suggesting a reply, that can run on the device itself. Companies also use small models for large, repetitive jobs where a big model would be slow and expensive.",
"p": "Language models small enough to run cheaply, even on a laptop or a phone. They usually have between about half a billion and ten billion parameters.",
"m": "“Small language model” describes size, not a special kind of design. There is also no official size limit: what counts as small changes as models grow."
},
"pt": {
"e": "Um modelo pequeno não guarda tanto conhecimento quanto um gigante, então erra mais em perguntas amplas ou difíceis. Em troca, é rápido, barato e privado: pode rodar sem mandar seus dados para lugar nenhum. Para deixá-los mais fortes, quem os cria usa dados de treino bem escolhidos e faz o modelo pequeno aprender com as respostas de um maior. Eles funcionam melhor em tarefas focadas, como separar e-mails ou tirar nomes e datas de documentos.",
"w": "Celulares e notebooks já trazem recursos de IA, como resumir uma mensagem ou sugerir uma resposta, que podem rodar no próprio aparelho. Empresas também usam modelos pequenos em tarefas grandes e repetitivas, em que um modelo grande seria lento e caro.",
"p": "Modelos de linguagem pequenos o bastante para rodar barato, até num notebook ou celular. Costumam ter entre meio bilhão e dez bilhões de parâmetros.",
"m": "“Modelo de linguagem pequeno” descreve o tamanho, não um tipo especial de projeto. Também não existe um limite oficial: o que conta como pequeno muda conforme os modelos crescem."
}
},
"params": {
"en": {
"e": "Models read and write text in small pieces called tokens, often a word or part of a word. A dense model runs all of its parameters for each token, so a bigger model is always slower and costlier per word. A Mixture of Experts splits much of the model into specialist parts and sends each token to only a few of them. This lets a model hold a lot of knowledge while doing less work for each word.",
"w": "Several well-known open models, such as Mixtral and DeepSeek-V3, use Mixture of Experts, while many others, such as the Llama 3 family, are dense. That is why model descriptions often list both “total” and “active” parameters.",
"p": "Two ways to build a model: in a dense one, every part works on every piece of text; in a Mixture of Experts, only a few parts do."
},
"pt": {
"e": "Os modelos leem e escrevem texto em pedacinhos chamados tokens, que costumam ser uma palavra ou parte dela. Um modelo denso usa todos os seus parâmetros em cada token, então um modelo maior é sempre mais lento e mais caro por palavra. Um Mixture of Experts divide boa parte do modelo em partes especialistas e manda cada token para só algumas delas. Assim o modelo guarda muito conhecimento, mas faz menos trabalho a cada palavra.",
"w": "Vários modelos abertos conhecidos, como o Mixtral e o DeepSeek-V3, usam Mixture of Experts, enquanto muitos outros, como a família Llama 3, são densos. Por isso as descrições de modelos muitas vezes mostram parâmetros “totais” e “ativos”.",
"p": "Duas formas de montar um modelo: no denso, todas as partes trabalham em cada pedaço de texto; num Mixture of Experts, só algumas trabalham."
}
},
"dense": {
"en": {
"e": "This is the classic and simplest design. Because every token passes through the whole model, the work per token grows with the model’s size: double the parameters and you roughly double the computing needed for each word. That makes dense models predictable and easier to train and run, but expensive to scale up. Many popular models, large and small, are still built this way.",
"w": "Many of the open models people download to run on their own computers are dense, including the Llama 3 models. Many small models built for phones and laptops are dense too.",
"p": "A dense model uses all of its parameters, every learned number inside it, for each piece of text it reads or writes."
},
"pt": {
"e": "É o desenho clássico e mais simples. Como cada token passa pelo modelo inteiro, o trabalho por token cresce com o tamanho: dobre os parâmetros e você dobra, mais ou menos, a computação necessária para cada palavra. Isso torna os modelos densos previsíveis e mais fáceis de treinar e rodar, mas caros de aumentar. Muitos modelos populares, grandes e pequenos, ainda são feitos assim.",
"w": "Muitos dos modelos abertos que as pessoas baixam para rodar no próprio computador são densos, como os modelos Llama 3. Vários modelos pequenos feitos para celulares e notebooks também são.",
"p": "Um modelo denso usa todos os seus parâmetros, cada número aprendido dentro dele, em cada pedaço de texto que lê ou escreve."
}
},
"moe": {
"en": {
"e": "The router is a small part of the model that learns, during training, which experts handle which tokens best. For each token it switches on only a few experts and leaves the rest idle. So a model can contain hundreds of billions of parameters while each token uses only a fraction of them, which makes answers faster and cheaper to produce. The experts don’t map neatly onto topics like “math” or “history”; their specialties emerge during training and are hard to describe.",
"w": "Several large models used through chatbots and online services are built this way. Among open models, DeepSeek-V3 has about 671 billion parameters in total but uses only about 37 billion for each token.",
"p": "A model split into many specialist parts, called experts, with a small router that picks just a few of them for each piece of text."
},
"pt": {
"e": "O roteador é uma parte pequena do modelo que aprende, durante o treino, quais especialistas lidam melhor com cada token. Para cada token, ele liga só alguns especialistas e deixa o resto parado. Assim, um modelo pode ter centenas de bilhões de parâmetros enquanto cada token usa só uma fração deles, o que deixa as respostas mais rápidas e baratas. Os especialistas não correspondem a assuntos como “matemática” ou “história”: a especialidade de cada um surge no treino e é difícil de descrever.",
"w": "Vários modelos grandes usados em chatbots e serviços online são feitos assim. Entre os modelos abertos, o DeepSeek-V3 tem cerca de 671 bilhões de parâmetros no total, mas usa só uns 37 bilhões em cada token.",
"p": "Um modelo dividido em muitas partes especialistas (experts), com um pequeno roteador que escolhe só algumas delas para cada pedaço de texto."
}
},
"compress": {
"en": {
"e": "A trained model is a huge collection of numbers, and the goal here is to store fewer of them, or store them more cheaply. There are three main approaches. Quantization keeps every number but saves it in a rougher, shorter form. Pruning deletes the parts that matter least. Distillation trains a new, smaller model to copy the answers of a bigger one. Each saves memory and time, and each can cost some quality if pushed too far.",
"w": "When you download a model to run on your own laptop, you usually get a compressed version so it fits in memory. The AI features built into phones also rely on models that have been shrunk to fit the device."
},
"pt": {
"e": "Um modelo treinado é uma enorme coleção de números, e a ideia aqui é guardar menos números ou guardá-los de um jeito mais barato. Há três caminhos principais. A quantização mantém todos os números, mas salva cada um de forma mais curta e aproximada. A poda apaga as partes que menos importam. A destilação treina um modelo novo e menor para copiar as respostas de um maior. Todos economizam memória e tempo, e todos podem custar um pouco de qualidade se exagerados.",
"w": "Quando você baixa um modelo para rodar no seu notebook, normalmente pega uma versão comprimida, para caber na memória. Os recursos de IA embutidos nos celulares também dependem de modelos encolhidos para caber no aparelho."
}
},
"quant": {
"en": {
"e": "A model is made of billions of numbers, and each one is normally stored with 16 bits, the 0s and 1s a computer uses. Quantization rounds each number to a shorter form, such as 8 or 4 bits. Going from 16 to 4 bits makes the model about four times smaller, so it needs less memory and often runs faster. The answers get slightly less precise, but with good methods the difference is usually small.",
"w": "Free apps such as Ollama and LM Studio let people run AI models on an ordinary laptop, and the models they download are usually quantized to 4 or 8 bits. That is what lets many models fit on a home computer."
},
"pt": {
"e": "Um modelo é feito de bilhões de números, e cada um costuma ser guardado com 16 bits, os 0s e 1s que o computador usa. A quantização arredonda cada número para uma forma mais curta, como 8 ou 4 bits. Passar de 16 para 4 bits deixa o modelo cerca de quatro vezes menor, então ele precisa de menos memória e muitas vezes roda mais rápido. As respostas ficam um pouco menos precisas, mas com bons métodos a diferença costuma ser pequena.",
"w": "Aplicativos gratuitos como Ollama e LM Studio permitem rodar modelos de IA num notebook comum, e os modelos que eles baixam costumam vir quantizados em 4 ou 8 bits. É isso que faz muitos modelos caberem num computador de casa."
}
},
"prune": {
"en": {
"e": "After training, some of a model’s connections barely affect the result. Pruning finds them, often by checking which numbers are close to zero or which parts change the output least when removed, and cuts them out. Removing scattered single numbers saves storage but rarely speeds things up; removing whole blocks, such as entire layers, makes the model genuinely faster. Afterward the model is usually trained a little more to recover lost quality.",
"w": "You rarely see pruning directly, but it is part of how some companies build small, efficient models from larger ones. Some small open models, for example, were made by pruning a bigger model and then training the result to imitate the original.",
"p": "Pruning removes the parts of a trained model that contribute little to its answers, making it smaller and sometimes faster."
},
"pt": {
"e": "Depois do treino, algumas conexões do modelo quase não mudam o resultado. A poda encontra essas partes, muitas vezes vendo quais números estão perto de zero ou quais partes menos alteram a saída quando retiradas, e as corta. Tirar números soltos aqui e ali economiza espaço, mas raramente acelera; tirar blocos inteiros, como camadas completas, deixa o modelo realmente mais rápido. Depois, o modelo costuma passar por um pouco mais de treino para recuperar a qualidade perdida.",
"w": "Você dificilmente vê a poda diretamente, mas ela faz parte de como algumas empresas criam modelos pequenos e eficientes a partir de modelos maiores. Alguns modelos abertos pequenos, por exemplo, foram feitos podando um modelo maior e depois treinando o resultado para imitar o original.",
"p": "A poda remove as partes de um modelo treinado que pouco contribuem para as respostas, deixando-o menor e, às vezes, mais rápido."
}
},
"hw": {
"en": {
"e": "Running a trained model to get answers is called inference. To write each new word, a language model has to read through its weights, the stored numbers, so two things matter most: how much memory the hardware has, which decides whether the model fits, and how quickly data can move out of that memory, which often decides the speed. This branch covers the chips, the kinds of memory, and the choice between running models yourself or using them online.",
"w": "When a chatbot answers instantly, it is running on powerful chips in a data center. When your phone turns speech into text without an internet connection, a smaller model is running on the phone itself.",
"p": "Once trained, a model has to run somewhere: a data center, a laptop or a phone. The hardware decides how fast it answers and which models fit."
},
"pt": {
"e": "Rodar um modelo treinado para obter respostas se chama inferência. Para escrever cada nova palavra, um modelo de linguagem precisa ler seus pesos, os números guardados, então duas coisas pesam mais: quanta memória o hardware tem, o que decide se o modelo cabe, e com que rapidez os dados saem dessa memória, o que muitas vezes decide a velocidade. Este ramo trata dos chips, dos tipos de memória e da escolha entre rodar modelos por conta própria ou usá-los online.",
"w": "Quando um chatbot responde na hora, ele está rodando em chips potentes num data center. Quando o celular transforma sua fala em texto sem internet, um modelo menor está rodando no próprio aparelho.",
"p": "Depois de treinado, um modelo precisa rodar em algum lugar: data center, notebook ou celular. O hardware decide a velocidade da resposta e quais modelos cabem."
}
},
"chips": {
"en": {
"e": "A CPU, the main processor in every computer, is very flexible but does only a handful of things at once. AI models mostly need huge amounts of simple multiplication that can happen side by side, and that is what a GPU, first designed for video game graphics, does well. An NPU goes further: it is built only for the math of neural networks, so it uses little power. That is why phones and laptops include one.",
"w": "The big AI services run on large numbers of GPUs and similar chips in data centers. Many recent phones and laptops advertise an NPU, sometimes called a neural engine, which powers features like photo enhancement and live captions."
},
"pt": {
"e": "A CPU, o processador principal de todo computador, é muito versátil, mas faz poucas coisas ao mesmo tempo. Modelos de IA precisam sobretudo de uma quantidade enorme de multiplicações simples, que podem ser feitas lado a lado, e é nisso que a GPU, criada originalmente para gráficos de videogame, é boa. A NPU vai além: é feita só para as contas das redes neurais, então gasta pouca energia. Por isso celulares e notebooks trazem uma.",
"w": "Os grandes serviços de IA rodam em grandes quantidades de GPUs e chips parecidos em data centers. Muitos celulares e notebooks recentes anunciam uma NPU, às vezes chamada de neural engine, que alimenta recursos como melhoria de fotos e legendas ao vivo."
}
},
"memory": {
"en": {
"e": "Before a model can answer, all of its weights have to be loaded into memory, and they stay there while it works. A graphics card has its own fast memory, called VRAM, but usually not much of it. The computer’s main memory, called RAM, is larger but slower for the GPU to reach. Some computers, such as Macs with Apple’s own chips, use unified memory: one shared pool that both processors can use, which lets bigger models fit.",
"w": "It is the number to check before downloading a model to run at home: if the model needs more memory than your computer or graphics card has, it either won’t load or will run very slowly. That is why people interested in local AI pay close attention to memory when buying a computer."
},
"pt": {
"e": "Antes de responder, o modelo precisa carregar todos os seus pesos na memória, e eles ficam lá enquanto ele trabalha. A placa de vídeo tem memória própria e rápida, a VRAM, mas costuma ter pouca. A memória principal do computador, a RAM, é maior, mas a GPU a acessa mais devagar. Alguns computadores, como os Macs com chips da própria Apple, usam memória unificada: um só bloco compartilhado pelos dois processadores, o que permite caber modelos maiores.",
"w": "É o número que você confere antes de baixar um modelo para rodar em casa: se ele precisa de mais memória do que o seu computador ou placa de vídeo têm, não carrega ou fica muito lento. Por isso quem se interessa por IA local presta muita atenção na memória ao comprar um computador."
}
},
"localcloud": {
"en": {
"e": "Running locally means your data never leaves your machine, it works offline, and there is no bill per question once you own the hardware. The catch is that you are limited to models your hardware can hold, and you have to set up and maintain everything. Using the cloud gives you the most capable models with no setup, but you pay for each use and your text is sent to the provider. Many organizations mix both.",
"w": "When you chat with a popular assistant in your browser, you are using cloud inference. Some hospitals, banks and law firms instead run open models on their own servers so sensitive data stays inside the organization.",
"p": "You can run a model on your own hardware, or send each request over the internet to a model running in another company’s data center."
},
"pt": {
"e": "Rodar localmente significa que seus dados não saem da sua máquina, funciona sem internet e não há conta por pergunta depois que você tem o hardware. O porém é ficar limitado aos modelos que seu equipamento aguenta, e cabe a você instalar e manter tudo. Na nuvem você usa os modelos mais capazes sem instalar nada, mas paga por uso e seu texto vai para o fornecedor. Muitas organizações combinam as duas coisas.",
"w": "Quando você conversa com um assistente famoso no navegador, está usando inferência na nuvem. Alguns hospitais, bancos e escritórios de advocacia preferem rodar modelos abertos nos próprios servidores, para que dados sensíveis não saiam da organização.",
"p": "Você pode rodar um modelo no seu próprio hardware ou mandar cada pedido pela internet para um modelo rodando no data center de outra empresa."
}
},
"systems": {
"en": {
"e": "A model by itself only takes in text and sends text back. It can’t look up today’s data, remember you between visits or press a button anywhere. An AI app adds those parts around it: a way to find the right documents, tools the model can use, memory, and checks that catch mistakes. This branch walks through those pieces, from the first call to a model up to running a system for real users.",
"w": "Most AI features you meet at work are built this way, from the chatbot on a company website that looks up your order to the email assistant that drafts a reply using the earlier messages in a thread."
},
"pt": {
"e": "Sozinho, um modelo só recebe texto e devolve texto. Ele não consulta dados de hoje, não lembra de você entre uma visita e outra e não aperta botão nenhum. Um app de IA acrescenta essas peças em volta: um jeito de achar os documentos certos, ferramentas que o modelo pode usar, memória e verificações que pegam erros. Este ramo percorre essas peças, da primeira chamada a um modelo até manter um sistema funcionando para usuários reais.",
"w": "A maioria dos recursos de IA que você encontra no trabalho é feita assim, do chatbot no site de uma empresa que consulta o seu pedido ao assistente de e-mail que rascunha uma resposta usando as mensagens anteriores da conversa."
}
},
"talk": {
"en": {
"e": "Apps usually reach a model through an API, a doorway that lets one program send requests to another over the internet. The request is a list of messages: an instruction that sets the model’s role, called the system prompt, followed by the conversation so far. The answer often comes back in small pieces, which is why chatbots seem to type. Settings such as temperature, which controls how varied the wording is, shape the reply.",
"w": "Every time you use an AI feature inside another app, such as a writing helper in a document editor, that app is sending your text to a model this way and showing you the reply. Developers pay for these calls according to how much text goes in and comes out.",
"p": "How a program sends a request to an AI model and gets the answer back. It is the basic step behind every AI app."
},
"pt": {
"e": "Os apps costumam acessar o modelo por uma API, uma porta de entrada que deixa um programa mandar pedidos a outro pela internet. O pedido é uma lista de mensagens: uma instrução que define o papel do modelo, chamada de system prompt, seguida da conversa até ali. A resposta muitas vezes volta em pedacinhos, e é por isso que os chatbots parecem digitar. Configurações como a temperatura, que controla o quanto o texto varia, moldam a resposta.",
"w": "Sempre que você usa um recurso de IA dentro de outro aplicativo, como um assistente de escrita num editor de documentos, esse app está mandando seu texto para um modelo desse jeito e mostrando a resposta. Os desenvolvedores pagam essas chamadas de acordo com a quantidade de texto que entra e sai.",
"p": "Como um programa manda um pedido a um modelo de IA e recebe a resposta de volta. É o passo básico por trás de todo app de IA."
}
},
"retrieval": {
"en": {
"e": "A model only knows what was in its training data, and it can’t see your company’s files. Retrieval fixes this: when a question arrives, the system searches your documents, picks the few passages that look most relevant and adds them to the request alongside the question. The model then writes its answer from that text. This approach is often called RAG, short for retrieval-augmented generation, and it also lets the app show which sources it used.",
"w": "A chatbot on an internal help site that answers questions about your company’s vacation policy, and links to the exact page it used, is doing retrieval. AI search tools that cite web pages work the same way.",
"p": "Finding the right documents or facts and handing them to the model, so it answers from your information instead of from memory alone."
},
"pt": {
"e": "Um modelo só sabe o que estava nos dados de treino e não enxerga os arquivos da sua empresa. A busca resolve isso: quando chega uma pergunta, o sistema procura nos seus documentos, escolhe os poucos trechos que parecem mais relevantes e os acrescenta ao pedido junto com a pergunta. O modelo então escreve a resposta a partir desse texto. Essa abordagem costuma ser chamada de RAG, sigla em inglês para geração aumentada por recuperação, e também permite mostrar quais fontes foram usadas.",
"w": "Um chatbot na intranet que responde sobre a política de férias da empresa e mostra o link da página que usou está fazendo busca. Ferramentas de busca com IA que citam páginas da web funcionam do mesmo jeito.",
"p": "Encontrar os documentos ou fatos certos e entregá-los ao modelo, para que ele responda com base nas suas informações, e não só no que memorizou."
}
},
"embmodel": {
"en": {
"e": "That list of numbers is called an embedding, or a vector. You can think of it as a point on a map with hundreds or even thousands of directions instead of two. The model is trained so that texts with similar meanings land near each other, even when they share no words: “my card was declined” sits close to “payment failed”. Measuring the distance between points then tells a computer how alike two texts are.",
"w": "When a help center finds the right article even though you described your problem in different words, an embedding model is often behind it. Online shops use them to suggest similar products, and support teams use them to group tickets about the same issue.",
"p": "Models that turn a piece of text, or an image, into a list of numbers that captures its meaning, so similar meanings get similar numbers."
},
"pt": {
"e": "Essa lista de números se chama embedding, ou vetor. Dá para pensar nela como um ponto num mapa com centenas ou até milhares de direções, em vez de duas. O modelo é treinado para que textos com significado parecido fiquem perto um do outro, mesmo sem palavras em comum: “meu cartão foi recusado” fica perto de “o pagamento não passou”. Medir a distância entre os pontos diz ao computador o quanto dois textos se parecem.",
"w": "Quando a central de ajuda acha o artigo certo mesmo que você tenha descrito o problema com outras palavras, muitas vezes há um modelo de embedding por trás. Lojas online usam esses modelos para sugerir produtos parecidos, e equipes de suporte, para agrupar chamados sobre o mesmo problema.",
"p": "Modelos que transformam um texto, ou uma imagem, numa lista de números que captura seu significado, de modo que significados parecidos geram números parecidos."
}
},
"vectordb": {
"en": {
"e": "First, an embedding model turns every document into a vector, and the database stores them. When a question comes in, it is turned into a vector too, and the database looks for the stored vectors nearest to it. Comparing against every single item would be too slow, so these databases organize vectors in clever indexes that check only the likely neighbors. They give up a tiny bit of accuracy in exchange for answers in milliseconds.",
"w": "When an internal assistant pulls the handful of policy paragraphs that relate to your question out of thousands of pages, a vector search is usually doing the finding. Recommendation features, like “similar items” in online shops, often use the same technique.",
"p": "A database that stores meaning as lists of numbers, called vectors, and quickly finds the ones closest to your question, even among millions."
},
"pt": {
"e": "Primeiro, um modelo de embedding transforma cada documento num vetor, e o banco guarda esses vetores. Quando chega uma pergunta, ela também vira um vetor, e o banco procura os vetores guardados mais próximos dela. Comparar com cada item seria lento demais, então esses bancos organizam os vetores em índices espertos que só conferem os vizinhos prováveis. Eles abrem mão de um tiquinho de precisão em troca de respostas em milissegundos.",
"w": "Quando um assistente interno separa, entre milhares de páginas, os poucos parágrafos de política interna que têm a ver com a sua pergunta, normalmente é uma busca vetorial que faz esse trabalho. Recursos de recomendação, como “itens parecidos” em lojas online, muitas vezes usam a mesma técnica.",
"p": "Um banco de dados que guarda significados como listas de números, chamadas vetores, e encontra rápido as mais próximas da sua pergunta, mesmo entre milhões."
}
},
"acting": {
"en": {
"e": "The model never presses buttons itself. The app tells it which tools exist, such as “check order status”. When the model decides it needs one, it replies with a short, structured request naming the tool and the details. The app runs the tool and sends the result back, and the model continues. When a model repeats this cycle on its own, choosing the next step until the job is done, the system is called an agent.",
"w": "A chatbot that checks the weather before answering, or a support bot that looks up your package’s tracking status, is using tools. Coding assistants that read files, run tests and fix errors on their own are agents.",
"p": "Giving a model the ability to do things, such as searching the web, looking up an order or sending an email, not just writing text."
},
"pt": {
"e": "O modelo nunca aperta botões sozinho. O app conta a ele quais ferramentas existem, como “consultar status do pedido”. Quando o modelo decide que precisa de uma, responde com um pedido curto e estruturado, dizendo a ferramenta e os detalhes. O app executa a ferramenta e devolve o resultado, e o modelo continua. Quando o modelo repete esse ciclo por conta própria, escolhendo o próximo passo até terminar o trabalho, o sistema é chamado de agente.",
"w": "Um chatbot que consulta a previsão do tempo antes de responder, ou um bot de atendimento que verifica o rastreio da sua encomenda, está usando ferramentas. Assistentes de programação que leem arquivos, rodam testes e corrigem erros sozinhos são agentes.",
"p": "Dar a um modelo a capacidade de fazer coisas, como pesquisar na web, consultar um pedido ou mandar um e-mail, e não só escrever texto."
}
},
"multiagent": {
"en": {
"e": "One model asked to do everything at once can lose track of a long, complicated task. Splitting the work helps: each agent gets a narrower job, its own instructions and only the information it needs. A coordinating agent, often called an orchestrator, hands out the pieces and combines the results. The cost is real, though: every extra agent means more model calls to pay for and more places where something can go wrong.",
"w": "Some AI research tools work this way: one part plans the questions, several others search the web in parallel, and a final step writes up and checks the report. Coding assistants may also hand side tasks, such as searching through code, to helper agents."
},
"pt": {
"e": "Um único modelo encarregado de tudo pode se perder numa tarefa longa e complicada. Dividir o trabalho ajuda: cada agente recebe uma função mais estreita, instruções próprias e só as informações de que precisa. Um agente coordenador, muitas vezes chamado de orquestrador, distribui as partes e junta os resultados. Mas o custo é real: cada agente a mais significa mais chamadas de modelo para pagar e mais pontos onde algo pode dar errado.",
"w": "Algumas ferramentas de pesquisa com IA funcionam assim: uma parte planeja as perguntas, várias outras pesquisam na web ao mesmo tempo e uma etapa final escreve e confere o relatório. Assistentes de programação também podem passar tarefas paralelas, como vasculhar o código, para agentes auxiliares."
}
},
"production": {
"en": {
"e": "A demo only has to work once; a product has to work thousands of times a day for people who type things nobody expected. So teams add layers: tests that measure answer quality, called evaluations, monitoring that shows when something breaks, filters known as guardrails that block harmful or off-topic replies, and limits that keep the bill under control. These pages cover the main pieces: memory, routing between models, and keeping quality and cost in check.",
"w": "Behind any AI feature a company offers its customers, there is usually a team watching how often answers are wrong, how long people wait and how much each conversation costs. When a chatbot politely refuses an off-topic request, that is often a guardrail at work."
},
"pt": {
"e": "Uma demonstração só precisa funcionar uma vez; um produto precisa funcionar milhares de vezes por dia, para pessoas que digitam coisas que ninguém previu. Por isso as equipes acrescentam camadas: testes que medem a qualidade das respostas, chamados de avaliações, monitoramento que mostra quando algo quebra, filtros chamados guardrails que barram respostas nocivas ou fora do assunto, e limites que mantêm a conta sob controle. Estas páginas tratam das peças principais: memória, roteamento entre modelos e controle de qualidade e custo.",
"w": "Por trás de qualquer recurso de IA que uma empresa oferece aos clientes, costuma haver uma equipe acompanhando com que frequência as respostas erram, quanto tempo as pessoas esperam e quanto custa cada conversa. Quando um chatbot recusa educadamente um pedido fora do assunto, muitas vezes é um guardrail em ação."
}
},
"memstate": {
"en": {
"e": "A model starts every request from scratch: it sees only the text sent to it at that moment. A chat feels continuous because the app quietly re-sends the earlier conversation each time. Long conversations eventually exceed how much text the model can take in at once, called its context window, so apps trim or summarize older parts. For longer-lasting memory, the app saves useful facts in a database and adds the relevant ones to future requests.",
"w": "When a chatbot remembers that you prefer short answers or that you work in marketing, even in a brand-new conversation, the app has stored those facts and is sending them along with your messages. Many assistants let you view and delete these saved memories in their settings."
},
"pt": {
"e": "O modelo começa cada pedido do zero: só enxerga o texto enviado naquele momento. A conversa parece contínua porque o app reenvia, sem você ver, as mensagens anteriores a cada vez. Conversas longas acabam passando do limite de texto que o modelo aceita de uma vez, chamado janela de contexto, então os apps cortam ou resumem as partes antigas. Para lembranças mais duradouras, o app guarda fatos úteis num banco de dados e inclui os relevantes nos próximos pedidos.",
"w": "Quando um chatbot lembra que você prefere respostas curtas ou que trabalha com marketing, mesmo numa conversa nova, o app guardou esses fatos e os envia junto com suas mensagens. Muitos assistentes deixam você ver e apagar essas memórias salvas nas configurações."
}
},
"routing": {
"en": {
"e": "Models differ a lot in price and speed. A large model can cost many times more per answer than a small one and take longer to reply, yet most everyday requests don’t need its full power. A router looks at each request first, using simple rules or a small, quick model, and decides where to send it. If the chosen model is down or fails, a backup takes over, so users still get an answer.",
"w": "Some chat assistants decide on their own whether to answer quickly or switch to a slower, more careful model for a hard question. Companies do the same behind their customer service bots to keep costs down without hurting quality on difficult cases."
},
"pt": {
"e": "Os modelos variam muito em preço e velocidade. Um modelo grande pode custar muitas vezes mais por resposta do que um pequeno e demorar mais para responder, mas a maioria dos pedidos do dia a dia não precisa de toda essa força. Um roteador olha cada pedido antes, usando regras simples ou um modelo pequeno e rápido, e decide para onde mandar. Se o modelo escolhido estiver fora do ar ou falhar, um reserva assume, e o usuário continua recebendo resposta.",
"w": "Alguns assistentes de chat decidem sozinhos se respondem rápido ou passam para um modelo mais lento e cuidadoso diante de uma pergunta difícil. Empresas fazem o mesmo por trás dos bots de atendimento, para gastar menos sem perder qualidade nos casos difíceis."
}
},
"trust": {
"en": {
"e": "AI systems can be wrong in ways that sound confident, such as inventing a fact or a source, which is called a hallucination. They can also be tricked: hidden text in a web page or email can steer a model into doing something its user never asked for. On top of that come wider questions about fakes, ownership and blame. This branch covers all three areas: the mistakes to expect, the attacks to guard against, and responsible use.",
"w": "You meet these ideas whenever an AI tool reminds you to check important information, or when your workplace tells you not to paste customer data into a public chatbot. Teachers asking students to say when they used AI are part of the same picture."
},
"pt": {
"e": "Sistemas de IA podem errar com toda a confiança, por exemplo inventando um fato ou uma fonte, o que se chama alucinação. Também podem ser enganados: um texto escondido numa página ou num e-mail pode levar o modelo a fazer algo que o usuário nunca pediu. Além disso, há questões mais amplas sobre falsificações, autoria e responsabilidade. Este ramo trata das três áreas: os erros a esperar, os ataques contra os quais se proteger e o uso responsável.",
"w": "Você encontra essas ideias sempre que uma ferramenta de IA lembra que é bom conferir informações importantes, ou quando sua empresa pede para não colar dados de clientes num chatbot público. Professores pedindo que os alunos avisem quando usaram IA fazem parte do mesmo cenário."
}
},
"society": {
"en": {
"e": "Some problems with AI aren’t technical bugs but questions for people and laws. Realistic fake photos, voices and videos are now easy to make, so it gets harder to trust what you see. Models learn from huge amounts of work made by others, which raises questions about copyright. And when an AI-assisted decision harms someone, a person or company still has to answer for it. Different countries are answering these questions in different ways.",
"w": "Schools are writing rules on when students may use AI and how they should say so. Many social networks now ask creators to label realistic AI-generated content, and phone scams that use cloned voices show why this matters."
},
"pt": {
"e": "Alguns problemas da IA não são falhas técnicas, e sim questões para as pessoas e as leis. Hoje é fácil fazer fotos, vozes e vídeos falsos muito realistas, então fica mais difícil confiar no que se vê. Os modelos aprendem com enormes quantidades de trabalho feito por outras pessoas, o que levanta questões de direito autoral. E quando uma decisão tomada com ajuda de IA prejudica alguém, uma pessoa ou empresa ainda precisa responder por ela. Cada país está respondendo a essas questões de um jeito.",
"w": "Escolas estão criando regras sobre quando os alunos podem usar IA e como devem avisar que usaram. Várias redes sociais pedem que os criadores identifiquem conteúdo realista gerado por IA, e os golpes por telefone com vozes clonadas mostram por que isso importa."
}
},
"copyright": {
"en": {
"e": "Copyright gives creators control over copies of their work. Models are trained on huge amounts of text and images, much of it protected. AI companies argue this is a kind of learning the law allows; many creators say it is copying without permission or payment. Courts and lawmakers are still deciding, and the answer may differ by country. Ownership of outputs is less open in the United States: work made by AI without real human creative input can’t be copyrighted there.",
"w": "Newspapers, book authors and artists have taken AI companies to court over the use of their work in training, while some publishers have signed deals to license their content instead. If you use AI-made text or images in your own work, these rules affect what you can safely publish or claim as yours.",
"p": "Two questions are still open: whether models may be trained on copyrighted work, and who owns what they produce."
},
"pt": {
"e": "O direito autoral dá aos criadores controle sobre as cópias do seu trabalho. Os modelos são treinados com quantidades enormes de textos e imagens, boa parte protegida. As empresas de IA dizem que isso é um tipo de aprendizado permitido pela lei; muitos criadores dizem que é cópia sem autorização nem pagamento. Tribunais e legisladores ainda estão decidindo, e a resposta pode variar de país para país. Nos Estados Unidos, a autoria dos resultados está mais definida: obras feitas por IA sem contribuição criativa humana real não podem ser protegidas.",
"w": "Jornais, autores de livros e artistas processaram empresas de IA pelo uso de suas obras no treino, enquanto algumas editoras preferiram assinar acordos de licenciamento. Se você usa textos ou imagens feitos por IA no seu trabalho, essas regras afetam o que dá para publicar com segurança ou chamar de seu.",
"p": "Duas perguntas continuam em aberto: se os modelos podem ser treinados com obras protegidas e de quem é o que eles produzem."
}
},
"eco": {
"en": {
"e": "Most confusion in AI news comes from mixing up four things. A model is the trained engine. A product is the app people open, such as a chat assistant. A harness wraps a model with tools so it can act, as coding agents do. A provider is the company or service that runs the model for you. Once you can tell these apart, a headline about a “new AI” usually turns out to be one of them.",
"w": "When someone says “I asked ChatGPT”, they name a product. The answer itself came from one of the GPT models running inside it, and the same model may also power other companies’ apps."
},
"pt": {
"e": "Boa parte da confusão nas notícias de IA vem de misturar quatro coisas. O modelo é o motor treinado. O produto é o app que as pessoas abrem, como um assistente de chat. O harness envolve o modelo com ferramentas para ele agir, como fazem os agentes de programação. O provedor é a empresa ou o serviço que roda o modelo para você. Separando essas quatro coisas, a manchete sobre uma “nova IA” quase sempre se encaixa em uma delas.",
"w": "Quando alguém diz “perguntei ao ChatGPT”, está falando de um produto. A resposta veio de um dos modelos GPT rodando lá dentro, e esse mesmo modelo pode estar por trás de apps de outras empresas."
}
},
"access": {
"en": {
"e": "You don’t have to sign up with every AI company to use their models. A gateway gives you one account and one way of calling many models, so switching is a small change. Hosting companies and the big cloud platforms run models on their own powerful computers and charge you per use. And open-weight models can also run on your own computer, with nothing leaving it.",
"w": "A small company can try several models through one gateway before choosing one. A large company often uses AI models through the cloud provider it already has a contract with, so its data stays under the same agreements."
},
"pt": {
"e": "Você não precisa se cadastrar em cada empresa de IA para usar os modelos dela. Um gateway dá uma única conta e um único jeito de chamar muitos modelos, então trocar de um para outro é uma mudança pequena. Empresas de hospedagem e as grandes nuvens rodam os modelos em computadores potentes e cobram por uso. E modelos de pesos abertos também rodam no seu próprio computador, sem que nada saia dele.",
"w": "Uma empresa pequena pode testar vários modelos por um único gateway antes de escolher um. Uma empresa grande costuma usar os modelos pela nuvem com que já tem contrato, para que os dados fiquem sob os mesmos acordos."
}
},
"hosts": {
"en": {
"e": "Running a large model takes expensive graphics chips, so most people rent that work instead of buying the hardware. Inference providers specialize in serving models quickly and cheaply, often open-weight ones. The big cloud platforms sell access to several companies’ models inside the account a business already uses. Either way you send text, get an answer back and pay for the amount of text processed.",
"w": "A company that already keeps its data with a big cloud provider can use AI models through that same provider, under the security and privacy terms it has already agreed."
},
"pt": {
"e": "Rodar um modelo grande exige chips gráficos caros, então a maioria das pessoas aluga esse trabalho em vez de comprar o equipamento. Os provedores de inferência se especializam em servir modelos de forma rápida e barata, muitas vezes os de pesos abertos. As grandes nuvens vendem acesso a modelos de várias empresas dentro da conta que a empresa cliente já usa. Nos dois casos, você envia texto, recebe a resposta e paga pela quantidade de texto processada.",
"w": "Uma empresa que já guarda seus dados num grande provedor de nuvem pode usar modelos de IA por esse mesmo provedor, dentro dos termos de segurança e privacidade que já assinou."
}
},
"buzz": {
"en": {
"e": "AI moves fast, and new labels appear every few months, often for ideas that already exist under another name. This branch translates the most common ones into plain words and links each to the concept underneath, so a new term becomes something you already understand. When you meet an unfamiliar buzzword, it is worth asking which older idea it renames.",
"w": "Posts and headlines such as “vibe coding is replacing developers” or “this model is state of the art on a coding benchmark” use these terms, usually without explaining them."
},
"pt": {
"e": "A IA muda rápido, e a cada poucos meses surgem rótulos novos, muitas vezes para ideias que já existiam com outro nome. Este ramo traduz os mais comuns para palavras simples e liga cada um ao conceito por trás, para que um termo novo vire algo que você já entende. Quando aparecer uma buzzword desconhecida, vale perguntar qual ideia antiga ela está renomeando.",
"w": "Posts e manchetes como “o vibe coding está substituindo os programadores” ou “este modelo é o estado da arte num benchmark de programação” usam esses termos, quase sempre sem explicar."
}
},
"vibe": {
"en": {
