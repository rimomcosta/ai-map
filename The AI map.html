general: {l:"Does it really learn?", f:"Generalization", s:"core",
 p:"A model is only useful if it works on new cases, not just the examples it studied. That ability is called generalization.",
 t:"Training minimizes error on the training data, but the real goal is low error on unseen data from the same source. The gap between the two is the generalization gap. Splitting the data, watching for overfitting and checking that the data matches the real world are how you measure and protect it.",
 h:"Statistical learning theory (Vapnik and Chervonenkis, 1970s) made the question formal; held-out test sets became standard practice in the 1990s.",
 w:"A medical model that works in the hospital where it was built but fails in another one with different scanners.",
 n:"Still the central question in the LLM era, where it is hard to know whether a model reasons about a problem or has seen it before.",
 m:"A high score on the training data proves nothing. A model that memorized every example scores 100% and is useless.",
 k:"Like the difference between a student who understands the subject and one who memorized last year’s exam."},

datasplit: {l:"Training, validation & test sets", s:"core",
 p:"Split your data into three piles: one to learn from, one to tune with, and one kept locked away for the final exam.",
 t:"The training set fits the model’s weights. The validation set is used to choose settings (hyperparameters) and decide when to stop. The test set is used once, at the end, for an honest estimate. A common split is 80/10/10; with little data, k-fold cross-validation rotates which part is held out.",
 h:"Standard since shared benchmark datasets such as MNIST (1998) and ImageNet (2009) came with fixed test sets.",
 w:"Kaggle competitions hide part of the test data so nobody can tune their model to it.",
 n:"For LLMs the same idea appears as held-out evaluation sets, kept private so they don’t end up in training data.",
 m:"If you keep adjusting the model until the test score looks good, the test set has become training data, and the score no longer means anything.",
 k:"Like homework, practice tests and the final exam: you learn from the first, check yourself with the second, and only the third counts."},

overfit: {l:"Overfitting & underfitting", s:"core",
 p:"Overfitting is memorizing the examples instead of learning the pattern. Underfitting is not learning enough of the pattern in the first place.",
 t:"An overfit model has low training error and high test error; an underfit model is poor on both. Remedies for overfitting: more data, a simpler model, regularization (weight decay, dropout), early stopping and data augmentation. For underfitting: a larger model, better features or longer training.",
 h:"Known in statistics as the bias–variance trade-off. Dropout (2012–2014) became a standard defence in deep learning.",
 w:"A stock-price model that fits ten years of history perfectly and loses money in its first week of real trading.",
 n:"Very large models can fit their training data completely and still generalize well, which is an active research topic. In fine-tuning, overfitting to a small dataset is still an everyday problem.",
 m:"A bigger model isn’t automatically more overfit. What matters is the gap between performance on the training data and on new data.",
 k:"Like memorizing the answers to last year’s test: perfect on those questions, lost when the questions change."},

leakage: {l:"Data leakage", s:"core",
 p:"When information the model shouldn’t have slips into its training, so it looks brilliant in tests and fails in real use.",
 t:"Common causes: the same or near-identical examples in both training and test sets; features that secretly contain the answer (a “cancellation date” column when predicting who will cancel); preprocessing fitted on all the data before splitting; and using future data to predict the past in time series.",
 w:"A model that predicted a disease almost perfectly, because one input column recorded the treatment patients were already receiving for it.",
 n:"For LLMs the equivalent is benchmark contamination: test questions that appear in the training data inflate the scores.",
 m:"A surprisingly high score is a reason to investigate, not to celebrate. Leakage is one of the most common causes of results that are too good to be true.",
 k:"Like an exam where the answer key was accidentally stapled to the question sheet."},

shift: {l:"Distribution shift", s:"core",
 p:"The world changes, and the data the model meets in real use stops looking like the data it was trained on.",
 t:"Covariate shift: the inputs change (a new camera, new slang). Concept shift: the right answer for the same input changes (what counts as fraud). Models are tested on data like their training data, so performance can drop without anyone noticing. Monitoring live inputs and retraining regularly are the usual defences.",
 w:"Demand forecasts and fraud models built on pre-2020 data broke when shopping habits changed overnight in the pandemic.",
 n:"A standard part of running machine learning in production. LLMs meet it as new events, products and slang after their training cutoff.",
 m:"A model doesn’t stay as accurate as it was on launch day. Accuracy is measured against a moment in time.",
 k:"Like studying with an old map: fine until the roads change."},

dataq: {l:"Data quality & labels", s:"core",
 p:"A model can only be as good as the examples it learns from. Wrong, missing or one-sided data produces a wrong or one-sided model.",
 t:"Typical problems: label errors, duplicates, missing groups, outdated records and classes with very few examples. Even famous benchmark datasets contain a few percent of wrong labels. The fixes are unglamorous: clear labeling guidelines, several annotators per item, audits of random samples and documentation of where the data came from.",
 h:"“Garbage in, garbage out” dates from the early days of computing. The data-centric AI movement (around 2021) argued for improving the data before changing the model.",
 w:"A face-recognition system that works worse for groups that were rare in its training photos.",
 n:"For LLMs, curating and filtering training data is one of the main quality levers, and one of the least published.",
 m:"More data isn’t always better. A smaller, clean and representative dataset often beats a huge messy one.",
 k:"Like cooking: no recipe can rescue spoiled ingredients."},

trust: {l:"Limits & safe use", s:"core",
 p:"The practical lens: where AI goes wrong, how it can be attacked, and the habits that keep people safe when using it.",
 t:"Three groups. Limits: mistakes that come from how models work, such as hallucinations and bias. Security: attacks on systems built around models, and the controls that contain them. Responsibility: effects on people and society, and who answers for the results.",
 w:"A company policy that says which data may go into a chatbot, which actions an agent may take alone, and who reviews its output.",
 n:"Essential for anyone using AI at school or at work, not only for engineers.",
 m:"Safe use isn’t about distrusting AI entirely. It is about knowing which mistakes to expect and checking where it matters.",
 k:"Like learning to drive: knowing how the engine works is useful, but knowing the rules of the road is what keeps you safe."},

limits: {l:"What AI gets wrong", s:"core",
 p:"Language models have typical ways of failing. Knowing them tells you when to double-check.",
 t:"The failures follow from the design: a model predicts plausible text from patterns in its training data. It has no built-in fact check, no reliable sense of what it doesn’t know, no knowledge after its cutoff date, and it repeats the biases of its data.",
 w:"Lawyers have been fined for filing court documents that cited cases a chatbot invented.",
 n:"Newer models make fewer of these mistakes, but none has eliminated them.",
 m:"These aren’t rare bugs waiting for a fix. They follow from how the technology works, so the habits for handling them stay useful.",
 k:"Like a very well-read friend who never says “I don’t know”: usually helpful, occasionally wrong with a straight face."},

halluc: {l:"Hallucinations", s:"core",
 p:"When a model states something false or made up as if it were fact.",
 t:"A language model is trained to produce likely text, not verified text. When it lacks the information, the most likely continuation is still a fluent, specific-sounding answer: an invented quote, a wrong date, a citation that doesn’t exist. Retrieval, web search and asking the model to quote its sources reduce the problem; they don’t remove it.",
 h:"The term spread with neural translation and summarization around 2018 and became mainstream with ChatGPT in 2022–2023.",
 w:"In 2023 a New York lawyer filed a brief citing six court cases that ChatGPT had invented.",
 n:"Rates keep falling in newer models and are much lower when the model works from supplied documents. The risk is highest exactly where it is hardest to check: obscure facts, numbers, names and references.",
 m:"The model isn’t lying, and it doesn’t know when it is wrong. It writes true and false sentences in exactly the same way.",
 k:"Like a student who didn’t study but writes a confident, well-structured essay anyway."},

confid: {l:"Confidence isn’t correctness", f:"Calibration and uncertainty", s:"core",
 p:"A model sounding sure tells you almost nothing about whether it is right.",
 t:"A well-calibrated system that says “90% sure” is right about 90% of the time. Language models write in a fluent, assured tone by default, and the confidence they express in words is only loosely linked to their accuracy. They can also give different answers to the same question on different runs, because each next token is sampled.",
 w:"Ask a chatbot “are you sure?” and it will often switch to a different answer, whether the first one was right or wrong.",
 n:"An active research area. Some products now show sources or flag low confidence, but there is no reliable “certainty meter” yet.",
 m:"Asking the model to rate its own confidence doesn’t give you a trustworthy number. Check important answers against an independent source instead.",
 k:"Like a confident stranger giving directions: the firm tone says nothing about whether they know the way."},

cutoff: {l:"Knowledge cutoff", s:"core",
 p:"A model only knows what was in its training data, which stops at a certain date.",
 t:"Training takes months, so every model is frozen at a cutoff date before its release. Anything later is unknown to it unless the application supplies it through web search, retrieval or the conversation itself. Models may also be unsure of their own cutoff or of today’s date.",
 w:"Ask about yesterday’s match: without web search the model either says it can’t know or guesses.",
 n:"Most chat apps now add web search, which hides the cutoff for common questions. It still matters for APIs, local models and niche topics.",
 m:"A chatbot that searches the web hasn’t “learned” the news. It is reading search results on the spot, and the model underneath is unchanged.",
 k:"Like someone back from six months at a remote research station: smart, but unaware of anything that happened while they were away."},

biasfair: {l:"Bias & fairness", s:"core",
 p:"Models learn from human-made data, so they pick up human stereotypes and imbalances, and can repeat them at scale.",
 t:"Bias enters through unbalanced training data, through labels that encode past decisions, and through the choice of what to optimize. It shows up as worse accuracy for some groups or as stereotyped outputs. Mitigation combines better data, testing results per group, and human review of decisions that affect people.",
 h:"Amazon dropped a CV-screening tool in 2018 after it learned to penalize CVs that mentioned women’s organizations. The Gender Shades study (2018) found face analysis far less accurate for darker-skinned women.",
 w:"Image generators that draw only men when asked for “an engineer”.",
 n:"Regulators increasingly require bias testing for high-impact uses such as hiring, credit and healthcare.",
 m:"A model isn’t neutral just because it is mathematical. It reflects the data and goals people gave it.",
 k:"Like a mirror of everything it has read: it reflects the good and the unfair alike."},

verify: {l:"Checking sources & citations", s:"core",
 p:"Treat an AI answer as a draft from a helpful stranger: useful, but verify what matters before you rely on it.",
 t:"Practical checks: open cited links and confirm they exist and say what is claimed; cross-check key facts, numbers and quotes with an independent source; ask the model to quote the passage it relied on; be most careful with names, dates, statistics, and legal and medical claims. Answers grounded in documents you supplied are more reliable but can still misread them.",
 w:"A student looks up every reference a chatbot suggests in the library catalogue before putting it in an essay.",
 n:"Search-connected assistants now show sources by default. A citation next to a sentence still doesn’t guarantee that the source supports it.",
 m:"A link isn’t proof. Models can attach real sources to claims those sources never make, or invent sources entirely.",
 k:"Like a tip from a friend of a friend: worth following up, not worth repeating as fact until you have checked."},

security: {l:"Security", s:"core",
 p:"Once a model can read your files or take actions, it becomes something attackers try to trick.",
 t:"A language model can’t reliably tell instructions from data: everything arrives as text. Attacks exploit that, and defences work around the model rather than inside it: limit what it can access, check inputs and outputs, and require approval for actions that matter.",
 w:"An email assistant that can read, write and send mail is useful, and a target.",
 n:"The main obstacle to giving AI agents more autonomy.",
 m:"A clever system prompt isn’t a security control. Anything the model can be told, it can be talked out of.",
 k:"Like hiring an eager new assistant who believes every note left on their desk: you limit their keys until trust is earned."},

injection: {l:"Prompt injection", s:"core",
 p:"Hiding instructions inside content the AI reads, so it follows the attacker instead of the user.",
 t:"Direct injection: the user types “ignore your previous instructions”. Indirect injection: the instruction sits in a web page, email, document or tool result that the model processes. Because the model sees one stream of text, it may obey. There is no complete fix; defences are layered: separate trusted from untrusted content, filter inputs, limit permissions and require human approval.",
 h:"Named in September 2022, when people made a GPT-3-based Twitter bot ignore its instructions.",
 w:"A hidden line in a web page tells a browsing assistant to send the user’s private data to another site.",
 n:"Ranked first in OWASP’s list of risks for LLM applications, and the central security problem for AI agents.",
 m:"Prompt injection isn’t the same as jailbreaking. Injection hijacks an application through the content it reads; a jailbreak talks the model itself out of its safety rules.",
 k:"Like a forged note slipped into a pile of paperwork: “The boss says give the bearer the keys.”"},

jailbreak: {l:"Jailbreaks", s:"wide",
 p:"Tricks that talk a model into ignoring its own safety rules.",
 t:"Role-play framings, invented scenarios, encoded text and long multi-step conversations are used to get content the model was trained to refuse. Providers respond with safety training, input and output classifiers and monitoring, and attackers adapt.",
 h:"The “DAN” (Do Anything Now) prompts for ChatGPT spread in early 2023.",
 w:"Asking for harmful instructions “as a line in a film script”.",
 n:"An ongoing contest. Companies run red-team exercises and bug bounties to find jailbreaks before others do.",
 m:"A jailbreak doesn’t unlock a hidden, smarter model. It only removes refusals, and the answers are no more reliable than before.",
 k:"Like sweet-talking a bouncer into letting you past the rope."},

perms: {l:"Permissions & least privilege", s:"core",
 p:"Give an AI system access only to what it needs for the task, and nothing more.",
 t:"Access control decides which data the system can read; tool permissions decide which actions it can take (read-only versus write, send, delete, pay). The assistant should never have more rights than the person using it. Other controls: sandboxes, allow-lists of tools and sites, spending limits, short-lived credentials and a log of every action.",
 w:"A coding agent that may read the project and run tests freely but must ask before deleting files or pushing code.",
 n:"The most dependable defence for agents: if the model is tricked, the damage is limited to what it was allowed to do.",
 m:"Telling the model “never delete files” in a prompt isn’t a permission. A real permission is enforced by the software around the model, which can’t be talked out of it.",
 k:"Like giving a house-sitter the front-door key but not the key to the safe."},

hitl: {l:"Human approval", f:"Human in the loop", s:"core",
 p:"A person reviews and confirms before the AI does anything that matters or can’t be undone.",
 t:"The system pauses at defined points and shows what it intends to do: send this email, run this command, make this payment. Low-risk, reversible steps can run automatically; high-risk ones wait for a yes. Good design keeps approvals rare and clear, because people who are asked too often start clicking “approve” without reading.",
 w:"Coding agents ask before running commands that change files; banking assistants draft a transfer and wait for the customer to confirm.",
 n:"Standard practice for agents, and required by regulation for some high-risk uses.",
 m:"A human in the loop only helps if the human really looks. Rubber-stamping every request gives the appearance of oversight without the protection.",
 k:"Like a pharmacist checking a prescription before handing over the medicine."},

privacy: {l:"Privacy & sensitive data", s:"core",
 p:"What you type into an AI tool goes to someone else’s computer. Think before sharing personal or confidential information.",
 t:"Questions to ask: is the conversation stored, for how long, and can it be used to train future models? Consumer apps and business plans often have different rules, and many offer an opt-out. Options for sensitive work include business agreements that exclude training, removing names and identifiers first, or running an open-weight model locally.",
 w:"In 2023 Samsung restricted staff use of chatbots after engineers pasted confidential source code into one.",
 n:"Privacy laws such as the GDPR in Europe and the LGPD in Brazil apply to personal data put into AI tools.",
 m:"A “private” chat isn’t necessarily private from the provider. Check the settings and the terms, especially on free plans.",
 k:"Like a postcard rather than a sealed letter: assume others along the way could read it, unless you know otherwise."},

society: {l:"Responsible use", s:"core",
 p:"AI changes what can be faked, who owns what, and who answers when things go wrong.",
 t:"Three questions that technology alone doesn’t settle: how to tell real media from generated media, how copyright applies to training data and to outputs, and who is accountable for decisions made with AI. Laws and norms are still being written and differ between countries.",
 w:"Schools writing rules for when students may use AI and how they should say so.",
 n:"Moving quickly: the EU AI Act entered into force in 2024 and applies in stages.",
 m:"“The AI decided” isn’t an answer. People choose to build, deploy and rely on these systems.",
 k:"Like any powerful tool, from cars to medicines: society adds rules as it learns what can go wrong."},

deepfake: {l:"Deepfakes & synthetic media", s:"core",
 p:"Realistic fake images, audio and video of real people, now cheap and fast to make.",
 t:"Image and video generators and voice-cloning models can imitate a person from a few photos or seconds of audio. Detection tools exist but are unreliable. The stronger approach is provenance: labeling AI content, watermarks, and signed metadata such as Content Credentials (C2PA) that record where a file came from.",
 h:"The word comes from a 2017 Reddit account that posted face-swapped videos made with deep learning.",
 w:"Scam calls that clone a relative’s voice to ask for money urgently.",
 n:"Many platforms now label AI-generated media, and several countries have laws against non-consensual and deceptive deepfakes.",
 m:"You can no longer reliably spot a fake by looking for odd hands or strange blinking. Check the source and look for confirmation elsewhere.",
 k:"Like a perfect forgery of someone’s signature, except it is their face and voice."},

copyright: {l:"Copyright & ownership", s:"wide",
 p:"Two open questions: may models be trained on copyrighted work, and who owns what they produce?",
 t:"Training: models learn from huge collections of text, images and code, much of it copyrighted. Whether that is permitted depends on the country and is being decided in court cases and new laws. Outputs: in several countries, including the United States, content produced by AI without meaningful human creative input can’t be copyrighted. Models can also sometimes reproduce training material closely.",
 w:"Newspapers, authors and artists have sued AI companies over training data; other publishers have signed licensing deals.",
 n:"Unsettled and changing. For anything commercial, check the tool’s terms and the rules where you live.",
 m:"“It’s on the internet” doesn’t mean free to use, and “the AI made it” doesn’t automatically mean you own it.",
 k:"Like sampling in music: the technology arrived first, and the rules are being worked out afterwards."},

account: {l:"Accountability", s:"core",
 p:"A model can’t be held responsible. The people and organizations that use it still are.",
 t:"Good practice: say when AI was used; keep a named person responsible for each AI-assisted decision; give the people affected a way to question the result; keep records of what the system did. Frameworks such as the NIST AI Risk Management Framework and laws such as the EU AI Act turn these into requirements for high-risk uses.",
 w:"In 2024 a tribunal held Air Canada to a refund policy that its website chatbot had invented.",
 n:"Becoming law in more places, with the strictest duties for uses that affect health, jobs, credit and rights.",
 m:"Using AI doesn’t move the responsibility to the tool. If you hand in, publish or act on its output, it is yours.",
 k:"Like signing a document someone else drafted: once your name is on it, it is your responsibility."}
};

updPT("openvs", {

 t:"Pesos abertos: os parâmetros finais podem ser baixados, normalmente com o código de inferência. Para “IA de código aberto”, este mapa usa a definição da Open Source Initiative (OSAID 1.0, 2024): os pesos, o código usado para treinar e rodar o modelo e informação sobre os dados detalhada o bastante para que uma pessoa capacitada construa um sistema substancialmente equivalente. Isso significa descrever todos os dados de treino e dizer onde obter as partes que podem ser compartilhadas; não exige publicar cada conjunto de dados. As licenças também importam: MIT e Apache 2.0 são permissivas, enquanto outras restringem uso comercial ou empresas muito grandes.",

general: {l:"Aprendeu de verdade?", f:"Generalização",
 p:"Um modelo só é útil se funcionar em casos novos, não apenas nos exemplos que estudou. Essa capacidade se chama generalização.",
 t:"O treino minimiza o erro nos dados de treino, mas o objetivo real é errar pouco em dados nunca vistos da mesma origem. A diferença entre os dois é a lacuna de generalização. Dividir os dados, vigiar o overfitting e conferir se os dados correspondem ao mundo real são as formas de medi-la e protegê-la.",
 h:"A teoria do aprendizado estatístico (Vapnik e Chervonenkis, anos 1970) formalizou a questão; conjuntos de teste separados viraram prática padrão nos anos 1990.",
 w:"Um modelo médico que funciona no hospital onde foi criado, mas falha em outro com aparelhos diferentes.",
 n:"Continua sendo a questão central na era dos LLMs, em que é difícil saber se o modelo raciocina sobre um problema ou se já o viu antes.",
 m:"Uma nota alta nos dados de treino não prova nada. Um modelo que decorou todos os exemplos tira 100% e não serve para nada.",
 k:"Como a diferença entre o aluno que entendeu a matéria e o que decorou a prova do ano passado."},

datasplit: {l:"Conjuntos de treino, validação e teste",
 p:"Divida os dados em três partes: uma para aprender, uma para ajustar e uma guardada a sete chaves para a prova final.",
 t:"O conjunto de treino ajusta os pesos do modelo. O de validação serve para escolher configurações (hiperparâmetros) e decidir quando parar. O de teste é usado uma única vez, no fim, para uma estimativa honesta. Uma divisão comum é 80/10/10; com poucos dados, a validação cruzada k-fold reveza a parte que fica de fora.",
 h:"Padrão desde que conjuntos de referência como o MNIST (1998) e o ImageNet (2009) passaram a vir com conjuntos de teste fixos.",
 w:"As competições do Kaggle escondem parte dos dados de teste para que ninguém ajuste o modelo a eles.",
 n:"Nos LLMs, a mesma ideia aparece como conjuntos de avaliação reservados, mantidos privados para não irem parar nos dados de treino.",
 m:"Se você continua ajustando o modelo até a nota no teste ficar boa, o conjunto de teste virou dado de treino, e a nota deixa de significar alguma coisa.",
 k:"Como lição de casa, simulados e prova final: você aprende com a primeira, se testa com os segundos, e só a terceira vale nota."},

overfit: {l:"Overfitting e underfitting", f:"Sobreajuste e subajuste",
 p:"Overfitting é decorar os exemplos em vez de aprender o padrão. Underfitting é nem chegar a aprender o padrão direito.",
 t:"Um modelo com overfitting tem erro baixo no treino e alto no teste; com underfitting, vai mal nos dois. Remédios para o overfitting: mais dados, um modelo mais simples, regularização (weight decay, dropout), parada antecipada e aumento de dados. Para o underfitting: um modelo maior, características melhores ou mais tempo de treino.",
 h:"Conhecido na estatística como o dilema viés–variância. O dropout (2012–2014) virou uma defesa padrão no deep learning.",
 w:"Um modelo de preço de ações que se encaixa perfeitamente em dez anos de histórico e perde dinheiro na primeira semana de operação real.",
 n:"Modelos muito grandes conseguem decorar todo o conjunto de treino e ainda generalizar bem, o que é tema ativo de pesquisa. No fine-tuning, o overfitting num conjunto pequeno continua sendo um problema do dia a dia.",
 m:"Um modelo maior não tem automaticamente mais overfitting. O que importa é a distância entre o desempenho nos dados de treino e em dados novos.",
 k:"Como decorar as respostas da prova do ano passado: perfeito naquelas questões, perdido quando as questões mudam."},

leakage: {l:"Vazamento de dados", f:"Data leakage",
 p:"Quando uma informação que o modelo não deveria ter escapa para o treino, e ele parece brilhante nos testes e falha no uso real.",
 t:"Causas comuns: exemplos iguais ou quase iguais no treino e no teste; características que escondem a resposta (uma coluna “data de cancelamento” ao prever quem vai cancelar); pré-processamento ajustado em todos os dados antes da divisão; e uso de dados do futuro para prever o passado em séries temporais.",
 w:"Um modelo que previa uma doença quase com perfeição, porque uma das colunas registrava o tratamento que os pacientes já estavam recebendo para ela.",
 n:"Nos LLMs, o equivalente é a contaminação de benchmarks: questões de teste que aparecem nos dados de treino inflam as notas.",
 m:"Uma nota surpreendentemente alta é motivo para investigar, não para comemorar. O vazamento é uma das causas mais comuns de resultados bons demais para ser verdade.",
 k:"Como uma prova em que o gabarito foi grampeado, sem querer, junto com as questões."},

shift: {l:"Mudança de distribuição", f:"Distribution shift",
 p:"O mundo muda, e os dados que o modelo encontra no uso real deixam de se parecer com os dados em que foi treinado.",
 t:"Mudança nas entradas: os dados mudam (uma câmera nova, gírias novas). Mudança de conceito: a resposta certa para a mesma entrada muda (o que conta como fraude). Os modelos são testados em dados parecidos com os de treino, então o desempenho pode cair sem ninguém perceber. Monitorar as entradas reais e retreinar com regularidade são as defesas usuais.",
 w:"Previsões de demanda e modelos de fraude feitos com dados anteriores a 2020 quebraram quando os hábitos de compra mudaram da noite para o dia na pandemia.",
 n:"Parte normal de manter machine learning em produção. Os LLMs sentem isso com eventos, produtos e gírias que surgem depois da data de corte do treino.",
 m:"Um modelo não continua tão preciso quanto era no dia do lançamento. A precisão é medida em relação a um momento no tempo.",
 k:"Como estudar com um mapa antigo: funciona até as ruas mudarem."},

dataq: {l:"Qualidade dos dados e rótulos",
 p:"Um modelo só pode ser tão bom quanto os exemplos com que aprende. Dados errados, incompletos ou parciais geram um modelo errado ou parcial.",
 t:"Problemas típicos: rótulos errados, duplicatas, grupos ausentes, registros desatualizados e classes com pouquíssimos exemplos. Até conjuntos de referência famosos têm alguns por cento de rótulos errados. As soluções não têm glamour: regras claras de rotulagem, vários anotadores por item, auditoria de amostras aleatórias e documentação da origem dos dados.",
 h:"“Entra lixo, sai lixo” vem dos primeiros tempos da computação. O movimento de IA centrada em dados (por volta de 2021) defendeu melhorar os dados antes de mexer no modelo.",
 w:"Um sistema de reconhecimento facial que funciona pior para grupos que eram raros nas fotos de treino.",
 n:"Nos LLMs, selecionar e filtrar os dados de treino é uma das principais alavancas de qualidade, e uma das menos divulgadas.",
 m:"Mais dados nem sempre é melhor. Um conjunto menor, limpo e representativo muitas vezes vence um conjunto enorme e bagunçado.",
 k:"Como cozinhar: nenhuma receita salva ingredientes estragados."},

trust: {l:"Limites e uso seguro",
 p:"A lente prática: onde a IA erra, como ela pode ser atacada e os hábitos que mantêm as pessoas seguras ao usá-la.",
 t:"Três grupos. Limites: erros que vêm do modo como os modelos funcionam, como alucinações e vieses. Segurança: ataques a sistemas construídos em volta de modelos e os controles que os contêm. Responsabilidade: efeitos sobre as pessoas e a sociedade, e quem responde pelos resultados.",
 w:"Uma política de empresa que diz quais dados podem entrar num chatbot, quais ações um agente pode tomar sozinho e quem revisa o que ele produz.",
 n:"Essencial para qualquer pessoa que use IA na escola ou no trabalho, não só para engenheiros.",
 m:"Usar com segurança não é desconfiar de tudo na IA. É saber quais erros esperar e conferir onde importa.",
 k:"Como aprender a dirigir: saber como o motor funciona ajuda, mas é conhecer as regras de trânsito que mantém você seguro."},

limits: {l:"O que a IA erra",
 p:"Os modelos de linguagem têm jeitos típicos de falhar. Conhecê-los mostra quando conferir duas vezes.",
 t:"As falhas vêm do próprio projeto: o modelo prevê texto plausível a partir de padrões dos dados de treino. Ele não tem checagem de fatos embutida, não tem uma noção confiável do que não sabe, não conhece nada depois da data de corte e repete os vieses dos seus dados.",
 w:"Advogados já foram multados por apresentar à Justiça documentos que citavam casos inventados por um chatbot.",
 n:"Modelos mais novos cometem menos desses erros, mas nenhum os eliminou.",
 m:"Não são bugs raros à espera de correção. Eles vêm do modo como a tecnologia funciona, então os hábitos para lidar com eles continuam valendo.",
 k:"Como um amigo muito lido que nunca diz “não sei”: quase sempre ajuda, às vezes erra com a maior naturalidade."},

halluc: {l:"Alucinações",
 p:"Quando o modelo afirma algo falso ou inventado como se fosse fato.",
 t:"Um modelo de linguagem é treinado para produzir texto provável, não texto verificado. Quando falta a informação, a continuação mais provável ainda é uma resposta fluente e cheia de detalhes: uma citação inventada, uma data errada, uma referência que não existe. Busca em documentos, pesquisa na web e pedir ao modelo que cite suas fontes reduzem o problema; não o eliminam.",
 h:"O termo se espalhou com a tradução e o resumo neurais por volta de 2018 e ficou popular com o ChatGPT em 2022–2023.",
 w:"Em 2023, um advogado de Nova York apresentou uma petição citando seis processos que o ChatGPT tinha inventado.",
 n:"As taxas continuam caindo nos modelos mais novos e são bem menores quando o modelo trabalha a partir de documentos fornecidos. O risco é maior justamente onde é mais difícil conferir: fatos obscuros, números, nomes e referências.",
 m:"O modelo não está mentindo e não sabe quando está errado. Ele escreve frases verdadeiras e falsas exatamente do mesmo jeito.",
 k:"Como um aluno que não estudou, mas escreve mesmo assim uma redação confiante e bem estruturada."},

confid: {l:"Confiança não é acerto", f:"Calibração e incerteza",
 p:"O modelo parecer seguro não diz quase nada sobre ele estar certo.",
 t:"Um sistema bem calibrado que diz “90% de certeza” acerta cerca de 90% das vezes. Os modelos de linguagem escrevem, por padrão, num tom fluente e seguro, e a confiança que expressam em palavras tem pouca relação com o acerto. Eles também podem dar respostas diferentes à mesma pergunta em execuções diferentes, porque cada próximo token é sorteado.",
 w:"Pergunte “tem certeza?” a um chatbot e ele muitas vezes muda para outra resposta, estivesse a primeira certa ou errada.",
 n:"Área ativa de pesquisa. Alguns produtos já mostram fontes ou sinalizam baixa confiança, mas ainda não existe um “medidor de certeza” confiável.",
 m:"Pedir ao modelo que dê uma nota para a própria confiança não gera um número em que se possa confiar. Em vez disso, confira as respostas importantes numa fonte independente.",
 k:"Como um desconhecido que explica o caminho com toda a segurança: o tom firme não diz se ele sabe mesmo onde fica."},

cutoff: {l:"Data de corte do conhecimento", f:"Knowledge cutoff",
 p:"O modelo só sabe o que estava nos dados de treino, que param numa certa data.",
 t:"O treino leva meses, então todo modelo fica congelado numa data de corte anterior ao lançamento. O que veio depois é desconhecido para ele, a não ser que a aplicação forneça por pesquisa na web, busca em documentos ou na própria conversa. Os modelos também podem não saber ao certo a própria data de corte nem a data de hoje.",
 w:"Pergunte sobre o jogo de ontem: sem pesquisa na web, o modelo ou diz que não tem como saber ou chuta.",
 n:"A maioria dos apps de chat hoje inclui pesquisa na web, o que esconde a data de corte nas perguntas comuns. Ela continua importando em APIs, modelos locais e assuntos de nicho.",
 m:"Um chatbot que pesquisa na web não “aprendeu” as notícias. Ele está lendo os resultados da busca na hora, e o modelo por baixo continua o mesmo.",
 k:"Como alguém que voltou de seis meses numa estação de pesquisa isolada: inteligente, mas sem saber de nada do que aconteceu enquanto esteve fora."},

biasfair: {l:"Viés e justiça",
 p:"Os modelos aprendem com dados feitos por pessoas, então absorvem estereótipos e desequilíbrios humanos, e podem repeti-los em grande escala.",
 t:"O viés entra por dados de treino desequilibrados, por rótulos que carregam decisões do passado e pela escolha do que otimizar. Ele aparece como precisão pior para alguns grupos ou como respostas estereotipadas. Para reduzi-lo, combinam-se dados melhores, testes de resultado por grupo e revisão humana das decisões que afetam pessoas.",
 h:"A Amazon abandonou em 2018 uma ferramenta de triagem de currículos depois que ela aprendeu a penalizar currículos que mencionavam organizações de mulheres. O estudo Gender Shades (2018) mostrou que a análise facial era bem menos precisa para mulheres de pele mais escura.",
 w:"Geradores de imagem que só desenham homens quando se pede “um engenheiro”.",
 n:"Reguladores exigem cada vez mais testes de viés em usos de alto impacto, como contratação, crédito e saúde.",
 m:"Um modelo não é neutro só por ser matemático. Ele reflete os dados e os objetivos que as pessoas lhe deram.",
 k:"Como um espelho de tudo o que leu: reflete tanto o que é bom quanto o que é injusto."},

verify: {l:"Conferindo fontes e citações",
 p:"Trate uma resposta de IA como o rascunho de um desconhecido prestativo: útil, mas confira o que importa antes de confiar.",
 t:"Checagens práticas: abra os links citados e confirme que existem e dizem o que foi afirmado; confira fatos, números e citações importantes numa fonte independente; peça ao modelo que transcreva o trecho em que se baseou; redobre o cuidado com nomes, datas, estatísticas e afirmações jurídicas e médicas. Respostas baseadas em documentos que você forneceu são mais confiáveis, mas ainda podem interpretá-los mal.",
 w:"Uma estudante procura no catálogo da biblioteca cada referência sugerida por um chatbot antes de colocá-la no trabalho.",

 m:"Um link não é prova. Os modelos podem ligar fontes reais a afirmações que essas fontes nunca fizeram, ou inventar fontes do zero.",
 k:"Como uma dica de um amigo de um amigo: vale investigar, mas não vale repetir como fato antes de conferir."},

security: {l:"Segurança",
 p:"Quando um modelo pode ler seus arquivos ou executar ações, ele vira algo que atacantes tentam enganar.",
 t:"Um modelo de linguagem não distingue de forma confiável instruções de dados: tudo chega como texto. Os ataques exploram isso, e as defesas agem em volta do modelo, não dentro dele: limitar o que ele pode acessar, verificar entradas e saídas e exigir aprovação para ações que importam.",
 w:"Um assistente de e-mail que pode ler, escrever e enviar mensagens é útil, e é um alvo.",
 n:"O principal obstáculo para dar mais autonomia aos agentes de IA.",
 m:"Um prompt de sistema esperto não é um controle de segurança. Tudo o que se pode dizer ao modelo, alguém pode convencê-lo a ignorar.",
 k:"Como contratar um assistente novo e empolgado que acredita em todo bilhete deixado na mesa: você limita as chaves dele até a confiança ser conquistada."},

injection: {l:"Prompt injection", f:"Injeção de prompt",
 p:"Esconder instruções dentro do conteúdo que a IA lê, para que ela obedeça ao atacante em vez do usuário.",
 t:"Injeção direta: o usuário digita “ignore suas instruções anteriores”. Injeção indireta: a instrução está numa página web, num e-mail, num documento ou no resultado de uma ferramenta que o modelo processa. Como o modelo enxerga um único fluxo de texto, ele pode obedecer. Não existe correção completa; as defesas são em camadas: separar conteúdo confiável do não confiável, filtrar entradas, limitar permissões e exigir aprovação humana.",
 h:"Ganhou nome em setembro de 2022, quando pessoas fizeram um bot do Twitter baseado em GPT-3 ignorar suas instruções.",
 w:"Uma linha escondida numa página web manda um assistente de navegação enviar os dados privados do usuário para outro site.",
 n:"Primeiro lugar na lista de riscos da OWASP para aplicações com LLM, e o problema central de segurança dos agentes de IA.",
 m:"Prompt injection não é o mesmo que jailbreak. A injeção sequestra uma aplicação pelo conteúdo que ela lê; o jailbreak convence o próprio modelo a abandonar suas regras de segurança.",
 k:"Como um bilhete falso enfiado numa pilha de papéis: “O chefe mandou entregar as chaves ao portador.”"},

jailbreak: {l:"Jailbreaks",
 p:"Truques que convencem um modelo a ignorar as próprias regras de segurança.",
 t:"Encenações, cenários inventados, texto codificado e longas conversas em várias etapas são usados para obter conteúdo que o modelo foi treinado a recusar. Os provedores respondem com treino de segurança, classificadores de entrada e saída e monitoramento, e os atacantes se adaptam.",
 h:"Os prompts “DAN” (Do Anything Now) para o ChatGPT se espalharam no começo de 2023.",
 w:"Pedir instruções perigosas “como uma fala de um roteiro de filme”.",
 n:"Uma disputa permanente. As empresas fazem exercícios de red team e pagam recompensas para encontrar jailbreaks antes dos outros.",
 m:"Um jailbreak não libera um modelo escondido e mais inteligente. Ele só remove as recusas, e as respostas não ficam mais confiáveis do que antes.",
 k:"Como convencer o segurança da porta, na conversa, a deixar você passar."},

perms: {l:"Permissões e privilégio mínimo",
 p:"Dê a um sistema de IA acesso só ao que ele precisa para a tarefa, e nada mais.",

 m:"Dizer ao modelo “nunca apague arquivos” num prompt não é uma permissão. Uma permissão de verdade é imposta pelo software em volta do modelo, que não se deixa convencer.",
 k:"Como dar a quem cuida da sua casa a chave da porta da frente, mas não a do cofre."},

hitl: {l:"Aprovação humana", f:"Human in the loop",

},
"pt": {
"e": "Uma rede neural é uma grande teia de números inspirada, de longe, nos neurônios do cérebro, em que cada camada passa seus resultados para a seguinte. No ML clássico, são as pessoas que decidem quais detalhes importam. Aqui a rede descobre sozinha: as primeiras camadas percebem coisas simples, como bordas numa foto, e as seguintes juntam isso em olhos e depois em rostos inteiros. Isso exige muitos dados e muito poder de computação, geralmente de chips gráficos chamados GPUs.",
"w": "O deep learning está por trás dos assistentes de voz que entendem fala, dos apps de tradução instantânea, do desbloqueio facial do celular, das ferramentas que criam imagens a partir de uma frase e de chatbots como o ChatGPT.",
"p": "Machine learning com redes neurais: muitas camadas empilhadas de cálculos simples, que descobrem sozinhas o que procurar em fotos, sons ou textos brutos."
}
},
"paradigms": {
"en": {
"e": "Sometimes every example comes with the right answer, and sometimes there are no answers at all, so the model just looks for patterns. Sometimes the answers are hidden inside the data itself, like the next word of a sentence. And sometimes the model acts, then receives a reward or a penalty. These four styles are called supervised, unsupervised, self-supervised and reinforcement learning, and the next lessons look at each one.",
"w": "A spam filter learns from emails people marked as spam (supervised). A shop groups customers by buying habits with no labels at all (unsupervised), a chatbot first learns language by predicting the next word (self-supervised), and game-playing programs improve by winning and losing (reinforcement).",
"p": "Machines can learn in a few different ways. What separates them is the kind of feedback the model gets while it learns."
},
"pt": {
"e": "Às vezes cada exemplo vem com a resposta certa, e às vezes não há resposta nenhuma, então o modelo só procura padrões. Às vezes as respostas estão escondidas nos próprios dados, como a próxima palavra de uma frase. E às vezes o modelo age e depois recebe uma recompensa ou uma penalidade. Esses quatro estilos se chamam aprendizado supervisionado, não supervisionado, auto-supervisionado e por reforço, e as próximas lições tratam de cada um.",
"w": "Um filtro de spam aprende com e-mails que as pessoas marcaram como spam (supervisionado). Uma loja agrupa clientes por hábitos de compra sem rótulo nenhum (não supervisionado), um chatbot aprende a língua prevendo a próxima palavra (auto-supervisionado) e programas que jogam melhoram ganhando e perdendo partidas (reforço).",
"p": "Máquinas podem aprender de alguns jeitos diferentes. O que separa um do outro é o tipo de retorno que o modelo recebe enquanto aprende."
}
},
"sup": {
"en": {
"e": "Each training example is a pair: an input, like a photo or an email, and its correct answer, called a label, like “cat” or “spam”. The model guesses, compares its guess with the label, and adjusts itself to shrink the difference. After thousands or millions of pairs it can label new inputs on its own. Those labels usually come from people, which makes good labeled data slow and expensive to collect.",
"w": "When you mark an email as spam, you are creating the kind of labeled example these systems learn from. Fraud alerts on card payments and tools that flag problems on X-rays are also trained on cases that people have already labeled."
},
"pt": {
"e": "Cada exemplo de treino é um par: uma entrada, como uma foto ou um e-mail, e a resposta certa, chamada rótulo, como “gato” ou “spam”. O modelo dá um palpite, compara com o rótulo e se ajusta para diminuir a diferença. Depois de milhares ou milhões de pares, ele consegue rotular entradas novas sozinho. Esses rótulos costumam vir de pessoas, por isso juntar bons dados rotulados é lento e caro.",
"w": "Quando você marca um e-mail como spam, está criando o tipo de exemplo rotulado com que esses sistemas aprendem. Os alertas de fraude no cartão e as ferramentas que apontam problemas em raios-X também são treinados com casos que pessoas já classificaram."
}
},
"unsup": {
"en": {
"e": "Nobody tells the model what to look for. It compares the examples with each other and puts similar ones together, or notices which ones look nothing like the rest. A shop’s purchase records, for instance, might fall into groups such as bargain hunters and weekend shoppers. The model finds the groups, but a person still has to look at them and decide what they mean.",
"w": "Shops and streaming services use it to sort customers into groups with similar habits. Banks and IT teams use it to flag activity that looks unlike anything normal, such as a strange burst of network traffic or an unusual card payment.",
"p": "Learning from data that comes with no answers at all. The model looks for groups and patterns on its own."
},
"pt": {
"e": "Ninguém diz ao modelo o que procurar. Ele compara os exemplos entre si e junta os parecidos, ou percebe quais não se parecem com nenhum outro. O histórico de compras de uma loja, por exemplo, pode se dividir em grupos como caçadores de promoção e quem só compra no fim de semana. O modelo encontra os grupos, mas uma pessoa ainda precisa olhar para eles e decidir o que significam.",
"w": "Lojas e serviços de streaming usam isso para separar clientes em grupos com hábitos parecidos. Bancos e equipes de TI usam para sinalizar atividades fora do normal, como um pico estranho de tráfego na rede ou uma compra incomum no cartão.",
"p": "Aprender com dados que não trazem resposta nenhuma. O modelo procura grupos e padrões por conta própria."
}
},
"selfsup": {
"en": {
"e": "Take any sentence, hide its last word, and ask the model to guess it. The real word was there all along, so the text itself grades the guess, with no person involved. Because no one has to label anything, this works on enormous amounts of text, images or audio. Along the way the model picks up grammar, facts and how ideas connect, which is why this is the first stage of training for today’s chatbots.",
"w": "Every major chatbot, such as ChatGPT, Claude or Gemini, first learned language this way, by predicting missing or next words across huge amounts of text. Many image tools learn to understand pictures in a similar way, by matching photos with their captions or filling in hidden patches."
},
"pt": {
"e": "Pegue uma frase qualquer, esconda a última palavra e peça ao modelo para adivinhá-la. A palavra verdadeira estava lá o tempo todo, então o próprio texto corrige o palpite, sem nenhuma pessoa envolvida. Como ninguém precisa rotular nada, isso funciona com quantidades enormes de texto, imagens ou áudio. No caminho, o modelo aprende gramática, fatos e como as ideias se ligam, e por isso esta é a primeira etapa do treino dos chatbots atuais.",
"w": "Todos os grandes chatbots, como ChatGPT, Claude e Gemini, aprenderam a língua primeiro desse jeito, prevendo palavras escondidas ou a próxima palavra em quantidades enormes de texto. Muitas ferramentas de imagem aprendem a entender fotos de forma parecida, associando fotos às suas legendas ou preenchendo pedaços escondidos."
}
},
"rl": {
"en": {
"e": "The learner, called an agent, takes an action, sees what happens and gets a score: a reward for good outcomes, a penalty for bad ones. Nobody shows it the right move in advance. Over many thousands of tries it works out which actions lead to the most reward in the long run, even when the payoff comes much later, as when giving up a piece early in a game leads to a win.",
"w": "The programs that beat the world’s best players at the board game Go learned largely by playing millions of games against themselves. Chatbots are also refined with reinforcement learning, using feedback from people who rated which answers were better."
},
"pt": {
"e": "Quem aprende, chamado de agente, toma uma ação, vê o que acontece e recebe uma nota: recompensa quando o resultado é bom, penalidade quando é ruim. Ninguém mostra a jogada certa antes. Ao longo de milhares de tentativas, ele descobre quais ações trazem mais recompensa no longo prazo, mesmo quando o ganho só vem bem depois, como entregar uma peça no início de uma partida e acabar vencendo.",
"w": "Os programas que venceram os melhores jogadores do mundo no Go, um jogo de tabuleiro, aprenderam em grande parte jogando milhões de partidas contra si mesmos. Os chatbots também são refinados com aprendizado por reforço, usando a avaliação de pessoas que indicaram quais respostas eram melhores."
}
},
"general": {
"en": {
"e": "During training, a model sees a fixed set of examples and gets better at those. The real test is how it does on cases it has never seen, like next month’s customers or a photo taken with a different phone. A model that has learned the underlying pattern handles them well. One that has only memorized details of its examples, even accidental ones like the background of the photos, falls apart.",
"w": "A medical AI can work well in the hospital where it was built and then make mistakes in another hospital that uses different scanners. Researchers have documented this kind of failure, which is why careful teams test medical models at hospitals that were not part of training."
},
"pt": {
"e": "No treino, o modelo vê um conjunto fixo de exemplos e melhora neles. O teste de verdade é como ele se sai em casos que nunca viu, como os clientes do mês que vem ou uma foto tirada com outro celular. Um modelo que aprendeu o padrão de fundo lida bem com eles. Um que só decorou detalhes dos exemplos, até detalhes acidentais como o fundo das fotos, desmorona.",
"w": "Uma IA médica pode funcionar bem no hospital onde foi criada e errar em outro hospital que usa aparelhos diferentes. Pesquisadores já documentaram esse tipo de falha, e por isso equipes cuidadosas testam modelos médicos em hospitais que não participaram do treino."
}
},
"datasplit": {
"en": {
"e": "The model learns only from the training pile. While building it, you check progress on the validation pile, which the model never trains on, to choose settings and decide when to stop. The test pile stays untouched until the very end, so its score tells you honestly how the model will do on new cases. If you peeked at it earlier, that score would be too optimistic.",
"w": "On Kaggle, a popular website for data science competitions, part of the test data stays hidden until the contest ends, so nobody can tune a model to it. Companies do the same when they hold back recent cases to check a model before launching it."
},
"pt": {
"e": "O modelo aprende só com a parte de treino. Durante o desenvolvimento, você confere o progresso na parte de validação, com a qual o modelo nunca treina, para escolher configurações e decidir quando parar. A parte de teste fica intocada até o final, então a nota nela mostra com honestidade como o modelo vai se sair em casos novos. Se você espiar antes, essa nota fica otimista demais.",
"w": "No Kaggle, um site popular de competições de ciência de dados, parte dos dados de teste fica escondida até o fim da disputa, para ninguém ajustar o modelo a ela. Empresas fazem o mesmo quando separam casos recentes para conferir um modelo antes de colocá-lo no ar."
}
},
"overfit": {
"en": {
"e": "A model with lots of room can fit every quirk of its examples, including random noise and coincidences, so it looks perfect on training data and stumbles on anything new. A model that is too simple misses even the obvious pattern and does badly everywhere. You tell them apart by comparing scores: overfitting shows a big gap between training data and new data, underfitting shows poor scores on both.",
"w": "Investment strategies that look perfect when tested on past prices and then lose money in real trading are a classic case of overfitting. It also shows up when a company trains a chatbot further on a small set of its own examples and the chatbot starts copying them almost word for word."
},
"pt": {
"e": "Um modelo com muita capacidade consegue se encaixar em cada detalhe dos exemplos, inclusive ruído e coincidências, então parece perfeito nos dados de treino e tropeça em qualquer coisa nova. Um modelo simples demais perde até o padrão óbvio e vai mal em tudo. Para saber qual é o caso, compare as notas: no overfitting há uma grande distância entre o treino e os dados novos; no underfitting, as duas notas são ruins.",
"w": "Estratégias de investimento que parecem perfeitas quando testadas em preços passados e depois perdem dinheiro no mercado real são um caso clássico de overfitting. Ele também aparece quando uma empresa treina um chatbot um pouco mais com um conjunto pequeno de exemplos próprios e o chatbot passa a copiá-los quase palavra por palavra."
}
},
"leakage": {
"en": {
"e": "Leakage happens when the training data contains a clue that will not be available when the model is used for real. The model grabs that shortcut instead of learning the real pattern, and tests do not catch it because the same clue is in the test data too. A classic case is predicting which customers will cancel using a column that is only filled in after they have already cancelled.",
"w": "Leakage has fooled researchers in medicine and finance, producing models that seemed nearly perfect until they met real cases. With chatbots, it appears when test questions end up in the training text, so a high score on a public test may partly reflect memory rather than skill."
},
"pt": {
"e": "O vazamento acontece quando os dados de treino trazem uma pista que não vai existir quando o modelo for usado de verdade. O modelo agarra esse atalho em vez de aprender o padrão real, e os testes não percebem, porque a mesma pista está nos dados de teste. Um caso clássico é prever quais clientes vão cancelar usando uma coluna que só é preenchida depois que eles já cancelaram.",
"w": "O vazamento já enganou pesquisadores em medicina e finanças, gerando modelos que pareciam quase perfeitos até encontrarem casos reais. Nos chatbots, ele aparece quando questões de teste vão parar nos textos de treino, e uma nota alta num teste público pode refletir, em parte, memória e não habilidade."
}
},
"shift": {
"en": {
"e": "A model learns from a snapshot of the past and quietly assumes the future will look the same. Sometimes the inputs change, like photos from a new camera or new slang in messages. Sometimes the meaning changes, as when scammers invent a new trick and a pattern that used to be “safe” is now fraud. Either way the model keeps answering with confidence, so teams watch its results and retrain it with fresh data.",
"w": "When the pandemic suddenly changed how people shopped and traveled, many forecasting and fraud models built on older data stopped working well. Chatbots show it too: they can be unaware of events, products and slang that appeared after their training data was collected.",
"m": "Many people assume a model stays as accurate as it was on launch day. Its accuracy was measured on data from one moment, and it can drop quietly as the world moves on."
},
"pt": {
"e": "Um modelo aprende com um retrato do passado e supõe, sem avisar, que o futuro vai ser igual. Às vezes mudam as entradas, como fotos de uma câmera nova ou gírias novas nas mensagens. Às vezes muda o significado, como quando golpistas inventam um truque novo e um padrão que era “seguro” vira fraude. Nos dois casos o modelo continua respondendo com confiança, por isso as equipes acompanham os resultados e o retreinam com dados novos.",
"w": "Quando a pandemia mudou de repente o jeito de as pessoas comprarem e viajarem, muitos modelos de previsão e de fraude feitos com dados antigos deixaram de funcionar bem. Os chatbots também mostram isso: podem não saber de eventos, produtos e gírias que surgiram depois que seus dados de treino foram coletados.",
"m": "Muita gente supõe que um modelo continua tão preciso quanto era no dia do lançamento. A precisão foi medida com dados de um momento específico e pode cair sem alarde à medida que o mundo muda."
}
},
"dataq": {
"en": {
"e": "A model treats its training examples as the truth. If some labels are wrong, it learns the mistakes; if a group of people or situations is missing, it has no idea how to handle them. It cannot tell good data from bad on its own. That is why teams spend so much effort checking labels, removing duplicates and making sure the data covers the cases the model will really meet.",
"w": "Independent tests have found that some face recognition systems make more mistakes with groups that were rare in their training photos. At work, the same problem shows up when a sales forecast or support bot trained on messy, outdated records gives messy, outdated answers."
},
"pt": {
"e": "Um modelo trata os exemplos de treino como verdade. Se alguns rótulos estão errados, ele aprende os erros; se falta um grupo de pessoas ou de situações, ele não sabe o que fazer com eles. Sozinho, ele não distingue dado bom de dado ruim. Por isso as equipes gastam tanto esforço conferindo rótulos, tirando duplicatas e garantindo que os dados cubram os casos que o modelo vai encontrar de verdade.",
"w": "Testes independentes já mostraram que alguns sistemas de reconhecimento facial erram mais com grupos que eram raros nas fotos de treino. No trabalho, o mesmo problema aparece quando uma previsão de vendas ou um bot de atendimento treinado com registros bagunçados e desatualizados devolve respostas bagunçadas e desatualizadas."
}
},
"nnbasics": {
"en": {
"e": "Each neuron receives some numbers, multiplies each one by its own weight, which marks how much that input matters, and adds up the results. Then it decides how strongly to pass the total on to the next layer. On its own, one neuron does very little. Millions of them, with weights tuned on many examples, can tell a cat from a dog or predict the next word in a sentence.",
"w": "Every AI you use today, from face unlock on your phone to chat assistants like ChatGPT, is built from these same pieces: neurons, layers and weights.",
"p": "A neural network is built from many tiny calculators called artificial neurons, arranged in layers. It learns by slowly adjusting the numbers inside them."
},
"pt": {
"e": "Cada neurônio recebe alguns números, multiplica cada um por um peso próprio, que indica o quanto aquela entrada importa, e soma tudo. Depois decide com que força passar o resultado para a camada seguinte. Sozinho, um neurônio faz muito pouco. Milhões deles, com pesos ajustados a partir de muitos exemplos, conseguem diferenciar um gato de um cachorro ou prever a próxima palavra de uma frase.",
"w": "Toda IA que você usa hoje, do desbloqueio facial do celular a assistentes como o ChatGPT, é feita dessas mesmas peças: neurônios, camadas e pesos.",
"p": "Uma rede neural é feita de muitas calculadoras minúsculas, os neurônios artificiais, organizadas em camadas. Ela aprende ajustando aos poucos os números dentro deles."
}
},
"perceptron": {
"en": {
"e": "It gives each input a weight, adds everything up and answers “yes” if the total passes a set cutoff, or “no” if it doesn’t. Training is simple: whenever it gets an example wrong, it shifts its weights a little toward the right answer. Think of sorting emails into spam and not spam from a few clues. If one straight line can split the two groups, the perceptron will find it; if no straight line can, it cannot get them all right.",
"w": "Today it lives mostly in classrooms: it is often the first model students code by hand when they learn machine learning. Every neuron in a modern network is a close relative of it.",
"p": "The simplest machine that learns: a single artificial neuron that sorts things into two groups by drawing a straight line between them."
},
"pt": {
"e": "Ele dá um peso a cada entrada, soma tudo e responde “sim” se o total passar de um valor de corte, ou “não” caso contrário. O treino é simples: sempre que erra um exemplo, ele mexe um pouco nos pesos na direção da resposta certa. Pense em separar e-mails entre spam e não spam a partir de algumas pistas. Se uma linha reta conseguir dividir os dois grupos, o perceptron acaba achando essa linha; se nenhuma conseguir, ele não tem como acertar todos.",
"w": "Hoje ele vive principalmente nas salas de aula: costuma ser o primeiro modelo que estudantes programam à mão quando aprendem machine learning. Cada neurônio de uma rede moderna é um parente próximo dele.",
"p": "A máquina mais simples que aprende: um único neurônio artificial que separa as coisas em dois grupos traçando uma linha reta entre eles."
}
},
"mlp": {
"en": {
"e": "The middle layers are called hidden layers because you never see their output directly. Each one turns what the previous layer found into something more useful, and a small bend added after each neuron, called an activation function, lets the network follow curves instead of only straight lines. This fixes the perceptron’s big weakness. Information always flows one way, from input to answer, which is why these are also called feed-forward networks.",
"w": "They make predictions from spreadsheet-style data, such as whether a customer is likely to cancel a subscription, and help recommendation systems rank what to show you next. A block of this kind also sits inside every layer of the transformers behind chat assistants.",
"p": "Neurons are stacked in layers, each passing its results to the next. The middle layers let the network learn curved patterns a single straight line could never separate."
},
"pt": {
"e": "As camadas do meio se chamam camadas ocultas, porque você nunca vê diretamente o que elas produzem. Cada uma transforma o que a anterior encontrou em algo mais útil, e uma pequena “dobra” aplicada depois de cada neurônio, chamada função de ativação, permite seguir curvas em vez de só linhas retas. É isso que resolve a grande limitação do perceptron. A informação anda sempre num só sentido, da entrada à resposta, daí o nome feed-forward.",
"w": "Elas fazem previsões a partir de dados em formato de planilha, como estimar se um cliente tende a cancelar uma assinatura, e ajudam sistemas de recomendação a escolher o que mostrar a seguir. Um bloco desse tipo também fica dentro de cada camada dos transformers que movem os assistentes de chat.",
"p": "Os neurônios ficam empilhados em camadas, e cada camada passa seus resultados à seguinte. As do meio permitem aprender padrões curvos que nenhuma linha reta separa."
}
},
"backprop": {
"en": {
"e": "The error is measured by a single number called the loss: how far the network’s answer was from the right one. Backpropagation works backward from the answer, layer by layer, to find how much each weight pushed that number up or down. Gradient descent then moves every weight a small step in the direction that lowers the loss. Repeat this over millions of examples and the errors shrink.",
"w": "Every AI model you use was shaped by this loop, from the spam filter in your inbox to the chat assistant you ask questions. Training a large model means repeating it an enormous number of times on powerful computers, which is a big part of why training is so expensive."
},
"pt": {
"e": "O erro é medido por um único número, chamado perda (loss): o quanto a resposta da rede ficou longe da certa. A retropropagação percorre a rede de trás para a frente, camada por camada, para descobrir quanto cada peso empurrou esse número para cima ou para baixo. Depois, a descida do gradiente move cada peso um passinho na direção que diminui a perda. Repetindo isso com milhões de exemplos, os erros vão encolhendo.",
"w": "Todo modelo de IA que você usa foi moldado por esse ciclo, do filtro de spam da sua caixa de entrada ao assistente de chat a quem você faz perguntas. Treinar um modelo grande significa repetir o ciclo um número enorme de vezes em computadores potentes, e isso explica boa parte do custo do treinamento."
}
},
"cnn": {
"en": {
"e": "A filter is a tiny grid of weights, often just 3 by 3 pixels, that slides across the whole picture and lights up wherever its pattern appears. Because the same filter is reused everywhere, a cat’s ear is recognized whether it sits in a corner or in the center. Each layer builds on the one before: lines combine into corners, corners into eyes, eyes into faces.",
"w": "When your phone groups photos by the faces in them, or a factory camera spots a scratch on a part, a CNN is often doing the work. Doctors also use CNN-based tools that flag suspicious areas in X-rays and other scans.",
"p": "Convolutional networks look at an image through small learned filters, spotting simple edges first, then shapes, then whole objects."
},
"pt": {
"e": "Um filtro é uma gradezinha de pesos, muitas vezes de só 3 por 3 pixels, que desliza pela foto inteira e “acende” onde encontra o seu padrão. Como o mesmo filtro é reaproveitado na imagem toda, a orelha de um gato é reconhecida esteja ela num canto ou no centro. Cada camada se apoia na anterior: linhas viram cantos, cantos viram olhos, olhos viram rostos.",
"w": "Quando o celular agrupa suas fotos pelos rostos que aparecem nelas, ou uma câmera de fábrica encontra um risco numa peça, muitas vezes é uma CNN trabalhando. Médicos também usam ferramentas baseadas em CNNs que apontam áreas suspeitas em raios X e outros exames.",
"p": "As redes convolucionais olham a imagem através de pequenos filtros aprendidos: primeiro percebem bordas, depois formas, depois objetos inteiros."
}
},
"rnn": {
"en": {
"e": "At each step the network takes two things: the new word and its memory so far, called the hidden state. It blends them into an updated memory and moves on, so by the end the memory holds a summary of everything it read. That summary is small, so early words fade as the text grows. Each step must also wait for the one before, which makes training slow, a limit the transformers of the next module removed.",
"w": "Before transformers took over, RNNs (mostly an improved kind called LSTM) powered Google Translate, the speech recognition in voice assistants and the next-word suggestions on phone keyboards.",
"p": "Recurrent networks read a sequence, such as a sentence, one piece at a time, carrying a running memory of what came before."
},
"pt": {
"e": "A cada passo, a rede recebe duas coisas: a palavra nova e a memória que já tem, chamada estado oculto. Ela mistura as duas numa memória atualizada e segue em frente, de modo que, no fim, essa memória guarda um resumo de tudo o que leu. Só que o resumo é pequeno, e as primeiras palavras vão se apagando conforme o texto cresce. Além disso, cada passo espera o anterior, o que deixa o treino lento, limite que os transformers do próximo módulo eliminaram.",
"w": "Antes de os transformers dominarem, as RNNs (principalmente uma versão melhorada chamada LSTM) estavam por trás do Google Tradutor, do reconhecimento de fala dos assistentes de voz e das sugestões de próxima palavra no teclado do celular.",
"p": "As redes recorrentes leem uma sequência, como uma frase, um pedaço de cada vez, carregando uma memória do que veio antes."
}
},
"trans": {
"en": {
"e": "Older networks such as RNNs read one word after another and passed along a fading memory. A transformer takes in every word at the same time, so the link between “it” and the noun it refers to is direct, however far apart they are. This also lets the work be split across many graphics chips (GPUs) running in parallel, which made training on enormous amounts of text practical. The rest of this module opens up its parts one by one.",
"w": "ChatGPT, Claude and Gemini are all built on transformers, as are most coding assistants and the AI tools that translate, summarize or transcribe speech. Search engines also use them to understand what you meant when you type a query.",
"p": "Transformers power today’s chat assistants. They read a whole text at once and let every word look at all the others to decide which ones matter."
},
"pt": {
"e": "Redes mais antigas, como as RNNs, liam uma palavra depois da outra e carregavam uma memória que ia se apagando. O transformer recebe todas as palavras ao mesmo tempo, então a ligação entre “ele” e o substantivo a que se refere é direta, por mais longe que estejam. Isso também permite dividir o trabalho entre muitos chips gráficos (GPUs) funcionando em paralelo, o que tornou viável treinar com quantidades enormes de texto. O resto deste módulo abre suas peças uma a uma.",
"w": "ChatGPT, Claude e Gemini são todos construídos sobre transformers, assim como a maioria dos assistentes de código e das ferramentas de IA que traduzem, resumem ou transcrevem áudio. Os buscadores também os usam para entender o que você quis dizer ao digitar uma pesquisa.",
"p": "Os transformers movem os assistentes de chat atuais. Eles leem o texto inteiro de uma vez e deixam cada palavra olhar para as outras e decidir quais importam."
}
},
"tok": {
"en": {
"e": "Using whole words would need an impossibly long list, since new names, typos and word forms appear all the time. Using single letters would make every text very long. Tokens are the middle ground: a frequent word like “the” is one token, while a rare word like “unbelievable” is split into familiar pieces. From then on the model never sees letters, only ID numbers, which is why it can stumble when asked to count the letters in a word.",
"w": "AI services charge by the token and set their limits in tokens, not words. In English one token is about three quarters of a word on average, so a 1,000-word document comes to roughly 1,300 tokens."
},
"pt": {
"e": "Usar palavras inteiras exigiria uma lista impossível de longa, já que nomes novos, erros de digitação e variações de palavras surgem o tempo todo. Usar letras soltas deixaria qualquer texto comprido demais. Os tokens são o meio-termo: uma palavra frequente como “de” vira um token só, enquanto uma palavra rara é dividida em pedaços conhecidos. Daí em diante o modelo não vê letras, só números de ID, e por isso pode tropeçar quando pedem que conte as letras de uma palavra.",
"w": "Os serviços de IA cobram por token e definem seus limites em tokens, não em palavras. Como os tokenizadores costumam ser montados com muito texto em inglês, um texto em português em geral gasta mais tokens que o mesmo texto em inglês."
}
},
"emb": {
"en": {
"e": "These numbers are not chosen by hand. They start out random, and during training the model nudges them until words used in similar ways end up with similar lists. You can think of each number as one direction on a map that has hundreds or thousands of directions instead of two. Because related words sit near each other, the model can treat “car” and “automobile” almost alike, even though their token IDs are completely different numbers.",
"w": "When a search box finds “cheap flights” for someone who typed “low-cost airfare”, or a store suggests products similar to one you viewed, the same idea is often at work. A famous early example: take the vector for “king”, subtract “man”, add “woman”, and you land near “queen”."
},
"pt": {
"e": "Esses números não são escolhidos à mão. Eles começam aleatórios e, durante o treino, o modelo os ajusta até que palavras usadas de jeitos parecidos fiquem com listas parecidas. Dá para pensar em cada número como uma direção num mapa com centenas ou milhares de direções, em vez de só duas. Como palavras relacionadas ficam próximas, o modelo trata “carro” e “automóvel” quase do mesmo jeito, mesmo que seus IDs de token sejam números totalmente diferentes.",
"w": "Quando uma busca encontra “passagem aérea barata” para quem digitou “voo em conta”, ou uma loja sugere produtos parecidos com o que você viu, muitas vezes é essa mesma ideia em ação. Um exemplo famoso dos primeiros tempos: pegue o vetor de “rei”, subtraia “homem”, some “mulher” e você cai perto de “rainha”."
}
},
"attn": {
"en": {
"e": "Take the word “bank”: next to “river” it means one thing, next to “loan” another, and attention is how the model works out which. Each word scores how relevant every other word is to it, then takes in information mostly from the high scorers. The model runs many of these comparisons side by side, called heads, so one can follow grammar while another tracks who did what. The result is a new version of each word’s vector, shaped by its context.",
"w": "Every time a chat assistant keeps track of who “he” or “it” refers to across a long message, attention is doing that work. In “The trophy didn’t fit in the suitcase because it was too big”, it helps the model link “it” to “trophy”."
},
"pt": {
"e": "Pense na palavra “banco”: perto de “praça” ela quer dizer uma coisa, perto de “empréstimo” quer dizer outra, e a atenção é o jeito de o modelo descobrir qual. Cada palavra dá uma nota para o quanto as outras são relevantes para ela e absorve informação principalmente das mais bem avaliadas. O modelo faz várias dessas comparações lado a lado, chamadas cabeças (heads), e assim uma acompanha a gramática enquanto outra acompanha quem fez o quê. O resultado é um novo vetor para cada palavra, moldado pelo contexto.",
"w": "Sempre que um assistente de chat entende a quem “ele” ou “isso” se refere numa mensagem longa, é a atenção trabalhando. Em “O troféu não coube na mala porque ele era grande demais”, ela ajuda o modelo a ligar “ele” a “troféu”."
}
},
"ctx": {
"en": {
"e": "Everything the model can use to produce the next word has to fit inside this window at the same moment. In a chat, the app quietly resends the earlier messages every time you write, so in a very long conversation it must eventually drop or summarize the oldest parts. Bigger windows also cost more time and money, because attention compares every token with every other one.",
"w": "If you paste a long contract or report into a chat assistant and it says the text is too long, or it seems to forget the start of a long conversation, you have hit the context window. Tools that search your documents and pass the model only the relevant passages exist to work around this limit."
},
"pt": {
"e": "Tudo o que o modelo pode usar para gerar a próxima palavra precisa caber nessa janela ao mesmo tempo. Num chat, o aplicativo reenvia em silêncio as mensagens anteriores a cada vez que você escreve, então, numa conversa muito longa, ele acaba tendo de descartar ou resumir as partes mais antigas. Janelas maiores também custam mais tempo e dinheiro, porque a atenção compara cada token com todos os outros.",
"w": "Se você cola um contrato ou relatório longo num assistente de chat e ele avisa que o texto é grande demais, ou parece esquecer o começo de uma conversa comprida, você esbarrou na janela de contexto. Ferramentas que buscam nos seus documentos e enviam ao modelo só os trechos relevantes existem justamente para contornar esse limite."
}
},
"logits": {
"en": {
"e": "These raw scores are called logits. A step called softmax turns them into probabilities that add up to 100%, so after “The cat sat on the”, the word “mat” might get a large share and “banana” almost none. The chosen token is added to the text and the whole process runs again for the next one. That is why answers appear word by word: the model writes one token at a time.",
"w": "Some AI tools offer a “temperature” setting: low values make the model stick to its top choices for steady, predictable answers, and higher values let it pick less likely tokens for more varied ones. This element of chance is also why the same question can get two different answers."
},
"pt": {
"e": "Essas notas brutas se chamam logits. Uma etapa chamada softmax as transforma em probabilidades que somam 100%, então, depois de “O gato subiu no”, a palavra “telhado” pode ficar com uma fatia grande e “banana” com quase nada. O token escolhido é acrescentado ao texto, e o processo todo roda de novo para o próximo. É por isso que as respostas aparecem aos poucos na tela: o modelo escreve um token de cada vez.",
"w": "Algumas ferramentas de IA têm um ajuste de “temperatura”: valores baixos fazem o modelo ficar nas escolhas mais prováveis, com respostas estáveis e previsíveis, e valores mais altos o deixam escolher tokens menos prováveis, com respostas mais variadas. Esse sorteio também explica por que a mesma pergunta pode receber duas respostas diferentes."
}
},
"pretrain": {
"en": {
"e": "The task is surprisingly simple: hide the next word of a real sentence and have the model guess it, over and over, across an enormous amount of books, websites and code. No one has to label the data, because the text itself contains the right answer. To guess well, the model picks up grammar, many facts and common patterns of how ideas connect. The result, called a base model, can continue any text but does not yet reliably follow instructions.",
"w": "You rarely talk to a pretrained-only model in a chat app, but every assistant starts from one. Companies that release open models often publish the base version too, so others can adapt it to their own needs.",
"p": "Pretraining is the long, expensive first stage of building a model: it learns the general patterns of language from a huge collection of text."
},
"pt": {
"e": "A tarefa é surpreendentemente simples: esconder a próxima palavra de uma frase real e pedir ao modelo que adivinhe, repetindo isso numa quantidade enorme de livros, sites e código. Ninguém precisa rotular os dados, porque o próprio texto já traz a resposta certa. Para adivinhar bem, o modelo acaba absorvendo gramática, muitos fatos e padrões comuns de como as ideias se ligam. O resultado, chamado modelo base, continua qualquer texto, mas ainda não segue instruções de forma confiável.",
"w": "Num app de chat você quase nunca conversa com um modelo apenas pré-treinado, mas todo assistente começa a partir de um. Empresas que lançam modelos abertos muitas vezes publicam também a versão base, para que outros possam adaptá-la às próprias necessidades.",
"p": "O pré-treinamento é a primeira etapa, longa e cara, de construir um modelo: ele aprende os padrões gerais da linguagem com uma coleção enorme de textos."
}
},
"finetune": {
"en": {
"e": "Because the model already knows language from pretraining, a few hundred or a few thousand good examples are often enough to change how it behaves. Each example pairs an input with the answer you want, such as a customer email and the right category for it. Fine-tuning is also part of how a base model becomes a helpful assistant: it is trained on many examples of questions answered clearly and politely.",
"w": "Companies fine-tune models to route support tickets to the right team, to answer in their brand’s tone, or to fill in reports in a fixed format. The chat assistants you use were themselves fine-tuned from base models to follow instructions."
},
"pt": {
